# Проксі ШІ-підказок ASK ME. Розгортання й секрети — worker/ai-proxy/README.md.
name = "askme-ai"
main = "src/index.js"
compatibility_date = "2026-10-01"

[vars]
# сайти, яким дозволено звертатися до проксі (через кому)
ALLOWED_ORIGINS = "https://1s0meb0dy1.github.io"
# моделі Gemini по черзі: якщо перша не відповіла за 9 с або видала помилку — пробуємо наступну
GEMINI_MODELS = "gemini-3.6-flash,gemini-3.5-flash-lite,gemini-flash-latest"
# запасні безкоштовні ШІ після Gemini: Groq (секрет GROQ_API_KEY) і вбудований Workers AI
GROQ_MODEL = "openai/gpt-oss-120b"
WORKERS_AI_MODEL = "@cf/meta/llama-3.3-70b-instruct-fp8-fast"

# Workers AI — без ключа, безкоштовна денна квота акаунта Cloudflare
[ai]
binding = "AI"

# обмеження частоти з однієї IP-адреси: 20 запитів за 60 с (захист від зловживань і перевитрати безкоштовної квоти)
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 20, period = 60 }
