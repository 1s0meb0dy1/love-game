name: CI и публикация
on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  rules:
    name: Проверка Firebase Rules в эмуляторе
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci
      - name: Проверка доступа, валидации и удаления данных
        run: npm run test:rules
  verify:
    name: Тесты, сборка, проверка веса
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Автотесты (логика и интерфейс)
        run: npm test
      - name: Сборка (Vite + service worker + сжатие)
        run: npm run build
      - name: Проверка веса сборки
        run: npm run size
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }
  deploy:
    name: Публикация на GitHub Pages
    needs: [verify, rules]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
