    <script>
        (function initPWA() {
            try {
                const createIconDataUrl = (size) => {
                    const canvas = document.createElement('canvas');
                    canvas.width = size; canvas.height = size;
                    const ctx = canvas.getContext('2d');
                    const bgGrad = ctx.createLinearGradient(0, 0, size, size);
                    bgGrad.addColorStop(0, '#f43f5e'); bgGrad.addColorStop(1, '#be123c');
                    ctx.fillStyle = bgGrad; ctx.fillRect(0, 0, size, size);
                    ctx.fillStyle = '#ffffff'; ctx.save();
                    const scale = (size / 20) * 0.52;
                    ctx.translate(size * 0.5, size * 0.5); ctx.scale(scale, scale);
                    ctx.beginPath();
                    ctx.moveTo(0, 9.35); ctx.lineTo(-1.45, 8.03);
                    ctx.bezierCurveTo(-6.6, 3.36, -10, 0.28, -10, -3.5);
                    ctx.bezierCurveTo(-10, -6.58, -7.58, -9, -4.5, -9);
                    ctx.bezierCurveTo(-2.76, -9, -1.09, -8.19, 0, -6.91);
                    ctx.bezierCurveTo(1.09, -8.19, 2.76, -9, 4.5, -9);
                    ctx.bezierCurveTo(7.58, -9, 10, -6.58, 10, -3.5);
                    ctx.bezierCurveTo(10, 0.28, 6.6, 3.36, 1.45, 8.04);
                    ctx.closePath(); ctx.fill(); ctx.restore();
                    return canvas.toDataURL('image/png');
                };
                const icon192 = createIconDataUrl(192);
                const icon512 = createIconDataUrl(512);
                document.getElementById('pwa-apple-icon').href = icon512;
                document.getElementById('pwa-favicon').href = icon192;
                const manifestObj = {
                    name: "ASK ME — Игра",
                    short_name: "Ask Me",
                    start_url: window.location.origin + window.location.pathname,
                    display: "standalone", background_color: "#09080c", theme_color: "#09080c",
                    icons: [{ src: icon192, sizes: "192x192", type: "image/png" }, { src: icon512, sizes: "512x512", type: "image/png" }]
                };
                document.getElementById('pwa-manifest').href = 'data:application/manifest+json;charset=utf-8,' + encodeURIComponent(JSON.stringify(manifestObj));
            } catch (e) {}
        })();
    </script>

                        const data = await r.json();
                        if(data && data.updatedAt && (now - data.updatedAt > 32 * 24 * 60 * 60 * 1000)) {
                            await fetch(`${FIREBASE_BASE_URL}/sessions/${k}.json?auth=${token}`, {method:'DELETE'});
                        }
                    }
                } catch(e){}
            };

            const handleAdminLogin = async (e) => {
                e.preventDefault();
                try {
                    const token = await Auth.login(adminForm.email, adminForm.pass);
                    setIsAdmin(true); SoundFX.success(); setAdminForm({email:'', pass:''});
                    cleanupOldSessions(token); // Запускаем чистку при входе
                } catch(err) { SoundFX.warn(); showToast(err.message); }
            };

            const handleSaveProfile = (e) => {
                e.preventDefault();
                const validPlayers = playersForm.filter(p => p.name.trim().length > 0);
                if(validPlayers.length < 2) { SoundFX.warn(); showToast("Нужно минимум 2 имени"); return; }
                
                const sid = profile?.sessionId || generateSessionId();
                const newProfile = { sessionId: sid, players: validPlayers, archivedIds: profile?.archivedIds||[], updatedAt: Date.now() };
                setProfile(newProfile); localStorage.setItem(PROFILE_STORAGE_KEY, JSON.stringify(newProfile));
                setIsPreviewMode(false); SoundFX.success(); navigate('menu');
            };

            const addPlayerField = () => {
                if(playersForm.length >= 8) return;
                SoundFX.click();
                setPlayersForm([...playersForm, { id: 'p'+Date.now(), name: '', gender: 'guy' }]);
            };

            // Загрузка базы
            useEffect(() => {
                const loadDb = async () => {
                    try {
                        const res = await fetch(`${FIREBASE_BASE_URL}/questions.json`);
                        const data = await res.json();
                        if(data) {
                            const arr = Object.keys(data).map(k => ({ dbKey: k, ...data[k] })).sort((a,b)=>a.num-b.num);
                            setDb(arr);
                        }
                    } catch(e){} finally { setIsLoading(false); }
                };
                loadDb();
            }, []);

            // Фильтрация (с учетом целевых ID сессий)
            const availableDb = useMemo(() => {
                if(!db.length) return [];
                const sid = profile?.sessionId || "GUEST";
                return db.filter(q => !q.targetId || String(q.targetId).trim() === '' || q.targetId === sid);
            }, [db, profile]);

            const stats = useMemo(() => {
                const arch = new Set(profile?.archivedIds || []);
                let active = 0;
                availableDb.forEach(q => { if(!arch.has(q.id)) active++; });
                return { active, total: availableDb.length, archived: arch.size };
            }, [availableDb, profile]);

            // Запуск игры
            const startGame = () => {
                if(!profile) { SoundFX.warn(); navigate('onboarding'); return; }
                const arch = new Set(profile.archivedIds || []);
                let pool = availableDb.filter(q => !arch.has(q.id));
                if(!pool.length) { showToast("Нет новых вопросов!"); return; }
                
                for (let i = pool.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [pool[i], pool[j]] = [pool[j], pool[i]]; }
                setGameQuestions(pool); setCurrentIndex(0); setTurnHistory({}); setGameMode('normal'); SoundFX.click(); navigate('game');
                startRouletteForIndex(0);
            };

            // Многоуровневая рулетка
            const startRouletteForIndex = (idx) => {
                if(!profile?.players || turnHistory[idx]) return;
                let shuffled = [...profile.players].sort(() => Math.random() - 0.5);
                setTurnHistory(p => ({...p, [idx]: shuffled}));
                setRouletteState({ open: true, queue: shuffled, currentTarget: shuffled[0], step: 0 });
                animateRouletteStep(0, shuffled);
            };

            const animateRouletteStep = (stepIdx, queue) => {
                if(stepIdx >= queue.length) { setTimeout(() => setRouletteState(s=>({...s, open: false})), 1500); return; }
                
                // Анимация (фиктивная задержка для интриги)
                SoundFX.tick();
                setRouletteState({ open: true, queue, currentTarget: queue[stepIdx], step: stepIdx });
                if(stepIdx === queue.length - 1) {
                    SoundFX.success(); // Последний игрок без долгой рулетки
                    setTimeout(() => animateRouletteStep(stepIdx+1, queue), 1500);
                } else {
                    setTimeout(() => { SoundFX.click(); animateRouletteStep(stepIdx+1, queue); }, 1500);
                }
            };

            const nextQuestion = () => {
                SoundFX.click();
                if(currentIndex < gameQuestions.length - 1) {
                    setCurrentIndex(currentIndex + 1);
                    startRouletteForIndex(currentIndex + 1);
                } else {
                    const answered = gameQuestions.map(q=>q.id);
                    setProfile(p => {
                        const n = {...p, archivedIds: [...new Set([...(p.archivedIds||[]), ...answered])]};
                        localStorage.setItem(PROFILE_STORAGE_KEY, JSON.stringify(n)); return n;
                    });
                    navigate('menu'); showToast("Игра завершена!");
                }
            };

            if (isLoading) return <div className="safe-screen flex items-center justify-center"><AskMeLogo /></div>;

            // --- ЭКРАН ВВОДА ИМЕН (Onboarding) ---
            if (screen === 'onboarding') {
                return (
                    <div className="safe-screen flex flex-col items-center justify-center relative slide-up">
                        {toastMsg && <div className="fixed top-5 bg-rose-500 text-white px-4 py-2 rounded-full z-50 fade-in">{toastMsg}</div>}
                        <button onClick={()=>{ setIsPreviewMode(true); navigate('menu'); }} className="absolute top-6 right-6 w-10 h-10 rounded-full bg-white/[0.05] flex items-center justify-center text-zinc-400 hover:text-white transition-all"><Icons.Close /></button>
                        
                        <div className="w-full max-w-sm flex flex-col items-center gap-6">
                            <AskMeLogo />
                            <div className="text-center">
                                <h1 className="font-display text-2xl font-bold text-white mb-2">Кто играет?</h1>
                                <p className="text-xs text-zinc-400">Введите имена, чтобы начать игру.</p>
                            </div>

                            <form onSubmit={handleSaveProfile} className="w-full flex flex-col gap-3">
                                {playersForm.map((p, idx) => (
                                    <div key={p.id} className="flex gap-2 relative">
                                        <input type="text" placeholder={`Игрок ${idx+1}`} required value={p.name} onChange={e => {
                                            const v = sanitizeName(e.target.value);
                                            setPlayersForm(playersForm.map((pl, i) => i === idx ? {...pl, name: v} : pl));
                                        }} className="flex-1 h-14 px-5 rounded-2xl bg-white/[0.04] border border-white/12 text-white outline-none focus:border-rose-500" />
                                        
                                        <button type="button" onClick={() => {
                                            setPlayersForm(playersForm.map((pl, i) => i === idx ? {...pl, gender: pl.gender === 'guy' ? 'girl' : 'guy'} : pl)); SoundFX.click();
                                        }} className="w-14 h-14 rounded-2xl bg-white/[0.04] border border-white/12 flex items-center justify-center text-xl hover:bg-white/[0.1] transition-all">
                                            {p.gender === 'guy' ? '👨' : '👩'}
                                        </button>

                                        {idx > 1 && <button type="button" onClick={() => setPlayersForm(playersForm.filter((_, i) => i !== idx))} className="absolute -left-3 -top-3 w-6 h-6 bg-rose-500 rounded-full flex items-center justify-center text-white text-xs border-2 border-[#09080c]"><Icons.Close /></button>}
                                    </div>
                                ))}

                                {playersForm.length < 8 && (
                                    <button type="button" onClick={addPlayerField} className="h-12 border border-dashed border-white/20 rounded-2xl text-xs font-bold uppercase tracking-widest text-zinc-400 hover:text-white transition-all flex items-center justify-center gap-2 mt-1">
                                        <Icons.Plus /> Добавить игрока
                                    </button>
                                )}

                                <button type="submit" className="h-14 mt-4 rounded-2xl btn-primary font-bold text-xs uppercase tracking-widest">Продолжить</button>
                            </form>
                        </div>
                    </div>
                );
            }

            // --- ГЛАВНОЕ МЕНЮ ---
            if (screen === 'menu') {
                const pCount = profile ? profile.players.length : 0;
                const isGroup = pCount > 2;

                return (
                    <div className="safe-screen flex flex-col items-center slide-up">
                        {toastMsg && <div className="fixed top-5 bg-rose-500 text-white px-4 py-2 rounded-full z-50 fade-in">{toastMsg}</div>}
                        
                        <header className="w-full max-w-md flex justify-between items-center py-2">
                            <button onClick={() => navigate('onboarding')} className="px-4 py-2 rounded-full bg-white/[0.04] border border-white/10 text-xs font-semibold text-zinc-200 flex items-center gap-2">
                                <Icons.User />
                                {profile ? profile.players.map(p=>p.name).join(', ').substring(0, 20)+(pCount>2?'...':'') : "Гость"}
                            </button>
                            {profile && (
                                <button onClick={() => { localStorage.removeItem(PROFILE_STORAGE_KEY); setProfile(null); navigate('onboarding'); }} className="p-2.5 rounded-full bg-white/[0.04] border border-white/10 text-zinc-400 hover:text-white">
                                    <Icons.Logout />
                                </button>
                            )}
                        </header>

                        <div className="w-full max-w-sm flex flex-col items-center gap-6 mt-6">
                            <AskMeLogo />
                            <div className="text-center">
                                <p className="text-rose-400 text-xs font-extrabold uppercase tracking-[0.2em] mb-1">
                                    {isGroup ? "Откровенные разговоры для компании" : "Откровенные разговоры для двоих"}
                                </p>
                                <p className="text-white text-sm font-semibold">
                                    {profile ? `${pCount} ${declOfNum(pCount, ['игрок', 'игрока', 'игроков'])}` : "Режим предпросмотра"}
                                </p>
                            </div>

                            <div className="w-full grid grid-cols-2 gap-3 text-center mb-2">
                                <div className="p-4 rounded-2xl bg-white/[0.04] border border-white/10">
                                    <div className="text-3xl font-display font-bold text-white">{stats.active}</div>
                                    <div className="text-[10px] uppercase tracking-widest text-zinc-500 mt-1">Доступно</div>
                                </div>
                                <div className="p-4 rounded-2xl bg-white/[0.04] border border-white/10">
                                    <div className="text-3xl font-display font-bold text-zinc-500">{stats.archived}</div>
                                    <div className="text-[10px] uppercase tracking-widest text-zinc-500 mt-1">В архиве</div>
                                </div>
                            </div>

                            {profile && <SessionIdBadge sessionId={profile.sessionId} onCopy={showToast} />}

                            <button onClick={startGame} className={`w-full h-14 rounded-2xl font-bold text-sm uppercase tracking-widest flex items-center justify-center gap-2 transition-all ${profile ? 'btn-primary' : 'bg-white/10 text-zinc-500 cursor-not-allowed'}`}>
                                <Icons.Play /> {profile ? "Начать игру" : "Введите имена для игры"}
                            </button>

                            {isAdmin && (
                                <button onClick={() => navigate('admin')} className="w-full text-xs text-zinc-500 mt-4 underline">Управление базой (Владелец)</button>
                            )}
                            {!isAdmin && (
                                <button onClick={() => navigate('admin')} className="w-full text-xs text-zinc-600 mt-4">Вход для администратора</button>
                            )}
                        </div>
                    </div>
                );
            }

            // --- ИГРОВОЙ ЭКРАН ---
            if (screen === 'game') {
                const q = gameQuestions[currentIndex];
                const queue = turnHistory[currentIndex] || [];
                
                return (
                    <div className="safe-screen flex flex-col justify-between slide-up relative">
                        <header className="flex justify-between items-center py-2 max-w-lg mx-auto w-full">
                            <span className="px-4 py-1.5 rounded-full border border-white/10 text-xs font-bold">{currentIndex + 1} / {gameQuestions.length}</span>
                            <button onClick={() => navigate('menu')} className="px-4 py-1.5 rounded-full border border-white/10 text-xs font-bold text-zinc-300">В меню</button>
                        </header>

                        <main className="flex-1 flex flex-col items-center justify-center text-center px-4 -mt-10">
                            {queue.length > 0 && !rouletteState.open && (
                                <div className="mb-8 px-5 py-2 rounded-2xl bg-white/[0.04] border border-white/10 flex flex-col gap-1">
                                    {queue.map((p, i) => (
                                        <div key={p.id} className="text-xs font-bold">
                                            <span className="text-zinc-500">{i===0?'Первым':i===queue.length-1?'Последним':i+1+'-м'} отвечает:</span> <span className="text-rose-300">{p.name}</span>
                                        </div>
                                    ))}
                                </div>
                            )}

                            <h2 className="text-2xl sm:text-3xl font-medium leading-snug text-white max-w-lg">{q?.text}</h2>
                        </main>

                        <div className="py-6 max-w-lg mx-auto w-full">
                            <button onClick={nextQuestion} className="w-full h-14 rounded-2xl btn-primary font-bold text-xs uppercase tracking-widest flex items-center justify-center gap-2">Далее <Icons.Next /></button>
                        </div>

                        {/* Рулетка очереди */}
                        <PopupModal isOpen={rouletteState.open}>
                            <div className="text-center flex flex-col items-center gap-6 py-4">
                                <h3 className="font-display text-xl font-bold text-white">Кто отвечает?</h3>
                                
                                <div className="flex flex-col gap-3 w-full">
                                    {rouletteState.queue.map((p, i) => (
                                        <div key={p.id} className={`p-4 rounded-2xl border transition-all duration-300 flex justify-between items-center ${i < rouletteState.step ? 'bg-white/10 border-white/20 opacity-50' : i === rouletteState.step ? 'bg-rose-500/20 border-rose-500 scale-105' : 'bg-white/[0.02] border-white/5 opacity-30'}`}>
                                            <span className="text-zinc-400 text-xs font-bold uppercase">{i===0?'Первый':i===rouletteState.queue.length-1?'Последний':(i+1)+'-й'}</span>
                                            <span className="text-white font-bold">{p.name} {p.gender==='guy'?'👨':'👩'}</span>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </PopupModal>
                    </div>
                );
            }

            // --- АДМИНКА ---
            if (screen === 'admin') {
                return (
                    <div className="safe-screen flex flex-col items-center slide-up">
                        {toastMsg && <div className="fixed top-5 bg-rose-500 text-white px-4 py-2 rounded-full z-50 fade-in">{toastMsg}</div>}
                        <header className="w-full max-w-md flex justify-between items-center py-2 mb-10">
                            <button onClick={() => navigate('menu')} className="p-3 rounded-2xl bg-white/[0.04] border border-white/10"><Icons.Back /></button>
                            <span className="font-bold uppercase tracking-widest text-xs text-rose-400">Владелец</span>
                        </header>

                        <div className="w-full max-w-sm flex flex-col gap-6">
                            {!isAdmin ? (
                                <form onSubmit={handleAdminLogin} className="flex flex-col gap-4">
                                    <input type="email" placeholder="Email" required value={adminForm.email} onChange={e=>setAdminForm({...adminForm, email:e.target.value})} className="h-14 px-5 rounded-2xl bg-white/[0.04] border border-white/12 text-white outline-none" />
                                    <input type="password" placeholder="Пароль" required value={adminForm.pass} onChange={e=>setAdminForm({...adminForm, pass:e.target.value})} className="h-14 px-5 rounded-2xl bg-white/[0.04] border border-white/12 text-white outline-none" />
                                    <button type="submit" className="h-14 rounded-2xl btn-primary font-bold text-xs uppercase tracking-widest mt-2">Войти</button>
                                </form>
                            ) : (
                                <div className="flex flex-col gap-4 text-center">
                                    <div className="p-4 bg-rose-500/10 border border-rose-500/30 rounded-2xl text-rose-300 text-sm font-bold">Вы авторизованы. Авто-очистка старых сессий выполнена.</div>
                                    <button onClick={()=>{ Auth.logout(); setIsAdmin(false); }} className="h-14 rounded-2xl btn-secondary font-bold text-xs uppercase tracking-widest">Выйти</button>
                                </div>
                            )}
                        </div>
                    </div>
                );
            }

            return null;
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
