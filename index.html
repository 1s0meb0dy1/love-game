                            )}
                            <div className="w-full flex flex-col divide-y divide-white/[0.08] border-y border-white/[0.08]">
                                <div className="flex justify-between items-center py-4 px-2"><span className="font-bold text-xs uppercase tracking-widest diff-text-1">Легких</span><span className="font-display text-2xl font-bold text-white"><AnimatedCounter target={cEasy} /></span></div>
                                <div className="flex justify-between items-center py-4 px-2"><span className="font-bold text-xs uppercase tracking-widest diff-text-2">Средних</span><span className="font-display text-2xl font-bold text-white"><AnimatedCounter target={cMed} /></span></div>
                                <div className="flex justify-between items-center py-4 px-2"><span className="font-bold text-xs uppercase tracking-widest diff-text-3">Глубоких</span><span className="font-display text-2xl font-bold text-white"><AnimatedCounter target={cHard} /></span></div>
                                <div className="flex justify-between items-center py-4 px-2"><span className="font-bold text-xs uppercase tracking-widest text-zinc-400">Пропущено</span><span className="font-display text-2xl font-bold text-white"><AnimatedCounter target={skippedCount} /></span></div>
                            </div>
                            <button onClick={() => { SoundFX.click(); navigate('menu'); }} className="w-full rounded-2xl font-bold text-xs uppercase tracking-[0.2em] btn-primary flex items-center justify-center gap-2"><Icons.Check /> В меню</button>
                        </div>
                        <AppFooter />
                    </div>
                );
            }

            if (screen === 'cat_list') {
                return (
                    <div className="safe-screen w-full flex flex-col fade-in max-w-md lg:max-w-3xl mx-auto relative z-10">
                        <header className="flex items-center justify-between gap-4 mb-6 pt-2">
                            <div className="flex items-center gap-3.5"><button onClick={() => { SoundFX.click(); navigate('menu'); }} className="p-3 bg-white/[0.04] rounded-2xl border border-white/10"><Icons.Back /></button><div><h2 className="font-display text-2xl font-bold text-white">Все вопросы</h2><p className="text-xs text-zinc-500 mt-0.5">Активно: {db.length - stats.archivedList.length - stats.disabledCount} из {db.length}</p></div></div>
                            {isAdmin && <button onClick={() => { SoundFX.click(); setAddStatus(null); setAddForm({ text: '', cat: 'family', diff: 'Простые', targetId: '' }); navigate('add_q'); }} className="hidden lg:flex px-5 h-12 rounded-2xl font-bold text-xs uppercase btn-primary items-center gap-2"><Icons.Plus /> Новый вопрос</button>}
                        </header>
                        \1{isAdmin && (
                                <div className="rounded-2xl border border-white/10 bg-white/[0.03]">
                                    <button type="button" aria-expanded={topicPanelOpen} onClick={() => { SoundFX.click(); if (!topicPanelOpen) { setTopicDraft(CATEGORIES.map(c => c.id)); setTopicErr(''); } setTopicPanelOpen(v => !v); }} className="w-full px-4 py-3.5 flex items-center justify-between text-left">
                                        <span className="text-sm font-bold text-white">Управление темами</span>
                                        <span aria-hidden="true" className="text-zinc-500">{topicPanelOpen ? '▴' : '▾'}</span>
                                    </button>
                                    {topicPanelOpen && (
                                        <div className="px-4 pb-4 flex flex-col gap-5 fade-in">
                                            <section className="flex flex-col gap-3">
                                                <div><div className="text-sm font-bold text-white">Новая тема</div><div className="text-xs text-zinc-500 leading-snug mt-0.5">Выберите иконку и назовите тему. Она сразу появится на главной и в списках.</div></div>
                                                <div className="flex flex-wrap gap-1.5">
                                                    {TOPIC_EMOJIS.map(em => (
                                                        <button key={em} type="button" aria-label={`Иконка ${em}`} aria-pressed={newTopicIcon === em} onClick={() => { SoundFX.click(); setNewTopicIcon(em); }} className={`w-10 h-10 rounded-xl border text-lg ${newTopicIcon === em ? 'border-rose-500 bg-rose-500/15' : 'border-white/10 bg-white/[0.04]'}`}>{em}</button>
                                                    ))}
                                                </div>
                                                <div className="flex gap-2">
                                                    <input type="text" value={newTopicIcon} maxLength={8} onChange={e => setNewTopicIcon(e.target.value)} placeholder="✨" aria-label="Иконка темы" className="w-16 h-12 rounded-xl bg-white/[0.04] border border-white/12 text-center text-xl text-white outline-none focus:border-rose-500" />
                                                    <input type="text" value={newTopicName} maxLength={30} onChange={e => { setNewTopicName(e.target.value); setTopicErr(''); }} placeholder="Название темы, например: Путешествия" aria-label="Название темы" className="flex-1 min-w-0 h-12 px-4 rounded-xl bg-white/[0.04] border border-white/12 text-sm text-white outline-none focus:border-rose-500" />
                                                </div>
                                                {topicErr && <span className="text-xs text-rose-400">{topicErr}</span>}
                                                <button type="button" disabled={topicBusy} onClick={addTopic} className="w-full h-12 rounded-2xl btn-primary text-xs font-bold uppercase tracking-widest disabled:opacity-50">{topicBusy ? 'Сохраняем…' : 'Добавить тему'}</button>
                                            </section>
                                            <div className="hairline-divider"></div>
                                            <section className="flex flex-col gap-3">
                                                <div><div className="text-sm font-bold text-white">Порядок тем</div><div className="text-xs text-zinc-500 leading-snug mt-0.5">Потяните за ⠿ или нажимайте стрелки. Порядок изменится на главной и во всех списках.</div></div>
                                                <TopicReorderList items={topicDraft.map(id => CATEGORIES.find(c => c.id === id)).filter(Boolean)} onChange={items => setTopicDraft(items.map(c => c.id))} />
                                                <button type="button" disabled={topicBusy || JSON.stringify(topicDraft) === JSON.stringify(CATEGORIES.map(c => c.id))} onClick={saveTopicOrder} className="w-full h-12 rounded-2xl border border-white/15 bg-white/[0.05] text-xs font-bold uppercase tracking-widest text-white disabled:opacity-40">Сохранить порядок</button>
                                            </section>
                                        </div>
                                    )}
                                </div>
                            )}
                            \2 divide-y md:divide-y-0 border-y border-white/[0.08] divide-white/[0.08]">
                                {CATEGORIES.map(cat => (
                                    <button key={cat.id} onClick={() => { SoundFX.click(); setViewCategory(cat.id); setVisibleLimit(60); navigate('q_list'); }} className="py-4 px-2 flex items-center justify-between text-left hover:bg-white/[0.02] transition-colors md:border-b md:border-white/[0.08]">
                                        <div className="flex items-center gap-3.5"><span className="text-2xl">{cat.icon}</span><div><div className="font-semibold text-base text-white">{cat.name}</div><div className="text-xs text-zinc-500">Активных: <span className="text-zinc-300 font-semibold">{stats.activeByCat[cat.id] || 0}</span> из {stats.totalByCat[cat.id] || 0}</div></div></div><span className="text-zinc-600"><Icons.Next /></span>
                                    </button>
                                ))}
                            </div>
                            <div className="pt-2 flex flex-col gap-4">
                                <button onClick={() => { SoundFX.click(); navigate('archive_page'); }} className="flex items-center gap-3 text-left group"> <span className="w-10 h-10 rounded-2xl bg-white/[0.04] border border-white/10 flex items-center justify-center text-rose-400 group-hover:border-rose-500/40 transition-all"><Icons.Archive /></span> <div><div className="font-bold text-base text-white flex items-center gap-2">Архив вопросов <span className="text-xs text-zinc-500 font-normal">→</span></div><div className="text-xs text-zinc-500">В архиве: {stats.archivedList.length} вопр.</div></div> </button>
                            </div>
                        </div>
                        {isAdmin && <div className="lg:hidden fixed bottom-5 left-5 right-5 max-w-md mx-auto pointer-events-none"> <button onClick={() => { SoundFX.click(); setAddStatus(null); setAddForm({ text: '', cat: 'family', diff: 'Простые', targetId: '' }); navigate('add_q'); }} className="w-full rounded-2xl font-bold text-xs uppercase btn-primary flex items-center justify-center gap-2 pointer-events-auto"><Icons.Plus /> Новый вопрос</button> </div>}
                    </div>
                );
            }

            if (screen === 'archive_page') {
                return (
                    <div className="safe-screen w-full flex flex-col fade-in max-w-2xl mx-auto relative z-10">
                        <header className="flex items-center justify-between gap-3 mb-6 pt-2 flex-wrap"> <div className="flex items-center gap-3.5"><button onClick={() => { SoundFX.click(); navigate('cat_list'); }} className="p-3 bg-white/[0.04] rounded-2xl border border-white/10"><Icons.Back /></button><div><h2 className="font-display text-2xl font-bold text-white">Архив вопросов</h2></div></div> </header>
                        {stats.archivedList.length === 0 ? ( <div className="flex-1 flex flex-col items-center justify-center text-center py-16 gap-4"><div className="w-12 h-12 rounded-2xl bg-white/[0.04] border border-white/10 flex items-center justify-center text-zinc-500"><Icons.Archive /></div><p className="text-sm text-zinc-400 max-w-xs leading-relaxed">Архив пуст.</p><button onClick={() => navigate('cat_list')} className="px-6 rounded-2xl btn-secondary text-xs font-bold mt-2">К темам</button></div> ) : ( <div className="flex-1 flex flex-col gap-6 pb-24"><div className="flex flex-col divide-y divide-white/[0.08] border-y border-white/[0.08]"> {filteredArchivedList.slice(0, archiveVisibleLimit).map(q => ( <div key={q.dbKey} className="py-4 flex items-start justify-between gap-4"><div className="text-sm text-zinc-200"><div className="flex items-center gap-2 text-[11px] mb-1"><span className="text-rose-400 font-bold">№ {q.num}</span></div>{q.cleanText}</div><button onClick={() => handleRestoreSingleFromArchive(q)} className="px-3.5 py-2 rounded-xl border border-white/15 bg-white/[0.04] text-[11px] font-bold"><Icons.Restore /> Вернуть</button></div> ))} </div> <button onClick={() => handleRestoreBatchFromArchive(stats.archivedList)} className="w-full rounded-2xl btn-primary text-xs font-bold uppercase flex items-center justify-center gap-2 mt-2"><Icons.Restore /> Вернуть все</button></div> )}
                    </div>
                );
            }

            if (screen === 'q_list') {
                const qs = profileDb.filter(q => q.categoryId === viewCategory);
                return (
                    <div className="safe-screen w-full flex flex-col fade-in max-w-2xl mx-auto relative z-10">
                        <header className="flex items-center justify-between gap-4 mb-7 pt-2 flex-shrink-0">
                            <div className="flex items-center gap-3.5"><button onClick={() => { SoundFX.click(); navigate('cat_list'); }} className="p-3 bg-white/[0.04] rounded-2xl border border-white/10"><Icons.Back /></button><h2 className="font-display text-2xl font-bold text-white">{CATEGORIES.find(c => c.id === viewCategory)?.name}</h2></div>
                            {isAdmin && <button onClick={() => { SoundFX.click(); setAddStatus(null); setAddForm({ text: '', cat: viewCategory || 'family', diff: 'Простые', targetId: '' }); navigate('add_q'); }} className="hidden lg:flex px-5 h-12 rounded-2xl font-bold text-xs uppercase btn-primary items-center gap-2"><Icons.Plus /> Новый вопрос</button>}
                        </header>
                        <div className="flex-1 flex flex-col gap-10 pb-24">
                            {DIFFICULTIES.map(diff => {
                                const diffQs = qs.filter(q => q.level === diff.id); if (diffQs.length === 0) return null;
                                return ( <div key={diff.id} className="space-y-3"><h3 className={`font-display text-sm font-bold uppercase ${diff.classText}`}>{diff.name}</h3><div className="flex flex-col divide-y divide-white/[0.08] border-y border-white/[0.08]"> {diffQs.slice(0, visibleLimit).map(q => ( <div key={q.dbKey} className="py-4 flex items-start justify-between gap-4"> <div className="text-[15px] text-zinc-100 flex-1"><span className="text-rose-400 font-bold mr-2">№ {q.num}.</span>{q.cleanText}</div> <div className="flex items-center gap-2 flex-shrink-0"> {isAdmin && <button onClick={() => openEditScreen(q, 'q_list')} className="p-2 rounded-xl bg-white/[0.04] text-zinc-400 border border-white/10"><Icons.Edit /></button>} </div> </div> ))} </div></div> );
                            })}
                        </div>
                    </div>
                );
            }

            if (screen === 'edit_q' && editingQuestion && isAdmin) {
                return (
                    <div className="safe-screen w-full flex flex-col fade-in max-w-lg mx-auto relative z-10">
                        <header className="flex items-center gap-3.5 mb-6 pt-2"><button onClick={() => { SoundFX.click(); navigate(returnScreen); }} className="p-3 bg-white/[0.04] rounded-2xl border border-white/10"><Icons.Back /></button><div><h2 className="font-display text-xl font-bold text-white">Редактирование</h2><p className="text-xs text-zinc-500">№ {editingQuestion.num}</p></div></header>
                        <div className="flex-1 flex flex-col gap-5 slide-up">
                            <textarea value={editForm.text} onChange={e => setEditForm({...editForm, text: e.target.value})} className="w-full p-4 rounded-2xl bg-white/[0.04] border border-white/12 text-base text-white h-36 focus:border-rose-500"></textarea>
                            <input type="text" placeholder="ID сессии (оставьте пустым для всех)" value={editForm.targetId} onChange={e => setEditForm({...editForm, targetId: e.target.value})} className="w-full h-14 px-5 rounded-2xl bg-white/[0.04] border border-white/12 text-white" />
                            <div className="grid grid-cols-2 gap-4"><CustomSelect value={editForm.cat} onChange={val => setEditForm({...editForm, cat: val})} options={CATEGORIES.map(c=>({value:c.id, label:c.name}))} /><CustomSelect value={editForm.diff} onChange={val => setEditForm({...editForm, diff: val})} options={DIFFICULTIES.map(d=>({value:d.id, label:d.name}))} /></div>
                            <button onClick={() => setConfirmModal({ action: 'delete', title: 'Удалить вопрос?' })} className="w-full h-13 py-3.5 rounded-2xl border border-rose-500/40 bg-rose-500/10 text-rose-300 font-bold uppercase text-xs flex items-center justify-center gap-2"><Icons.Trash /> Удалить</button>
                            <div className="mt-auto pt-4 grid grid-cols-2 gap-3.5"><button onClick={() => navigate(returnScreen)} className="w-full rounded-2xl btn-secondary font-bold text-xs uppercase">Отмена</button><button onClick={() => setConfirmModal({ action: 'save', title: 'Сохранить?' })} disabled={isSaving} className="w-full rounded-2xl btn-primary font-bold text-xs uppercase"><Icons.Check /> Сохранить</button></div>
                        </div>
                        <PopupModal isOpen={Boolean(confirmModal)} onClose={() => setConfirmModal(null)}>
                            {confirmModal && <div className="text-center gap-5 pt-2"><h3 className="font-display font-bold text-white mb-4">{confirmModal.title}</h3><div className="grid grid-cols-2 gap-3 w-full"><button onClick={() => setConfirmModal(null)} className="btn-secondary rounded-2xl uppercase font-bold text-xs p-3">Отмена</button><button onClick={() => confirmModal.action === 'delete' ? executeDeleteQuestion() : executeSaveEdit()} className="btn-primary rounded-2xl uppercase font-bold text-xs p-3">Да</button></div></div>}
                        </PopupModal>
                        <PopupModal isOpen={Boolean(resultModal)} onClose={() => { const target = resultModal?.afterCloseScreen; setResultModal(null); if (target) navigate(target); }}>
                            {resultModal && <div className="text-center gap-4 pt-2"><h3 className="font-display text-lg font-bold text-white mb-2">{resultModal.msg}</h3><button onClick={() => { const target = resultModal.afterCloseScreen; setResultModal(null); if (target) navigate(target); }} className="w-full rounded-2xl btn-primary font-bold text-xs p-3 mt-1">Понятно</button></div>}
                        </PopupModal>
                    </div>
                );
            }

            if (screen === 'add_q' && isAdmin) {
                return (
                    <div className="safe-screen w-full flex flex-col fade-in max-w-lg mx-auto relative z-10">
                        <header className="flex items-center gap-3.5 mb-6 pt-2"><button onClick={() => { SoundFX.click(); navigate(viewCategory ? 'q_list' : 'cat_list'); }} className="p-3 bg-white/[0.04] rounded-2xl border border-white/10"><Icons.Back /></button><h2 className="font-display text-xl font-bold text-white">Новый вопрос</h2></header>
                        {addStatus ? (
                            <div className="flex-1 flex flex-col items-center justify-center slide-up"><h3 className="font-display text-2xl font-bold text-white">{addStatus.ok ? 'Вопрос добавлен' : 'Ошибка'}</h3><p className="text-xs text-zinc-400 mb-4 mt-2">{addStatus.msg}</p><div className="grid grid-cols-2 gap-3 w-full max-w-xs"><button onClick={() => navigate(viewCategory ? 'q_list' : 'cat_list')} className="btn-secondary rounded-2xl uppercase text-xs p-3 font-bold">К списку</button><button onClick={() => setAddStatus(null)} className="btn-primary rounded-2xl uppercase text-xs p-3 font-bold">Еще один</button></div></div>
                        ) : (
                            <form onSubmit={handleAddQuestion} className="flex-1 flex flex-col gap-5 slide-up">
                                <textarea required value={addForm.text} onChange={e => setAddForm({...addForm, text: e.target.value})} className="w-full p-4 rounded-2xl bg-white/[0.04] border border-white/12 text-base text-white h-36 focus:border-rose-500" placeholder="Введите вопрос..."></textarea>
                                <input type="text" placeholder="ID сессии (оставьте пустым для всех)" value={addForm.targetId} onChange={e => setAddForm({...addForm, targetId: e.target.value})} className="w-full h-14 px-5 rounded-2xl bg-white/[0.04] border border-white/12 text-white" />
                                <div className="grid grid-cols-2 gap-4"><CustomSelect value={addForm.cat} onChange={val => setAddForm({...addForm, cat: val})} options={CATEGORIES.map(c=>({value:c.id, label:c.name}))} /><CustomSelect value={addForm.diff} onChange={val => setAddForm({...addForm, diff: val})} options={DIFFICULTIES.map(d=>({value:d.id, label:d.name}))} /></div>
                                <button type="button" disabled={isGeneratingQuestion} onClick={handleGenerateQuestionAI} className="w-full h-13 rounded-2xl border border-rose-500/40 bg-rose-500/10 text-rose-200 font-bold uppercase text-xs flex items-center justify-center gap-2"><Icons.Sparkles /> {isGeneratingQuestion ? "Генерация..." : "Идея от ИИ"}</button>
                                <div className="mt-auto pt-4 grid grid-cols-2 gap-3.5"><button type="button" onClick={() => navigate(viewCategory ? 'q_list' : 'cat_list')} className="w-full rounded-2xl btn-secondary font-bold text-xs uppercase">Отмена</button><button type="submit" disabled={isSaving || !addForm.text.trim()} className="w-full rounded-2xl btn-primary font-bold text-xs uppercase flex items-center justify-center gap-2"><Icons.Plus /> Сохранить</button></div>
                            </form>
                        )}
                    </div>
                );
            }

            return null;
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
