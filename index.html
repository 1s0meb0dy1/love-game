                                                                className="h-10 px-3 rounded-xl bg-white/5 border border-white/10 text-xs text-white/90 outline-none"
                                                            >
                                                                <option value="all" className="bg-[#160a1c]">Любая сложность</option>
                                                                {DIFFICULTIES.map(d => (
                                                                    <option key={d.id} value={d.id} className="bg-[#160a1c]">{d.name}</option>
                                                                ))}
                                                            </select>
                                                        </div>

                                                        {(archiveFilterCat !== 'all' || archiveFilterDiff !== 'all' || archiveSearch.trim() !== '') && (
                                                            <div className="flex items-center justify-between pt-1 px-1">
                                                                <span className="text-[11px] text-white/50">
                                                                    Найдено: {filteredArchivedList.length}
                                                                </span>
                                                                <button 
                                                                    onClick={() => {
                                                                        SoundFX.click();
                                                                        setArchiveFilterCat('all');
                                                                        setArchiveFilterDiff('all');
                                                                        setArchiveSearch('');
                                                                    }}
                                                                    className="text-[11px] font-bold text-amber-300 hover:underline"
                                                                >
                                                                    Сбросить фильтры
                                                                </button>
                                                            </div>
                                                        )}
                                                    </div>

                                                    <div className="flex flex-col gap-2.5 max-h-[380px] overflow-y-auto no-scrollbar pr-1">
                                                        {filteredArchivedList.length === 0 ? (
                                                            <div className="text-center py-6 text-xs text-white/40">
                                                                По выбранным фильтрам в архиве ничего не найдено
                                                            </div>
                                                        ) : (
                                                            filteredArchivedList.slice(0, archiveVisibleLimit).map(q => {
                                                                const cInfo = CATEGORIES.find(c => c.id === q.categoryId) || CATEGORIES[0];
                                                                const dInfo = DIFFICULTIES.find(d => d.id === q.level) || DIFFICULTIES[0];
                                                                return (
                                                                    <div key={q.dbKey} className="p-4 rounded-2xl bg-white/[0.03] border border-white/10 flex items-start justify-between gap-3">
                                                                        <div className="text-xs text-white/85 leading-relaxed">
                                                                            <div className="flex items-center gap-1.5 mb-1">
                                                                                <span className="text-amber-400 font-bold">№ {q.num}</span>
                                                                                <span>•</span>
                                                                                <span className="text-white/60">{cInfo.icon} {cInfo.name}</span>
                                                                                <span>•</span>
                                                                                <span className={dInfo.classText}>{dInfo.name}</span>
                                                                            </div>
                                                                            {q.cleanText}
                                                                        </div>
                                                                        <button 
                                                                            onClick={() => handleRestoreSingleFromArchive(q)}
                                                                            className="flex-shrink-0 px-3 py-2 rounded-xl bg-emerald-500/15 hover:bg-emerald-500/25 border border-emerald-500/30 text-emerald-300 text-[10px] font-bold uppercase tracking-wider flex items-center gap-1 active:scale-95 transition-all"
                                                                        >
                                                                            <Icons.Restore /> Вернуть
                                                                        </button>
                                                                    </div>
                                                                );
                                                            })
                                                        )}
                                                        {filteredArchivedList.length > archiveVisibleLimit && (
                                                            <button 
                                                                onClick={() => { SoundFX.click(); setArchiveVisibleLimit(prev => prev + 60); }}
                                                                className="w-full py-3 rounded-xl bg-white/5 text-xs font-bold uppercase tracking-widest text-white/60 hover:text-white"
                                                            >
                                                                Показать еще ({filteredArchivedList.length - archiveVisibleLimit})
                                                            </button>
                                                        )}
                                                    </div>

                                                    {(archiveFilterCat !== 'all' || archiveFilterDiff !== 'all' || archiveSearch.trim() !== '') && filteredArchivedList.length > 0 && (
                                                        <button 
                                                            onClick={() => handleRestoreBatchFromArchive(filteredArchivedList)}
                                                            className="w-full h-12 rounded-2xl bg-sky-500/15 hover:bg-sky-500/25 border border-sky-400/30 text-sky-300 text-[11px] font-bold uppercase tracking-widest flex items-center justify-center gap-2 transition-all active:scale-95"
                                                        >
                                                            <Icons.Restore /> Вернуть найденные ({filteredArchivedList.length})
                                                        </button>
                                                    )}
                                                </div>
                                            )}

                                            <button 
                                                onClick={() => handleRestoreBatchFromArchive(stats.archivedList)}
                                                className="w-full h-14 rounded-2xl bg-emerald-600/20 hover:bg-emerald-600/30 border border-emerald-500/40 text-emerald-300 text-xs font-bold uppercase tracking-widest flex items-center justify-center gap-2 transition-all active:scale-95 mt-1"
                                            >
                                                <Icons.Restore /> Вернуть все вопросы ({totalArchivedCount})
                                            </button>
                                        </>
                                    )}
                                </div>
                            </div>

                            <AppFooter extraBottomPadding={isAdmin} />
                        </div>

                        {isAdmin && (
                            <div className="fixed bottom-6 left-5 right-5 max-w-lg mx-auto pointer-events-none" style={{ paddingBottom: 'env(safe-area-inset-bottom)' }}>
                                <button 
                                    onClick={() => { SoundFX.click(); setAddStatus(null); setAddForm({ text: '', cat: 'family', diff: 'Простые' }); setScreen('add_q'); }} 
                                    className="w-full h-14 rounded-2xl font-bold text-sm uppercase tracking-widest btn-romantic flex items-center justify-center gap-2 shadow-2xl pointer-events-auto"
                                >
                                    <Icons.Plus /> Добавить вопрос в базу
                                </button>
                            </div>
                        )}
                    </div>
                );
            }

            // СПИСОК ВОПРОСОВ ВЫБРАННОЙ КАТЕГОРИИ
            if (screen === 'q_list') {
                const cat = CATEGORIES.find(c => c.id === viewCategory) || CATEGORIES[0];
                const qs = profileDb.filter(q => q.categoryId === viewCategory);
                
                return (
                    <div className="safe-screen w-full flex flex-col p-5 fade-in max-w-2xl mx-auto relative z-10">
                        <div className="flex items-center justify-between gap-4 mb-8 pt-2 flex-shrink-0">
                            <div className="flex items-center gap-4">
                                <button onClick={() => { SoundFX.click(); setScreen('cat_list'); }} className="p-4 bg-white/5 rounded-full hover:bg-white/10 text-white/80 transition-all">
                                    <Icons.Back />
                                </button>
                                <div>
                                    <h2 className="text-2xl font-bold text-white tracking-wide flex items-center gap-2">
                                        {cat.icon} {cat.name}
                                    </h2>
                                    <div className="text-[11px] font-bold uppercase tracking-widest text-white/40 mt-1">
                                        Активных: {stats.activeByCat[cat.id] || 0} из {qs.length}
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div className="flex-1 overflow-y-auto no-scrollbar flex flex-col gap-10 pb-28">
                            {DIFFICULTIES.map(diff => {
                                const diffQs = qs.filter(q => q.level === diff.id);
                                if (diffQs.length === 0) return null;
                                const shownQs = diffQs.slice(0, visibleLimit);

                                return (
                                    <div key={diff.id}>
                                        <h3 className={`text-[22px] md:text-2xl font-bold uppercase tracking-widest mb-5 pl-2 ${diff.classText}`}>
                                            {diff.name} ({diffQs.length})
                                        </h3>
                                        <div className="flex flex-col gap-3">
                                            {shownQs.map(q => (
                                                <div 
                                                    key={q.dbKey} 
                                                    className={`clean-card p-5 flex items-start justify-between gap-3.5 transition-opacity ${q.disabled ? 'opacity-45' : 'opacity-100'}`}
                                                >
                                                    <div className="text-[15px] md:text-base font-normal text-white/90 leading-snug flex-1">
                                                        <span className="text-white/40 font-bold mr-2">№ {q.num}.</span>
                                                        {q.cleanText}
                                                        {q.archived && (
                                                            <span className="ml-2 inline-block text-[10px] font-bold uppercase px-2 py-0.5 rounded-md bg-amber-500/20 text-amber-300">
                                                                В архиве
                                                            </span>
                                                        )}
                                                        {q.disabled && (
                                                            <span className="ml-2 inline-block text-[10px] font-bold uppercase px-2 py-0.5 rounded-md bg-rose-500/20 text-rose-300">
                                                                Скрыт вами
                                                            </span>
                                                        )}
                                                    </div>

                                                    <div className="flex items-center gap-2 flex-shrink-0">
                                                        <button 
                                                            onClick={() => toggleQuestionPersonalEnable(q)}
                                                            title={q.disabled ? "Включить вопрос для себя" : "Отключить вопрос для себя"}
                                                            className={`px-3 py-2 rounded-xl text-[10px] font-bold uppercase tracking-wider border transition-all active:scale-90 ${
                                                                q.disabled 
                                                                    ? 'bg-white/5 border-white/10 text-white/40' 
                                                                    : 'bg-emerald-500/15 border-emerald-500/35 text-emerald-300'
                                                            }`}
                                                        >
                                                            {q.disabled ? "Выкл" : "Вкл"}
                                                        </button>

                                                        {isAdmin && (
                                                            <button 
                                                                onClick={() => openEditScreen(q, 'q_list')}
                                                                title="Редактировать вопрос в БД"
                                                                className="p-2.5 rounded-xl bg-white/5 hover:bg-white/15 text-white/60 hover:text-white active:scale-90 transition-all border border-white/10"
                                                            >
                                                                <Icons.Edit />
                                                            </button>
                                                        )}
                                                    </div>
                                                </div>
                                            ))}
                                            {diffQs.length > visibleLimit && (
                                                <button 
                                                    onClick={() => { SoundFX.click(); setVisibleLimit(prev => prev + 80); }}
                                                    className="w-full h-12 rounded-2xl bg-white/5 hover:bg-white/10 text-xs font-bold uppercase tracking-widest text-white/70"
                                                >
                                                    Показать еще ({diffQs.length - visibleLimit})
                                                </button>
                                            )}
                                        </div>
                                    </div>
                                );
                            })}

                            <AppFooter extraBottomPadding={isAdmin} />
                        </div>

                        {isAdmin && (
                            <div className="fixed bottom-6 left-5 right-5 max-w-2xl mx-auto pointer-events-none" style={{ paddingBottom: 'env(safe-area-inset-bottom)' }}>
                                <button 
                                    onClick={() => { SoundFX.click(); setAddStatus(null); setAddForm({ text: '', cat: viewCategory || 'family', diff: 'Простые' }); setScreen('add_q'); }} 
                                    className="w-full h-14 rounded-2xl font-bold text-sm uppercase tracking-widest btn-romantic flex items-center justify-center gap-2 shadow-2xl pointer-events-auto"
                                >
                                    <Icons.Plus /> Добавить вопрос в базу
                                </button>
                            </div>
                        )}
                    </div>
                );
            }

            // ЭКРАН РЕДАКТИРОВАНИЯ И УДАЛЕНИЯ ВОПРОСА
            if (screen === 'edit_q' && editingQuestion && isAdmin) {
                const origText = (editingQuestion.cleanText || editingQuestion.text.replace(/^№\s*\d+\.\s*/, '')).trim();
                const hasChanges = 
                    editForm.text.trim() !== "" && (
                        editForm.text.trim() !== origText ||
                        editForm.cat !== editingQuestion.categoryId ||
                        editForm.diff !== editingQuestion.level
                    );

                return (
                    <div className="safe-screen w-full flex flex-col p-5 fade-in max-w-lg mx-auto relative z-10">
                        <div className="flex items-center justify-between mb-6 pt-2">
                            <div className="flex items-center gap-4">
                                <button onClick={() => { SoundFX.click(); setScreen(returnScreen); }} className="p-4 bg-white/5 rounded-full hover:bg-white/10 text-white/80 transition-all">
                                    <Icons.Back />
                                </button>
                                <div>
                                    <h2 className="text-xl font-bold text-white tracking-wide">Редактирование (Админ)</h2>
                                    <p className="text-[11px] font-bold uppercase tracking-widest text-white/40 mt-0.5">
                                        Вопрос № {editingQuestion.num} • ID: {editingQuestion.id}
                                    </p>
                                </div>
                            </div>
                        </div>

                        <div className="flex-1 flex flex-col gap-6 slide-up">
                            <div>
                                <label className="block text-[11px] font-bold uppercase tracking-widest text-white/50 mb-3 ml-2">Текст вопроса</label>
                                <textarea 
                                    value={editForm.text}
                                    onChange={e => setEditForm({...editForm, text: e.target.value})}
                                    className="w-full glass-panel p-5 text-base text-white/95 placeholder-white/20 outline-none resize-none h-36 focus:border-[#e11d48]/50 transition-colors shadow-inner"
                                    placeholder="Введите текст вопроса..."
                                ></textarea>
                            </div>
                            
                            <div>
                                <label className="block text-[11px] font-bold uppercase tracking-widest text-white/50 mb-3 ml-2">Тема вопроса</label>
                                <select 
                                    value={editForm.cat}
                                    onChange={e => { SoundFX.toggle(true); setEditForm({...editForm, cat: e.target.value}); }}
                                    className="w-full glass-panel h-14 px-5 text-base text-white/90 outline-none appearance-none font-medium bg-transparent"
                                >
                                    {CATEGORIES.map(c => <option key={c.id} value={c.id} className="bg-[#160a1c] text-white">{c.icon} {c.name}</option>)}
                                </select>
                            </div>

                            <div>
                                <label className="block text-[11px] font-bold uppercase tracking-widest text-white/50 mb-3 ml-2">Сложность</label>
                                <select 
                                    value={editForm.diff}
                                    onChange={e => { SoundFX.toggle(true); setEditForm({...editForm, diff: e.target.value}); }}
                                    className="w-full glass-panel h-14 px-5 text-base text-white/90 outline-none appearance-none font-medium bg-transparent"
                                >
                                    {DIFFICULTIES.map(d => <option key={d.id} value={d.id} className="bg-[#160a1c] text-white">{d.name}</option>)}
                                </select>
                            </div>

                            <button 
                                type="button"
                                onClick={() => { SoundFX.warn(); setConfirmModal({ action: 'delete', title: 'Точно ли вы хотите удалить этот вопрос из базы данных?' }); }}
                                className="w-full h-14 rounded-2xl border border-rose-500/40 bg-rose-950/20 hover:bg-rose-900/30 text-rose-400 text-xs font-bold uppercase tracking-widest flex items-center justify-center gap-2 transition-all active:scale-95"
                            >
                                <Icons.Trash /> Удалить вопрос
                            </button>

                            <div className="mt-auto pt-2 grid grid-cols-2 gap-4">
                                <button 
                                    type="button" 
                                    onClick={() => { SoundFX.click(); setScreen(returnScreen); }} 
                                    className="w-full h-14 rounded-2xl btn-ghost text-xs font-bold uppercase tracking-widest"
                                >
                                    Отменить
                                </button>
                                <button 
                                    type="button"
                                    disabled={!hasChanges || isSaving}
                                    onClick={() => { SoundFX.click(); setConfirmModal({ action: 'save', title: 'Точно ли вы хотите изменить этот вопрос в базе данных?' }); }}
                                    className="w-full h-14 rounded-2xl btn-romantic text-white text-xs font-bold uppercase tracking-widest flex items-center justify-center gap-2 shadow-xl disabled:opacity-25 disabled:pointer-events-none"
                                >
                                    <Icons.Check /> Сохранить
                                </button>
                            </div>

                            <AppFooter />
                        </div>

                        {confirmModal && (
                            <div className="fixed inset-0 bg-black/80 backdrop-blur-md flex items-center justify-center p-5 z-50 fade-in">
                                <div className="glass-panel p-7 w-full max-w-sm text-center flex flex-col items-center gap-6 border border-white/10">
                                    <div className="text-4xl">{confirmModal.action === 'delete' ? '🗑️' : '✏️'}</div>
                                    <h3 className="text-base font-bold text-white leading-snug">
                                        {confirmModal.title}
                                    </h3>
                                    <div className="grid grid-cols-2 gap-3 w-full">
                                        <button 
                                            onClick={() => { SoundFX.click(); setConfirmModal(null); }}
                                            className="w-full h-14 rounded-2xl btn-ghost text-xs font-bold uppercase tracking-widest"
                                        >
                                            Отмена
                                        </button>
                                        <button 
                                            onClick={() => confirmModal.action === 'delete' ? executeDeleteQuestion() : executeSaveEdit()}
                                            className="w-full h-14 rounded-2xl btn-romantic text-white text-xs font-bold uppercase tracking-widest"
                                        >
                                            Да
                                        </button>
                                    </div>
                                </div>
                            </div>
                        )}

                        {resultModal && (
                            <div className="fixed inset-0 bg-black/85 backdrop-blur-md flex items-center justify-center p-5 z-50 fade-in">
                                <div className="glass-panel p-8 w-full max-w-sm text-center flex flex-col items-center gap-5 border border-white/10">
                                    <div className="text-5xl">{resultModal.ok ? '✅' : '⚠️'}</div>
                                    <h3 className="text-lg font-bold text-white">
                                        {resultModal.ok ? 'Выполнено успешно' : 'Ошибка базы данных'}
                                    </h3>
                                    <p className="text-xs text-white/70 leading-relaxed">
                                        {resultModal.msg}
                                    </p>
                                    <button 
                                        onClick={() => {
                                            SoundFX.click();
                                            const target = resultModal.afterCloseScreen;
                                            setResultModal(null);
                                            if (target) setScreen(target);
                                        }}
                                        className="w-full h-14 rounded-2xl btn-romantic text-white text-xs font-bold uppercase tracking-widest mt-2"
                                    >
                                        Понятно
                                    </button>
                                </div>
                            </div>
                        )}
                    </div>
                );
            }

            // ФОРМА ДОБАВЛЕНИЯ НОВОГО ВОПРОСА + AI ГЕНЕРАТОР
            if (screen === 'add_q' && isAdmin) {
                return (
                    <div className="safe-screen w-full flex flex-col p-5 fade-in max-w-lg mx-auto relative z-10">
                        <div className="flex items-center gap-4 mb-6 pt-2">
                            <button onClick={() => { SoundFX.click(); setScreen(viewCategory ? 'q_list' : 'cat_list'); }} className="p-4 bg-white/5 rounded-full hover:bg-white/10 text-white/80 transition-all">
                                <Icons.Back />
                            </button>
                            <h2 className="text-2xl font-bold text-white tracking-wide">Новый вопрос (Админ)</h2>
                        </div>

                        {addStatus ? (
                            <div className="flex-1 flex flex-col items-center justify-center slide-up">
                                <div className="glass-panel p-8 w-full flex flex-col items-center text-center shadow-2xl">
                                    {addStatus.ok ? (
                                        <svg className="checkmark mb-6" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 52 52">
                                            <circle className="checkmark-circle" cx="26" cy="26" r="25" fill="none"/>
                                            <path className="checkmark-check" fill="none" d="M14.1 27.2l7.1 7.2 16.7-16.8"/>
                                        </svg>
                                    ) : (
                                        <div className="text-5xl mb-6">⚠️</div>
                                    )}
                                    <h3 className="text-xl font-bold text-white mb-2 tracking-wide">
                                        {addStatus.ok ? 'Успешно добавлен!' : 'Ошибка сохранения'}
                                    </h3>
                                    <p className="text-xs text-white/70 mb-8 leading-relaxed">
                                        {addStatus.msg}
                                    </p>
                                    <div className="grid grid-cols-2 gap-3 w-full">
                                        <button 
                                            onClick={() => { SoundFX.click(); setScreen(viewCategory ? 'q_list' : 'cat_list'); }} 
                                            className="btn-ghost h-14 w-full rounded-2xl text-xs font-bold uppercase tracking-widest"
                                        >
                                            К списку
                                        </button>
                                        <button 
                                            onClick={() => { SoundFX.click(); setAddStatus(null); setAddForm({ text: '', cat: addForm.cat, diff: addForm.diff }); }} 
                                            className="btn-romantic h-14 w-full rounded-2xl text-xs font-bold uppercase tracking-widest text-white"
                                        >
                                            Еще один
                                        </button>
                                    </div>
                                </div>
                                <AppFooter />
                            </div>
                        ) : (
                            <form onSubmit={handleAddQuestion} className="flex-1 flex flex-col gap-5 slide-up">
                                <div>
                                    <label className="block text-[11px] font-bold uppercase tracking-widest text-white/50 mb-2.5 ml-2">Текст вопроса</label>
                                    <textarea 
                                        required
                                        value={addForm.text}
                                        onChange={e => setAddForm({...addForm, text: e.target.value})}
                                        className="w-full glass-panel p-5 text-base text-white/95 placeholder-white/25 outline-none resize-none h-36 focus:border-[#e11d48]/50 transition-colors shadow-inner"
                                        placeholder="Напишите вопрос вручную или нажмите «Сгенерировать вопрос» ниже..."
                                    ></textarea>
                                </div>
                                
                                <div>
                                    <label className="block text-[11px] font-bold uppercase tracking-widest text-white/50 mb-2.5 ml-2">Тема вопроса</label>
                                    <select 
                                        value={addForm.cat}
                                        onChange={e => { SoundFX.toggle(true); setAddForm({...addForm, cat: e.target.value}); }}
                                        className="w-full glass-panel h-14 px-5 text-base text-white/90 outline-none appearance-none font-medium bg-transparent"
                                    >
                                        {CATEGORIES.map(c => <option key={c.id} value={c.id} className="bg-[#160a1c] text-white">{c.icon} {c.name}</option>)}
                                    </select>
                                </div>

                                <div>
                                    <label className="block text-[11px] font-bold uppercase tracking-widest text-white/50 mb-2.5 ml-2">Сложность</label>
                                    <select 
                                        value={addForm.diff}
                                        onChange={e => { SoundFX.toggle(true); setAddForm({...addForm, diff: e.target.value}); }}
                                        className="w-full glass-panel h-14 px-5 text-base text-white/90 outline-none appearance-none font-medium bg-transparent"
                                    >
                                        {DIFFICULTIES.map(d => <option key={d.id} value={d.id} className="bg-[#160a1c] text-white">{d.name}</option>)}
                                    </select>
                                </div>

                                <button 
                                    type="button"
                                    disabled={isGeneratingQuestion}
                                    onClick={handleGenerateQuestionAI}
                                    className="w-full rounded-2xl btn-ai-magic text-white text-xs font-bold uppercase tracking-widest flex items-center justify-center gap-2.5 shadow-xl disabled:opacity-50"
                                >
                                    <Icons.Sparkles />
                                    {isGeneratingQuestion ? "ИИ придумывает уникальный вопрос..." : "Сгенерировать вопрос"}
                                </button>

                                <div className="mt-auto pt-4 grid grid-cols-2 gap-4">
                                    <button type="button" onClick={() => { SoundFX.click(); setScreen(viewCategory ? 'q_list' : 'cat_list'); }} className="w-full h-14 rounded-2xl btn-ghost text-xs font-bold uppercase tracking-widest">
                                        Отмена
                                    </button>
                                    <button type="submit" disabled={isSaving || !addForm.text.trim()} className="w-full h-14 rounded-2xl btn-romantic text-white text-xs font-bold uppercase tracking-widest flex items-center justify-center gap-2 shadow-xl disabled:opacity-30">
                                        <Icons.Plus /> {isSaving ? "Сохранение..." : "Сохранить"}
                                    </button>
                                </div>

                                <AppFooter />
                            </form>
                        )}
                    </div>
                );
            }

            return null;
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
