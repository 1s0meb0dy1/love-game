    <!-- Генератор PWA-иконки (Только градиент и сердечко) -->
    <script>
        (function initPWA() {
            try {
                const createIconDataUrl = (size) => {
                    const canvas = document.createElement('canvas');
                    canvas.width = size;
                    canvas.height = size;
                    const ctx = canvas.getContext('2d');

                    const bgGrad = ctx.createLinearGradient(0, 0, size, size);
                    bgGrad.addColorStop(0, '#f43f5e');
                    bgGrad.addColorStop(1, '#be123c');
                    ctx.fillStyle = bgGrad;
                    ctx.fillRect(0, 0, size, size);

                    ctx.fillStyle = '#ffffff';
                    ctx.save();
                    const scale = (size / 20) * 0.52;
                    ctx.translate(size * 0.5, size * 0.5);
                    ctx.scale(scale, scale);
                    ctx.beginPath();
                    ctx.moveTo(0, 9.35);
                    ctx.lineTo(-1.45, 8.03);
                    ctx.bezierCurveTo(-6.6, 3.36, -10, 0.28, -10, -3.5);
                    ctx.bezierCurveTo(-10, -6.58, -7.58, -9, -4.5, -9);
                    ctx.bezierCurveTo(-2.76, -9, -1.09, -8.19, 0, -6.91);
                    ctx.bezierCurveTo(1.09, -8.19, 2.76, -9, 4.5, -9);
                    ctx.bezierCurveTo(7.58, -9, 10, -6.58, 10, -3.5);
                    ctx.bezierCurveTo(10, 0.28, 6.6, 3.36, 1.45, 8.04);
                    ctx.closePath();
                    ctx.fill();
                    ctx.restore();

                    return canvas.toDataURL('image/png');
                };

                const icon192 = createIconDataUrl(192);
                const icon512 = createIconDataUrl(512);

                document.getElementById('pwa-apple-icon').href = icon512;
                document.getElementById('pwa-favicon').href = icon192;

                const manifestObj = {
                    name: "ASK ME — Игра для пар",
                    short_name: "Ask Me",
                    description: "Откровенные разговоры для двоих",
                    start_url: window.location.origin + window.location.pathname,
                    display: "standalone",
                    background_color: "#09080c",
                    theme_color: "#09080c",
                    icons: [
                        { src: icon192, sizes: "192x192", type: "image/png", purpose: "any maskable" },
                        { src: icon512, sizes: "512x512", type: "image/png", purpose: "any maskable" }
                    ]
                };
                document.getElementById('pwa-manifest').href = 'data:application/manifest+json;charset=utf-8,' + encodeURIComponent(JSON.stringify(manifestObj));
            } catch (e) {}
        })();
    </script>

        // ================= КРИПТОГРАФИЯ (AES-GCM WebCrypto) =================
        const bufToBase64Url = (buf) => btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
        const base64UrlToBuf = (b64u) => {
            const b64 = b64u.replace(/-/g, '+').replace(/_/g, '/').padEnd(b64u.length + (4 - b64u.length % 4) % 4, '=');
            const bin = atob(b64);
            const res = new Uint8Array(bin.length);
            for(let i=0; i<bin.length; i++) res[i] = bin.charCodeAt(i);
            return res.buffer;
        };

        const generateSessionId = () => {
            const ALPHABET = "23456789ABCDEFGHJKLMNPQRSTUVWXYZ";
            const bytes = new Uint8Array(8);
            window.crypto.getRandomValues(bytes);
            return Array.from(bytes).map(b => ALPHABET[b % ALPHABET.length]).join('');
        };

        const generateAESKey = async () => {
            const key = await window.crypto.subtle.generateKey({ name: 'AES-GCM', length: 128 }, true, ['encrypt', 'decrypt']);
            const raw = await window.crypto.subtle.exportKey('raw', key);
            return bufToBase64Url(raw);
        };

        const encryptSessionAES = async (dataObj, keyStr) => {
            try {
                const key = await window.crypto.subtle.importKey('raw', base64UrlToBuf(keyStr), { name: 'AES-GCM' }, false, ['encrypt']);
                const iv = window.crypto.getRandomValues(new Uint8Array(12));
                const encoded = new TextEncoder().encode(JSON.stringify(dataObj));
                const cipher = await window.crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, encoded);
                const combined = new Uint8Array(12 + cipher.byteLength);
                combined.set(iv, 0); combined.set(new Uint8Array(cipher), 12);
                return bufToBase64Url(combined.buffer);
            } catch (e) { return null; }
        };

        const decryptSessionAES = async (cipherB64Url, keyStr) => {
            try {
                const combined = new Uint8Array(base64UrlToBuf(cipherB64Url));
                const iv = combined.slice(0, 12);
                const data = combined.slice(12);
                const key = await window.crypto.subtle.importKey('raw', base64UrlToBuf(keyStr), { name: 'AES-GCM' }, false, ['decrypt']);
                const decrypted = await window.crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, data);
                return JSON.parse(new TextDecoder().decode(decrypted));
            } catch (e) { return null; }
        };

        // Старый XOR метод для обратной совместимости (миграция)
        const decryptLegacyXOR = (cipherB64, sessionId) => {
            try {
                const key = "ASKME_KEY_" + String(sessionId).trim().toUpperCase() + "_SECRET";
                const binary = atob(cipherB64);
                const bytes = new Uint8Array(binary.length);
                let state = 137;
                for (let i = 0; i < key.length; i++) state = (state * 31 + key.charCodeAt(i)) & 0xff;
                for (let i = 0; i < binary.length; i++) {
                    const kChar = key.charCodeAt(i % key.length);
                    state = (state + kChar + (i & 0xff)) & 0xff;
                    bytes[i] = binary.charCodeAt(i) ^ state ^ kChar;
                }
                return JSON.parse(new TextDecoder().decode(bytes));
            } catch (e) { return null; }
        };

        // ================= УТИЛИТЫ И AUDIO =================
        const sanitizeInput = (str, maxLength = 600) => str ? String(str).replace(/[<>]/g, "").trim().slice(0, maxLength) : "";
        
        const copyTextToClipboard = async (text) => {
            try {
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    await navigator.clipboard.writeText(text); return true;
                }
                const ta = document.createElement("textarea"); ta.value = text;
                document.body.appendChild(ta); ta.select(); document.execCommand("copy"); document.body.removeChild(ta);
                return true;
            } catch (e) { return false; }
        };

        const SoundFX = {
            ctx: null, filter: null, muted: false, unlocked: false,
            triggerHaptic(pattern = 12) {
                if (this.muted) return;
                try {
                    if (navigator.vibrate) navigator.vibrate(pattern);
                    else document.getElementById('ios-taptic-label')?.click();
                } catch (e) {}
            },
            init() {
                try {
                    const AudioCtx = window.AudioContext || window.webkitAudioContext;
                    if (!AudioCtx || this.ctx) return;
                    this.ctx = new AudioCtx(); this.filter = this.ctx.createBiquadFilter();
                    this.filter.type = "lowpass"; this.filter.frequency.value = 1650; this.filter.connect(this.ctx.destination);
                    if (this.ctx.state === 'suspended') this.ctx.resume();
                    const buf = this.ctx.createBuffer(1, 1, 22050);
                    const src = this.ctx.createBufferSource(); src.buffer = buf; src.connect(this.ctx.destination);
                    if (src.start) src.start(0); this.unlocked = true;
                } catch (e) {}
            },
            playAcousticNote(freq, duration = 0.12, vol = 0.24, endFreq = null) {
                if (this.muted) return;
                try {
                    this.init(); if (!this.ctx || !this.filter) return;
                    const now = this.ctx.currentTime;
                    const osc = this.ctx.createOscillator(); const sub = this.ctx.createOscillator(); const gain = this.ctx.createGain();
                    osc.type = 'sine'; sub.type = 'triangle';
                    osc.frequency.setValueAtTime(freq, now); sub.frequency.setValueAtTime(freq * 0.5, now);
                    if (endFreq) osc.frequency.exponentialRampToValueAtTime(endFreq, now + duration);
                    gain.gain.setValueAtTime(0.001, now); gain.gain.linearRampToValueAtTime(vol, now + 0.014); gain.gain.exponentialRampToValueAtTime(0.0008, now + duration);
                    osc.connect(gain); sub.connect(gain); gain.connect(this.filter);
                    osc.start(now); sub.start(now); osc.stop(now + duration + 0.015); sub.stop(now + duration + 0.015);
                } catch (e) {}

        };

        if (typeof window !== 'undefined') {

        // ================= MAIN APP =================

            // ================= РАБОТА С БД И АВТОРИЗАЦИЕЙ =================

                if (!profData || !profData.sessionId) return;
                try { localStorage.setItem(PROFILE_STORAGE_KEY, JSON.stringify(profData)); } catch (e) {}
                
                try {
                    const dbHashKey = "sess_" + profData.sessionId.toLowerCase(); // В БД храним просто по ID, но прочитать можно только зная ID.
                    const payloadObj = { guyName: profData.guyName, girlName: profData.girlName, archivedIds: profData.archivedIds || [], disabledIds: profData.disabledIds || [], savedGame: profData.savedGame || null, updatedAt: profData.updatedAt || Date.now() };
                    
                    let encryptedPayload = "";
                    if (profData.sessionKey) {
                        encryptedPayload = await encryptSessionAES(payloadObj, profData.sessionKey);
                    } else {
                        return; // Старые сессии не пушим заново без нового ключа
                    }

                    if (encryptedPayload) {
                        await fetch(`${FIREBASE_BASE_URL}/sessions/${dbHashKey}.json`, {
                            method: "PUT", headers: { "Content-Type": "application/json" },
                            body: JSON.stringify({ payload: encryptedPayload, updatedAt: Date.now() })

                    }
                } catch (e) { showToast("Ошибка синхронизации: " + e.message); }
            };

            // Автоматическое восстановление по ссылке
            useEffect(() => {
                const hash = window.location.hash;

                        setRestoreIdInput(sid + (key ? `|${key}` : ''));

                    }
                }
            }, []);

            const handleRestoreByInput = async (e) => {
                e.preventDefault();
                setIsRestoringSession(true);
                let sid = "", key = "";
                
                if (restoreIdInput.includes('http') || restoreIdInput.includes('sid=')) {
                    try {
                        const url = new URL(restoreIdInput);
                        const params = new URLSearchParams(url.hash.split('?')[1]);
                        sid = params.get('sid') || ""; key = params.get('key') || "";
                    } catch (err) {
                        const mSid = restoreIdInput.match(/sid=([A-Z0-9]{8})/i);
                        const mKey = restoreIdInput.match(/key=([\w-]+)/i);
                        if (mSid) sid = mSid[1]; if (mKey) key = mKey[1];
                    }
                } else if (restoreIdInput.includes('|')) {
                    [sid, key] = restoreIdInput.split('|');
                } else {
                    sid = restoreIdInput; // Legacy
                }

                sid = sid.trim().toUpperCase();
                if (sid.length !== 8) { showToast("Неверный формат ссылки или ID."); setIsRestoringSession(false); return; }

                try {
                    const dbHashKey = "sess_" + sid.toLowerCase();
                    const res = await fetch(`${FIREBASE_BASE_URL}/sessions/${dbHashKey}.json?t=${Date.now()}`);
                    if (!res.ok) throw new Error("Сессия не найдена");
                    const data = await res.json();
                    
                    if (data && data.payload) {
                        let decrypted = null;
                        if (key) decrypted = await decryptSessionAES(data.payload, key);
                        if (!decrypted) decrypted = decryptLegacyXOR(data.payload, sid); // Fallback для старых (старые лежали в корне, но если их перенесли...)
                        
                        // Если старая сессия лежала в корне (legacy):

                            // Если восстановили без AES ключа, генерируем новый и апгрейдим сессию

                                    <div className="flex items-center gap-1.5 flex-shrink-0">
                                        {!isStandalonePWA && (
                                            <button onClick={() => { SoundFX.click(); setShowPwaModal(true); }} title="Скачать на устройство" aria-label="Скачать приложение" className="p-2 rounded-full bg-rose-500/15 hover:bg-rose-500/25 border border-rose-500/35 text-rose-200 flex items-center justify-center transition-all active:scale-95"><Icons.DownloadApp /></button>
                                        )}
                                        <button onClick={() => { setIsMuted(!isMuted); SoundFX.muted = !isMuted; if(!isMuted)SoundFX.click(); }} aria-label={isMuted ? "Включить звук" : "Выключить звук"} className={`px-3 py-2 rounded-full border text-xs font-bold uppercase tracking-wider flex items-center gap-1.5 transition-all ${isMuted ? 'border-white/10 text-zinc-500' : 'border-rose-500/35 bg-rose-500/10 text-rose-300'}`}>{isMuted ? <Icons.SoundOff /> : <Icons.SoundOn />}<span className="hidden sm:inline">{isMuted ? "Выкл" : "Звук"}</span></button>
                                    </div>
                                </header>

                                <div className="flex flex-col items-center text-center gap-3 py-1">
                                    <AskMeLogo size="lg" onClick={() => { const nc = logoTapCount+1; setLogoTapCount(nc); if(nc>=5) { SoundFX.magic(); setLogoTapCount(0); navigate('admin_login'); } }} />
                                    <div className="flex items-center gap-2.5 text-base font-semibold text-white mt-1"><span>{profile.guyName}</span><span className="text-rose-500 text-sm">♥</span><span>{profile.girlName}</span></div>
                                    <p className="text-rose-400 text-[11px] sm:text-xs font-extrabold uppercase tracking-[0.24em] mt-0.5 drop-shadow-[0_0_14px_rgba(244,63,94,0.45)]">Откровенные разговоры для двоих</p>
                                </div>

                                <div className="hairline-divider"></div>

                                <div className="grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">
                                    <div className="lg:col-span-7 flex flex-col gap-8">
                                        <div className="space-y-4">
                                            <div className="flex items-center justify-between"><h2 className="text-xs font-bold uppercase tracking-[0.2em] text-zinc-400">Темы</h2></div>
                                            <div className="grid grid-cols-2 gap-2.5">
                                                {CATEGORIES.map(cat => {
                                                    const cnt = stats.activeByCat[cat.id] || 0; const isSel = selectedCats.includes(cat.id) && cnt > 0;
                                                    return <button key={cat.id} disabled={cnt===0} onClick={() => toggleCategory(cat.id)} className={`px-4 py-3.5 rounded-2xl text-sm font-semibold flex items-center justify-between transition-all ${cnt===0 ? 'opacity-25 border border-white/5 text-zinc-600' : isSel ? 'topic-pill-active' : 'topic-pill-inactive hover:border-white/20 hover:text-zinc-300'}`}><div className="flex items-center gap-2.5"><span className="text-base">{cat.icon}</span><span>{cat.name}</span></div><span className={`text-xs font-bold ${isSel ? 'text-rose-400' : 'text-zinc-600'}`}>{cnt}</span></button>;
                                                })}
                                            </div>
                                        </div>
                                        <div className="space-y-4">
                                            <h2 className="text-xs font-bold uppercase tracking-[0.2em] text-zinc-400">Сложность</h2>
                                            <div className="grid grid-cols-3 gap-2.5">
                                                {DIFFICULTIES.map(diff => (
                                                    <button key={diff.id} onClick={() => toggleDiff(diff.id)} className={`h-12 rounded-2xl text-xs font-bold uppercase tracking-wider transition-all ${selectedDiffs.includes(diff.id) ? diff.classBg : 'border border-white/10 text-zinc-500 hover:text-zinc-300'}`}>{diff.name}</button>
                                                ))}
                                            </div>
                                        </div>
                                    </div>

                                    <div className="lg:col-span-5 flex flex-col gap-7 lg:pl-6 lg:border-l lg:border-white/[0.08]">
                                        <div className="space-y-3.5"><div className="flex items-center justify-between"><h2 className="text-xs font-bold uppercase tracking-[0.2em] text-zinc-400">Список вопросов</h2><span className="text-xs text-zinc-500">Архив: <b className="text-zinc-300">{stats.archivedList.length}</b></span></div><button onClick={() => navigate('cat_list')} className="w-full rounded-2xl btn-secondary flex items-center justify-center gap-2.5 text-xs font-bold uppercase tracking-widest"><Icons.List /> Все вопросы</button></div>
                                        <div className="hairline-divider"></div>
                                        <div className="flex flex-col gap-5">
                                            <div className="flex items-center gap-3 w-full"><div className="h-[1px] flex-1 bg-white/10"></div><span className="text-[10px] font-bold uppercase tracking-[0.2em] text-zinc-400">Доступно для игры</span><div className="h-[1px] flex-1 bg-white/10"></div></div>
                                            <div className="grid grid-cols-[1fr_auto_1fr] items-center py-1">
                                                <div className="flex flex-col items-center gap-1"><span className="font-display text-4xl font-bold text-white leading-none">{selectedCats.filter(c => stats.activeByCat[c]>0).length}</span><span className="uppercase text-[10px] font-bold tracking-widest text-zinc-500">Тем(ы)</span></div>
                                                <div className="h-9 w-[1px] bg-white/10"></div>
                                                <div className="flex flex-col items-center gap-1"><span className="font-display text-4xl font-bold text-rose-500 leading-none">{stats.availableActive}</span><span className="uppercase text-[10px] font-bold tracking-widest text-zinc-500">Вопросов</span></div>
                                            </div>
                                            {profile.savedGame?.questionIds?.length > 0 && (
                                                <button onClick={handleResumeSavedGame} className="w-full rounded-2xl border border-rose-500/50 bg-rose-500/15 hover:bg-rose-500/20 text-rose-200 h-14 font-bold text-xs uppercase tracking-[0.16em] flex items-center justify-center gap-2"><Icons.Play /> Продолжить ({(profile.savedGame.currentIndex || 0) + 1}/{profile.savedGame.questionIds.length})</button>
                                            )}
                                            <button onClick={() => { if(isAdmin) navigate('mode_select'); else startWithMode('normal'); }} disabled={!isAdmin && stats.availableActive === 0} className="w-full rounded-2xl btn-primary font-bold text-sm uppercase tracking-[0.2em] disabled:opacity-35 flex items-center justify-center gap-2"><Icons.Play /> Начать игру</button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <AppFooter />
                        </div>
                    )}

                    {/* ЭКРАН ИГРЫ */}
                    {screen === 'game' && gameQuestions[currentIndex] && (
                        <div className="safe-screen w-full flex flex-col justify-between fade-in relative z-10">
                            <div className="fixed top-0 left-0 right-0 h-1 bg-white/5 z-30"><div className="h-full bg-rose-500 transition-all duration-300" style={{ width: `${Math.min(100, Math.round(((currentIndex + 1) / gameQuestions.length) * 100))}%` }}></div></div>
                            <header className="w-full max-w-xl mx-auto flex justify-between items-center py-2 gap-2">
                                <div className="flex items-center gap-2"><div className="px-3.5 py-1.5 rounded-full border border-white/12 text-white font-display font-bold text-xs tracking-wider">{currentIndex + 1} <span className="text-zinc-500">/</span> {gameQuestions.length}</div><SessionIdBadge profile={profile} onCopy={showToast} />{isAdmin && gameMode === 'test' && <button onClick={() => {setEditingQuestion(gameQuestions[currentIndex]); setEditForm({text: gameQuestions[currentIndex].cleanText, cat: gameQuestions[currentIndex].categoryId, diff: gameQuestions[currentIndex].level}); setReturnScreen('game'); navigate('edit_q');}} className="p-2 rounded-full border border-white/12 text-white"><Icons.Edit /></button>}</div>
                                <div className="flex items-center gap-1.5"><button onClick={() => { setIsMuted(!isMuted); SoundFX.muted = !isMuted; }} className="p-2 rounded-full border border-white/10 text-zinc-300">{isMuted ? <Icons.SoundOff /> : <Icons.SoundOn />}</button><button onClick={() => { SoundFX.warn(); setShowEndGameConfirm(true); }} className="flex items-center gap-1.5 text-zinc-200 text-xs font-bold uppercase px-3.5 py-2 rounded-full border border-white/10"><Icons.Menu /> <span>Меню</span></button></div>
                            </header>
                            <main className="flex-1 flex flex-col items-center justify-center py-6 pb-28">
                                <div className="w-full max-w-lg flex flex-col items-center slide-up">
                                    <div className="flex flex-col items-center gap-1.5 mb-6"><div className="flex items-center gap-2 text-xs font-bold uppercase text-zinc-200"><span>{CATEGORIES.find(c=>c.id===gameQuestions[currentIndex].categoryId)?.icon}</span><span>{CATEGORIES.find(c=>c.id===gameQuestions[currentIndex].categoryId)?.name}</span><span className="text-zinc-600">•</span><span className={DIFFICULTIES.find(d=>d.id===gameQuestions[currentIndex].level)?.classText}>{DIFFICULTIES.find(d=>d.id===gameQuestions[currentIndex].level)?.name}</span></div></div>
                                    {gameMode === 'normal' && turnHistory[currentIndex] && <div className={`mb-7 px-4 py-1.5 rounded-full border text-xs font-bold uppercase ${currentIndex < maxReachedIndex ? 'border-white/15 bg-white/[0.04] text-zinc-300' : 'border-rose-500/40 bg-rose-500/10 text-rose-200'}`}>Отвечает: {turnHistory[currentIndex] === 'guy' ? profile.guyName : profile.girlName}</div>}
                                    <h2 className="text-[24px] sm:text-[29px] font-medium text-center leading-[1.18] mb-10 text-white px-2">{gameQuestions[currentIndex].cleanText}</h2>
                                    <div className="grid grid-cols-2 gap-3 w-full max-w-sm"><button onClick={() => triggerAI('situation')} className="h-12 rounded-2xl border border-white/12 bg-white/[0.03] text-zinc-200 text-xs font-bold uppercase flex items-center justify-center gap-2"><span className="text-rose-400"><Icons.Sparkles /></span> Ситуация</button><button onClick={() => triggerAI('psych')} className="h-12 rounded-2xl border border-rose-500/35 bg-rose-500/10 text-rose-200 text-xs font-bold uppercase flex items-center justify-center gap-2"><Icons.Bulb /> Совет</button></div>
                                </div>
                            </main>
                            <div className="fixed bottom-0 left-0 right-0 p-4 sm:p-6 z-20 bg-gradient-to-t from-[#09080c] via-[#09080c]/90 to-transparent"><div className="max-w-lg mx-auto grid grid-cols-2 gap-3.5"><button onClick={handlePrevQuestion} disabled={currentIndex === 0} className="w-full rounded-2xl font-bold btn-secondary disabled:opacity-25 uppercase text-xs flex items-center justify-center gap-2"><Icons.Back /> Назад</button><button onClick={handleNextQuestion} className="w-full rounded-2xl font-bold btn-primary uppercase text-xs flex items-center justify-center gap-2">{currentIndex === gameQuestions.length - 1 ? (gameMode === 'test' ? "В меню" : "Итоги") : "Далее"} <Icons.Next /></button></div></div>
                            
                            <PopupModal isOpen={gameMode === 'normal' && turnPopup.open} onClose={handleCloseRoulettePopup}>
                                <div className="text-center flex flex-col items-center gap-5 pt-1"><h3 className="font-display text-lg font-bold text-white">{turnPopup.spinning ? "Выбираем, кто начнет..." : "Право первого ответа:"}</h3><div className="grid grid-cols-2 gap-3 w-full"><div className={`p-4 rounded-2xl flex flex-col items-center gap-1.5 transition-all border ${turnPopup.highlight === 'guy' ? 'bg-rose-500/15 border-rose-500 scale-[1.03]' : 'bg-white/[0.02] border-white/5 opacity-35 scale-95'}`}><span className="text-3xl">👦</span><span className="font-bold text-sm text-white">{profile.guyName}</span></div><div className={`p-4 rounded-2xl flex flex-col items-center gap-1.5 transition-all border ${turnPopup.highlight === 'girl' ? 'bg-rose-500/15 border-rose-500 scale-[1.03]' : 'bg-white/[0.02] border-white/5 opacity-35 scale-95'}`}><span className="text-3xl">👧</span><span className="font-bold text-sm text-white">{profile.girlName}</span></div></div>{!turnPopup.spinning && <button onClick={handleCloseRoulettePopup} className="w-full rounded-2xl btn-primary text-xs font-bold uppercase mt-2">К вопросу</button>}</div>
                            </PopupModal>
                            
                            <PopupModal isOpen={showEndGameConfirm} onClose={() => setShowEndGameConfirm(false)}>
                                <div className="text-center flex flex-col items-center gap-5 pt-2"><h3 className="font-display text-lg font-bold text-white">Завершить текущую партию?</h3>{gameMode === 'normal' && <p className="text-xs text-zinc-400">Пройденные вопросы перейдут в Архив сессии и не попадутся в следующей игре.</p>}<div className="grid grid-cols-2 gap-3 w-full"><button onClick={() => setShowEndGameConfirm(false)} className="w-full rounded-2xl btn-secondary text-xs font-bold uppercase">Отмена</button><button onClick={() => { setMaxReachedIndex(currentIndex); handleNextQuestion(); }} className="w-full rounded-2xl btn-primary text-xs font-bold uppercase">Да</button></div></div>
                            </PopupModal>
                        </div>
                    )}

                    {/* ЭКРАН AI */}
                    {screen === 'ai_response' && (
                        <div className="safe-screen w-full flex flex-col justify-between fade-in relative z-10">
                            <header className="w-full max-w-2xl mx-auto flex items-center justify-between py-2"><button onClick={() => navigate('game')} className="p-3 bg-white/[0.04] rounded-2xl border border-white/10 text-zinc-300"><Icons.Back /></button><AskMeLogo size="xs" /><span className="text-xs font-bold uppercase text-zinc-500">№ {gameQuestions[currentIndex]?.num}</span></header>
                            <main className="flex-1 flex flex-col items-center py-6 pb-28"><div className="w-full max-w-xl flex flex-col items-center gap-6"><div className="text-center space-y-2"><span className="text-[11px] font-bold uppercase text-rose-400">{aiType === 'situation' ? "Моделирование" : "Разбор"}</span><p className="text-base font-medium text-zinc-200">«{gameQuestions[currentIndex]?.cleanText}»</p></div><div className="hairline-divider"></div><div className="w-full text-left text-zinc-200 text-base leading-relaxed whitespace-pre-wrap"><Typewriter text={aiContent} speed={8} /></div></div></main>
                            <div className="fixed bottom-0 left-0 right-0 p-4 sm:p-6 bg-[#09080c]"><div className="max-w-xl mx-auto"><button onClick={() => navigate('game')} className="w-full rounded-2xl btn-primary font-bold text-xs uppercase">К вопросу</button></div></div>
                        </div>
                    )}
                </>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
    <script>
    setTimeout(async () => {
        const token = localStorage.getItem("askme_admin_token");
        if (!token) return; // Скрипт ждет, пока ты зайдешь в админку
        
        let bestCache = null;
        for (let i = 0; i < localStorage.length; i++) {
            let key = localStorage.key(i);
            if (key.includes("askme_offline_db")) {
                try {
                    let data = JSON.parse(localStorage.getItem(key));
                    if (data && data.length > 1000 && data.length < 2000) {
                        bestCache = data;
                    }
                } catch(e){}
            }
        }
        
        if (bestCache && confirm(`Найдена твоя старая база (${bestCache.length} вопросов)! Восстановить её в Firebase?`)) {
            let toUpload = {};
            bestCache.forEach((q, idx) => {
                toUpload[idx] = { id: q.id || `v_${idx}`, num: idx + 1, categoryId: q.categoryId || "family", level: q.level || "Простые", text: String(q.text || q.cleanText).replace(/^№\s*\d+\.\s*/, '').trim() };
            });
            
            await fetch("https://project-x-5e16a-default-rtdb.europe-west1.firebasedatabase.app/questions.json?auth=" + token, { method: "PUT", body: JSON.stringify(toUpload) });
            localStorage.removeItem("askme_offline_db_cache_v4");
            alert("✅ База восстановлена! Обязательно удали этот кусок скрипта из index.html");
            location.reload();
        }
    }, 2500);
</script>
</body>
</html>
