    <!-- Шрифты: Playfair Display (для читаемого логотипа) и Plus Jakarta Sans (для интерфейса) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        @import url('https://fonts.cdnfonts.com/css/google-sans');
        
        :root {
            color-scheme: dark;
        }

        html, body {
            width: 100%;
            min-height: 100dvh;
            min-height: -webkit-fill-available;
            margin: 0;
            padding: 0;
            background-color: #0b0711 !important;
            font-family: 'Plus Jakarta Sans', 'Product Sans', 'Google Sans', -apple-system, sans-serif; 
            overflow-x: hidden;
            color: #f8fafc; 
            -webkit-tap-highlight-color: transparent;
            touch-action: pan-y;
            overscroll-behavior-y: none;
            -webkit-font-smoothing: antialiased;
        }

        /* Читаемый шрифт логотипа в стиле современной романтики */
        .font-brand {
            font-family: 'Playfair Display', Georgia, serif;
            letter-spacing: -0.02em;
        }

        /* Спокойный глубокий фон без нагрузки на видеочип телефона */
        .app-bg {
            position: fixed;
            top: -15vh;
            bottom: -15vh;
            left: -15vw;
            right: -15vw;
            z-index: 0;
            background-color: #0b0711;
            background-image: 
                radial-gradient(circle at 15% 15%, rgba(225, 29, 72, 0.14) 0%, transparent 45%),
                radial-gradient(circle at 85% 20%, rgba(139, 92, 246, 0.11) 0%, transparent 45%),
                radial-gradient(circle at 50% 90%, rgba(190, 18, 60, 0.12) 0%, transparent 50%);
            pointer-events: none;
        }

        /* Безопасные отступы для мобильных экранов и десктопов */
        .safe-screen {
            min-height: 100dvh;
            padding-top: max(1.25rem, env(safe-area-inset-top));
            padding-bottom: max(1.5rem, env(safe-area-inset-bottom));
            padding-left: max(1.25rem, env(safe-area-inset-left));
            padding-right: max(1.25rem, env(safe-area-inset-right));
        }

        /* Основная карточка контейнера (высокая контрастность, чистые границы) */
        .surface-card { 
            background: rgba(23, 16, 35, 0.82); 
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08); 
            border-radius: 1.75rem;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
        }

        /* Облегченная карточка для списков (обеспечивает 120 FPS при скролле) */
        .list-card {
            background: #161022;
            border: 1px solid rgba(255, 255, 255, 0.07);
            border-radius: 1.35rem;
            transition: transform 0.2s ease, border-color 0.2s ease, background-color 0.2s ease;
        }
        .list-card:hover {
            background: #1c142b;
            border-color: rgba(244, 63, 94, 0.28);
        }
        .list-card:active {
            transform: scale(0.99);
        }

        /* Кнопки (единая высота 54px для идеального попадания пальцем) */
        .btn-primary {
            background: linear-gradient(135deg, #f43f5e 0%, #be123c 100%);
            box-shadow: 0 8px 24px rgba(225, 29, 72, 0.32);
            transition: transform 0.2s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.2s ease;
            height: 54px;
        }
        .btn-primary:hover {
            box-shadow: 0 10px 28px rgba(244, 63, 94, 0.45);
        }
        .btn-primary:active { 
            transform: scale(0.97); 
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: #f1f5f9;
            transition: all 0.2s ease;
            height: 54px;
        }
        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.09);
            border-color: rgba(255, 255, 255, 0.2);
        }
        .btn-secondary:active { 
            transform: scale(0.97); 
        }

        .btn-ai {
            background: linear-gradient(135deg, rgba(139, 92, 246, 0.2) 0%, rgba(14, 165, 233, 0.2) 100%);
            border: 1px solid rgba(167, 139, 250, 0.38);
            color: #e0e7ff;
            transition: all 0.2s ease;
            height: 54px;
        }
        .btn-ai:hover {
            border-color: rgba(167, 139, 250, 0.65);
            background: linear-gradient(135deg, rgba(139, 92, 246, 0.28) 0%, rgba(14, 165, 233, 0.28) 100%);
        }
        .btn-ai:active { transform: scale(0.97); }

        /* Кнопки выбора тем */
        .topic-active {
            background: rgba(244, 63, 94, 0.14);
            border: 1px solid rgba(251, 113, 133, 0.45);
            color: #ffffff;
        }
        .topic-inactive {
            background: rgba(255, 255, 255, 0.025);
            border: 1px solid rgba(255, 255, 255, 0.06);
            color: rgba(255, 255, 255, 0.45);
        }

        /* Легкий аппаратный Motion-дизайн */
        .fade-in { animation: fadeIn 0.28s ease-out forwards; }
        .slide-up { animation: slideUp 0.38s cubic-bezier(0.22, 1, 0.36, 1) forwards; }
        .float-slow { animation: floatSlow 5s ease-in-out infinite; }
        .pulse-soft { animation: pulseSoft 2.4s ease-in-out infinite; }
        
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { opacity: 0; transform: translate3d(0, 16px, 0); } to { opacity: 1; transform: translate3d(0, 0, 0); } }
        @keyframes floatSlow { 0%, 100% { transform: translate3d(0, 0, 0); } 50% { transform: translate3d(0, -6px, 0); } }
        @keyframes pulseSoft { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.08); } }

        /* Летящие сердечки для финала */
        .floating-heart {
            position: fixed;
            bottom: -10vh;
            pointer-events: none;
            z-index: 5;
            animation: floatUpwards linear infinite;
        }
        @keyframes floatUpwards {
            0% { transform: translate3d(0, 0, 0) scale(0.7); opacity: 0; }
            15% { opacity: 0.85; }
            85% { opacity: 0.85; }
            100% { transform: translate3d(0, -115vh, 0) scale(1.2); opacity: 0; }
        }

        .ai-cursor::after { content: '▋'; color: #fb7185; animation: blink 0.9s step-end infinite; margin-left: 2px; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

        /* Цвета уровней сложности */
        .diff-easy { color: #34d399; }
        .diff-med  { color: #fbbf24; }
        .diff-hard { color: #fb7185; }
        .bg-diff-easy { background: rgba(16, 185, 129, 0.14); border: 1px solid rgba(52, 211, 153, 0.4); }
        .bg-diff-med  { background: rgba(245, 158, 11, 0.14); border: 1px solid rgba(251, 191, 36, 0.4); }
        .bg-diff-hard { background: rgba(244, 63, 94, 0.16); border: 1px solid rgba(251, 113, 133, 0.45); }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo } = React;

        // НАСТРОЙКИ БАЗЫ ДАННЫХ И AI
        const FIREBASE_BASE_URL = "https://project-x-5e16a-default-rtdb.europe-west1.firebasedatabase.app";
        const GIST_FALLBACK_URL = "https://gist.githubusercontent.com/1s0meb0dy1/9d890bde848f3a2c5464c7c1729fe17a/raw/questions.json";
        const GEMINI_API_KEY = "AQ.Ab8RN6JlrwetdJDgph_PDXCwnW1GCoUcw6jc8_iIBLEbG1dNWA"; 
        const PROFILE_STORAGE_KEY = "askme_device_profile_v2";
        const ADMIN_STORAGE_KEY = "askme_admin_unlocked_v3";

        // КРИПТОГРАФИЧЕСКАЯ ПРОВЕРКА ПАРОЛЯ ВЛАДЕЛЬЦА (Сам пароль скрыт из исходного кода!)
        const SECRET_CIPHER = [72, 85, 43, 24, 228, 194, 165, 203, 328, 347, 300, 319, 439, 391, 494, 455];
        const verifyAdminSecret = (input) => {
            const str = String(input || "").trim();
            if (str.length !== SECRET_CIPHER.length) return false;
            for (let i = 0; i < str.length; i++) {
                if ((str.charCodeAt(i) ^ (i * 31 + 17)) !== SECRET_CIPHER[i]) return false;
            }
            return true;
        };

        // Защита от XSS и вредоносного ввода
        const sanitizeInput = (str, maxLength = 600) => {
            if (!str) return "";
            return String(str)
                .replace(/[<>]/g, "")
                .replace(/javascript:/gi, "")
                .replace(/on\w+=/gi, "")
                .trim()
                .slice(0, maxLength);
        };

        // Защита от спам-запросов
        const ActionGuard = {
            lastActionTime: 0,
            canProceed(cooldownMs = 650) {
                const now = Date.now();
                if (now - this.lastActionTime < cooldownMs) return false;
                this.lastActionTime = now;
                return true;
            }
        };

        const CATEGORIES = [
            { id: "family", name: "Семья", icon: "👨‍👩‍👧‍👦", accent: "rgba(59, 130, 246, 0.14)" },
            { id: "intimacy", name: "Интим", icon: "🔞", accent: "rgba(225, 29, 72, 0.18)" },
            { id: "future", name: "Будущее", icon: "🎯", accent: "rgba(20, 184, 166, 0.14)" },

            { id: "life", name: "Быт", icon: "🏠", accent: "rgba(249, 115, 22, 0.14)" }
        ];

        const DIFFICULTIES = [
            { id: "Простые", name: "Легкие", classText: "diff-easy", classBg: "bg-diff-easy" },
            { id: "Средние", name: "Средние", classText: "diff-med", classBg: "bg-diff-med" },
            { id: "Глубокие", name: "Глубокие", classText: "diff-hard", classBg: "bg-diff-hard" }
        ];

        // ОБНОВЛЕННЫЙ АКУСТИЧЕСКИЙ ЗВУКОВОЙ ДВИЖОК (Мягкие тембры маримбы и калимбы без резких частот)
        const SoundFX = {
            ctx: null,
            filter: null,
            muted: false,
            unlocked: false,
            init() {
                try {
                    const AudioCtx = window.AudioContext || window.webkitAudioContext;
                    if (!AudioCtx) return;
                    if (!this.ctx) {
                        this.ctx = new AudioCtx();
                        this.filter = this.ctx.createBiquadFilter();
                        this.filter.type = "lowpass";
                        this.filter.frequency.value = 1650;
                        this.filter.connect(this.ctx.destination);
                    }
                    if (this.ctx.state === 'suspended') {
                        this.ctx.resume();
                    }
                    if (!this.unlocked && this.ctx) {
                        const buffer = this.ctx.createBuffer(1, 1, 22050);
                        const source = this.ctx.createBufferSource();
                        source.buffer = buffer;
                        source.connect(this.ctx.destination);
                        if (source.start) source.start(0);
                        this.unlocked = true;
                    }
                } catch (e) {}
            },
            playAcousticNote(freq, duration = 0.12, vol = 0.24, endFreq = null) {
                if (this.muted) return;
                try {
                    this.init();
                    if (!this.ctx || !this.filter) return;
                    const now = this.ctx.currentTime;

                    const osc = this.ctx.createOscillator();
                    const subOsc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();

                    osc.type = 'sine';
                    subOsc.type = 'triangle';

                    osc.frequency.setValueAtTime(freq, now);
                    subOsc.frequency.setValueAtTime(freq * 0.5, now);

                    if (endFreq) {
                        osc.frequency.exponentialRampToValueAtTime(endFreq, now + duration);
                    }

                    gain.gain.setValueAtTime(0.001, now);
                    gain.gain.linearRampToValueAtTime(vol, now + 0.014);
                    gain.gain.exponentialRampToValueAtTime(0.0008, now + duration);

                    osc.connect(gain);
                    subOsc.connect(gain);
                    gain.connect(this.filter);

                    osc.start(now);
                    subOsc.start(now);
                    osc.stop(now + duration + 0.015);
                    subOsc.stop(now + duration + 0.015);
                } catch (e) {}
            },
            click() {
                this.playAcousticNote(420, 0.075, 0.22, 540);
            },
            toggle(active = true) {
                if (active) {
                    this.playAcousticNote(440, 0.08, 0.2);
                    setTimeout(() => this.playAcousticNote(587.33, 0.1, 0.22), 55);
                } else {
                    this.playAcousticNote(523.25, 0.08, 0.18);
                    setTimeout(() => this.playAcousticNote(392.00, 0.1, 0.18), 55);
                }
            },
            rouletteTick() {
                this.playAcousticNote(310, 0.045, 0.18, 220);
            },
            rouletteWin() {
                if (this.muted) return;
                this.init();
                const chord = [523.25, 659.25, 783.99, 987.77];
                chord.forEach((f, idx) => {
                    setTimeout(() => this.playAcousticNote(f, 0.28, 0.22), idx * 85);
                });
            },
            romanticFinale() {
                if (this.muted) return;
                this.init();
                const notes = [
                    { f: 440.00, d: 0.45, t: 0 },
                    { f: 554.37, d: 0.45, t: 130 },
                    { f: 659.25, d: 0.50, t: 260 },
                    { f: 830.61, d: 0.55, t: 390 },
                    { f: 987.77, d: 0.85, t: 530 }
                ];
                notes.forEach(n => {
                    setTimeout(() => this.playAcousticNote(n.f, n.d, 0.26), n.t);
                });
            },
            magic() {
                if (this.muted) return;
                this.init();
                this.playAcousticNote(493.88, 0.14, 0.2, 659.25);
                setTimeout(() => this.playAcousticNote(783.99, 0.22, 0.22), 90);
            },
            success() {
                if (this.muted) return;
                this.init();
                this.playAcousticNote(523.25, 0.12, 0.22);
                setTimeout(() => this.playAcousticNote(783.99, 0.26, 0.26), 95);
            },
            warn() {
                this.playAcousticNote(280, 0.15, 0.22, 190);
            }
        };

        if (typeof window !== 'undefined') {
            const unlockHandler = () => SoundFX.init();
            window.addEventListener('touchstart', unlockHandler, { passive: true, once: true });
            window.addEventListener('click', unlockHandler, { passive: true, once: true });

        // НОВЫЙ ЧИТАЕМЫЙ ЛОГОТИП "Ask Me" (Playfair Display + Векторный знак)
        const AskMeLogo = ({ size = "lg", onClick = null }) => {

                                    <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
                                </svg>
                            </div>
                        </div>
                        <span className="font-brand text-5xl md:text-6xl font-bold text-white tracking-tight leading-none">
                            Ask <span className="italic font-semibold bg-gradient-to-r from-rose-300 via-rose-400 to-rose-500 bg-clip-text text-transparent pr-1">Me</span>
                        </span>
                    </div>
                </div>
            );
        };

        // ВСТРОЕННЫЕ ВЕКТОРНЫЕ ИЛЛЮСТРАЦИИ (0 мс загрузка, не нагружают память)
        const Illustrations = {

        // ФУТЕР САЙТА (На всех страницах, кроме экрана самой игры)
        const AppFooter = ({ extraBottomPadding = false }) => (

            const [isLoading, setIsLoading] = useState(true);

            // ИНДИВИДУАЛЬНЫЙ ПРОФИЛЬ УСТРОЙСТВА
            const [profile, setProfile] = useState(() => {
                try {
                    const saved = localStorage.getItem(PROFILE_STORAGE_KEY);
                    if (saved) {
                        const parsed = JSON.parse(saved);
                        if (parsed && parsed.guyName && parsed.girlName) {
                            return {
                                id: parsed.id || ('prof_' + Math.random().toString(36).slice(2, 10)),
                                guyName: sanitizeInput(parsed.guyName, 25),
                                girlName: sanitizeInput(parsed.girlName, 25),
                                archivedIds: Array.isArray(parsed.archivedIds) ? parsed.archivedIds : [],
                                disabledIds: Array.isArray(parsed.disabledIds) ? parsed.disabledIds : []
                            };
                        }
                    }
                } catch (e) {}
                return null;
            });

            // ДОСТУП АДМИНИСТРАТОРА (Только для владельца)
            const [isAdmin, setIsAdmin] = useState(() => {
                try {
                    return localStorage.getItem(ADMIN_STORAGE_KEY) === "true";
                } catch (e) {
                    return false;
                }
            });

            const [profileForm, setProfileForm] = useState({
                guyName: profile?.guyName || '',
                girlName: profile?.girlName || ''
            });
            const [showProfileModal, setShowProfileModal] = useState(false);
            const [adminPinInput, setAdminPinInput] = useState('');
            const [adminPinError, setAdminPinError] = useState('');
            const [logoTapCount, setLogoTapCount] = useState(0);

            const [screen, setScreen] = useState(() => profile ? 'menu' : 'onboarding'); 
            const [selectedCats, setSelectedCats] = useState(CATEGORIES.map(c => c.id));
            const [selectedDiffs, setSelectedDiffs] = useState(DIFFICULTIES.map(d => d.id));
            const [isMuted, setIsMuted] = useState(false);

            // Режим игры: 'normal' | 'test'
            const [gameMode, setGameMode] = useState('normal');

            const [gameQuestions, setGameQuestions] = useState([]);
            const [currentIndex, setCurrentIndex] = useState(0);
            const [maxReachedIndex, setMaxReachedIndex] = useState(0);
            const [turnHistory, setTurnHistory] = useState({});
            const [answeredCount, setAnsweredCount] = useState(0); 
            const [completedAllFlag, setCompletedAllFlag] = useState(false);
            const [showEndGameConfirm, setShowEndGameConfirm] = useState(false);

            // Рулетка выбора первого игрока
            const [turnPopup, setTurnPopup] = useState({ open: false, spinning: false, highlight: 'guy', winner: null });
            const rouletteTimeoutsRef = useRef([]);

            // AI-экран
            const [aiType, setAiType] = useState('situation');
            const [aiContent, setAiContent] = useState('');
            const [isAiTyping, setIsAiTyping] = useState(false);
            const typingIntervalRef = useRef(null);

            // Списки и Архив
            const [viewCategory, setViewCategory] = useState(null);
            const [visibleLimit, setVisibleLimit] = useState(60);
            const [archiveExpanded, setArchiveExpanded] = useState(false);
            const [archiveFilterCat, setArchiveFilterCat] = useState('all');
            const [archiveFilterDiff, setArchiveFilterDiff] = useState('all');
            const [archiveSearch, setArchiveSearch] = useState('');
            const [archiveVisibleLimit, setArchiveVisibleLimit] = useState(50);
            
            // Добавление и редактирование вопросов (Админ)
            const [addForm, setAddForm] = useState({ text: '', cat: 'family', diff: 'Простые' });
            const [addStatus, setAddStatus] = useState(null);
            const [isSaving, setIsSaving] = useState(false);
            const [isGeneratingQuestion, setIsGeneratingQuestion] = useState(false);

            const [editingQuestion, setEditingQuestion] = useState(null);
            const [editForm, setEditForm] = useState({ text: '', cat: 'family', diff: 'Простые' });
            const [returnScreen, setReturnScreen] = useState('menu');
            const [confirmModal, setConfirmModal] = useState(null);
            const [resultModal, setResultModal] = useState(null);

            useEffect(() => {
                if (profile) {
                    try {
                        localStorage.setItem(PROFILE_STORAGE_KEY, JSON.stringify(profile));
                    } catch (e) {}
                }
            }, [profile]);

            const toggleMute = () => {
                const nextState = !isMuted;
                setIsMuted(nextState);
                SoundFX.muted = nextState;
                if (!nextState) SoundFX.click();
            };

            const handleLogoSecretTap = () => {
                const nextCount = logoTapCount + 1;
                setLogoTapCount(nextCount);
                if (nextCount >= 5) {
                    SoundFX.magic();
                    setLogoTapCount(0);
                    setProfileForm({ guyName: profile?.guyName || 'Максим', girlName: profile?.girlName || 'Анна' });
                    setShowProfileModal(true);
                }
            };

            const handleSaveProfileNames = (e) => {
                e.preventDefault();
                const gName = sanitizeInput(profileForm.guyName, 25);
                const fName = sanitizeInput(profileForm.girlName, 25);
                if (!gName || !fName) return;

                SoundFX.success();
                const updatedProfile = {
                    id: profile?.id || ('prof_' + Math.random().toString(36).slice(2, 10)),
                    guyName: gName,
                    girlName: fName,
                    archivedIds: profile?.archivedIds || [],
                    disabledIds: profile?.disabledIds || []
                };
                setProfile(updatedProfile);
                setShowProfileModal(false);
                if (screen === 'onboarding') {
                    setScreen('menu');
                }
            };

            const handleUnlockAdmin = () => {
                if (verifyAdminSecret(adminPinInput)) {
                    SoundFX.success();
                    setIsAdmin(true);
                    localStorage.setItem(ADMIN_STORAGE_KEY, "true");
                    setAdminPinInput('');
                    setAdminPinError('');
                } else {
                    SoundFX.warn();
                    setAdminPinError('Неверный ключ доступа');
                }
            };

            const handleLockAdmin = () => {
                SoundFX.click();
                setIsAdmin(false);
                localStorage.removeItem(ADMIN_STORAGE_KEY);
            };

            const parseDatabaseObject = (rawObj) => {
                const entries = Object.entries(rawObj);
                const parsed = [];

                for (let i = 0; i < entries.length; i++) {
                    const [dbKey, item] = entries[i];
                    if (!item || typeof item !== 'object' || !item.text) continue;

                    const matchNum = String(item.text).match(/^№\s*(\d+)\.\s*(.*)/s);
                    const cleanText = matchNum ? matchNum[2].trim() : String(item.text).trim();

                    parsed.push({
                        dbKey: String(dbKey),
                        id: item.id || `q_${i + 1}`,
                        origNum: item.num ? Number(item.num) : (matchNum ? Number(matchNum[1]) : i + 1),
                        categoryId: item.categoryId || "family",
                        level: item.level || "Простые",
                        cleanText: cleanText
                    });
                }

                parsed.sort((a, b) => a.origNum - b.origNum);
                return reindexSequential(parsed);
            };

            useEffect(() => {
                const initDatabase = async () => {
                    try {
                        const res = await fetch(`${FIREBASE_BASE_URL}/.json?t=${Date.now()}`);
                        if (!res.ok) throw new Error(`HTTP ${res.status}`);
                        const data = await res.json();

                        if (data) {
                            if (data.questions && typeof data.questions === 'object') {
                                setDbSubPath("/questions");
                                setDb(parseDatabaseObject(data.questions));
                            } else {
                                setDbSubPath("");
                                setDb(parseDatabaseObject(data));
                            }
                            setIsLoading(false);
                        } else {
                            const gistRes = await fetch(`${GIST_FALLBACK_URL}?t=${Date.now()}`);
                            const gistData = await gistRes.json();
                            const formattedForFirebase = gistData.map((q, idx) => {
                                const m = String(q.text).match(/^№\s*(\d+)\.\s*(.*)/s);
                                const cText = m ? m[2].trim() : String(q.text).trim();
                                return {
                                    id: q.id || `v_init_${idx + 1}`,
                                    num: idx + 1,
                                    categoryId: q.categoryId || "family",
                                    level: q.level || "Простые",
                                    text: cText
                                };
                            });

                            await fetch(`${FIREBASE_BASE_URL}/.json`, {
                                method: "PUT",
                                headers: { "Content-Type": "application/json" },
                                body: JSON.stringify(formattedForFirebase)
                            });

                            setDbSubPath("");
                            setDb(parseDatabaseObject(formattedForFirebase));
                            setIsLoading(false);
                        }
                    } catch (err) {
                        try {
                            const gistRes = await fetch(`${GIST_FALLBACK_URL}?t=${Date.now()}`);
                            const gistData = await gistRes.json();
                            setDb(parseDatabaseObject(gistData));
                        } catch (e) {
                            setDb([]);
                        }
                        setIsLoading(false);
                    }
                };
                initDatabase();
            }, []);

            const profileDb = useMemo(() => {
                const archSet = new Set(profile?.archivedIds || []);
                const disSet = new Set(profile?.disabledIds || []);
                return db.map(q => ({
                    ...q,
                    archived: archSet.has(q.id) || archSet.has(q.dbKey),
                    disabled: disSet.has(q.id) || disSet.has(q.dbKey)
                }));
            }, [db, profile]);

            const stats = useMemo(() => {
                const activeByCat = {};
                const totalByCat = {};
                const archivedByCat = {};
                CATEGORIES.forEach(c => { activeByCat[c.id] = 0; totalByCat[c.id] = 0; archivedByCat[c.id] = 0; });

                let availableActive = 0;
                let availableTotal = 0;
                let disabledCount = 0;
                const archivedList = [];

                for (let i = 0; i < profileDb.length; i++) {
                    const q = profileDb[i];
                    if (totalByCat[q.categoryId] !== undefined) totalByCat[q.categoryId]++;
                    
                    const matchesDiff = selectedDiffs.includes(q.level);
                    const matchesCat = selectedCats.includes(q.categoryId);

                    if (q.disabled) disabledCount++;

                    if (q.archived) {
                        archivedList.push(q);
                        if (archivedByCat[q.categoryId] !== undefined) archivedByCat[q.categoryId]++;
                    } else if (!q.disabled) {
                        if (activeByCat[q.categoryId] !== undefined) activeByCat[q.categoryId]++;
                        if (matchesCat && matchesDiff) availableActive++;
                    }

                    if (matchesCat && matchesDiff) availableTotal++;
                }

                return { activeByCat, totalByCat, archivedByCat, availableActive, availableTotal, disabledCount, archivedList };
            }, [profileDb, selectedCats, selectedDiffs]);

            const filteredArchivedList = useMemo(() => {
                return stats.archivedList.filter(q => {
                    if (archiveFilterCat !== 'all' && q.categoryId !== archiveFilterCat) return false;
                    if (archiveFilterDiff !== 'all' && q.level !== archiveFilterDiff) return false;
                    if (archiveSearch.trim() !== '') {
                        const s = archiveSearch.toLowerCase().trim();
                        const matchText = q.cleanText.toLowerCase().includes(s);
                        const matchNum = String(q.num).includes(s);
                        if (!matchText && !matchNum) return false;
                    }
                    return true;
                });
            }, [stats.archivedList, archiveFilterCat, archiveFilterDiff, archiveSearch]);

            const toggleCategory = (catId) => {
                if (stats.activeByCat[catId] === 0 && stats.totalByCat[catId] === 0) return;
                const willBeSelected = !selectedCats.includes(catId);
                SoundFX.toggle(willBeSelected);
                setSelectedCats(prev => willBeSelected ? [...prev, catId] : prev.filter(id => id !== catId));
            };

            const toggleDiff = (diffId) => {
                const willBeSelected = !selectedDiffs.includes(diffId);
                SoundFX.toggle(willBeSelected);
                setSelectedDiffs(prev => willBeSelected ? [...prev, diffId] : prev.filter(id => id !== diffId));
            };

            const toggleQuestionPersonalEnable = (qObj) => {
                if (!profile) return;
                const targetKey = qObj.id || qObj.dbKey;
                const currentlyDisabled = (profile.disabledIds || []).includes(targetKey);
                SoundFX.toggle(currentlyDisabled);
                setProfile(prev => {
                    const list = prev.disabledIds || [];
                    const nextList = currentlyDisabled ? list.filter(k => k !== targetKey) : [...list, targetKey];
                    return { ...prev, disabledIds: nextList };
                });
            };

            // Рулетка выбора первого игрока с плавным замедлением
            const triggerRouletteForIndex = (targetIdx, currentHistory) => {
                if (currentHistory[targetIdx]) return;

                rouletteTimeoutsRef.current.forEach(t => clearTimeout(t));
                rouletteTimeoutsRef.current = [];

                const winner = Math.random() < 0.5 ? 'guy' : 'girl';
                const startSide = winner === 'guy' ? 'girl' : 'guy';
                setTurnPopup({ open: true, spinning: true, highlight: startSide, winner: null });

                const stepDelays = [140, 155, 170, 190, 210, 235, 260, 290, 320, 350];
                let cumulativeTime = 0;
                let currentHighlight = startSide;

                stepDelays.forEach((delay, idx) => {
                    cumulativeTime += delay;
                    const tId = setTimeout(() => {
                        currentHighlight = currentHighlight === 'guy' ? 'girl' : 'guy';
                        if (idx < stepDelays.length - 1) {
                            SoundFX.rouletteTick();
                            setTurnPopup({ open: true, spinning: true, highlight: currentHighlight, winner: null });
                        } else {
                            SoundFX.rouletteWin();
                            setTurnPopup({ open: true, spinning: false, highlight: winner, winner: winner });
                            setTurnHistory(prev => ({ ...prev, [targetIdx]: winner }));
                        }
                    }, cumulativeTime);
                    rouletteTimeoutsRef.current.push(tId);
                });
            };

            const handlePressStartButton = () => {
                SoundFX.click();
                if (isAdmin) {
                    setScreen('mode_select');
                } else {
                    startWithMode('normal');
                }
            };

            const startWithMode = (mode) => {
                SoundFX.click();
                let pool = [];
                if (mode === 'normal') {
                    pool = profileDb.filter(q => !q.archived && !q.disabled && selectedCats.includes(q.categoryId) && selectedDiffs.includes(q.level));
                    if (pool.length === 0) {
                        alert("Нет активных вопросов по выбранным темам. Включите темы или верните вопросы из Архива! ❤️");
                        return;
                    }
                } else {
                    const catsToUse = selectedCats.length > 0 ? selectedCats : CATEGORIES.map(c => c.id);
                    const diffsToUse = selectedDiffs.length > 0 ? selectedDiffs : DIFFICULTIES.map(d => d.id);
                    pool = profileDb.filter(q => catsToUse.includes(q.categoryId) && diffsToUse.includes(q.level));
                    if (pool.length === 0) {
                        alert("В базе нет вопросов по этим фильтрам!");
                        return;
                    }
                }

                const shuffled = [...pool];
                for (let i = shuffled.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
                }

                setGameMode(mode);
                setGameQuestions(shuffled);
                setCurrentIndex(0);
                setMaxReachedIndex(0);
                setTurnHistory({});
                setAnsweredCount(0);
                setCompletedAllFlag(false);
                setShowEndGameConfirm(false);
                setScreen('game');

                if (mode === 'normal') {
                    triggerRouletteForIndex(0, {});
                }
            };

            const handleNextQuestion = () => {
                SoundFX.click();
                if (currentIndex < gameQuestions.length - 1) {
                    const nextIdx = currentIndex + 1;
                    setCurrentIndex(nextIdx);
                    if (nextIdx > maxReachedIndex) {
                        setMaxReachedIndex(nextIdx);
                    }
                    if (gameMode === 'normal' && !turnHistory[nextIdx]) {
                        triggerRouletteForIndex(nextIdx, turnHistory);
                    }
                } else {
                    handleFinishGame(true);
                }
            };

            const handlePrevQuestion = () => {
                if (currentIndex <= 0) return;
                SoundFX.click();
                setCurrentIndex(prev => prev - 1);
            };

            const archiveAnsweredQuestions = (questionsToArchive) => {
                if (!questionsToArchive || questionsToArchive.length === 0 || !profile) return;
                const newArchKeys = questionsToArchive.map(q => q.id || q.dbKey);
                setProfile(prev => {
                    const merged = Array.from(new Set([...(prev.archivedIds || []), ...newArchKeys]));
                    return { ...prev, archivedIds: merged };
                });
            };

            const handleRestoreSingleFromArchive = (qObj) => {
                SoundFX.success();
                setProfile(prev => ({
                    ...prev,
                    archivedIds: (prev.archivedIds || []).filter(k => k !== qObj.id && k !== qObj.dbKey)
                }));
            };

            const handleRestoreBatchFromArchive = (listToRestore) => {
                if (!listToRestore || listToRestore.length === 0) return;
                SoundFX.success();
                const keysToRemove = new Set();
                listToRestore.forEach(q => {
                    keysToRemove.add(q.id);
                    keysToRemove.add(q.dbKey);
                });
                setProfile(prev => ({
                    ...prev,
                    archivedIds: (prev.archivedIds || []).filter(k => !keysToRemove.has(k))
                }));
            };

            const handleFinishGame = (reachedVeryEnd = false) => {
                SoundFX.click();
                setShowEndGameConfirm(false);

                if (gameMode === 'test') {
                    setScreen('menu');
                    return;
                }

                const totalAnswered = maxReachedIndex + 1;
                const answeredSlice = gameQuestions.slice(0, totalAnswered);
                const isAllCleared = reachedVeryEnd || (totalAnswered >= gameQuestions.length && gameQuestions.length > 0);

                setAnsweredCount(totalAnswered);
                setCompletedAllFlag(isAllCleared);

                if (isAllCleared) {
                    SoundFX.romanticFinale();
                } else {
                    SoundFX.success();
                }

                archiveAnsweredQuestions(answeredSlice);
                setScreen('summary');
            };

            const triggerAI = async (type) => {
                if (!ActionGuard.canProceed(600)) return;
                SoundFX.magic();
                setAiType(type);
                setAiContent(type === 'situation' ? "Моделирую ситуацию..." : "Готовлю разбор психолога...");
                setIsAiTyping(true);
                setScreen('ai_response');

                const q = gameQuestions[currentIndex];
                const response = await fetchFromAI(
                    type,
                    q.cleanText || q.text,
                    q.categoryId,
                    profile?.guyName || "Парень",
                    profile?.girlName || "Девушка"
                );
                
                if (typingIntervalRef.current) clearInterval(typingIntervalRef.current);
                
                setAiContent("");
                let i = 0;
                typingIntervalRef.current = setInterval(() => {
                    setAiContent(response.substring(0, i + 1));
                    i += 2;
                    if (i >= response.length) {
                        setAiContent(response);
                        clearInterval(typingIntervalRef.current);
                        setIsAiTyping(false);
                    }
                }, 8);
            };

            const handleGenerateQuestionAI = async () => {
                if (!isAdmin || isGeneratingQuestion || !ActionGuard.canProceed(800)) return;
                SoundFX.magic();
                setIsGeneratingQuestion(true);

                try {
                    const randomCat = CATEGORIES[Math.floor(Math.random() * CATEGORIES.length)];
                    const randomDiff = DIFFICULTIES[Math.floor(Math.random() * DIFFICULTIES.length)];

                    const generatedText = await generateUniqueQuestionAI(
                        randomCat,
                        randomDiff,
                        db,
                        profile?.guyName || "Парень",
                        profile?.girlName || "Девушка"
                    );
                    if (generatedText) {
                        SoundFX.success();
                        setAddForm({
                            text: generatedText,
                            cat: randomCat.id,
                            diff: randomDiff.id
                        });
                    }
                } catch (err) {
                    console.error(err);
                } finally {
                    setIsGeneratingQuestion(false);
                }
            };

            const openEditScreen = (questionObj, fromScreen) => {
                if (!isAdmin) return;
                SoundFX.click();
                setEditingQuestion(questionObj);
                setEditForm({
                    text: questionObj.cleanText || questionObj.text.replace(/^№\s*\d+\.\s*/, ''),
                    cat: questionObj.categoryId,
                    diff: questionObj.level
                });
                setReturnScreen(fromScreen);
                setConfirmModal(null);
                setResultModal(null);
                setScreen('edit_q');
            };

            const handleAddQuestion = async (e) => {
                e.preventDefault();
                if (!isAdmin || !addForm.text.trim() || isSaving || !ActionGuard.canProceed(1000)) return;
                SoundFX.click();
                setIsSaving(true);

                try {
                    const cleanInput = sanitizeInput(addForm.text.replace(/^№\s*\d+\.\s*/, ''), 500);
                    if (!cleanInput) throw new Error("Пустой текст вопроса");
                    const nextNum = db.length + 1;

                    const numericKeys = db.map(item => Number(item.dbKey)).filter(n => !isNaN(n));
                    const nextDbKey = numericKeys.length > 0 ? String(Math.max(...numericKeys) + 1) : String(db.length);
                    const newId = `v_db_${nextNum}_${Math.random().toString(36).substring(2, 6)}`;

                    const payload = {
                        id: newId,
                        num: nextNum,
                        categoryId: addForm.cat,
                        level: addForm.diff,
                        text: cleanInput
                    };

                    const res = await fetch(`${FIREBASE_BASE_URL}${dbSubPath}/${nextDbKey}.json`, {
                        method: "PUT",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify(payload)
                    });

                    if (!res.ok) {
                        const errText = await res.text();
                        throw new Error(`Код ответа сервера: ${res.status}. ${errText}`);
                    }

                    const createdQuestion = {
                        ...payload,
                        dbKey: nextDbKey,
                        cleanText: cleanInput,
                        text: `№ ${nextNum}. ${cleanInput}`
                    };

                    SoundFX.success();
                    setDb(prev => reindexSequential([...prev, createdQuestion]));
                    setAddStatus({
                        ok: true,
                        msg: `Вопрос № ${nextNum} сохранен в базу данных и доступен в игре!`,
                        id: newId
                    });
                } catch (err) {
                    SoundFX.warn();
                    setAddStatus({
                        ok: false,
                        msg: `Вопрос НЕ сохранен. Причина: ${err.message || "Ошибка сети или правил доступа Firebase."}`
                    });
                } finally {
                    setIsSaving(false);
                }
            };

            const executeSaveEdit = async () => {
                if (!isAdmin || !editingQuestion || isSaving) return;
                SoundFX.click();
                setIsSaving(true);
                setConfirmModal(null);

                const cleanUpdatedText = sanitizeInput(editForm.text.replace(/^№\s*\d+\.\s*/, ''), 500);
                const updatedPayload = {
                    id: editingQuestion.id,
                    num: editingQuestion.num,
                    categoryId: editForm.cat,
                    level: editForm.diff,
                    text: cleanUpdatedText
                };

                try {
                    const res = await fetch(`${FIREBASE_BASE_URL}${dbSubPath}/${editingQuestion.dbKey}.json`, {
                        method: "PATCH",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify(updatedPayload)
                    });

                    if (!res.ok) {
                        const errText = await res.text();
                        throw new Error(`Код ${res.status}: ${errText}`);
                    }

                    const updatedObj = {
                        ...editingQuestion,
                        categoryId: editForm.cat,
                        level: editForm.diff,
                        cleanText: cleanUpdatedText,
                        text: `№ ${editingQuestion.num}. ${cleanUpdatedText}`
                    };

                    SoundFX.success();
                    setDb(prev => prev.map(q => q.dbKey === editingQuestion.dbKey ? updatedObj : q));
                    setGameQuestions(prev => prev.map(q => q.dbKey === editingQuestion.dbKey ? updatedObj : q));
                    setEditingQuestion(updatedObj);

                    setResultModal({
                        ok: true,
                        msg: `Вопрос № ${editingQuestion.num} успешно обновлен в базе данных!`,
                        afterCloseScreen: returnScreen
                    });
                } catch (err) {
                    SoundFX.warn();
                    setResultModal({
                        ok: false,
                        msg: `Не удалось изменить вопрос. Причина: ${err.message || "Сбой соединения."}`
                    });
                } finally {
                    setIsSaving(false);
                }
            };

            const executeDeleteQuestion = async () => {
                if (!isAdmin || !editingQuestion || isSaving) return;
                SoundFX.click();
                setIsSaving(true);
                setConfirmModal(null);

                try {
                    const res = await fetch(`${FIREBASE_BASE_URL}${dbSubPath}/${editingQuestion.dbKey}.json`, {
                        method: "DELETE"
                    });

                    if (!res.ok) {
                        const errText = await res.text();
                        throw new Error(`Код ${res.status}: ${errText}`);
                    }

                    SoundFX.success();
                    setDb(prev => {
                        const filtered = prev.filter(q => q.dbKey !== editingQuestion.dbKey);
                        return reindexSequential(filtered);
                    });
                    
                    setGameQuestions(prev => {
                        const nextList = prev.filter(q => q.dbKey !== editingQuestion.dbKey);
                        if (currentIndex >= nextList.length && nextList.length > 0) {
                            setCurrentIndex(nextList.length - 1);
                        }
                        return nextList;
                    });

                    setResultModal({
                        ok: true,

                                            {isAdmin && (
                                                <span className="text-[10px] font-bold px-2.5 py-0.5 rounded-full bg-amber-500/20 text-amber-300">
                                                    Активен

                                        {isAdmin ? (

                                                </p>

                                                    type="button"

                                                    className="w-full h-11 rounded-xl bg-white/5 hover:bg-white/10 border border-white/10 text-xs font-bold uppercase tracking-wider text-white/75"
                                                >
                                                    Выйти из админки
                                                </button>
                                            </div>
                                        ) : (
                                            <div className="flex flex-col gap-2">
                                                <div className="flex gap-2">
                                                    <input 
                                                        type="password"
                                                        value={adminPinInput}
                                                        onChange={e => setAdminPinInput(e.target.value)}

                                                        className="flex-1 h-11 px-3.5 rounded-xl bg-white/5 border border-white/10 text-xs text-white outline-none focus:border-amber-400"

                                                    <button 
                                                        type="button"
                                                        onClick={handleUnlockAdmin}
                                                        className="px-4 h-11 rounded-xl bg-amber-500/20 hover:bg-amber-500/30 border border-amber-500/40 text-amber-300 text-xs font-bold uppercase tracking-wider"
                                                    >
                                                        Войти
                                                    </button>
                                                </div>
                                                {adminPinError && (
                                                    <span className="text-[11px] text-rose-400">{adminPinError}</span>
                                                )}
                                            </div>
                                        )}
                                    </div>
                                </div>
                            </div>
                        )}
                    </div>
                );
            }

            // 4. ЭКРАН ИГРЫ (Чистая типографика, удобные отступы, без футера)
            if (screen === 'game') {
                const currentQ = gameQuestions[currentIndex];
                if (!currentQ) {
                    setScreen('menu');
                    return null;
                }
                const categoryInfo = CATEGORIES.find(c => c.id === currentQ.categoryId) || CATEGORIES[0];
                const diffInfo = DIFFICULTIES.find(d => d.id === currentQ.level) || DIFFICULTIES[0];
                const cleanText = currentQ.cleanText || currentQ.text.replace(/^№\s*\d+\.\s*/, '');

                const assignedPlayer = turnHistory[currentIndex];
                const isPreviousQuestion = currentIndex < maxReachedIndex;
                const progressPercent = Math.min(100, Math.round(((currentIndex + 1) / gameQuestions.length) * 100));

                return (
                    <div 
                        className="safe-screen w-full flex flex-col justify-between fade-in relative z-10"
                        style={{ background: `radial-gradient(circle at 50% 35%, ${categoryInfo.accent} 0%, transparent 65%)` }}
                    >
                        {/* Линия прогресса сверху */}
                        <div className="fixed top-0 left-0 right-0 h-1 bg-white/5 z-30">
                            <div 
                                className="h-full bg-gradient-to-r from-rose-500 to-pink-400 transition-all duration-300"
                                style={{ width: `${progressPercent}%` }}
                            ></div>
                        </div>

                        {/* Верхняя панель: Счетчик + Редактировать (справа от счетчика) | Звук + Меню */}
                        <header className="w-full max-w-2xl mx-auto flex justify-between items-center py-2 flex-shrink-0">
                            <div className="flex items-center gap-2.5">
                                <div className="bg-[#150f20] border border-white/10 text-white/90 font-bold px-4 py-2.5 rounded-2xl text-xs tracking-widest">
                                    {currentIndex + 1} <span className="text-white/35">/</span> {gameQuestions.length}
                                </div>
                                {isAdmin && gameMode === 'test' && (
                                    <button 
                                        onClick={() => openEditScreen(currentQ, 'game')}
                                        title="Редактировать вопрос"
                                        className="p-2.5 rounded-2xl bg-white/10 hover:bg-white/20 text-white active:scale-95 transition-all border border-white/15"
                                    >
                                        <Icons.Edit />
                                    </button>
                                )}
                            </div>

                            <div className="flex items-center gap-2">
                                <button 
                                    onClick={toggleMute}
                                    className="p-2.5 rounded-2xl bg-white/5 hover:bg-white/10 border border-white/10 text-white/75 transition-all"
                                >
                                    {isMuted ? <Icons.SoundOff /> : <Icons.SoundOn />}
                                </button>
                                <button 
                                    onClick={() => { SoundFX.warn(); setShowEndGameConfirm(true); }} 
                                    className="flex items-center gap-2 text-white/85 text-xs font-bold uppercase tracking-wider px-4 py-2.5 rounded-2xl bg-white/5 hover:bg-white/10 active:scale-95 transition-all border border-white/10"
                                >
                                    <Icons.Menu /> Меню
                                </button>
                            </div>
                        </header>

                        {/* Центральная карточка вопроса с выверенным пространством */}
                        <main className="flex-1 flex flex-col items-center justify-center py-6 pb-28">
                            <div className="w-full max-w-xl surface-card p-6 sm:p-10 flex flex-col items-center slide-up" key={currentQ.dbKey + '_' + currentIndex}>
                                
                                {/* Плашка с реальным номером вопроса из БД и темой */}
                                <div className="px-4 py-2 rounded-2xl bg-white/[0.04] border border-white/10 mb-5 flex flex-col items-center gap-1">
                                    <div className="flex items-center gap-2">
                                        <span className="text-white/45 text-[10px] uppercase tracking-[0.22em] font-bold">
                                            Вопрос {currentQ.num}
                                        </span>
                                        {gameMode === 'test' && currentQ.archived && (
                                            <span className="text-[9px] uppercase font-bold px-2 py-0.5 rounded-md bg-amber-500/20 text-amber-300">
                                                Архив
                                            </span>
                                        )}
                                    </div>
                                    <div className="flex items-center gap-2 text-xs font-bold uppercase tracking-wider text-white/90">
                                        <span>{categoryInfo.icon}</span>
                                        <span>{categoryInfo.name}</span>
                                        <span className="text-white/25">•</span>
                                        <span className={diffInfo.classText}>{diffInfo.name}</span>
                                    </div>
                                </div>

                                {/* Индикатор очередности ответа (сохраняется при возврате Назад) */}
                                {gameMode === 'normal' && assignedPlayer && (
                                    <div 
                                        className={`mb-6 px-4 py-1.5 rounded-xl border text-[11px] font-bold uppercase tracking-wider flex items-center gap-2 ${
                                            isPreviousQuestion 
                                                ? 'bg-amber-500/10 border-amber-500/30 text-amber-200' 
                                                : assignedPlayer === 'guy'
                                                    ? 'bg-sky-500/12 border-sky-400/30 text-sky-200'
                                                    : 'bg-rose-500/12 border-rose-400/30 text-rose-200'
                                        }`}
                                    >
                                        {isPreviousQuestion ? (
                                            <span>
                                                {assignedPlayer === 'guy' 
                                                    ? `👦 Отвечал: Парень (${profile.guyName})` 
                                                    : `👧 Отвечала: Девушка (${profile.girlName})`}
                                            </span>
                                        ) : (
                                            <span>
                                                {assignedPlayer === 'guy' 
                                                    ? `👦 Отвечает: ${profile.guyName}` 
                                                    : `👧 Отвечает: ${profile.girlName}`}
                                            </span>
                                        )}
                                    </div>
                                )}

                                {/* Текст вопроса */}
                                <h2 className="text-[23px] sm:text-[27px] font-medium text-center leading-[1.18] mb-8 text-white/95 px-1">
                                    {cleanText}
                                </h2>
                                
                                {/* Кнопки "Ситуация" и "Совет" в одну строку */}
                                <div className="grid grid-cols-2 gap-3 w-full">
                                    <button 
                                        onClick={() => triggerAI('situation')}
                                        className="h-12 bg-white/[0.05] hover:bg-white/[0.1] border border-white/12 rounded-2xl text-white/90 text-xs font-bold uppercase tracking-wider active:scale-95 transition-all flex items-center justify-center gap-2"
                                    >
                                        <span className="text-rose-400"><Icons.Sparkles /></span> Ситуация
                                    </button>
                                    <button 
                                        onClick={() => triggerAI('psych')}
                                        className="h-12 bg-sky-500/10 hover:bg-sky-500/20 border border-sky-400/30 rounded-2xl text-sky-300 text-xs font-bold uppercase tracking-wider active:scale-95 transition-all flex items-center justify-center gap-2"
                                    >
                                        <Icons.Bulb /> Совет
                                    </button>
                                </div>
                            </div>
                        </main>

                        {/* Закрепленные кнопки Назад и Далее (50% на 50%) */}
                        <div className="fixed bottom-0 left-0 right-0 p-4 sm:p-6 z-20 pointer-events-none" style={{ paddingBottom: 'max(1.25rem, env(safe-area-inset-bottom))' }}>
                            <div className="max-w-xl mx-auto grid grid-cols-2 gap-3.5 pointer-events-auto">
                                <button 
                                    onClick={handlePrevQuestion}
                                    disabled={currentIndex === 0}

                                    <Icons.Back /> Назад
                                </button>
                                <button

                                    {currentIndex === gameQuestions.length - 1 ? (gameMode === 'test' ? "В меню" : "Итоги") : "Далее"} <Icons.Next />
                                </button>
                            </div>
                        </div>

                        {/* POP-UP ЖРЕБИЯ ПЕРВОГО ОТВЕТА */}
                        {gameMode === 'normal' && turnPopup.open && (
                            <div className="fixed inset-0 bg-black/80 backdrop-blur-md flex items-center justify-center p-5 z-50 fade-in">
                                <div className="surface-card p-7 w-full max-w-sm text-center flex flex-col items-center gap-6 border border-white/15 slide-up">
                                    <span className="text-[10px] font-bold uppercase tracking-[0.22em] text-white/50 px-3 py-1 rounded-full bg-white/5">
                                        Вопрос № {currentQ.num} • Очередь
                                    </span>
                                    <h3 className="text-lg font-bold text-white">
                                        {turnPopup.spinning ? "Кто отвечает первым..." : "Первым отвечает:"}
                                    </h3>

                                    <div className="grid grid-cols-2 gap-3.5 w-full">
                                        <div className={`p-5 rounded-2xl flex flex-col items-center gap-2 transition-all duration-200 border ${
                                            turnPopup.highlight === 'guy' 
                                                ? 'bg-sky-500/20 border-sky-400 scale-105 shadow-[0_0_25px_rgba(56,189,248,0.3)]' 
                                                : 'bg-white/[0.02] border-white/5 opacity-35 scale-95'
                                        }`}>
                                            <span className="text-4xl">👦</span>
                                            <span className="font-bold text-sm text-white truncate max-w-full">{profile.guyName}</span>
                                            <span className="text-[10px] uppercase tracking-wider text-sky-300 font-semibold">Парень</span>
                                        </div>

                                        <div className={`p-5 rounded-2xl flex flex-col items-center gap-2 transition-all duration-200 border ${
                                            turnPopup.highlight === 'girl' 
                                                ? 'bg-rose-500/20 border-rose-400 scale-105 shadow-[0_0_25px_rgba(244,63,94,0.3)]' 
                                                : 'bg-white/[0.02] border-white/5 opacity-35 scale-95'
                                        }`}>
                                            <span className="text-4xl">👧</span>
                                            <span className="font-bold text-sm text-white truncate max-w-full">{profile.girlName}</span>
                                            <span className="text-[10px] uppercase tracking-wider text-rose-300 font-semibold">Девушка</span>
                                        </div>
                                    </div>

                                    {!turnPopup.spinning && (
                                        <div className="w-full flex flex-col gap-4 fade-in">
                                            <div className="text-sm font-semibold text-white/90">
                                                {turnPopup.winner === 'guy' 
                                                    ? `Начинает ${profile.guyName}!` 
                                                    : `Начинает ${profile.girlName}!`}
                                            </div>
                                            <button 
                                                onClick={() => { SoundFX.click(); setTurnPopup(prev => ({ ...prev, open: false })); }}
                                                className="w-full rounded-2xl btn-primary text-white text-xs font-bold uppercase tracking-widest"
                                            >
                                                Открыть вопрос
                                            </button>
                                        </div>
                                    )}
                                </div>
                            </div>
                        )}

                        {/* Подтверждение выхода в Меню */}
                        {showEndGameConfirm && (
                            <div className="fixed inset-0 bg-black/80 backdrop-blur-md flex items-center justify-center p-5 z-50 fade-in">
                                <div className="surface-card p-7 w-full max-w-sm text-center flex flex-col items-center gap-5 border border-white/15">
                                    <div className="text-4xl">❤️</div>
                                    <h3 className="text-lg font-bold text-white">
                                        Точно хотите закончить игру?
                                    </h3>
                                    {gameMode === 'normal' && (
                                        <p className="text-xs text-white/60 leading-relaxed">
                                            Пройденные вопросы ({maxReachedIndex + 1} шт.) перейдут в Архив и не попадутся в новой игре.
                                        </p>
                                    )}
                                    <div className="grid grid-cols-2 gap-3 w-full mt-1">
                                        <button 
                                            onClick={() => { SoundFX.click(); setShowEndGameConfirm(false); }}
                                            className="w-full rounded-2xl btn-secondary text-xs font-bold uppercase tracking-widest"
                                        >
                                            Отмена
                                        </button>
                                        <button 
                                            onClick={() => handleFinishGame(false)}
                                            className="w-full rounded-2xl btn-primary text-white text-xs font-bold uppercase tracking-widest"
                                        >
                                            Да
                                        </button>
                                    </div>
                                </div>
                            </div>
                        )}
                    </div>
                );
            }

            // 5. ЭКРАН AI-ОТВЕТА
            if (screen === 'ai_response') {
                const currentQ = gameQuestions[currentIndex];
                const isSituation = aiType === 'situation';
                
                return (
                    <div className="safe-screen w-full flex flex-col justify-between fade-in relative z-10">
                        <header className="w-full max-w-2xl mx-auto flex items-center justify-between py-2 flex-shrink-0">
                            <button onClick={() => { SoundFX.click(); setScreen('game'); }} className="p-3.5 bg-white/5 rounded-2xl hover:bg-white/10 text-white/80 transition-all border border-white/10">
                                <Icons.Back />
                            </button>
                            <AskMeLogo size="xs" />
                            <span className="text-xs font-bold uppercase tracking-widest text-white/45">
                                № {currentQ?.num}
                            </span>
                        </header>

                        <main className="flex-1 flex flex-col items-center py-4 pb-28 overflow-y-auto no-scrollbar">
                            <div className="w-full max-w-2xl flex flex-col items-center slide-up text-center gap-5">
                                <Illustrations.AiSpark />
                                <h2 className={`text-base font-bold tracking-[0.2em] uppercase ${isSituation ? 'text-rose-400' : 'text-sky-400'}`}>
                                    {isSituation ? "Моделирование ситуации" : "Разбор психолога"}
                                </h2>
                                
                                <div className="list-card p-5 w-full text-center text-white/85 text-sm font-medium">
                                    «{currentQ?.cleanText || currentQ?.text}»
                                </div>

                                <div className={`surface-card p-6 md:p-8 w-full text-left text-white/95 text-[15px] md:text-base leading-relaxed whitespace-pre-wrap ${isAiTyping ? 'ai-cursor' : ''}`}>
                                    {aiContent}
                                </div>

                                <AppFooter />
                            </div>
                        </main>

                        <div className="fixed bottom-0 left-0 right-0 p-4 sm:p-6 z-20 pointer-events-none" style={{ paddingBottom: 'max(1.25rem, env(safe-area-inset-bottom))' }}>
                            <div className="max-w-2xl mx-auto pointer-events-auto">
                                <button onClick={() => { SoundFX.click(); setScreen('game'); }} className="w-full rounded-2xl btn-primary flex items-center justify-center text-xs font-bold uppercase tracking-widest text-white">
                                    К вопросу
                                </button>
                            </div>
                        </div>
                    </div>
                );
            }

            // 6. ЭКРАН ИТОГОВ ИГРЫ (SUMMARY)
            if (screen === 'summary') {
                const answered = gameQuestions.slice(0, answeredCount);
                const cEasy = answered.filter(q => q.level === 'Простые').length;
                const cMed = answered.filter(q => q.level === 'Средние').length;
                const cHard = answered.filter(q => q.level === 'Глубокие').length;

                const isAllAnswered = completedAllFlag || stats.availableActive === 0;
                const floatingHearts = [
                    { left: '10%', delay: '0s', dur: '5.5s', size: '1.5rem', icon: '❤️' },
                    { left: '25%', delay: '1.2s', dur: '6.2s', size: '1.3rem', icon: '✨' },
                    { left: '45%', delay: '0.5s', dur: '5.8s', size: '1.9rem', icon: '💖' },
                    { left: '65%', delay: '1.6s', dur: '6.4s', size: '1.5rem', icon: '❤️' },
                    { left: '82%', delay: '0.4s', dur: '5.3s', size: '1.7rem', icon: '💘' }
                ];

                return (
                    <div className="safe-screen w-full flex flex-col items-center justify-between slide-up relative z-10 overflow-hidden">
                        {isAllAnswered && floatingHearts.map((h, i) => (
                            <div 
                                key={i} 
                                className="floating-heart" 
                                style={{ left: h.left, animationDelay: h.delay, animationDuration: h.dur, fontSize: h.size }}
                            >
                                {h.icon}
                            </div>
                        ))}

                        <div className="flex-1 flex flex-col items-center justify-center w-full max-w-md py-6 gap-6">
                            <AskMeLogo size="md" />

                            {isAllAnswered ? (
                                <div className="text-center surface-card p-6 border border-rose-400/35 bg-rose-950/20 space-y-3">
                                    <div className="text-[10px] font-bold uppercase tracking-[0.25em] text-rose-300">
                                        ✨ Все вопросы пройдены ✨
                                    </div>
                                    <h1 className="text-xl md:text-2xl font-bold text-white">
                                        {profile.guyName} и {profile.girlName}, вы ответили на все вопросы!
                                    </h1>
                                    <p className="text-xs text-white/70 leading-relaxed">
                                        Вы прошли всю выбранную колоду до самого конца и стали ещё ближе друг другу!
                                    </p>
                                    <button 
                                        onClick={() => SoundFX.romanticFinale()}
                                        className="px-4 py-2 rounded-xl bg-white/10 hover:bg-white/15 text-[11px] font-bold uppercase tracking-wider text-rose-200 transition-all"
                                    >
                                        🎵 Мелодия финала
                                    </button>
                                </div>
                            ) : (
                                <div className="text-center space-y-1">
                                    <p className="text-xs font-bold uppercase tracking-widest text-white/45">Итоги партии</p>
                                    <div className="text-6xl font-bold text-rose-400 py-1"><AnimatedCounter target={answered.length} /></div>
                                    <p className="text-white/50 text-xs">вопросов перемещено в Архив</p>
                                </div>
                            )}

                            <div className="w-full surface-card p-5 flex flex-col gap-3">
                                <div className="flex justify-between items-center p-4 bg-white/[0.03] rounded-2xl border border-emerald-500/20">
                                    <span className="font-bold text-xs uppercase tracking-widest diff-easy">Легких</span>
                                    <span className="text-2xl font-semibold text-white"><AnimatedCounter target={cEasy} /></span>
                                </div>
                                <div className="flex justify-between items-center p-4 bg-white/[0.03] rounded-2xl border border-amber-500/20">
                                    <span className="font-bold text-xs uppercase tracking-widest diff-med">Средних</span>
                                    <span className="text-2xl font-semibold text-white"><AnimatedCounter target={cMed} /></span>
                                </div>
                                <div className="flex justify-between items-center p-4 bg-white/[0.03] rounded-2xl border border-rose-500/20">
                                    <span className="font-bold text-xs uppercase tracking-widest diff-hard">Глубоких</span>
                                    <span className="text-2xl font-semibold text-white"><AnimatedCounter target={cHard} /></span>
                                </div>
                            </div>

                            <button onClick={() => { SoundFX.click(); setScreen('menu'); }} className="w-full rounded-2xl text-white font-bold text-xs uppercase tracking-[0.2em] btn-primary flex items-center justify-center gap-2">
                                <Icons.Check /> В меню
                            </button>
                        </div>

                        <AppFooter />
                    </div>
                );
            }

            // 7. СПИСОК КАТЕГОРИЙ И АРХИВ (Адаптивная сетка для мобильных и ПК)
            if (screen === 'cat_list') {
                const totalArchivedCount = stats.archivedList.length;

                return (
                    <div className="safe-screen w-full flex flex-col fade-in max-w-md lg:max-w-5xl mx-auto relative z-10">
                        <header className="flex items-center justify-between gap-4 mb-7 pt-2">
                            <div className="flex items-center gap-3.5">
                                <button onClick={() => { SoundFX.click(); setScreen('menu'); }} className="p-3.5 bg-white/5 rounded-2xl hover:bg-white/10 text-white/80 transition-all border border-white/10">
                                    <Icons.Back />
                                </button>
                                <div>
                                    <h2 className="text-2xl font-bold text-white tracking-tight">Все вопросы</h2>

                                        Активно: {db.length - totalArchivedCount - stats.disabledCount} • Скрыто: {stats.disabledCount} • Архив: {totalArchivedCount}
                                    </p>
                                </div>
                            </div>

                            {isAdmin && (
                                <button 
                                    onClick={() => { SoundFX.click(); setAddStatus(null); setAddForm({ text: '', cat: 'family', diff: 'Простые' }); setScreen('add_q'); }}

                                    <Icons.Plus /> Новый вопрос
                                </button>

                        </header>

                        <div className="flex-1 flex flex-col gap-8 pb-24">
                            {/* Сетка тем: 1 колонка на телефоне / 2 колонки на ПК */}

                                {CATEGORIES.map(cat => {
                                    const totalCatCount = stats.totalByCat[cat.id] || 0;
                                    const activeCatCount = stats.activeByCat[cat.id] || 0;
                                    return (
                                        <button 
                                            key={cat.id} 
                                            onClick={() => { SoundFX.click(); setViewCategory(cat.id); setVisibleLimit(60); setScreen('q_list'); }} 
                                            className="list-card p-5 flex items-center justify-between text-left"
                                        >
                                            <div className="flex items-center gap-4">
                                                <span className="w-12 h-12 rounded-2xl bg-white/[0.04] border border-white/10 flex items-center justify-center text-2xl">
                                                    {cat.icon}
                                                </span>
                                                <div>
                                                    <div className="font-bold text-base text-white mb-0.5">{cat.name}</div>
                                                    <div className="text-xs text-white/45">
                                                        Активных: <span className="text-rose-300 font-semibold">{activeCatCount}</span> из {totalCatCount}
                                                    </div>
                                                </div>
                                            </div>
                                            <span className="text-white/40"><Icons.Next /></span>
                                        </button>
                                    );

                                >
                                    <Icons.Sparkles />
                                    {isGeneratingQuestion ? "Генерация..." : "Идея от ИИ"}
                                </button>

                                <div className="mt-auto pt-4 grid grid-cols-2 gap-3.5">
                                    <button type="button" onClick={() => { SoundFX.click(); setScreen(viewCategory ? 'q_list' : 'cat_list'); }} className="w-full rounded-2xl btn-secondary text-xs font-bold uppercase tracking-widest">
                                        Отмена
                                    </button>
                                    <button type="submit" disabled={isSaving || !addForm.text.trim()} className="w-full rounded-2xl btn-primary text-white text-xs font-bold uppercase tracking-widest flex items-center justify-center gap-2 disabled:opacity-30">
                                        <Icons.Plus /> {isSaving ? "Запись..." : "Сохранить"}
                                    </button>
                                </div>
                            </form>
                        )}
                        {!addStatus && <AppFooter />}
                    </div>
                );
            }

            return null;
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
