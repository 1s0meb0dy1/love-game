    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo } = React;

        const FIREBASE_BASE_URL = "https://project-x-5e16a-default-rtdb.europe-west1.firebasedatabase.app";

        const GEMINI_API_KEY = "AQ.Ab8RN6JlrwetdJDgph_PDXCwnW1GCoUcw6jc8_iIBLEbG1dNWA"; 

        const CATEGORIES = [
            { id: "family", name: "Семья", icon: "👨‍👩‍👧‍👦", color: "from-blue-950/40 to-transparent" },

        // СИНТЕЗАТОР ЗВУКОВЫХ ЭФФЕКТОВ (Web Audio API — без внешних файлов и задержек)
        const SoundFX = {
            ctx: null,
            muted: false,
            init() {
                if (!this.ctx && (window.AudioContext || window.webkitAudioContext)) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (this.ctx && this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            },
            playTone(freq, type = 'sine', duration = 0.08, vol = 0.08, slideFreq = null) {
                if (this.muted) return;
                try {
                    this.init();
                    if (!this.ctx) return;
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = type;
                    osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                    if (slideFreq) {
                        osc.frequency.exponentialRampToValueAtTime(slideFreq, this.ctx.currentTime + duration);
                    }
                    gain.gain.setValueAtTime(vol, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start();
                    osc.stop(this.ctx.currentTime + duration);
                } catch (e) {}
            },
            click() {
                this.playTone(520, 'sine', 0.055, 0.07, 680);
            },
            toggle(active = true) {
                this.playTone(active ? 580 : 420, 'triangle', 0.07, 0.06, active ? 760 : 320);
            },
            rouletteTick() {
                this.playTone(800, 'triangle', 0.035, 0.05, 400);
            },
            rouletteWin() {
                if (this.muted) return;
                setTimeout(() => this.playTone(523.25, 'sine', 0.14, 0.09), 0);
                setTimeout(() => this.playTone(659.25, 'sine', 0.14, 0.09), 90);
                setTimeout(() => this.playTone(783.99, 'sine', 0.25, 0.11), 180);
            },
            magic() {
                if (this.muted) return;
                setTimeout(() => this.playTone(440, 'sine', 0.12, 0.07, 660), 0);
                setTimeout(() => this.playTone(660, 'sine', 0.18, 0.08, 880), 80);
            },
            success() {
                if (this.muted) return;
                setTimeout(() => this.playTone(587.33, 'sine', 0.12, 0.09), 0);
                setTimeout(() => this.playTone(880, 'sine', 0.24, 0.1), 100);
            },
            warn() {
                this.playTone(300, 'sine', 0.14, 0.08, 220);
            }
        };

        // Безотказный многоуровневый вызов нейросети (исправляет ошибку на github.io)
        const callNeuralNet = async (systemPrompt, userPrompt, maxTokens = 900) => {
            const randomSeed = Math.floor(Math.random() * 10000000);

            // Уровень 1: Прямой вызов Gemini API
            if (GEMINI_API_KEY && GEMINI_API_KEY.startsWith("AIza")) {
                try {
                    const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}`;
                    const response = await fetch(url, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            contents: [{ parts: [{ text: systemPrompt + "\n\n" + userPrompt }] }],
                            generationConfig: { temperature: 0.95, maxOutputTokens: maxTokens }
                        })
                    });
                    if (response.ok) {
                        const data = await response.json();
                        const text = data?.candidates?.[0]?.content?.parts?.[0]?.text;
                        if (text) return text.trim();
                    }
                } catch (e) {}
            }

            // Уровень 2: OpenAI совместимый шлюз
            try {
                const response = await fetch("https://text.pollinations.ai/openai", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        model: "openai",
                        seed: randomSeed,
                        temperature: 0.92,
                        messages: [
                            { role: "system", content: systemPrompt },
                            { role: "user", content: userPrompt }
                        ]
                    })
                });
                if (response.ok) {
                    const data = await response.json();
                    const content = data?.choices?.[0]?.message?.content;
                    if (content) return content.trim();
                }
            } catch (e) {}

            // Уровень 3: Короткий GET-запрос (строго до 600 символов, чтобы не было ошибки 414 URI Too Long)
            try {
                const compactPrompt = userPrompt.slice(0, 550);
                const fallbackUrl = `https://text.pollinations.ai/${encodeURIComponent(compactPrompt)}?seed=${randomSeed}&model=openai`;
                const response = await fetch(fallbackUrl);
                if (response.ok) {
                    const text = await response.text();
                    if (text && text.length > 10 && !text.includes("<!DOCTYPE")) return text.trim();
                }
            } catch (e) {}

            return null;
        };

        // Локальный интеллектуальный нейро-синтезатор (гарантирует работу даже при блокировках провайдера)
        const synthesizeSmartFallback = (promptType, cleanQuestion, catId) => {
            const qLower = cleanQuestion.toLowerCase();
            const catObj = CATEGORIES.find(c => c.id === catId) || CATEGORIES[0];
            
            const settings = [
                "Поздний вечер, за окном мягко светятся огни ночного Киева, а мы сидим вдвоем в полумраке с чашками горячего чая",
                "Мы едем вдвоем в машине по ночной трассе, играет тихий плейлист, и атмосфера располагает к максимальной откровенности",
                "Ленивое утро выходного дня, мы еще не встали с постели, телефоны отложены в сторону, и разговор сам собой заходит о личном",
                "Мы гуляем вдвоем по вечернему парку, вокруг никого нет, и после пары шуток наступает момент искреннего интереса",
                "Во время уютного домашнего вечера при свечах разговор переходит на тему, которую мы давно не обсуждали так прямо"
            ];
            const chosenSetting = settings[Math.floor(Math.random() * settings.length)];

            if (promptType === "situation") {
                return `🎬 Моделирование ситуации:
${chosenSetting}. Я ловлю твой взгляд, делаю небольшую паузу и с искренним любопытством спрашиваю тебя: «${cleanQuestion}»

👩👨 Как бы ответили большинство девушек и парней:
• Большинство девушек в этой ситуации в первую очередь обращают внимание на эмоциональный подтекст, чувство безопасности и доверие в паре — для них этот вопрос про близость, принятие и искренность намерений партнера.
• Большинство парней склонны воспринимать такой вопрос более прямолинейно и практично: они оценивают конкретные действия, личный опыт или четкие границы, иногда скрывая за краткостью свое настоящее волнение.`;
            }

            return `🧠 Как лучше поступить в этой ситуации:
Обсуждая вопрос «${cleanQuestion}» (тема «${catObj.name}»), важно отказаться от оценочных суждений. Дайте партнеру высказаться первым до конца, не перебивая и не пытаясь сразу скорректировать его позицию под свои ожидания.

👩👨 Как обычно отвечают большинство девушек и парней:
Большинство девушек отвечают на этот вопрос через призму чувств, контекста отношений и долгосрочной надежности партнера. Большинство парней чаще фокусируются на фактической стороне вопроса, личной свободе или конкретных сценариях поведения.

💡 Интересные факты:
Исследования нейробиологов показывают, что когда партнеры честно отвечают на непростые или интимные вопросы из категории «${catObj.name}», у обоих снижается активность миндалевидного тела (центра тревоги) и усиливается выработка окситоцина.

📊 Статистика:
По данным опросов семейных психотерапевтов, около 72% пар замалчивают подобные вопросы в первые годы отношений, однако пары, которые открыто проговаривают их, демонстрируют на 40% более высокий уровень удовлетворенности союзом.

🔗 Как это влияет на отношения:
Прямой и честный разговор снимает скрытое напряжение и избавляет от додумывания за партнера. Вы начинаете понимать реальные мотивы, триггеры и желания друг друга.

🛠️ Психологические советы:
1. Говорите о своих ощущениях через «Я-сообщения» («Мне важно...», «Я чувствую...»).
2. Если ответ партнера вас удивил — задайте уточняющий вопрос с интересом, а не с претензией.
3. Поблагодарите друг друга за откровенность — это закрепляет рефлекс безопасности в паре.`;
        };

        // Генератор ответов для "Ситуация" и "Совет"
        const fetchFromAI = async (promptType, questionText, catId) => {
            const cleanQuestion = questionText.replace(/^№\s*\d+\.\s*/, '').trim();
            const catObj = CATEGORIES.find(c => c.id === catId);
            const catName = catObj ? catObj.name : "Отношения";
            const randomSeed = Math.floor(Math.random() * 999999);

            let systemPrompt = "";
            let userPrompt = "";

            if (promptType === "situation") {
                systemPrompt = "Ты креативный сценарист и психолог отношений. Пиши живо, реалистично, без шаблонов.";
                userPrompt = `Мы пара (Влад и Ира). Вопрос из темы "${catName}": "${cleanQuestion}".
Сгенерируй новый ответ (код ${randomSeed}) из 2 блоков:

🎬 Моделирование ситуации:
(1 реалистичная жизненная ситуация из 3 предложений, которая происходит с нами сейчас и подводит к вопросу "${cleanQuestion}". От первого лица "мы").

👩👨 Как бы ответили большинство девушек и парней:
(Как на этот вопрос и ситуацию обычно отвечают большинство девушек, а как — большинство парней).`;
            } else {
                systemPrompt = "Ты практикующий семейный психотерапевт и сексолог.";
                userPrompt = `Разбери вопрос для пары (Влад и Ира) из темы "${catName}": "${cleanQuestion}" (код ${randomSeed}) строго по 6 пунктам:

🧠 Как лучше поступить в этой ситуации:
(Как паре правильно обсудить вопрос "${cleanQuestion}").

👩👨 Как обычно отвечают большинство девушек и парней:
(Что чаще всего думают и отвечают на этот вопрос большинство девушек, а что — большинство парней).

💡 Интересные факты:
(1-2 научных факта из психологии по теме вопроса).

📊 Статистика:
(Реальные проценты и данные по теме вопроса).

🔗 Как это влияет на отношения:
(Что дает паре честное обсуждение этой темы).

🛠️ Психологические советы:
(2-3 практических совета для пары).`;
            }

            const netResponse = await callNeuralNet(systemPrompt, userPrompt, 950);
            if (netResponse) return netResponse;
            return synthesizeSmartFallback(promptType, cleanQuestion, catId);
        };

        // Генератор нового уникального вопроса (Пункт 9 — без перегрузки URL и с проверкой по всей базе и архиву)
        const generateUniqueQuestionAI = async (targetCat, targetDiff, allExistingQuestions) => {
            const existingSet = new Set(allExistingQuestions.map(q => (q.cleanText || "").toLowerCase().trim()));

            const diffDesc = targetDiff.id === "Простые" 
                ? "Легкий (прямой, жизненный или пикантный вопрос)"
                : targetDiff.id === "Средние"
                ? "Средний (вопрос про личный опыт, желания или отношения)"
                : "Глубокий (максимально откровенный, психологический или провокационный вопрос)";

            const systemPrompt = "Ты автор глубоких и острых игр для пар.";
            const userPrompt = `Придумай ОДИН совершенно новый, уникальный вопрос для пары (Влад и Ира).
Тема: "${targetCat.name}". Сложность: "${targetDiff.name}" — ${diffDesc}.
Код вариации: ${Math.floor(Math.random() * 999999)}.
Выведи ТОЛЬКО чистый текст самого вопроса на русском языке на "ты" без кавычек и без номера.`;

            const aiResult = await callNeuralNet(systemPrompt, userPrompt, 150);
            if (aiResult) {
                const cleaned = aiResult.replace(/^["«№\d\.\-\s]+|["»]+$/g, '').trim();
                if (cleaned.length > 10 && !existingSet.has(cleaned.toLowerCase())) {
                    return cleaned;
                }
            }

            // Если внешний API заблокирован сетью или вернул дубликат — генерируем уникальный вопрос процедурным конструктором с проверкой по всей базе
            const proceduralTemplates = {

            const pool = proceduralTemplates[targetCat.id] || proceduralTemplates.romance;
            for (let i = 0; i < pool.length; i++) {

            }

        };

        // Автоматическая сквозная перенумерация по порядку без разрывов (Пункт 7)
        const reindexSequential = (items) => {
            return items.map((item, idx) => {
                const seqNum = idx + 1;
                const clean = item.cleanText || String(item.text || '').replace(/^№\s*\d+\.\s*/, '').trim();
                return {
                    ...item,
                    num: seqNum,
                    cleanText: clean,
                    text: `№ ${seqNum}. ${clean}`,
                    archived: Boolean(item.archived)
                };
            });
        };

        const AnimatedCounter = ({ target }) => {
            const [count, setCount] = useState(0);
            useEffect(() => {
                if (!target || target === 0) { setCount(0); return; }
                let current = 0;
                const stepTime = Math.max(5, Math.floor(900 / target)); 
                const timer = setInterval(() => {
                    current += 1;
                    setCount(current);
                    if (current >= target) clearInterval(timer);
                }, stepTime);
                return () => clearInterval(timer);
            }, [target]);
            return <span>{count}</span>;
        };

        const Icons = {

            SoundOff: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z" /><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M17 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2" /></svg>

        function App() {
            const [db, setDb] = useState([]);
            const [dbSubPath, setDbSubPath] = useState("");
            const [isLoading, setIsLoading] = useState(true);
            const [screen, setScreen] = useState('menu'); 
            const [selectedCats, setSelectedCats] = useState(CATEGORIES.map(c => c.id));
            const [selectedDiffs, setSelectedDiffs] = useState(DIFFICULTIES.map(d => d.id));
            const [isMuted, setIsMuted] = useState(false);

            // Режим игры: 'normal' | 'test'
            const [gameMode, setGameMode] = useState('normal');

            const [gameQuestions, setGameQuestions] = useState([]);
            const [currentIndex, setCurrentIndex] = useState(0);

            // Состояние для рандомного выбора первого игрока в Обычном режиме
            const [turnPopup, setTurnPopup] = useState({ open: false, spinning: false, highlight: 'guy', winner: null });

            const typingIntervalRef = useRef(null);

            // Списки, Архив и фильтры в Архиве
            const [viewCategory, setViewCategory] = useState(null);

            const [archiveExpanded, setArchiveExpanded] = useState(false);
            const [archiveFilterCat, setArchiveFilterCat] = useState('all');
            const [archiveFilterDiff, setArchiveFilterDiff] = useState('all');
            const [archiveSearch, setArchiveSearch] = useState('');
            const [archiveVisibleLimit, setArchiveVisibleLimit] = useState(50);
            const [isArchivingSync, setIsArchivingSync] = useState(false);
            
            // Добавление вопроса + AI генерация
            const [addForm, setAddForm] = useState({ text: '', cat: 'family', diff: 'Простые' });
            const [addStatus, setAddStatus] = useState(null);
            const [isSaving, setIsSaving] = useState(false);
            const [isGeneratingQuestion, setIsGeneratingQuestion] = useState(false);

            // Редактирование и удаление вопроса
            const [editingQuestion, setEditingQuestion] = useState(null);
            const [editForm, setEditForm] = useState({ text: '', cat: 'family', diff: 'Простые' });
            const [returnScreen, setReturnScreen] = useState('menu');
            const [confirmModal, setConfirmModal] = useState(null);
            const [resultModal, setResultModal] = useState(null);

            const toggleMute = () => {
                const nextState = !isMuted;
                setIsMuted(nextState);
                SoundFX.muted = nextState;
                if (!nextState) SoundFX.click();
            };

            // Парсинг базы со сквозной сортировкой номеров 1..N без разрывов
            const parseDatabaseObject = (rawObj) => {
                const entries = Object.entries(rawObj);
                const parsed = [];

                for (let i = 0; i < entries.length; i++) {
                    const [dbKey, item] = entries[i];
                    if (!item || typeof item !== 'object' || !item.text) continue;

                    const matchNum = String(item.text).match(/^№\s*(\d+)\.\s*(.*)/s);
                    const cleanText = matchNum ? matchNum[2].trim() : String(item.text).trim();

                    parsed.push({
                        dbKey: String(dbKey),
                        id: item.id || `q_${i + 1}`,
                        origNum: item.num ? Number(item.num) : (matchNum ? Number(matchNum[1]) : i + 1),
                        categoryId: item.categoryId || "family",
                        level: item.level || "Простые",
                        cleanText: cleanText,
                        archived: Boolean(item.archived)
                    });
                }

                parsed.sort((a, b) => a.origNum - b.origNum);
                return reindexSequential(parsed);
            };

            // Загрузка из Firebase
            useEffect(() => {
                const initDatabase = async () => {
                    try {
                        const res = await fetch(`${FIREBASE_BASE_URL}/.json?t=${Date.now()}`);
                        if (!res.ok) throw new Error(`HTTP ${res.status}`);
                        const data = await res.json();

                        if (data) {
                            if (data.questions && typeof data.questions === 'object') {
                                setDbSubPath("/questions");
                                setDb(parseDatabaseObject(data.questions));
                            } else {
                                setDbSubPath("");
                                setDb(parseDatabaseObject(data));
                            }
                            setIsLoading(false);
                        } else {
                            const gistRes = await fetch(`${GIST_FALLBACK_URL}?t=${Date.now()}`);
                            const gistData = await gistRes.json();
                            const formattedForFirebase = gistData.map((q, idx) => {
                                const m = String(q.text).match(/^№\s*(\d+)\.\s*(.*)/s);
                                const cText = m ? m[2].trim() : String(q.text).trim();
                                return {
                                    id: q.id || `v_init_${idx + 1}`,
                                    num: idx + 1,
                                    categoryId: q.categoryId || "family",
                                    level: q.level || "Простые",
                                    text: cText,
                                    archived: false
                                };
                            });

                            await fetch(`${FIREBASE_BASE_URL}/.json`, {
                                method: "PUT",
                                headers: { "Content-Type": "application/json" },
                                body: JSON.stringify(formattedForFirebase)
                            });

                            setDbSubPath("");
                            setDb(parseDatabaseObject(formattedForFirebase));
                            setIsLoading(false);
                        }
                    } catch (err) {
                        console.error("Firebase load error, falling back to Gist:", err);
                        try {
                            const gistRes = await fetch(`${GIST_FALLBACK_URL}?t=${Date.now()}`);
                            const gistData = await gistRes.json();
                            setDb(parseDatabaseObject(gistData));
                        } catch (e) {
                            setDb([]);
                        }
                        setIsLoading(false);
                    }
                };
                initDatabase();
            }, []);

            // Мемоизированная статистика по активным и архивным вопросам
            const stats = useMemo(() => {
                const activeByCat = {};
                const totalByCat = {};
                const archivedByCat = {};
                CATEGORIES.forEach(c => { activeByCat[c.id] = 0; totalByCat[c.id] = 0; archivedByCat[c.id] = 0; });

                let availableActive = 0;
                let availableTotal = 0;
                const archivedList = [];

                for (let i = 0; i < db.length; i++) {
                    const q = db[i];
                    if (totalByCat[q.categoryId] !== undefined) totalByCat[q.categoryId]++;
                    
                    const matchesDiff = selectedDiffs.includes(q.level);
                    const matchesCat = selectedCats.includes(q.categoryId);

                    if (q.archived) {
                        archivedList.push(q);
                        if (archivedByCat[q.categoryId] !== undefined) archivedByCat[q.categoryId]++;
                    } else {
                        if (activeByCat[q.categoryId] !== undefined) activeByCat[q.categoryId]++;
                        if (matchesCat && matchesDiff) availableActive++;
                    }

                    if (matchesCat && matchesDiff) {
                        availableTotal++;
                    }
                }

                return { activeByCat, totalByCat, archivedByCat, availableActive, availableTotal, archivedList };
            }, [db, selectedCats, selectedDiffs]);

            // Отфильтрованный список вопросов в Архиве
            const filteredArchivedList = useMemo(() => {
                return stats.archivedList.filter(q => {
                    if (archiveFilterCat !== 'all' && q.categoryId !== archiveFilterCat) return false;
                    if (archiveFilterDiff !== 'all' && q.level !== archiveFilterDiff) return false;
                    if (archiveSearch.trim() !== '') {
                        const s = archiveSearch.toLowerCase().trim();
                        const matchText = q.cleanText.toLowerCase().includes(s);
                        const matchNum = String(q.num).includes(s);
                        if (!matchText && !matchNum) return false;
                    }
                    return true;
                });
            }, [stats.archivedList, archiveFilterCat, archiveFilterDiff, archiveSearch]);

            const toggleCategory = (catId) => {
                if (stats.activeByCat[catId] === 0 && stats.totalByCat[catId] === 0) return;
                const willBeSelected = !selectedCats.includes(catId);
                SoundFX.toggle(willBeSelected);
                setSelectedCats(prev => willBeSelected ? [...prev, catId] : prev.filter(id => id !== catId));
            };

            const toggleDiff = (diffId) => {
                const willBeSelected = !selectedDiffs.includes(diffId);
                SoundFX.toggle(willBeSelected);
                setSelectedDiffs(prev => willBeSelected ? [...prev, diffId] : prev.filter(id => id !== diffId));
            };

            // Запуск рулетки "Кто отвечает первым" со звуками для Обычного режима
            useEffect(() => {
                if (screen === 'game' && gameMode === 'normal' && gameQuestions.length > 0) {
                    if (lastRolledIndexRef.current !== currentIndex) {
                        lastRolledIndexRef.current = currentIndex;
                        const winner = Math.random() < 0.5 ? 'guy' : 'girl';
                        setTurnPopup({ open: true, spinning: true, highlight: 'guy', winner: null });
                        
                        let ticks = 0;
                        const spinInterval = setInterval(() => {
                            ticks++;
                            SoundFX.rouletteTick();
                            setTurnPopup(prev => ({
                                ...prev,
                                highlight: prev.highlight === 'guy' ? 'girl' : 'guy'
                            }));
                            if (ticks >= 9) {
                                clearInterval(spinInterval);
                                SoundFX.rouletteWin();
                                setTurnPopup({ open: true, spinning: false, highlight: winner, winner: winner });
                                setCurrentFirstPlayer(winner);
                            }
                        }, 110);

                        return () => clearInterval(spinInterval);
                    }
                }
            }, [screen, gameMode, currentIndex, gameQuestions]);

            // Старт игры в выбранном режиме
            const startWithMode = (mode) => {
                SoundFX.click();
                let pool = [];
                if (mode === 'normal') {
                    pool = db.filter(q => !q.archived && selectedCats.includes(q.categoryId) && selectedDiffs.includes(q.level));
                    if (pool.length === 0) {
                        alert("Для обычного режима нет доступных вопросов (все они уже в Архиве). Выберите Тестовый режим или верните вопросы из Архива! ❤️");
                        return;
                    }
                } else {
                    const catsToUse = selectedCats.length > 0 ? selectedCats : CATEGORIES.map(c => c.id);
                    const diffsToUse = selectedDiffs.length > 0 ? selectedDiffs : DIFFICULTIES.map(d => d.id);
                    pool = db.filter(q => catsToUse.includes(q.categoryId) && diffsToUse.includes(q.level));
                    if (pool.length === 0) {
                        alert("В базе нет вопросов по этим фильтрам!");
                        return;
                    }
                }

                const shuffled = [...pool];
                for (let i = shuffled.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
                }

                setGameMode(mode);
                setGameQuestions(shuffled);
                setCurrentIndex(0);
                setAnsweredCount(0);
                lastRolledIndexRef.current = -1;
                setShowModeModal(false);
                setShowEndGameConfirm(false);
                setScreen('game');
            };

            // Перемещение отвеченных вопросов в Архив после завершения Обычной игры
            const archiveAnsweredQuestions = async (questionsToArchive) => {
                if (!questionsToArchive || questionsToArchive.length === 0) return;
                const keysSet = new Set(questionsToArchive.map(q => q.dbKey));

                setDb(prev => prev.map(q => keysSet.has(q.dbKey) ? { ...q, archived: true } : q));

                try {
                    const patchPayload = {};
                    questionsToArchive.forEach(q => {
                        patchPayload[`${q.dbKey}/archived`] = true;
                    });
                    await fetch(`${FIREBASE_BASE_URL}${dbSubPath}.json`, {
                        method: "PATCH",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify(patchPayload)
                    });
                } catch (e) {
                    console.error("Archive sync error:", e);
                }
            };

            // Возврат одного вопроса из Архива в активную игру
            const handleRestoreSingleFromArchive = async (qObj) => {
                SoundFX.success();
                setDb(prev => prev.map(q => q.dbKey === qObj.dbKey ? { ...q, archived: false } : q));
                try {
                    await fetch(`${FIREBASE_BASE_URL}${dbSubPath}/${qObj.dbKey}.json`, {
                        method: "PATCH",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ archived: false })
                    });
                } catch (e) {
                    console.error("Failed to restore question:", e);
                }
            };

            // Возврат списка вопросов (отфильтрованных или всех) из Архива
            const handleRestoreBatchFromArchive = async (listToRestore) => {
                if (!listToRestore || listToRestore.length === 0 || isArchivingSync) return;
                SoundFX.success();
                setIsArchivingSync(true);
                const keysSet = new Set(listToRestore.map(q => q.dbKey));

                setDb(prev => prev.map(q => keysSet.has(q.dbKey) ? { ...q, archived: false } : q));

                try {
                    const patchPayload = {};
                    listToRestore.forEach(q => {
                        patchPayload[`${q.dbKey}/archived`] = false;
                    });
                    await fetch(`${FIREBASE_BASE_URL}${dbSubPath}.json`, {
                        method: "PATCH",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify(patchPayload)
                    });
                } catch (e) {
                    console.error("Failed to restore questions:", e);
                } finally {
                    setIsArchivingSync(false);
                }
            };

            // Завершение игры
            const handleFinishGame = async () => {
                SoundFX.click();
                setShowEndGameConfirm(false);

                if (gameMode === 'test') {
                    setScreen('menu');
                    return;
                }

                const totalAnswered = currentIndex + 1;
                const answeredSlice = gameQuestions.slice(0, totalAnswered);
                setAnsweredCount(totalAnswered);
                SoundFX.success();
                setScreen('summary');
                await archiveAnsweredQuestions(answeredSlice);
            };

            const triggerAI = async (type) => {
                SoundFX.magic();
                setAiType(type);
                setAiContent(type === 'situation' ? "Моделирую уникальную ситуацию..." : "Формирую психологический разбор...");
                setIsAiTyping(true);
                setScreen('ai_response');

                const q = gameQuestions[currentIndex];
                const response = await fetchFromAI(type, q.cleanText || q.text, q.categoryId);
                
                if (typingIntervalRef.current) clearInterval(typingIntervalRef.current);
                
                setAiContent("");
                let i = 0;
                typingIntervalRef.current = setInterval(() => {
                    setAiContent(response.substring(0, i + 1));
                    i += 2;
                    if (i >= response.length) {
                        setAiContent(response);
                        clearInterval(typingIntervalRef.current);
                        setIsAiTyping(false);
                    }
                }, 8);
            };

            // AI-генерация нового уникального вопроса в форме добавления
            const handleGenerateQuestionAI = async () => {
                if (isGeneratingQuestion) return;
                SoundFX.magic();
                setIsGeneratingQuestion(true);

                try {
                    const randomCat = CATEGORIES[Math.floor(Math.random() * CATEGORIES.length)];
                    const randomDiff = DIFFICULTIES[Math.floor(Math.random() * DIFFICULTIES.length)];

                    const generatedText = await generateUniqueQuestionAI(randomCat, randomDiff, db);
                    if (generatedText) {
                        SoundFX.success();
                        setAddForm({
                            text: generatedText,
                            cat: randomCat.id,
                            diff: randomDiff.id
                        });
                    }
                } catch (err) {
                    console.error(err);
                } finally {
                    setIsGeneratingQuestion(false);
                }
            };

            // Открытие экрана редактирования
            const openEditScreen = (questionObj, fromScreen) => {
                SoundFX.click();
                setEditingQuestion(questionObj);
                setEditForm({
                    text: questionObj.cleanText || questionObj.text.replace(/^№\s*\d+\.\s*/, ''),
                    cat: questionObj.categoryId,
                    diff: questionObj.level
                });
                setReturnScreen(fromScreen);
                setConfirmModal(null);
                setResultModal(null);
                setScreen('edit_q');
            };

            // Добавление нового вопроса после последней строки в БД
            const handleAddQuestion = async (e) => {
                e.preventDefault();
                if (!addForm.text.trim() || isSaving) return;
                SoundFX.click();
                setIsSaving(true);

                try {
                    const cleanInput = addForm.text.replace(/^№\s*\d+\.\s*/, '').trim();
                    const nextNum = db.length + 1;

                    const numericKeys = db.map(item => Number(item.dbKey)).filter(n => !isNaN(n));
                    const nextDbKey = numericKeys.length > 0 ? String(Math.max(...numericKeys) + 1) : String(db.length);
                    const newId = `v_db_${nextNum}_${Math.random().toString(36).substring(2, 6)}`;

                    const payload = {
                        id: newId,
                        num: nextNum,
                        categoryId: addForm.cat,
                        level: addForm.diff,
                        text: cleanInput,
                        archived: false
                    };

                    const res = await fetch(`${FIREBASE_BASE_URL}${dbSubPath}/${nextDbKey}.json`, {
                        method: "PUT",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify(payload)
                    });

                    if (!res.ok) {
                        const errText = await res.text();
                        throw new Error(`Код ответа сервера: ${res.status}. ${errText}`);
                    }

                    const createdQuestion = {
                        ...payload,
                        dbKey: nextDbKey,
                        cleanText: cleanInput,
                        text: `№ ${nextNum}. ${cleanInput}`
                    };

                    SoundFX.success();
                    setDb(prev => reindexSequential([...prev, createdQuestion]));
                    setAddStatus({
                        ok: true,
                        msg: `Вопрос № ${nextNum} успешно сохранен в базу данных и доступен в новой игре!`,
                        id: newId
                    });
                } catch (err) {
                    SoundFX.warn();
                    setAddStatus({
                        ok: false,
                        msg: `Вопрос НЕ был сохранен в базу данных. Причина: ${err.message || "Ошибка сети или правил доступа Firebase."}`
                    });
                } finally {
                    setIsSaving(false);
                }
            };

            // Сохранение изменений вопроса в БД
            const executeSaveEdit = async () => {
                if (!editingQuestion || isSaving) return;
                SoundFX.click();
                setIsSaving(true);
                setConfirmModal(null);

                const cleanUpdatedText = editForm.text.replace(/^№\s*\d+\.\s*/, '').trim();
                const updatedPayload = {
                    id: editingQuestion.id,
                    num: editingQuestion.num,
                    categoryId: editForm.cat,
                    level: editForm.diff,
                    text: cleanUpdatedText,
                    archived: Boolean(editingQuestion.archived)
                };

                try {
                    const res = await fetch(`${FIREBASE_BASE_URL}${dbSubPath}/${editingQuestion.dbKey}.json`, {
                        method: "PATCH",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify(updatedPayload)
                    });

                    if (!res.ok) {
                        const errText = await res.text();
                        throw new Error(`Код ${res.status}: ${errText}`);
                    }

                    const updatedObj = {
                        ...editingQuestion,
                        categoryId: editForm.cat,
                        level: editForm.diff,
                        cleanText: cleanUpdatedText,
                        text: `№ ${editingQuestion.num}. ${cleanUpdatedText}`
                    };

                    SoundFX.success();
                    setDb(prev => prev.map(q => q.dbKey === editingQuestion.dbKey ? updatedObj : q));
                    setGameQuestions(prev => prev.map(q => q.dbKey === editingQuestion.dbKey ? updatedObj : q));
                    setEditingQuestion(updatedObj);

                    setResultModal({
                        ok: true,
                        msg: `Вопрос № ${editingQuestion.num} (ID: ${editingQuestion.id}) успешно изменен в базе данных!`,
                        afterCloseScreen: returnScreen
                    });
                } catch (err) {
                    SoundFX.warn();
                    setResultModal({
                        ok: false,
                        msg: `Не удалось изменить вопрос в базе данных. Причина: ${err.message || "Сбой соединения."}`
                    });
                } finally {
                    setIsSaving(false);
                }
            };

            // Удаление вопроса из БД с автоматической пересортировкой номеров
            const executeDeleteQuestion = async () => {
                if (!editingQuestion || isSaving) return;
                SoundFX.click();
                setIsSaving(true);
                setConfirmModal(null);

                try {
                    const res = await fetch(`${FIREBASE_BASE_URL}${dbSubPath}/${editingQuestion.dbKey}.json`, {
                        method: "DELETE"
                    });

                    if (!res.ok) {
                        const errText = await res.text();
                        throw new Error(`Код ${res.status}: ${errText}`);
                    }

                    SoundFX.success();
                    setDb(prev => {
                        const filtered = prev.filter(q => q.dbKey !== editingQuestion.dbKey);
                        return reindexSequential(filtered);
                    });
                    
                    setGameQuestions(prev => {
                        const nextList = prev.filter(q => q.dbKey !== editingQuestion.dbKey);
                        if (currentIndex >= nextList.length && nextList.length > 0) {
                            setCurrentIndex(nextList.length - 1);
                        }
                        return nextList;
                    });

                    setResultModal({
                        ok: true,
                        msg: `Вопрос № ${editingQuestion.num} (ID: ${editingQuestion.id}) навсегда удален из базы данных, нумерация обновлена!`,
                        afterCloseScreen: returnScreen
                    });
                } catch (err) {
                    SoundFX.warn();
                    setResultModal({
                        ok: false,
                        msg: `Не удалось удалить вопрос из базы данных. Причина: ${err.message || "Сбой сети."}`
                    });
                } finally {
                    setIsSaving(false);
                }
            };

            if (isLoading) {

                            <p className="text-white/40 text-[11px] font-bold uppercase tracking-[0.25em] mt-2">Давай узнаем друг друга еще раз</p>

                                    {CATEGORIES.map(cat => {

                                            <button 
                                                key={cat.id}

                                                className={`p-3.5 rounded-xl text-sm font-medium flex items-center justify-between transition-all duration-300 ${
                                                    isEmpty 
                                                        ? 'opacity-30 cursor-not-allowed bg-black/20 border border-white/5 text-white/30' 
                                                        : isSelected 
                                                            ? 'cat-btn-active text-white' 
                                                            : 'cat-btn-inactive text-white/40 hover:text-white/60'
                                                }`}
                                            >
                                                <div className="flex items-center gap-2 truncate">
                                                    <span className="text-lg">{cat.icon}</span> 
                                                    <span className="truncate">{cat.name}</span>
                                                </div>
                                                <span className="text-[10px] font-bold px-2 py-0.5 rounded-full bg-white/5 text-white/50">
                                                    {catActiveCount}
                                                </span>
                                            </button>
                                        );
                                    })}
                                </div>
                            </div>

                            <div className="w-full overflow-hidden">
                                <h2 className="text-[14px] md:text-base font-bold text-center uppercase tracking-widest text-white/50 mb-4">Сложность вопросов</h2>
                                <div className="flex overflow-x-auto gap-3 pb-2 pt-1 px-1 no-scrollbar snap-x touch-pan-x">
                                    {DIFFICULTIES.map(diff => {
                                        const isActive = selectedDiffs.includes(diff.id);
                                        return (
                                            <button 
                                                key={diff.id}
                                                onClick={() => toggleDiff(diff.id)}
                                                className={`flex-shrink-0 px-6 h-14 rounded-full text-xs font-bold uppercase tracking-widest transition-all duration-300 snap-center ${isActive ? diff.classBg + ' ' + diff.classText : 'bg-black/20 text-white/30 border border-white/5'}`}
                                            >
                                                {diff.name}
                                            </button>
                                        );
                                    })}
                                </div>
                                <button 
                                    onClick={() => { SoundFX.click(); setScreen('cat_list'); }} 
                                    className="w-full mt-4 rounded-2xl btn-ghost flex items-center justify-center gap-2 text-xs font-bold uppercase tracking-widest"
                                >
                                    <Icons.List /> Список вопросов {stats.archivedList.length > 0 ? `(Архив: ${stats.archivedList.length})` : ''}
                                </button>
                            </div>

                            {/* ИСПРАВЛЕННЫЙ БЛОК "ДОСТУПНО ДЛЯ НОВОЙ ИГРЫ" (линии строго по бокам, не заходят под заголовок) */}
                            <div className="flex flex-col gap-5 pt-1">
                                <div className="flex items-center gap-3 w-full">
                                    <div className="h-[1px] flex-1 bg-gradient-to-r from-transparent via-white/10 to-white/20"></div>
                                    <span className="text-[10px] font-bold uppercase tracking-[0.2em] text-white/45 px-3.5 py-1.5 rounded-full border border-white/10 bg-white/[0.03] flex-shrink-0">
                                        Доступно для новой игры
                                    </span>
                                    <div className="h-[1px] flex-1 bg-gradient-to-l from-transparent via-white/10 to-white/20"></div>
                                </div>
                                
                                <div className="grid grid-cols-[1fr_auto_1fr] items-center px-2">
                                    <div className="flex flex-col items-center gap-1.5">
                                        <span className="text-4xl font-light text-white leading-none">{activeSelectedCatsCount}</span>
                                        <span className="uppercase text-[10px] font-bold tracking-widest text-white/40">Тем(ы)</span>
                                    </div>
                                    <div className="h-12 w-[1px] bg-white/10"></div>
                                    <div className="flex flex-col items-center gap-1.5">
                                        <span className="text-4xl font-light text-white leading-none">{stats.availableActive}</span>
                                        <span className="uppercase text-[10px] font-bold tracking-widest text-white/40">Вопросов</span>
                                    </div>
                                </div>

                                <button 
                                    onClick={() => { SoundFX.click(); setShowModeModal(true); }}
                                    disabled={stats.availableTotal === 0 && db.length === 0}
                                    className="w-full h-14 text-white font-bold text-sm uppercase tracking-[0.2em] btn-romantic disabled:opacity-40 disabled:grayscale flex items-center justify-center gap-2 shadow-2xl rounded-2xl"
                                >
                                    <Icons.Play /> Начать игру
                                </button>
                            </div>
                        </div>

                        {/* МОДАЛЬНОЕ ОКНО ВЫБОРА РЕЖИМА ИГРЫ */}
                        {showModeModal && (
                            <div className="fixed inset-0 bg-black/85 backdrop-blur-xl flex items-center justify-center p-5 z-50 fade-in">
                                <div className="glass-panel p-7 w-full max-w-md flex flex-col gap-5 border border-white/15 shadow-2xl slide-up">
                                    <div className="text-center">
                                        <div className="text-4xl mb-3">🎮</div>
                                        <h3 className="text-xl font-bold text-white leading-snug">
                                            В каком режиме вы хотите начать игру?
                                        </h3>
                                        <p className="text-xs text-white/50 mt-1.5">
                                            Выберите подходящий формат для текущей сессии
                                        </p>
                                    </div>

                                    <button 
                                        disabled={stats.availableActive === 0}
                                        onClick={() => startWithMode('normal')}
                                        className="w-full p-5 rounded-2xl text-left transition-all border border-rose-500/40 bg-gradient-to-br from-rose-950/60 to-black/60 hover:border-rose-400 active:scale-[0.98] disabled:opacity-35 disabled:pointer-events-none flex flex-col gap-1.5 shadow-lg"
                                    >
                                        <div className="flex items-center justify-between">
                                            <span className="font-bold text-sm uppercase tracking-wider text-rose-300 flex items-center gap-2">
                                                ❤️ Обычный режим
                                            </span>
                                            <span className="text-[11px] font-bold px-2.5 py-1 rounded-full bg-rose-500/20 text-rose-200">
                                                {stats.availableActive} вопр.
                                            </span>
                                        </div>
                                        <p className="text-xs text-white/70 leading-relaxed">
                                            Случайный выбор первого отвечающего (Влад/Ира), без редактирования карточек. Отвеченные вопросы после игры уходят в Архив.
                                        </p>
                                        {stats.availableActive === 0 && (
                                            <span className="text-[11px] text-rose-400 font-bold mt-1">
                                                ⚠️ Все вопросы выбранных тем в Архиве — доступен только Тестовый режим!
                                            </span>
                                        )}
                                    </button>

                                    <button 
                                        onClick={() => startWithMode('test')}
                                        className="w-full p-5 rounded-2xl text-left transition-all border border-sky-500/40 bg-gradient-to-br from-sky-950/50 to-black/60 hover:border-sky-400 active:scale-[0.98] flex flex-col gap-1.5 shadow-lg"
                                    >
                                        <div className="flex items-center justify-between">
                                            <span className="font-bold text-sm uppercase tracking-wider text-sky-300 flex items-center gap-2">
                                                🛠️ Тестовый режим
                                            </span>
                                            <span className="text-[11px] font-bold px-2.5 py-1 rounded-full bg-sky-500/20 text-sky-200">
                                                {stats.availableTotal > 0 ? stats.availableTotal : db.length} вопр.
                                            </span>
                                        </div>
                                        <p className="text-xs text-white/70 leading-relaxed">
                                            Доступны все вопросы (включая Архив), включено редактирование и удаление карточек, быстрый выход в меню без экрана итогов.
                                        </p>
                                    </button>

                                    <button 
                                        onClick={() => { SoundFX.click(); setShowModeModal(false); }}
                                        className="w-full h-14 rounded-2xl btn-ghost text-xs font-bold uppercase tracking-widest mt-1"
                                    >
                                        Отмена
                                    </button>
                                </div>
                            </div>
                        )}
                    </div>
                );
            }

            // ЭКРАН ИГРЫ
            if (screen === 'game') {
                const currentQ = gameQuestions[currentIndex];
                if (!currentQ) {
                    setScreen('menu');
                    return null;
                }
                const categoryInfo = CATEGORIES.find(c => c.id === currentQ.categoryId) || CATEGORIES[0];
                const diffInfo = DIFFICULTIES.find(d => d.id === currentQ.level) || DIFFICULTIES[0];
                const cleanText = currentQ.cleanText || currentQ.text.replace(/^№\s*\d+\.\s*/, '');

                return (
                    <div className={`min-h-[100dvh] w-full flex flex-col bg-gradient-to-br ${categoryInfo.color} transition-colors duration-1000 fade-in relative z-10`}>
                        {/* Верхняя панель */}
                        <div className="flex justify-between items-center p-5 md:p-8 flex-shrink-0">
                            <div className="flex items-center gap-2.5">
                                <div className="bg-[#0b0610]/60 backdrop-blur-md border border-white/10 text-white/85 font-bold px-5 py-2.5 rounded-full text-xs tracking-widest shadow-xl">
                                    {currentIndex + 1} / {gameQuestions.length}
                                </div>
                                {gameMode === 'test' && (
                                    <button 
                                        onClick={() => openEditScreen(currentQ, 'game')}
                                        title="Редактировать вопрос"
                                        className="p-2.5 rounded-full bg-white/10 hover:bg-white/20 text-white active:scale-95 transition-all border border-white/15 shadow-xl"
                                    >
                                        <Icons.Edit />
                                    </button>
                                )}
                            </div>
                            <div className="flex items-center gap-2">
                                <button 
                                    onClick={toggleMute}
                                    title={isMuted ? "Включить звук" : "Выключить звук"}
                                    className="p-2.5 rounded-full bg-white/5 hover:bg-white/10 border border-white/10 text-white/75 transition-all"
                                >
                                    {isMuted ? <Icons.SoundOff /> : <Icons.SoundOn />}
                                </button>
                                <button 
                                    onClick={() => { SoundFX.warn(); setShowEndGameConfirm(true); }} 
                                    className="flex items-center gap-2 text-white/80 text-[11px] font-bold uppercase tracking-widest px-5 py-2.5 rounded-full bg-white/5 hover:bg-white/10 active:scale-95 transition-all border border-white/10"
                                >
                                    <Icons.Menu /> Меню
                                </button>
                            </div>
                        </div>

                        {/* Центральная часть с вопросом */}
                        <div className="flex-1 flex flex-col items-center justify-center px-5 pb-28 overflow-y-auto no-scrollbar">

                                <div className="glass-panel px-6 py-3.5 rounded-3xl mb-5 flex flex-col items-center gap-1.5 shadow-2xl">

                                        </span>
                                        {gameMode === 'test' && currentQ.archived && (

                    <div className="min-h-[100dvh] w-full flex flex-col p-5 fade-in max-w-2xl mx-auto relative z-10">
                        <div className="flex items-center gap-4 mb-8 pt-4 flex-shrink-0">
                            <button onClick={() => { SoundFX.click(); setScreen('cat_list'); }} className="p-4 bg-white/5 rounded-full hover:bg-white/10 text-white/80 transition-all">
                                <Icons.Back />
                            </button>
                            <div>
                                <h2 className="text-2xl font-bold text-white tracking-wide flex items-center gap-2">
                                    {cat.icon} {cat.name}
                                </h2>
                                <div className="text-[11px] font-bold uppercase tracking-widest text-white/40 mt-1">
                                    Всего: {qs.length} вопросов
                                </div>
                            </div>
                        </div>
                        <div className="flex-1 overflow-y-auto no-scrollbar flex flex-col gap-10 pb-28">
                            {DIFFICULTIES.map(diff => {
                                const diffQs = qs.filter(q => q.level === diff.id);
                                if (diffQs.length === 0) return null;
                                const shownQs = diffQs.slice(0, visibleLimit);

                                return (
                                    <div key={diff.id}>
                                        <h3 className={`text-[22px] md:text-2xl font-bold uppercase tracking-widest mb-5 pl-2 ${diff.classText}`}>
                                            {diff.name} ({diffQs.length})
                                        </h3>
                                        <div className="flex flex-col gap-3">
                                            {shownQs.map(q => (
                                                <div key={q.dbKey} className="clean-card p-5 flex items-start justify-between gap-4">
                                                    <div className="text-[15px] md:text-base font-normal text-white/90 leading-snug">
                                                        <span className="text-white/40 font-bold mr-2">№ {q.num}.</span>
                                                        {q.cleanText}
                                                        {q.archived && (
                                                            <span className="ml-2 inline-block text-[10px] font-bold uppercase px-2 py-0.5 rounded-md bg-amber-500/20 text-amber-300">
                                                                Архив
                                                            </span>
                                                        )}
                                                    </div>
                                                    <button 
                                                        onClick={() => openEditScreen(q, 'q_list')}
                                                        title="Редактировать вопрос"
                                                        className="flex-shrink-0 p-3 rounded-xl bg-white/5 hover:bg-white/15 text-white/60 hover:text-white active:scale-90 transition-all border border-white/10"
                                                    >
                                                        <Icons.Edit />
                                                    </button>
                                                </div>
                                            ))}
                                            {diffQs.length > visibleLimit && (
                                                <button 
                                                    onClick={() => { SoundFX.click(); setVisibleLimit(prev => prev + 80); }}
                                                    className="w-full h-12 rounded-2xl bg-white/5 hover:bg-white/10 text-xs font-bold uppercase tracking-widest text-white/70"
                                                >
                                                    Показать еще ({diffQs.length - visibleLimit})
                                                </button>
                                            )}
                                        </div>
                                    </div>
                                );
                            })}
                        </div>
                        <div className="fixed bottom-6 left-5 right-5 max-w-2xl mx-auto pointer-events-none">
                            <button 
                                onClick={() => { SoundFX.click(); setAddStatus(null); setAddForm({ text: '', cat: viewCategory || 'family', diff: 'Простые' }); setScreen('add_q'); }} 
                                className="w-full h-14 rounded-2xl font-bold text-sm uppercase tracking-widest btn-romantic flex items-center justify-center gap-2 shadow-2xl pointer-events-auto"
                            >
                                <Icons.Plus /> Добавить вопрос
                            </button>
                        </div>
                    </div>
                );
            }

            // ЭКРАН РЕДАКТИРОВАНИЯ И УДАЛЕНИЯ ВОПРОСА
            if (screen === 'edit_q' && editingQuestion) {
                const origText = (editingQuestion.cleanText || editingQuestion.text.replace(/^№\s*\d+\.\s*/, '')).trim();
                const hasChanges = 
                    editForm.text.trim() !== "" && (
                        editForm.text.trim() !== origText ||
                        editForm.cat !== editingQuestion.categoryId ||
                        editForm.diff !== editingQuestion.level
                    );

                return (
                    <div className="min-h-[100dvh] w-full flex flex-col p-5 fade-in max-w-lg mx-auto relative z-10">
                        <div className="flex items-center justify-between mb-6 pt-4">
                            <div className="flex items-center gap-4">
                                <button onClick={() => { SoundFX.click(); setScreen(returnScreen); }} className="p-4 bg-white/5 rounded-full hover:bg-white/10 text-white/80 transition-all">
                                    <Icons.Back />
                                </button>
                                <div>
                                    <h2 className="text-xl font-bold text-white tracking-wide">Редактирование</h2>
                                    <p className="text-[11px] font-bold uppercase tracking-widest text-white/40 mt-0.5">
                                        Вопрос № {editingQuestion.num} • ID: {editingQuestion.id}
                                    </p>
                                </div>
                            </div>
                        </div>

                        <div className="flex-1 flex flex-col gap-6 slide-up">
                            <div>
                                <label className="block text-[11px] font-bold uppercase tracking-widest text-white/50 mb-3 ml-2">Текст вопроса</label>
                                <textarea 
                                    value={editForm.text}
                                    onChange={e => setEditForm({...editForm, text: e.target.value})}
                                    className="w-full glass-panel p-5 text-base text-white/95 placeholder-white/20 outline-none resize-none h-36 focus:border-[#e11d48]/50 transition-colors shadow-inner"
                                    placeholder="Введите текст вопроса..."
                                ></textarea>
                            </div>
                            
                            <div>
                                <label className="block text-[11px] font-bold uppercase tracking-widest text-white/50 mb-3 ml-2">Тема вопроса</label>
                                <select 
                                    value={editForm.cat}
                                    onChange={e => { SoundFX.toggle(true); setEditForm({...editForm, cat: e.target.value}); }}
                                    className="w-full glass-panel h-14 px-5 text-base text-white/90 outline-none appearance-none font-medium bg-transparent"
                                >
                                    {CATEGORIES.map(c => <option key={c.id} value={c.id} className="bg-[#160a1c] text-white">{c.icon} {c.name}</option>)}
                                </select>
                            </div>

                            <div>
                                <label className="block text-[11px] font-bold uppercase tracking-widest text-white/50 mb-3 ml-2">Сложность</label>
                                <select 
                                    value={editForm.diff}
                                    onChange={e => { SoundFX.toggle(true); setEditForm({...editForm, diff: e.target.value}); }}
                                    className="w-full glass-panel h-14 px-5 text-base text-white/90 outline-none appearance-none font-medium bg-transparent"
                                >
                                    {DIFFICULTIES.map(d => <option key={d.id} value={d.id} className="bg-[#160a1c] text-white">{d.name}</option>)}
                                </select>
                            </div>

                            <button 
                                type="button"
                                onClick={() => { SoundFX.warn(); setConfirmModal({ action: 'delete', title: 'Точно ли вы хотите удалить этот вопрос из базы данных?' }); }}
                                className="w-full h-14 rounded-2xl border border-rose-500/40 bg-rose-950/20 hover:bg-rose-900/30 text-rose-400 text-xs font-bold uppercase tracking-widest flex items-center justify-center gap-2 transition-all active:scale-95"
                            >
                                <Icons.Trash /> Удалить вопрос
                            </button>

                            <div className="mt-auto pb-4 pt-2 grid grid-cols-2 gap-4">
                                <button 
                                    type="button" 
                                    onClick={() => { SoundFX.click(); setScreen(returnScreen); }} 
                                    className="w-full h-14 rounded-2xl btn-ghost text-xs font-bold uppercase tracking-widest"
                                >
                                    Отменить
                                </button>
                                <button 
                                    type="button"
                                    disabled={!hasChanges || isSaving}
                                    onClick={() => { SoundFX.click(); setConfirmModal({ action: 'save', title: 'Точно ли вы хотите изменить этот вопрос в базе данных?' }); }}
                                    className="w-full h-14 rounded-2xl btn-romantic text-white text-xs font-bold uppercase tracking-widest flex items-center justify-center gap-2 shadow-xl disabled:opacity-25 disabled:pointer-events-none"
                                >
                                    <Icons.Check /> Сохранить
                                </button>
                            </div>
                        </div>

                        {confirmModal && (
                            <div className="fixed inset-0 bg-black/80 backdrop-blur-md flex items-center justify-center p-5 z-50 fade-in">
                                <div className="glass-panel p-7 w-full max-w-sm text-center flex flex-col items-center gap-6 border border-white/10">
                                    <div className="text-4xl">{confirmModal.action === 'delete' ? '🗑️' : '✏️'}</div>
                                    <h3 className="text-base font-bold text-white leading-snug">
                                        {confirmModal.title}
                                    </h3>
                                    <div className="grid grid-cols-2 gap-3 w-full">
                                        <button 
                                            onClick={() => { SoundFX.click(); setConfirmModal(null); }}
                                            className="w-full h-14 rounded-2xl btn-ghost text-xs font-bold uppercase tracking-widest"
                                        >
                                            Отмена
                                        </button>
                                        <button 
                                            onClick={() => confirmModal.action === 'delete' ? executeDeleteQuestion() : executeSaveEdit()}
                                            className="w-full h-14 rounded-2xl btn-romantic text-white text-xs font-bold uppercase tracking-widest"
                                        >
                                            Да
                                        </button>
                                    </div>
                                </div>
                            </div>
                        )}

                        {resultModal && (
                            <div className="fixed inset-0 bg-black/85 backdrop-blur-md flex items-center justify-center p-5 z-50 fade-in">
                                <div className="glass-panel p-8 w-full max-w-sm text-center flex flex-col items-center gap-5 border border-white/10">
                                    <div className="text-5xl">{resultModal.ok ? '✅' : '⚠️'}</div>
                                    <h3 className="text-lg font-bold text-white">
                                        {resultModal.ok ? 'Выполнено успешно' : 'Ошибка базы данных'}
                                    </h3>
                                    <p className="text-xs text-white/70 leading-relaxed">
                                        {resultModal.msg}
                                    </p>
                                    <button 
                                        onClick={() => {
                                            SoundFX.click();
                                            const target = resultModal.afterCloseScreen;
                                            setResultModal(null);
                                            if (target) setScreen(target);
                                        }}
                                        className="w-full h-14 rounded-2xl btn-romantic text-white text-xs font-bold uppercase tracking-widest mt-2"
                                    >
                                        Понятно
                                    </button>
                                </div>
                            </div>
                        )}
                    </div>
                );
            }

            // ФОРМА ДОБАВЛЕНИЯ НОВОГО ВОПРОСА + AI ГЕНЕРАТОР
            if (screen === 'add_q') {
                return (
                    <div className="min-h-[100dvh] w-full flex flex-col p-5 fade-in max-w-lg mx-auto relative z-10">
                        <div className="flex items-center gap-4 mb-6 pt-4">
                            <button onClick={() => { SoundFX.click(); setScreen(viewCategory ? 'q_list' : 'cat_list'); }} className="p-4 bg-white/5 rounded-full hover:bg-white/10 text-white/80 transition-all">
                                <Icons.Back />
                            </button>
                            <h2 className="text-2xl font-bold text-white tracking-wide">Новый вопрос</h2>
                        </div>

                        {addStatus ? (
                            <div className="flex-1 flex flex-col items-center justify-center slide-up">
                                <div className="glass-panel p-8 w-full flex flex-col items-center text-center shadow-2xl">
                                    {addStatus.ok ? (
                                        <svg className="checkmark mb-6" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 52 52">
                                            <circle className="checkmark-circle" cx="26" cy="26" r="25" fill="none"/>
                                            <path className="checkmark-check" fill="none" d="M14.1 27.2l7.1 7.2 16.7-16.8"/>
                                        </svg>
                                    ) : (
                                        <div className="text-5xl mb-6">⚠️</div>
                                    )}
                                    <h3 className="text-xl font-bold text-white mb-2 tracking-wide">
                                        {addStatus.ok ? 'Успешно добавлен!' : 'Ошибка сохранения'}
                                    </h3>
                                    <p className="text-xs text-white/70 mb-8 leading-relaxed">
                                        {addStatus.msg}
                                    </p>
                                    <div className="grid grid-cols-2 gap-3 w-full">
                                        <button 
                                            onClick={() => { SoundFX.click(); setScreen(viewCategory ? 'q_list' : 'cat_list'); }} 
                                            className="btn-ghost h-14 w-full rounded-2xl text-xs font-bold uppercase tracking-widest"
                                        >
                                            К списку
                                        </button>
                                        <button 
                                            onClick={() => { SoundFX.click(); setAddStatus(null); setAddForm({ text: '', cat: addForm.cat, diff: addForm.diff }); }} 
                                            className="btn-romantic h-14 w-full rounded-2xl text-xs font-bold uppercase tracking-widest text-white"
                                        >
                                            Еще один
                                        </button>
                                    </div>
                                </div>
                            </div>
                        ) : (
                            <form onSubmit={handleAddQuestion} className="flex-1 flex flex-col gap-5 slide-up">
                                <div>
                                    <label className="block text-[11px] font-bold uppercase tracking-widest text-white/50 mb-2.5 ml-2">Текст вопроса</label>
                                    <textarea 
                                        required
                                        value={addForm.text}
                                        onChange={e => setAddForm({...addForm, text: e.target.value})}
                                        className="w-full glass-panel p-5 text-base text-white/95 placeholder-white/25 outline-none resize-none h-36 focus:border-[#e11d48]/50 transition-colors shadow-inner"
                                        placeholder="Напишите вопрос вручную или нажмите «Сгенерировать вопрос» ниже..."
                                    ></textarea>
                                </div>
                                
                                <div>
                                    <label className="block text-[11px] font-bold uppercase tracking-widest text-white/50 mb-2.5 ml-2">Тема вопроса</label>
                                    <select 
                                        value={addForm.cat}
                                        onChange={e => { SoundFX.toggle(true); setAddForm({...addForm, cat: e.target.value}); }}
                                        className="w-full glass-panel h-14 px-5 text-base text-white/90 outline-none appearance-none font-medium bg-transparent"
                                    >
                                        {CATEGORIES.map(c => <option key={c.id} value={c.id} className="bg-[#160a1c] text-white">{c.icon} {c.name}</option>)}
                                    </select>
                                </div>

                                <div>
                                    <label className="block text-[11px] font-bold uppercase tracking-widest text-white/50 mb-2.5 ml-2">Сложность</label>
                                    <select 
                                        value={addForm.diff}
                                        onChange={e => { SoundFX.toggle(true); setAddForm({...addForm, diff: e.target.value}); }}
                                        className="w-full glass-panel h-14 px-5 text-base text-white/90 outline-none appearance-none font-medium bg-transparent"
                                    >
                                        {DIFFICULTIES.map(d => <option key={d.id} value={d.id} className="bg-[#160a1c] text-white">{d.name}</option>)}
                                    </select>
                                </div>

                                {/* AI-КНОПКА ГЕНЕРАЦИИ НОВОГО УНИКАЛЬНОГО ВОПРОСА */}
                                <button 
                                    type="button"
                                    disabled={isGeneratingQuestion}
                                    onClick={handleGenerateQuestionAI}
                                    className="w-full rounded-2xl btn-ai-magic text-white text-xs font-bold uppercase tracking-widest flex items-center justify-center gap-2.5 shadow-xl disabled:opacity-50"
                                >
                                    <Icons.Sparkles />
                                    {isGeneratingQuestion ? "ИИ придумывает уникальный вопрос..." : "Сгенерировать вопрос"}
                                </button>

                                <div className="mt-auto pb-6 pt-4 grid grid-cols-2 gap-4">
                                    <button type="button" onClick={() => { SoundFX.click(); setScreen(viewCategory ? 'q_list' : 'cat_list'); }} className="w-full h-14 rounded-2xl btn-ghost text-xs font-bold uppercase tracking-widest">
                                        Отмена
                                    </button>
                                    <button type="submit" disabled={isSaving || !addForm.text.trim()} className="w-full h-14 rounded-2xl btn-romantic text-white text-xs font-bold uppercase tracking-widest flex items-center justify-center gap-2 shadow-xl disabled:opacity-30">
                                        <Icons.Plus /> {isSaving ? "Сохранение..." : "Сохранить"}
                                    </button>
                                </div>
                            </form>
                        )}
                    </div>
                );
            }
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
