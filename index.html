<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Влад & Ира ❤️</title>
    <!-- React & Tailwind -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Подключение Google Sans -->
    <style>
        @import url('https://fonts.cdnfonts.com/css/google-sans');
        
        body { 
            font-family: 'Product Sans', 'Google Sans', sans-serif; 
            overflow-x: hidden;
            background-color: #0b090f;
            color: white; 
            -webkit-tap-highlight-color: transparent;
            touch-action: pan-y;
        }

        /* Новый переливающийся темный фон (анимированный градиент) */
        .animated-gradient-bg {
            background: linear-gradient(-45deg, #0d0614, #1a0b1c, #090e17, #1c0914, #050505);
            background-size: 400% 400%;
            animation: gradientShift 20s ease infinite;
            background-attachment: fixed;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Стекломорфизм (более темный и глубокий) */
        .glass-panel { 
            background: rgba(12, 8, 15, 0.65); 
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.04); 
            border-radius: 1.75rem;
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.6);
        }

        /* Кнопки */
        .btn-romantic {
            background: linear-gradient(135deg, #be123c 0%, #881337 100%);
            box-shadow: 0 4px 20px rgba(159, 18, 57, 0.3);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .btn-romantic:active { transform: scale(0.95); box-shadow: 0 2px 10px rgba(159, 18, 57, 0.4); }

        .btn-ghost {
            background: transparent;
            border: 1px solid rgba(255,255,255,0.1);
            color: rgba(255,255,255,0.7);
            transition: all 0.3s ease;
        }
        .btn-ghost:active { transform: scale(0.95); background: rgba(255,255,255,0.05); }
        
        .cat-btn-active {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 200, 220, 0.2);
            box-shadow: 0 0 20px rgba(255, 200, 220, 0.05);
            transform: scale(0.98);
        }
        .cat-btn-inactive {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.02);
        }

        /* Анимации */
        .fade-in { animation: fadeIn 0.4s ease-out forwards; }
        .slide-up { animation: slideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .heart-pulse { animation: heartPulse 1.8s infinite ease-in-out; }
        
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes heartPulse {
            0%, 100% { transform: scale(1); }
            15% { transform: scale(1.15); }
            30% { transform: scale(1); }
            45% { transform: scale(1.1); }
        }

        /* Анимация галочки */
        .checkmark-circle { stroke-dasharray: 166; stroke-dashoffset: 166; stroke-width: 2; stroke-miterlimit: 10; stroke: #10b981; fill: none; animation: stroke 0.6s cubic-bezier(0.65, 0, 0.45, 1) forwards; }
        .checkmark { width: 56px; height: 56px; border-radius: 50%; display: block; stroke-width: 2; stroke: #fff; stroke-miterlimit: 10; margin: 10% auto; box-shadow: inset 0px 0px 0px #10b981; animation: fill .4s ease-in-out .4s forwards, scale .3s ease-in-out .9s both; }
        .checkmark-check { transform-origin: 50% 50%; stroke-dasharray: 48; stroke-dashoffset: 48; animation: stroke 0.3s cubic-bezier(0.65, 0, 0.45, 1) 0.8s forwards; }
        @keyframes stroke { 100% { stroke-dashoffset: 0; } }
        @keyframes scale { 0%, 100% { transform: none; } 50% { transform: scale3d(1.1, 1.1, 1); } }
        @keyframes fill { 100% { box-shadow: inset 0px 0px 0px 30px #10b981; } }

        /* Эффект печати AI */
        .ai-cursor::after { content: '|'; animation: blink 1s step-end infinite; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

        /* Цвета сложностей */
        .diff-easy { color: #34d399; }
        .diff-med  { color: #fbbf24; }
        .diff-hard { color: #fb7185; }
        .bg-diff-easy { background: rgba(52, 211, 153, 0.1); border: 1px solid rgba(52, 211, 153, 0.2); }
        .bg-diff-med  { background: rgba(251, 191, 36, 0.1); border: 1px solid rgba(251, 191, 36, 0.2); }
        .bg-diff-hard { background: rgba(251, 113, 133, 0.1); border: 1px solid rgba(251, 113, 133, 0.2); }

        /* Кастомный скролл */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="animated-gradient-bg">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const GIST_URL = "https://gist.githubusercontent.com/1s0meb0dy1/9d890bde848f3a2c5464c7c1729fe17a/raw/questions.json";

        const CATEGORIES = [
            { id: "family", name: "Семья", icon: "👨‍👩‍👧‍👦", color: "from-blue-950/20 to-transparent" },
            { id: "intimacy", name: "Интим", icon: "🔞", color: "from-rose-950/20 to-transparent" },
            { id: "future", name: "Будущее", icon: "🎯", color: "from-teal-950/20 to-transparent" },
            { id: "secrets", name: "Секреты", icon: "🤫", color: "from-fuchsia-950/20 to-transparent" },
            { id: "romance", name: "Романтика", icon: "❤️", color: "from-pink-950/20 to-transparent" },
            { id: "past", name: "Прошлое", icon: "⏳", color: "from-amber-950/20 to-transparent" },
            { id: "values", name: "Ценности", icon: "⚖️", color: "from-indigo-950/20 to-transparent" },
            { id: "fears", name: "Страхи", icon: "👻", color: "from-stone-900/30 to-transparent" },
            { id: "money", name: "Деньги", icon: "💰", color: "from-emerald-950/20 to-transparent" },
            { id: "life", name: "Быт", icon: "🏠", color: "from-orange-950/20 to-transparent" }
        ];

        const DIFFICULTIES = [
            { id: "Простые", name: "Легкие", classText: "diff-easy", classBg: "bg-diff-easy" },
            { id: "Средние", name: "Средние", classText: "diff-med", classBg: "bg-diff-med" },
            { id: "Глубокие", name: "Глубокие", classText: "diff-hard", classBg: "bg-diff-hard" }
        ];

        const generateSmartSituation = (qText, catId) => {
            const intros = {
                family: ["Вы собрались за ужином после долгого и напряженного дня", "Представь, мы организовываем большой семейный праздник, всё идет наперекосяк"],
                intimacy: ["В момент глубокой ночи, когда мы остались абсолютно одни и никуда не спешим", "Представь, что мы сняли номер в уединенном отеле, свет приглушен"],
                future: ["Мы стоим на пороге принятия решения, которое изменит наши жизни навсегда", "Через 5 лет мы оборачиваемся назад и понимаем, что именно сегодня тот самый день"],
                secrets: ["Мы играем в игру 'правда или действие', атмосфера становится серьезной", "Представь, что я случайно нашел(ла) твой старый личный дневник"],
                romance: ["Во время нашей идеальной прогулки, когда вокруг ни души", "Представь, что мы оказались под сильным дождем без зонта и спрятались под навесом"],
                past: ["Мы случайно наткнулись на коробку с твоими старыми, детскими вещами", "Представь, что мы встретили человека из твоего прошлого, о котором ты давно забыл(а)"],
                values: ["Мы оказались в центре серьезного спора в кругу друзей, мнения разделились", "Представь ситуацию, где тебе предлагают огромную выгоду в обмен на предательство идеалов"],
                fears: ["Происходит именно то, чего ты всегда подсознательно избегал(а)", "Мы застряли вдали от цивилизации, без связи и без четкого плана действий"],
                money: ["Нам на счет внезапно падает сумма, о которой мы могли только мечтать", "Представь, что мы потеряли почти все сбережения из-за системного сбоя"],
                life: ["Мы делаем тяжелый ремонт в квартире, кругом хаос, пыль и усталость", "В доме отключили свет и воду на двое суток, наши телефоны почти разряжены"]
            };
            const catIntros = intros[catId] || ["Происходит неожиданное событие, которое застает нас врасплох"];
            const selectedIntro = catIntros[Math.floor(Math.random() * catIntros.length)];
            const cleanQuestion = qText.replace(/^№\s*\d+\.\s*/, '');
            return `${selectedIntro}. И в этой атмосфере возникает мысль: «${cleanQuestion}».\n\nЧто ты почувствуешь в первую секунду? Какие будут твои первые реальные действия? Как мы справимся с этим вместе?`;
        };

        const AnimatedCounter = ({ target }) => {
            const [count, setCount] = useState(0);
            useEffect(() => {
                if (!target || target === 0) {
                    setCount(0);
                    return;
                }
                let current = 0;
                const stepTime = Math.abs(Math.floor(1500 / target)); // Анимация длится ~1.5 сек
                const timer = setInterval(() => {
                    current += 1;
                    setCount(current);
                    if (current >= target) clearInterval(timer);
                }, stepTime);
                return () => clearInterval(timer);
            }, [target]);
            return <span>{count}</span>;
        };

        const Icons = {
            Play: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z" /><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>,
            Menu: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 6h16M4 12h16M4 18h16" /></svg>,
            Back: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M10 19l-7-7m0 0l7-7m-7 7h18" /></svg>,
            Next: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M14 5l7 7m0 0l-7 7m7-7H3" /></svg>,
            Sparkles: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z" /></svg>,
            List: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 6h16M4 10h16M4 14h16M4 18h16" /></svg>,
            Plus: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 4v16m8-8H4" /></svg>,
            Check: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M5 13l4 4L19 7" /></svg>
        };

        function App() {
            const [db, setDb] = useState([]);
            const [isLoading, setIsLoading] = useState(true);
            const [screen, setScreen] = useState('menu'); 
            const [selectedCats, setSelectedCats] = useState(CATEGORIES.map(c => c.id));
            const [selectedDiffs, setSelectedDiffs] = useState(DIFFICULTIES.map(d => d.id));
            
            const [gameQuestions, setGameQuestions] = useState([]);
            const [currentIndex, setCurrentIndex] = useState(0);
            const [answeredCount, setAnsweredCount] = useState(0); // Фикс для Итогов
            
            const [showAiPopup, setShowAiPopup] = useState(false);
            const [aiText, setAiText] = useState("");
            const [isAiTyping, setIsAiTyping] = useState(false);

            const [viewCategory, setViewCategory] = useState(null);
            
            const [addForm, setAddForm] = useState({ text: '', cat: 'family', diff: 'Простые' });
            const [addSuccess, setAddSuccess] = useState(null);

            useEffect(() => {
                fetch(GIST_URL + "?t=" + new Date().getTime())
                    .then(res => res.json())
                    .then(data => {
                        const numberedData = data.map((q, index) => {
                            const hasNumber = q.text.startsWith("№");
                            return { ...q, text: hasNumber ? q.text : `№ ${index + 1}. ${q.text}` };
                        });
                        setDb(numberedData);
                        setIsLoading(false); 
                    })
                    .catch(err => {
                        console.error(err);
                        setDb([{ text: "Ошибка загрузки вопросов. Проверьте ссылку.", categoryId: "family", level: "Простые" }]);
                        setIsLoading(false);
                    });
            }, []);

            const toggleCategory = (catId) => setSelectedCats(prev => prev.includes(catId) ? prev.filter(id => id !== catId) : [...prev, catId]);
            const toggleDiff = (diffId) => setSelectedDiffs(prev => prev.includes(diffId) ? prev.filter(id => id !== diffId) : [...prev, diffId]);

            const startGame = () => {
                let filtered = db.filter(q => selectedCats.includes(q.categoryId) && selectedDiffs.includes(q.level));
                if (filtered.length === 0) return alert("По этим параметрам нет вопросов. Выберите другие! ❤️");
                for (let i = filtered.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [filtered[i], filtered[j]] = [filtered[j], filtered[i]];
                }
                setGameQuestions(filtered);
                setCurrentIndex(0);
                setAnsweredCount(0);
                setScreen('game');
            };

            const generateAI = () => {
                setShowAiPopup(true);
                setAiText("Синтезирую ситуацию...");
                setIsAiTyping(true);
                
                setTimeout(() => {
                    const q = gameQuestions[currentIndex];
                    const fullText = generateSmartSituation(q.text, q.categoryId);
                    setAiText("");
                    
                    let i = 0;
                    const typingInterval = setInterval(() => {
                        setAiText(fullText.substring(0, i + 1));
                        i++;
                        if (i >= fullText.length) {
                            clearInterval(typingInterval);
                            setIsAiTyping(false);
                        }
                    }, 25);
                }, 800);
            };

            const handleAddQuestion = (e) => {
                e.preventDefault();
                if (!addForm.text.trim()) return;
                
                const newId = 'v_local_' + Math.random().toString(36).substr(2, 6);
                const newQ = {
                    id: newId,
                    categoryId: addForm.cat,
                    level: addForm.diff,
                    text: `№ ${db.length + 1}. ${addForm.text.trim()}`
                };
                
                setDb([...db, newQ]);
                setAddSuccess(newId);
            };

            const goToSummary = (fromFinishButton = false) => {
                // Если нажали завершить на последнем вопросе, засчитываем его тоже
                if (fromFinishButton) {
                    setAnsweredCount(currentIndex + 1);
                } else {
                    // Если вышли в меню посередине игры
                    setAnsweredCount(currentIndex);
                }
                setScreen('summary');
            };

            if (isLoading) {
                return (
                    <div className="min-h-[100dvh] w-full flex flex-col items-center justify-center fade-in">
                        <div className="text-6xl mb-6 heart-pulse text-[#be123c] drop-shadow-[0_0_30px_rgba(190,18,60,0.7)]">🤍</div>
                        <p className="text-white/40 font-bold uppercase text-[10px] tracking-[0.4em]">Синхронизация</p>
                    </div>
                );
            }

            // МЕНЮ
            if (screen === 'menu') {
                const availableCount = db.filter(q => selectedCats.includes(q.categoryId) && selectedDiffs.includes(q.level)).length;
                return (
                    <div className="min-h-[100dvh] w-full flex flex-col items-center justify-center p-4 md:p-6 slide-up">
                        <div className="text-center mb-6 flex-shrink-0">
                            <h1 className="text-5xl font-bold mb-3 flex items-center justify-center gap-3 text-white tracking-tight">
                                <span>Влад</span>
                                <span className="text-3xl text-[#be123c] heart-pulse drop-shadow-[0_0_20px_rgba(190,18,60,0.6)]">❤️</span>
                                <span>Ира</span>
                            </h1>
                            <p className="text-white/40 text-[10px] font-bold uppercase tracking-[0.25em]">Давай узнаем друг друга еще раз</p>
                        </div>

                        <div className="w-full max-w-md glass-panel p-6 flex flex-col gap-7">
                            
                            {/* Выбор тем (Сетка) */}
                            <div>
                                <h2 className="text-xs md:text-sm font-bold text-center uppercase tracking-widest text-white/50 mb-4">Темы вопросов</h2>
                                <div className="grid grid-cols-2 gap-3">
                                    {CATEGORIES.map(cat => (
                                        <button 
                                            key={cat.id}
                                            onClick={() => toggleCategory(cat.id)}
                                            className={`p-3.5 rounded-xl text-sm font-medium flex items-center justify-center gap-2 transition-all duration-300 ${selectedCats.includes(cat.id) ? 'cat-btn-active text-white' : 'cat-btn-inactive text-white/40 hover:text-white/60'}`}
                                        >
                                            <span className="text-lg">{cat.icon}</span> 
                                            <span className="truncate">{cat.name}</span>
                                        </button>
                                    ))}
                                </div>
                            </div>

                            {/* Выбор сложности (Скролл в 1 линию) */}
                            <div className="w-full overflow-hidden">
                                <h2 className="text-xs md:text-sm font-bold text-center uppercase tracking-widest text-white/50 mb-4">Сложность вопросов</h2>
                                <div className="flex overflow-x-auto gap-3 pb-2 pt-1 px-1 no-scrollbar snap-x touch-pan-x">
                                    {DIFFICULTIES.map(diff => {
                                        const isActive = selectedDiffs.includes(diff.id);
                                        return (
                                            <button 
                                                key={diff.id}
                                                onClick={() => toggleDiff(diff.id)}
                                                className={`flex-shrink-0 px-5 py-3 rounded-full text-[11px] font-bold uppercase tracking-widest transition-all duration-300 snap-center ${isActive ? diff.classBg + ' ' + diff.classText : 'bg-black/20 text-white/30 border border-white/5'}`}
                                            >
                                                {diff.name}
                                            </button>
                                        );
                                    })}
                                </div>
                                <button 
                                    onClick={() => setScreen('cat_list')} 
                                    className="w-full mt-4 py-3.5 rounded-xl btn-ghost flex items-center justify-center gap-2 text-[10px] font-bold uppercase tracking-widest"
                                >
                                    <Icons.List /> Список вопросов
                                </button>
                            </div>

                            {/* Статистика и Кнопка */}
                            <div className="flex flex-col gap-6 pt-5 border-t border-white/5">
                                <div className="text-center w-full mb-[-15px]">
                                    <span className="text-[10px] font-bold uppercase tracking-[0.2em] text-white/40 bg-[#0c080f] px-4 py-1 rounded-full border border-white/5">Вы выбрали</span>
                                </div>
                                {/* Линия по центру */}
                                <div className="grid grid-cols-[1fr_auto_1fr] items-center px-2">
                                    <div className="flex flex-col items-center gap-1.5">
                                        <span className="text-4xl font-light text-white leading-none">{selectedCats.length}</span>
                                        <span className="uppercase text-[9px] font-bold tracking-widest text-white/40">Тем(ы)</span>
                                    </div>
                                    <div className="h-12 w-px bg-white/10"></div>
                                    <div className="flex flex-col items-center gap-1.5">
                                        <span className="text-4xl font-light text-white leading-none">{availableCount}</span>
                                        <span className="uppercase text-[9px] font-bold tracking-widest text-white/40">Вопросов</span>
                                    </div>
                                </div>
                                <button 
                                    onClick={startGame}
                                    disabled={availableCount === 0}
                                    className="w-full py-4.5 rounded-xl text-white font-bold text-sm uppercase tracking-[0.2em] btn-romantic disabled:opacity-50 disabled:grayscale flex items-center justify-center gap-2 mt-2"
                                >
                                    <Icons.Play /> Начать игру
                                </button>
                            </div>
                        </div>
                    </div>
                );
            }

            // ИГРА
            if (screen === 'game') {
                const currentQ = gameQuestions[currentIndex];
                const categoryInfo = CATEGORIES.find(c => c.id === currentQ.categoryId) || CATEGORIES[0];
                const diffInfo = DIFFICULTIES.find(d => d.id === currentQ.level) || DIFFICULTIES[0];
                const textParts = currentQ.text.match(/(№\s*\d+\.\s*)(.*)/);
                const cleanText = textParts ? textParts[2] : currentQ.text;

                return (
                    <div className={`min-h-[100dvh] w-full flex flex-col bg-gradient-to-br ${categoryInfo.color} transition-colors duration-1000 fade-in`}>
                        <div className="flex justify-between items-center p-5 md:p-8 flex-shrink-0">
                            <div className="bg-[#030102]/60 backdrop-blur-md border border-white/5 text-white/80 font-bold px-5 py-2 rounded-full text-[11px] tracking-widest shadow-xl">
                                {currentIndex + 1} / {gameQuestions.length}
                            </div>
                            <button onClick={() => goToSummary(false)} className="flex items-center gap-2 text-white/70 text-[10px] font-bold uppercase tracking-widest px-4 py-2 rounded-full bg-white/5 hover:bg-white/10 active:scale-95 transition-all border border-white/5">
                                <Icons.Menu /> Меню
                            </button>
                        </div>

                        <div className="flex-1 flex flex-col items-center justify-center p-5 overflow-y-auto no-scrollbar">
                            <div className="w-full max-w-lg flex flex-col items-center slide-up" key={currentIndex}>
                                <div className="glass-panel px-6 py-3.5 rounded-[1.25rem] mb-10 flex flex-col items-center gap-2 shadow-2xl">
                                    <span className="text-white/40 text-[9px] uppercase tracking-[0.25em] font-bold">Вопрос {currentIndex + 1}</span>
                                    <div className="flex items-center gap-3 text-[11px] font-bold uppercase tracking-widest text-white/90">
                                        <span className="text-base">{categoryInfo.icon}</span>
                                        <span>{categoryInfo.name}</span>
                                        <span className="w-1 h-1 rounded-full bg-white/20"></span>
                                        <span className={diffInfo.classText}>{diffInfo.name}</span>
                                    </div>
                                </div>
                                <h2 className="text-2xl md:text-3xl font-medium text-center leading-relaxed mb-12 text-white/95 px-2">
                                    {cleanText}
                                </h2>
                                <button 
                                    onClick={generateAI}
                                    className="bg-white/5 hover:bg-white/10 border border-white/10 px-6 py-3.5 rounded-full text-white/80 text-[11px] font-bold uppercase tracking-widest active:scale-95 transition-all flex items-center gap-2 shadow-xl"
                                >
                                    <Icons.Sparkles /> Сгенерировать ситуацию
                                </button>
                            </div>
                        </div>

                        <div className="p-5 md:p-8 flex gap-4 flex-shrink-0">
                            <button 
                                onClick={() => setCurrentIndex(prev => prev - 1)}
                                disabled={currentIndex === 0}
                                className="flex-1 py-4.5 rounded-xl font-bold text-white/70 glass-panel disabled:opacity-20 active:scale-95 transition-all uppercase tracking-widest text-[10px] flex items-center justify-center gap-2"
                            >
                                <Icons.Back /> Назад
                            </button>
                            <button 
                                onClick={() => {
                                    if (currentIndex < gameQuestions.length - 1) {
                                        setCurrentIndex(prev => prev + 1);
                                    } else {
                                        goToSummary(true); // Прошли последний вопрос
                                    }
                                }}
                                className="flex-[2] py-4.5 rounded-xl font-bold text-white btn-romantic active:scale-95 uppercase tracking-widest text-[11px] flex items-center justify-center gap-2"
                            >
                                {currentIndex === gameQuestions.length - 1 ? "Итоги" : "Далее"} <Icons.Next />
                            </button>
                        </div>

                        {showAiPopup && (
                            <div className="fixed inset-0 bg-[#030102]/90 backdrop-blur-xl flex items-center justify-center p-5 z-50 fade-in">
                                <div className="glass-panel p-8 w-full max-w-sm rounded-[2rem] border-white/10 shadow-2xl">
                                    <h3 className="font-bold text-xs uppercase tracking-widest text-[#be123c] flex items-center gap-2 mb-6">
                                        <Icons.Sparkles /> AI Ситуация
                                    </h3>
                                    <div className={`text-white/90 text-sm bg-black/60 p-6 rounded-2xl border border-white/5 font-light leading-relaxed mb-8 min-h-[160px] shadow-inner ${isAiTyping ? 'ai-cursor' : ''}`}>
                                        {aiText}
                                    </div>
                                    <button 
                                        onClick={() => setShowAiPopup(false)}
                                        className="w-full py-4 bg-white/5 hover:bg-white/10 rounded-xl text-white/80 font-bold uppercase tracking-widest text-[10px] active:scale-95 transition-all border border-white/10"
                                    >
                                        Закрыть
                                    </button>
                                </div>
                            </div>
                        )}
                    </div>
                );
            }

            // ИТОГИ (SUMMARY)
            if (screen === 'summary') {
                // Извлекаем только те вопросы, на которые ответили
                const answered = gameQuestions.slice(0, answeredCount);
                
                const cEasy = answered.filter(q => q.level === 'Простые').length;
                const cMed = answered.filter(q => q.level === 'Средние').length;
                const cHard = answered.filter(q => q.level === 'Глубокие').length;

                return (
                    <div className="min-h-[100dvh] w-full flex flex-col items-center justify-center p-5 slide-up">
                        <div className="text-7xl mb-8 heart-pulse drop-shadow-[0_0_30px_rgba(190,18,60,0.7)]">❤️</div>
                        <div className="text-center mb-12">
                            <h1 className="text-3xl font-bold mb-3 text-white/90">Вы ответили на</h1>
                            <div className="text-7xl font-light text-[#be123c] mt-2"><AnimatedCounter target={answered.length} /></div>
                            <p className="text-white/30 text-[10px] font-bold uppercase tracking-widest mt-4">вопросов</p>
                        </div>
                        <div className="w-full max-w-sm glass-panel p-6 flex flex-col gap-4 mb-10">
                            <div className="flex justify-between items-center p-4 bg-black/40 rounded-xl border border-[#34d399]/20">
                                <span className="font-bold text-[10px] uppercase tracking-widest diff-easy">Легких</span>
                                <span className="text-2xl font-light text-white"><AnimatedCounter target={cEasy} /></span>
                            </div>
                            <div className="flex justify-between items-center p-4 bg-black/40 rounded-xl border border-[#fbbf24]/20">
                                <span className="font-bold text-[10px] uppercase tracking-widest diff-med">Средних</span>
                                <span className="text-2xl font-light text-white"><AnimatedCounter target={cMed} /></span>
                            </div>
                            <div className="flex justify-between items-center p-4 bg-black/40 rounded-xl border border-[#fb7185]/20">
                                <span className="font-bold text-[10px] uppercase tracking-widest diff-hard">Глубоких</span>
                                <span className="text-2xl font-light text-white"><AnimatedCounter target={cHard} /></span>
                            </div>
                        </div>
                        <div className="w-full max-w-sm">
                            <button 
                                onClick={() => setScreen('menu')}
                                className="w-full py-4.5 rounded-xl text-white font-bold text-[11px] uppercase tracking-[0.2em] btn-romantic flex items-center justify-center gap-2 shadow-2xl"
                            >
                                <Icons.Check /> Завершить
                            </button>
                        </div>
                    </div>
                );
            }

            // СПИСОК КАТЕГОРИЙ (БАЗА ДАННЫХ)
            if (screen === 'cat_list') {
                return (
                    <div className="min-h-[100dvh] w-full flex flex-col p-5 fade-in max-w-lg mx-auto">
                        <div className="flex items-center gap-4 mb-8 pt-4">
                            <button onClick={() => setScreen('menu')} className="p-3 bg-white/5 rounded-full hover:bg-white/10 text-white/70">
                                <Icons.Back />
                            </button>
                            <h2 className="text-xl font-bold text-white tracking-wide">База вопросов</h2>
                        </div>
                        <div className="flex-1 overflow-y-auto no-scrollbar flex flex-col gap-3 pb-24">
                            {CATEGORIES.map(cat => {
                                const count = db.filter(q => q.categoryId === cat.id).length;
                                return (
                                    <button key={cat.id} onClick={() => { setViewCategory(cat.id); setScreen('q_list'); }}
                                        className="glass-panel p-5 flex items-center justify-between hover:bg-white/5 transition-colors text-left"
                                    >
                                        <div className="flex items-center gap-4">
                                            <span className="text-2xl">{cat.icon}</span>
                                            <div>
                                                <div className="font-bold text-sm text-white/90">{cat.name}</div>
                                                <div className="text-[10px] uppercase tracking-widest text-white/40 mt-1">{count} вопросов</div>
                                            </div>
                                        </div>
                                        <Icons.Next />
                                    </button>
                                );
                            })}
                        </div>
                        <div className="fixed bottom-5 left-5 right-5 max-w-lg mx-auto">
                            <button onClick={() => setScreen('add_q')} className="w-full py-4.5 rounded-xl font-bold text-xs uppercase tracking-widest btn-romantic flex items-center justify-center gap-2 shadow-2xl">
                                <Icons.Plus /> Добавить вопрос
                            </button>
                        </div>
                    </div>
                );
            }

            // СПИСОК ВОПРОСОВ В КАТЕГОРИИ
            if (screen === 'q_list') {
                const cat = CATEGORIES.find(c => c.id === viewCategory);
                const qs = db.filter(q => q.categoryId === viewCategory);
                
                return (
                    <div className="min-h-[100dvh] w-full flex flex-col p-5 fade-in max-w-2xl mx-auto">
                        <div className="flex items-center gap-4 mb-8 pt-4 flex-shrink-0">
                            <button onClick={() => setScreen('cat_list')} className="p-3 bg-white/5 rounded-full hover:bg-white/10 text-white/70 transition-all">
                                <Icons.Back />
                            </button>
                            <div>
                                <h2 className="text-xl font-bold text-white tracking-wide flex items-center gap-2">
                                    {cat.icon} {cat.name}
                                </h2>
                                <div className="text-[10px] uppercase tracking-widest text-white/40 mt-1">{qs.length} вопросов</div>
                            </div>
                        </div>
                        <div className="flex-1 overflow-y-auto no-scrollbar flex flex-col gap-8 pb-24">
                            {DIFFICULTIES.map(diff => {
                                const diffQs = qs.filter(q => q.level === diff.id);
                                if (diffQs.length === 0) return null;
                                return (
                                    <div key={diff.id}>
                                        <h3 className={`text-xl font-bold uppercase tracking-widest mb-4 pl-2 ${diff.classText}`}>{diff.name} ({diffQs.length})</h3>
                                        <div className="flex flex-col gap-3">
                                            {diffQs.map(q => (
                                                <div key={q.id} className="glass-panel p-5 text-base font-normal text-white/90 leading-relaxed border-white/5 shadow-md">
                                                    {q.text}
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                );
                            })}
                        </div>
                        <div className="fixed bottom-5 left-5 right-5 max-w-2xl mx-auto">
                            <button onClick={() => setScreen('add_q')} className="w-full py-4.5 rounded-xl font-bold text-xs uppercase tracking-widest btn-romantic flex items-center justify-center gap-2 shadow-2xl">
                                <Icons.Plus /> Добавить вопрос
                            </button>
                        </div>
                    </div>
                );
            }

            // ФОРМА ДОБАВЛЕНИЯ
            if (screen === 'add_q') {
                return (
                    <div className="min-h-[100dvh] w-full flex flex-col p-5 fade-in max-w-lg mx-auto">
                        <div className="flex items-center gap-4 mb-8 pt-4">
                            <button onClick={() => setScreen('cat_list')} className="p-3 bg-white/5 rounded-full hover:bg-white/10 text-white/70">
                                <Icons.Back />
                            </button>
                            <h2 className="text-xl font-bold text-white tracking-wide">Новый вопрос</h2>
                        </div>

                        {addSuccess ? (
                            <div className="flex-1 flex flex-col items-center justify-center slide-up">
                                <div className="glass-panel p-8 w-full flex flex-col items-center text-center shadow-2xl">
                                    <svg className="checkmark mb-6" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 52 52">
                                        <circle className="checkmark-circle" cx="26" cy="26" r="25" fill="none"/>
                                        <path className="checkmark-check" fill="none" d="M14.1 27.2l7.1 7.2 16.7-16.8"/>
                                    </svg>
                                    <h3 className="text-xl font-bold text-white mb-2 tracking-wide">Успешно добавлен!</h3>
                                    <p className="text-xs text-white/50 mb-8 tracking-widest uppercase">ID: {addSuccess}</p>
                                    <button onClick={() => { setAddSuccess(null); setAddForm({ text: '', cat: 'family', diff: 'Простые' }); }} className="btn-ghost px-8 py-4 rounded-xl text-[10px] font-bold uppercase tracking-widest shadow-lg">
                                        Добавить еще
                                    </button>
                                </div>
                            </div>
                        ) : (
                            <form onSubmit={handleAddQuestion} className="flex-1 flex flex-col gap-6 slide-up">
                                <div>
                                    <label className="block text-[10px] font-bold uppercase tracking-widest text-white/50 mb-3 ml-1">Текст вопроса</label>
                                    <textarea 
                                        required
                                        value={addForm.text}
                                        onChange={e => setAddForm({...addForm, text: e.target.value})}
                                        className="w-full glass-panel p-5 text-base text-white/90 placeholder-white/20 outline-none resize-none h-40 focus:border-[#be123c]/50 transition-colors shadow-inner"
                                        placeholder="Напишите ваш откровенный или глубокий вопрос..."
                                    ></textarea>
                                </div>
                                
                                <div>
                                    <label className="block text-[10px] font-bold uppercase tracking-widest text-white/50 mb-3 ml-1">Тема вопроса</label>
                                    <select 
                                        value={addForm.cat}
                                        onChange={e => setAddForm({...addForm, cat: e.target.value})}
                                        className="w-full glass-panel p-4.5 text-sm text-white/90 outline-none appearance-none bg-transparent font-medium"
                                        style={{ backgroundColor: "rgba(12,8,15,0.9)" }}
                                    >
                                        {CATEGORIES.map(c => <option key={c.id} value={c.id}>{c.icon} {c.name}</option>)}
                                    </select>
                                </div>

                                <div>
                                    <label className="block text-[10px] font-bold uppercase tracking-widest text-white/50 mb-3 ml-1">Сложность</label>
                                    <select 
                                        value={addForm.diff}
                                        onChange={e => setAddForm({...addForm, diff: e.target.value})}
                                        className="w-full glass-panel p-4.5 text-sm text-white/90 outline-none appearance-none font-medium"
                                        style={{ backgroundColor: "rgba(12,8,15,0.9)" }}
                                    >
                                        {DIFFICULTIES.map(d => <option key={d.id} value={d.id}>{d.name}</option>)}
                                    </select>
                                </div>

                                <div className="mt-auto pb-5 flex gap-4">
                                    <button type="button" onClick={() => setScreen('cat_list')} className="flex-1 py-4.5 rounded-xl btn-ghost text-[10px] font-bold uppercase tracking-widest">
                                        Назад
                                    </button>
                                    <button type="submit" className="flex-[2] py-4.5 rounded-xl btn-romantic text-white text-[11px] font-bold uppercase tracking-widest flex items-center justify-center gap-2 shadow-xl">
                                        <Icons.Plus /> Добавить
                                    </button>
                                </div>
                            </form>
                        )}
                    </div>
                );
            }
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
