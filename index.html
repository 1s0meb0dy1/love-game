<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Влад & Ира ❤️</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Montserrat', sans-serif; 
            overflow: hidden; /* Запрещаем скролл всей страницы */
            background-color: #0b0f19; 
            color: white; 
            -webkit-tap-highlight-color: transparent;
            touch-action: pan-y; /* Защита от случайных зумов */
        }
        
        /* Легкий и быстрый UI */
        .glass-panel { 
            background: rgba(25, 20, 35, 0.6); 
            backdrop-filter: blur(8px); /* Легкий блюр, не тормозит телефон */
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.1); 
            border-radius: 1.5rem;
        }
        
        .glass-button-active {
            background: rgba(255, 255, 255, 0.95);
            color: #0f172a;
            border: 1px solid rgba(255, 255, 255, 1);
            transform: scale(0.98);
        }

        .glass-button-inactive {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* Только одна простая анимация появления для экранов */
        .fade-in { animation: fadeIn 0.3s ease-out forwards; }
        @keyframes fadeIn { 
            from { opacity: 0; } 
            to { opacity: 1; } 
        }

        /* Скрываем скроллбар для длинных вопросов, если они есть */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-slate-950">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // Идеальная ссылка, которая всегда отдает свежую версию базы
        const GIST_URL = "https://gist.githubusercontent.com/1s0meb0dy1/9d890bde848f3a2c5464c7c1729fe17a/raw/questions.json";

        const CATEGORIES = [
            { id: "family", name: "Семья", icon: "👨‍👩‍👧‍👦", color: "from-blue-950 to-slate-950" },
            { id: "intimacy", name: "Интим", icon: "🔥", color: "from-rose-950 to-slate-950" },
            { id: "future", name: "Будущее", icon: "🎯", color: "from-teal-950 to-slate-950" },
            { id: "secrets", name: "Секреты", icon: "🤫", color: "from-purple-950 to-slate-950" },
            { id: "romance", name: "Романтика", icon: "❤️", color: "from-pink-950 to-slate-950" },
            { id: "past", name: "Прошлое", icon: "🕰️", color: "from-amber-950 to-slate-950" },
            { id: "values", name: "Ценности", icon: "⚖️", color: "from-indigo-950 to-slate-950" },
            { id: "fears", name: "Страхи", icon: "👻", color: "from-gray-900 to-slate-950" },
            { id: "money", name: "Деньги", icon: "💰", color: "from-emerald-950 to-slate-950" },
            { id: "life", name: "Быт", icon: "🏠", color: "from-orange-950 to-slate-950" }
        ];

        function App() {
            const [db, setDb] = useState([]);
            const [isLoading, setIsLoading] = useState(true);
            const [screen, setScreen] = useState('menu');
            const [selectedCats, setSelectedCats] = useState([]);
            const [gameQuestions, setGameQuestions] = useState([]);
            const [currentIndex, setCurrentIndex] = useState(0);
            const [showAiPopup, setShowAiPopup] = useState(false);

            useEffect(() => {
                fetch(GIST_URL)
                    .then(res => res.json())
                    .then(data => {
                        const numberedData = data.map((q, index) => {
                            const hasNumber = q.text.startsWith("№");
                            return { ...q, text: hasNumber ? q.text : `№ ${index + 1}. ${q.text}` };
                        });
                        setDb(numberedData);
                        setIsLoading(false); 
                    })
                    .catch(err => {
                        console.error(err);
                        setDb([{ text: "Ошибка загрузки вопросов. Проверьте ссылку.", categoryId: "family", level: "Простые" }]);
                        setIsLoading(false);
                    });
            }, []);

            const toggleCategory = (catId) => {
                setSelectedCats(prev => 
                    prev.includes(catId) ? prev.filter(id => id !== catId) : [...prev, catId]
                );
            };

            const startGame = () => {
                let filtered = db.filter(q => selectedCats.includes(q.categoryId));
                if (filtered.length === 0) return alert("Выберите хотя бы одну тему! ❤️");

                for (let i = filtered.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [filtered[i], filtered[j]] = [filtered[j], filtered[i]];
                }

                setGameQuestions(filtered);
                setCurrentIndex(0);
                setScreen('game');
            };

            const exitToMenu = () => {
                if (confirm("Выйти в меню? Прогресс текущей игры сбросится.")) {
                    setScreen('menu');
                }
            };

            if (isLoading) {
                return (
                    <div className="h-[100dvh] w-full flex flex-col items-center justify-center bg-slate-950">
                        <div className="text-5xl mb-4 text-pink-500">🤍</div>
                        <p className="text-white/70 font-medium uppercase text-xs tracking-widest">Загрузка...</p>
                    </div>
                );
            }

            if (screen === 'menu') {
                return (
                    // Использование h-[100dvh] гарантирует идеальное размещение в 1 экран без скролла на мобильных
                    <div className="h-[100dvh] w-full flex flex-col items-center justify-center p-4 bg-gradient-to-br from-slate-900 to-black fade-in">
                        
                        {/* Заголовок */}
                        <div className="text-center mb-4 flex-shrink-0">
                            <h1 className="text-4xl font-bold mb-1 flex items-center justify-center gap-2">
                                <span>Влад</span>
                                <span className="text-2xl text-pink-500">❤️</span>
                                <span>Ира</span>
                            </h1>
                            <p className="text-white/60 text-[10px] uppercase tracking-widest">Узнаем друг друга глубже</p>
                        </div>

                        {/* Основная панель */}
                        <div className="w-full max-w-sm glass-panel p-5 flex flex-col flex-shrink-0">
                            
                            <h2 className="text-xs font-bold text-center uppercase text-white/80 mb-4">Выбери темы</h2>
                            
                            {/* Компактная сетка категорий */}
                            <div className="grid grid-cols-2 gap-2 mb-4">
                                {CATEGORIES.map(cat => (
                                    <button 
                                        key={cat.id}
                                        onClick={() => toggleCategory(cat.id)}
                                        className={`p-2.5 rounded-xl text-xs md:text-sm font-medium flex items-center justify-center gap-1.5 transition-colors ${selectedCats.includes(cat.id) ? 'glass-button-active' : 'glass-button-inactive text-white/80'}`}
                                    >
                                        <span className="text-base">{cat.icon}</span> 
                                        <span className="truncate">{cat.name}</span>
                                    </button>
                                ))}
                            </div>

                            {/* Информационный блок */}
                            <div className="flex justify-between items-center px-4 py-2 bg-black/30 rounded-xl mb-4">
                                <div className="flex flex-col items-center">
                                    <span className="text-lg font-bold text-white">{selectedCats.length}</span>
                                    <span className="uppercase text-[9px] text-white/60">Тем</span>
                                </div>
                                <div className="h-6 w-px bg-white/20"></div>
                                <div className="flex flex-col items-center">
                                    <span className="text-lg font-bold text-white">{db.filter(q => selectedCats.includes(q.categoryId)).length}</span>
                                    <span className="uppercase text-[9px] text-white/60">Вопросов</span>
                                </div>
                            </div>

                            <button 
                                onClick={startGame}
                                disabled={selectedCats.length === 0}
                                className="w-full py-3.5 rounded-xl bg-white text-black font-bold text-sm uppercase tracking-wide disabled:opacity-40 active:scale-95 transition-transform"
                            >
                                Начать игру
                            </button>
                        </div>
                    </div>
                );
            }

            if (screen === 'game') {
                const currentQ = gameQuestions[currentIndex];
                const categoryInfo = CATEGORIES.find(c => c.id === currentQ.categoryId) || CATEGORIES[0];
                
                const textParts = currentQ.text.match(/(№\s*\d+\.\s*)(.*)/);
                const cleanText = textParts ? textParts[2] : currentQ.text;
                const gameQuestionNumber = currentIndex + 1;

                return (
                    <div className={`h-[100dvh] w-full flex flex-col bg-gradient-to-br ${categoryInfo.color} fade-in`}>
                        
                        {/* Шапка */}
                        <div className="flex justify-between items-center p-4 flex-shrink-0">
                            <div className="bg-black/30 text-white/90 font-bold px-4 py-1.5 rounded-full text-xs">
                                {gameQuestionNumber} / {gameQuestions.length}
                            </div>
                            <button onClick={exitToMenu} className="text-white/80 text-[10px] font-bold uppercase px-3 py-1.5 rounded-full bg-white/10 active:bg-white/20">
                                Меню
                            </button>
                        </div>

                        {/* Карточка вопроса (гибкая область, занимает всё доступное место) */}
                        <div className="flex-1 flex flex-col items-center justify-center p-4 overflow-y-auto no-scrollbar">
                            <div className="w-full max-w-sm flex flex-col items-center">
                                
                                <div className="glass-panel px-4 py-2 rounded-xl mb-6 flex flex-col items-center gap-1">
                                    <span className="text-white/50 text-[10px] uppercase font-bold">Вопрос {gameQuestionNumber}</span>
                                    <div className="flex items-center gap-2 text-xs font-bold uppercase text-white/90">
                                        <span className="text-sm">{categoryInfo.icon}</span>
                                        <span>{categoryInfo.name}</span>
                                        <span className="w-1 h-1 rounded-full bg-white/40"></span>
                                        <span className={
                                            currentQ.level === "Простые" ? "text-emerald-400" :
                                            currentQ.level === "Средние" ? "text-amber-400" : "text-rose-400"
                                        }>
                                            {currentQ.level}
                                        </span>
                                    </div>
                                </div>
                                
                                <h2 className="text-xl md:text-2xl font-medium text-center leading-snug mb-8 text-white px-2">
                                    {cleanText}
                                </h2>

                                <button 
                                    onClick={() => setShowAiPopup(true)}
                                    className="glass-panel px-5 py-2.5 rounded-full text-white/90 text-xs font-bold uppercase active:scale-95 transition-transform flex items-center gap-2"
                                >
                                    <span>✨</span> Ситуация
                                </button>
                            </div>
                        </div>

                        {/* Навигация (подвал) */}
                        <div className="p-4 flex gap-3 flex-shrink-0 mb-2">
                            <button 
                                onClick={() => setCurrentIndex(prev => prev - 1)}
                                disabled={currentIndex === 0}
                                className="flex-1 py-3.5 rounded-xl font-bold text-white/80 glass-panel disabled:opacity-20 active:scale-95 uppercase text-xs"
                            >
                                Назад
                            </button>
                            <button 
                                onClick={() => {
                                    if (currentIndex < gameQuestions.length - 1) {
                                        setCurrentIndex(prev => prev + 1);
                                    } else {
                                        alert("Вы ответили на все вопросы! ❤️");
                                        setScreen('menu');
                                    }
                                }}
                                className="flex-[2] py-3.5 rounded-xl font-bold text-black bg-white active:scale-95 uppercase text-xs"
                            >
                                {currentIndex === gameQuestions.length - 1 ? "Завершить" : "Далее"} 
                            </button>
                        </div>

                        {/* AI POP-UP */}
                        {showAiPopup && (
                            <div className="fixed inset-0 bg-slate-950/90 flex items-center justify-center p-4 z-50 fade-in">
                                <div className="glass-panel p-6 w-full max-w-sm rounded-2xl">
                                    <div className="flex justify-between items-center mb-4">
                                        <h3 className="font-bold text-sm uppercase text-white">✨ Ситуация</h3>
                                    </div>
                                    <div className="text-white/80 mb-6 text-sm bg-black/40 p-4 rounded-xl leading-relaxed">
                                        Представь, что эта ситуация произошла с нами прямо сейчас. Опиши свои первые мысли, эмоции и действия. Как бы мы справились с этим вместе?
                                    </div>
                                    <button 
                                        onClick={() => setShowAiPopup(false)}
                                        className="w-full py-3 bg-white/20 rounded-xl text-white font-bold uppercase text-xs active:bg-white/30"
                                    >
                                        Вернуться
                                    </button>
                                </div>
                            </div>
                        )}
                    </div>
                );
            }
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
