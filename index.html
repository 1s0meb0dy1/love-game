    <style>
        @import url('https://fonts.cdnfonts.com/css/google-sans');
        
        :root {
            color-scheme: dark;
        }

        html, body {
            width: 100%;
            min-height: 100dvh;
            min-height: -webkit-fill-available;
            margin: 0;
            padding: 0;
            background-color: #09080c !important;
            font-family: 'Plus Jakarta Sans', 'Product Sans', 'Google Sans', -apple-system, sans-serif; 
            overflow-x: hidden;
            color: #fafafa; 
            -webkit-tap-highlight-color: transparent;
            touch-action: pan-y;
            overscroll-behavior-y: none;
            -webkit-font-smoothing: antialiased;
        }

        /* Современный геометрический гротеск без засечек для логотипа и цифр */
        .font-display {
            font-family: 'Outfit', 'Plus Jakarta Sans', sans-serif;
        }

        /* Единый сдержанный фон в монохромно-рубиновой гамме */
        .app-bg {
            position: fixed;
            top: -15vh;
            bottom: -15vh;
            left: -15vw;
            right: -15vw;
            z-index: 0;
            background-color: #09080c;
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(225, 29, 72, 0.13) 0%, transparent 55%),
                radial-gradient(circle at 50% 100%, rgba(159, 18, 57, 0.08) 0%, transparent 50%);
            pointer-events: none;
        }

        /* Контейнер с учетом безопасных зон мобильного экрана */
        .safe-screen {
            min-height: 100dvh;
            padding-top: max(1.25rem, env(safe-area-inset-top));
            padding-bottom: max(1.5rem, env(safe-area-inset-bottom));
            padding-left: max(1.25rem, env(safe-area-inset-left));
            padding-right: max(1.25rem, env(safe-area-inset-right));
        }

        /* Фиксированная обертка для Pop-up окон: всегда следует за экраном и никогда не выходит за его рамки */
        .viewport-popup-overlay {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100dvh;
            background: rgba(9, 8, 12, 0.84);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: max(1rem, env(safe-area-inset-top)) 1.25rem max(1rem, env(safe-area-inset-bottom));
            z-index: 100;
        }

        .viewport-popup-box {
            width: 100%;
            max-width: 22rem;
            max-height: calc(100dvh - 2.5rem);
            overflow-y: auto;
            background: #13111a;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 1.75rem;
            padding: 1.5rem;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.7);
        }

        /* Тонкая линия-разделитель вместо громоздких подложек */
        .hairline-divider {
            height: 1px;
            width: 100%;
            background: linear-gradient(90deg, transparent 0%, rgba(255, 255, 255, 0.08) 50%, transparent 100%);
        }

        /* Кнопки единого стандарта (54px) в гармоничной палитре */
        .btn-primary {
            background: linear-gradient(135deg, #f43f5e 0%, #be123c 100%);
            color: #ffffff;
            box-shadow: 0 8px 24px rgba(225, 29, 72, 0.28);
            transition: transform 0.18s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.18s ease;
            height: 54px;
        }
        .btn-primary:active { transform: scale(0.97); }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.11);
            color: #f4f4f5;
            transition: all 0.18s ease;
            height: 54px;
        }
        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.2);
        }
        .btn-secondary:active { transform: scale(0.97); }

        /* Минималистичные интерактивные плашки для тем (без лишнего визуального шума) */
        .topic-pill-active {
            background: rgba(244, 63, 94, 0.12);
            border: 1px solid rgba(244, 63, 94, 0.48);
            color: #ffffff;
        }
        .topic-pill-inactive {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: #71717a;
        }

        /* Гармоничные оттенки сложности (без светофора "зеленый-желтый-красный") */
        .diff-text-1 { color: #e4e4e7; } /* Светлый жемчужный */
        .diff-text-2 { color: #fda4af; } /* Нежно-розовый */
        .diff-text-3 { color: #f43f5e; } /* Насыщенный рубиновый */

        .diff-pill-1 { background: rgba(255, 255, 255, 0.09); border: 1px solid rgba(255, 255, 255, 0.28); color: #ffffff; }
        .diff-pill-2 { background: rgba(251, 113, 133, 0.14); border: 1px solid rgba(251, 113, 133, 0.42); color: #fecdd3; }
        .diff-pill-3 { background: rgba(225, 29, 72, 0.22); border: 1px solid rgba(244, 63, 94, 0.55); color: #fda4af; }

        /* Легкие аппаратные анимации (60/120 FPS) */
        .fade-in { animation: fadeIn 0.24s ease-out forwards; }
        .slide-up { animation: slideUp 0.34s cubic-bezier(0.22, 1, 0.36, 1) forwards; }
        .pulse-soft { animation: pulseSoft 2.4s ease-in-out infinite; }
        
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { opacity: 0; transform: translate3d(0, 14px, 0); } to { opacity: 1; transform: translate3d(0, 0, 0); } }
        @keyframes pulseSoft { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.07); } }

        .floating-heart {
            position: fixed;
            bottom: -10vh;
            pointer-events: none;
            z-index: 5;
            animation: floatUpwards linear infinite;
        }
        @keyframes floatUpwards {
            0% { transform: translate3d(0, 0, 0) scale(0.7); opacity: 0; }
            15% { opacity: 0.8; }
            85% { opacity: 0.8; }
            100% { transform: translate3d(0, -115vh, 0) scale(1.15); opacity: 0; }
        }

        .ai-cursor::after { content: '▋'; color: #f43f5e; animation: blink 0.9s step-end infinite; margin-left: 2px; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>

        const SECRET_CIPHER = [72, 85, 43, 24, 228, 194, 165, 203, 328, 347, 300, 319, 439, 391, 494, 455];

        // АКУСТИЧЕСКИЙ ЗВУКОВОЙ ДВИЖОК
        const SoundFX = {
            ctx: null,
            filter: null,
            muted: false,
            unlocked: false,
            init() {
                try {
                    const AudioCtx = window.AudioContext || window.webkitAudioContext;
                    if (!AudioCtx) return;
                    if (!this.ctx) {
                        this.ctx = new AudioCtx();
                        this.filter = this.ctx.createBiquadFilter();
                        this.filter.type = "lowpass";
                        this.filter.frequency.value = 1650;
                        this.filter.connect(this.ctx.destination);
                    }
                    if (this.ctx.state === 'suspended') {
                        this.ctx.resume();
                    }
                    if (!this.unlocked && this.ctx) {
                        const buffer = this.ctx.createBuffer(1, 1, 22050);
                        const source = this.ctx.createBufferSource();
                        source.buffer = buffer;
                        source.connect(this.ctx.destination);
                        if (source.start) source.start(0);
                        this.unlocked = true;
                    }
                } catch (e) {}
            },
            playAcousticNote(freq, duration = 0.12, vol = 0.24, endFreq = null) {
                if (this.muted) return;
                try {
                    this.init();
                    if (!this.ctx || !this.filter) return;
                    const now = this.ctx.currentTime;

                    const osc = this.ctx.createOscillator();
                    const subOsc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();

                    osc.type = 'sine';
                    subOsc.type = 'triangle';

                    osc.frequency.setValueAtTime(freq, now);
                    subOsc.frequency.setValueAtTime(freq * 0.5, now);

                    if (endFreq) {
                        osc.frequency.exponentialRampToValueAtTime(endFreq, now + duration);
                    }

                    gain.gain.setValueAtTime(0.001, now);
                    gain.gain.linearRampToValueAtTime(vol, now + 0.014);
                    gain.gain.exponentialRampToValueAtTime(0.0008, now + duration);

                    osc.connect(gain);
                    subOsc.connect(gain);
                    gain.connect(this.filter);

                    osc.start(now);
                    subOsc.start(now);
                    osc.stop(now + duration + 0.015);
                    subOsc.stop(now + duration + 0.015);
                } catch (e) {}
            },
            click() {
                this.playAcousticNote(420, 0.075, 0.22, 540);
            },
            toggle(active = true) {

                const chord = [523.25, 659.25, 783.99, 987.77];

            magic() {
                if (this.muted) return;
                this.init();
                this.playAcousticNote(493.88, 0.14, 0.2, 659.25);
                setTimeout(() => this.playAcousticNote(783.99, 0.22, 0.22), 90);

            success() {
                if (this.muted) return;
                this.init();
                this.playAcousticNote(523.25, 0.12, 0.22);
                setTimeout(() => this.playAcousticNote(783.99, 0.26, 0.26), 95);
            },
            warn() {
                this.playAcousticNote(280, 0.15, 0.22, 190);
            }
        };

        // Вызов нейросети
        const callNeuralNet = async (systemPrompt, userPrompt, maxTokens = 900) => {
            const randomSeed = Math.floor(Math.random() * 10000000);

            if (GEMINI_API_KEY && GEMINI_API_KEY.startsWith("AIza")) {

        const synthesizeSmartFallback = (promptType, cleanQuestion, catId, guyName, girlName) => {

            const settings = [

                const entries = Object.entries(rawObj);
                const parsed = [];

                for (let i = 0; i < entries.length; i++) {
                    const [dbKey, item] = entries[i];
                    if (!item || typeof item !== 'object' || !item.text) continue;

                    const matchNum = String(item.text).match(/^№\s*(\d+)\.\s*(.*)/s);
                    const cleanText = matchNum ? matchNum[2].trim() : String(item.text).trim();

                    parsed.push({
                        dbKey: String(dbKey),
                        id: item.id || `q_${i + 1}`,
                        origNum: item.num ? Number(item.num) : (matchNum ? Number(matchNum[1]) : i + 1),
                        categoryId: item.categoryId || "family",
                        level: item.level || "Простые",
                        cleanText: cleanText
                    });

                parsed.sort((a, b) => a.origNum - b.origNum);
                return reindexSequential(parsed);

                                setDb(parseDatabaseObject(data.questions));

                }));

            const stats = useMemo(() => {

                const archivedByCat = {};
                CATEGORIES.forEach(c => { activeByCat[c.id] = 0; totalByCat[c.id] = 0; archivedByCat[c.id] = 0; });

                let availableActive = 0;
                let availableTotal = 0;
                let disabledCount = 0;
                const archivedList = [];

                for (let i = 0; i < profileDb.length; i++) {
                    const q = profileDb[i];
                    if (totalByCat[q.categoryId] !== undefined) totalByCat[q.categoryId]++;
                    
                    const matchesDiff = selectedDiffs.includes(q.level);
                    const matchesCat = selectedCats.includes(q.categoryId);

                    if (q.disabled) disabledCount++;

                    if (q.archived) {
                        archivedList.push(q);
                        if (archivedByCat[q.categoryId] !== undefined) archivedByCat[q.categoryId]++;
                    } else if (!q.disabled) {
                        if (activeByCat[q.categoryId] !== undefined) activeByCat[q.categoryId]++;
                        if (matchesCat && matchesDiff) availableActive++;
                    }

                    if (matchesCat && matchesDiff) availableTotal++;
                }

                return { activeByCat, totalByCat, archivedByCat, availableActive, availableTotal, disabledCount, archivedList };
            }, [profileDb, selectedCats, selectedDiffs]);

            const filteredArchivedList = useMemo(() => {

                    if (archiveFilterDiff !== 'all' && q.level !== archiveFilterDiff) return false;
                    if (archiveSearch.trim() !== '') {
                        const s = archiveSearch.toLowerCase().trim();
                        const matchText = q.cleanText.toLowerCase().includes(s);

                setSelectedCats(prev => willBeSelected ? [...prev, catId] : prev.filter(id => id !== catId));

            const toggleQuestionPersonalEnable = (qObj) => {

                const currentlyDisabled = (profile.disabledIds || []).includes(targetKey);
                SoundFX.toggle(currentlyDisabled);
                setProfile(prev => {
                    const list = prev.disabledIds || [];
                    const nextList = currentlyDisabled ? list.filter(k => k !== targetKey) : [...list, targetKey];
                    return { ...prev, disabledIds: nextList };

            // Рулетка выбора первого игрока с плавным замедлением
            const triggerRouletteForIndex = (targetIdx, currentHistory) => {
                if (currentHistory[targetIdx]) return;

                rouletteTimeoutsRef.current.forEach(t => clearTimeout(t));
                rouletteTimeoutsRef.current = [];

                const winner = Math.random() < 0.5 ? 'guy' : 'girl';
                const startSide = winner === 'guy' ? 'girl' : 'guy';
                setTurnPopup({ open: true, spinning: true, highlight: startSide, winner: null });

                const stepDelays = [140, 155, 170, 190, 210, 235, 260, 290, 320, 350];
                let cumulativeTime = 0;
                let currentHighlight = startSide;

                stepDelays.forEach((delay, idx) => {
                    cumulativeTime += delay;
                    const tId = setTimeout(() => {
                        currentHighlight = currentHighlight === 'guy' ? 'girl' : 'guy';
                        if (idx < stepDelays.length - 1) {
                            SoundFX.rouletteTick();
                            setTurnPopup({ open: true, spinning: true, highlight: currentHighlight, winner: null });
                        } else {
                            SoundFX.rouletteWin();
                            setTurnPopup({ open: true, spinning: false, highlight: winner, winner: winner });
                            setTurnHistory(prev => ({ ...prev, [targetIdx]: winner }));
                        }
                    }, cumulativeTime);
                    rouletteTimeoutsRef.current.push(tId);
                });

            const handlePressStartButton = () => {

                SoundFX.click();
                let pool = [];
                if (mode === 'normal') {
                    pool = profileDb.filter(q => !q.archived && !q.disabled && selectedCats.includes(q.categoryId) && selectedDiffs.includes(q.level));
                    if (pool.length === 0) {
                        alert("Нет активных вопросов по выбранным темам. Включите темы или верните вопросы из Архива! ❤️");
                        return;

                } else {
                    const catsToUse = selectedCats.length > 0 ? selectedCats : CATEGORIES.map(c => c.id);
                    const diffsToUse = selectedDiffs.length > 0 ? selectedDiffs : DIFFICULTIES.map(d => d.id);

                        alert("В базе нет вопросов по этим фильтрам!");
                        return;

                const shuffled = [...pool];
                for (let i = shuffled.length - 1; i > 0; i--) {

                    });

                    if (!res.ok) {
                        const errText = await res.text();
                        throw new Error(`Код ${res.status}: ${errText}`);

                    setDb(prev => {

                    setGameQuestions(prev => {

                        return nextList;

                    });
                } catch (err) {

                    setResultModal({
                        ok: false,
                        msg: `Не удалось удалить вопрос. Причина: ${err.message || "Сбой сети."}`
                    });
                } finally {
                    setIsSaving(false);
                }
            };

                        <p className="text-zinc-500 font-semibold uppercase text-[11px] tracking-[0.25em] mt-5">
                            Синхронизация...
                        </p>
                    </div>
                );
            }

            // СЕКРЕТНАЯ СТРАНИЦА ВХОДА АДМИНИСТРАТОРА (Доступна по ссылке #/admin или 5 тапам по логотипу)
            if (screen === 'admin_login') {
                return (
                    <div className="safe-screen w-full flex flex-col items-center justify-between slide-up relative z-10">
                        <header className="w-full max-w-md flex items-center justify-between pt-2">

                                            <span>
                                                {assignedPlayer === 'guy' 
                                                    ? `Первым отвечает: ${profile.guyName}`

                        {/* КОМПАКТНЫЙ POP-UP ЖРЕБИЯ (Всегда следует за экраном и помещается на любом телефоне) */}

                                </div>

            // 5. ЭКРАН AI-ОТВЕТА (#/ai)
            if (screen === 'ai_response') {
                const currentQ = gameQuestions[currentIndex];
                const isSituation = aiType === 'situation';
                
                return (
                    <div className="safe-screen w-full flex flex-col justify-between fade-in relative z-10">

                            </button>

                            <div className="max-w-xl mx-auto">
                                <button onClick={() => { SoundFX.click(); navigate('game'); }} className="w-full rounded-2xl btn-primary flex items-center justify-center text-xs font-bold uppercase tracking-widest">

                                </button>
                            </div>

                    </div>
                );
            }

            // 6. ЭКРАН ИТОГОВ ИГРЫ (#/summary)
            if (screen === 'summary') {
                const answered = gameQuestions.slice(0, answeredCount);
                const cEasy = answered.filter(q => q.level === 'Простые').length;
                const cMed = answered.filter(q => q.level === 'Средние').length;
                const cHard = answered.filter(q => q.level === 'Глубокие').length;

                const isAllAnswered = completedAllFlag || stats.availableActive === 0;
                const floatingHearts = [
                    { left: '12%', delay: '0s', dur: '5.5s', size: '1.4rem', icon: '❤️' },
                    { left: '32%', delay: '1.2s', dur: '6.2s', size: '1.2rem', icon: '✨' },
                    { left: '52%', delay: '0.5s', dur: '5.8s', size: '1.7rem', icon: '❤️' },
                    { left: '75%', delay: '1.6s', dur: '6.4s', size: '1.4rem', icon: '✨' }
                ];

                return (
                    <div className="safe-screen w-full flex flex-col items-center justify-between slide-up relative z-10 overflow-hidden">
                        {isAllAnswered && floatingHearts.map((h, i) => (
                            <div 
                                key={i} 
                                className="floating-heart" 
                                style={{ left: h.left, animationDelay: h.delay, animationDuration: h.dur, fontSize: h.size }}
                            >
                                {h.icon}
                            </div>
                        ))}

                        <div className="flex-1 flex flex-col items-center justify-center w-full max-w-sm py-6 gap-7">
                            <AskMeLogo size="md" />

                            {isAllAnswered ? (
                                <div className="text-center space-y-3 py-2">
                                    <div className="text-[11px] font-bold uppercase tracking-[0.25em] text-rose-400">
                                        Все вопросы пройдены
                                    </div>
                                    <h1 className="font-display text-2xl font-bold text-white">
                                        {profile.guyName} и {profile.girlName}, вы ответили на все вопросы!
                                    </h1>
                                    <p className="text-xs text-zinc-400 leading-relaxed">
                                        Вы прошли всю выбранную колоду до самого конца и стали ещё ближе друг другу.
                                    </p>

                                        onClick={() => SoundFX.romanticFinale()}
                                        className="px-4 py-2 rounded-full border border-rose-500/35 bg-rose-500/10 text-[11px] font-bold uppercase tracking-wider text-rose-300"
                                    >
                                        🎵 Мелодия финала
                                    </button>

                                    const totalCatCount = stats.totalByCat[cat.id] || 0;

                                        <button 
                                            key={cat.id}

                                                    <div className="font-semibold text-base text-white">{cat.name}</div>

                            {/* КОМПАКТНЫЙ БЛОК АРХИВА ВНИЗУ СТРАНИЦЫ (Сам список вынесен на отдельную страницу #/archive, здесь только "Вернуть все") */}

                                <div className="flex items-center justify-between">

                                        onClick={() => { SoundFX.click(); navigate('archive_page'); }}

                                    >
                                        <span className="w-10 h-10 rounded-2xl bg-white/[0.04] border border-white/10 flex items-center justify-center text-rose-400 group-hover:border-rose-500/40 transition-all">
                                            <Icons.Archive />
                                        </span>
                                        <div>
                                            <div className="font-bold text-base text-white flex items-center gap-2">

                                            </div>
                                            <div className="text-xs text-zinc-500">

                                            </div>
                                        </div>
                                    </button>
                                </div>

                                <button 
                                    disabled={totalArchivedCount === 0}
                                    onClick={() => handleRestoreBatchFromArchive(stats.archivedList)}
                                    className="w-full rounded-2xl btn-secondary text-xs font-bold uppercase tracking-widest flex items-center justify-center gap-2 disabled:opacity-30 disabled:pointer-events-none"
                                >
                                    <Icons.Restore /> Вернуть все ({totalArchivedCount})
                                </button>
                            </div>

                            <AppFooter extraBottomPadding={isAdmin} />
                        </div>

                        {isAdmin && (
                            <div className="lg:hidden fixed bottom-5 left-5 right-5 max-w-md mx-auto pointer-events-none" style={{ paddingBottom: 'env(safe-area-inset-bottom)' }}>
                                <button 
                                    onClick={() => { SoundFX.click(); setAddStatus(null); setAddForm({ text: '', cat: 'family', diff: 'Простые' }); navigate('add_q'); }} 
                                    className="w-full rounded-2xl font-bold text-xs uppercase tracking-widest btn-primary flex items-center justify-center gap-2 pointer-events-auto"
                                >
                                    <Icons.Plus /> Новый вопрос
                                </button>
                            </div>
                        )}
                    </div>
                );
            }

            // 8. ОТДЕЛЬНАЯ СТРАНИЦА "АРХИВ ВОПРОСОВ" (#/archive)
            if (screen === 'archive_page') {
                const totalArchivedCount = stats.archivedList.length;

                return (
                    <div className="safe-screen w-full flex flex-col fade-in max-w-2xl mx-auto relative z-10">
                        <header className="flex items-center justify-between gap-4 mb-6 pt-2">
                            <div className="flex items-center gap-3.5">
                                <button onClick={() => { SoundFX.click(); navigate('cat_list'); }} className="p-3 bg-white/[0.04] rounded-2xl hover:bg-white/[0.08] text-zinc-300 border border-white/10">
                                    <Icons.Back />
                                </button>
                                <div>
                                    <h2 className="font-display text-2xl font-bold text-white">Архив вопросов</h2>
                                    <p className="text-xs text-zinc-500 mt-0.5">
                                        Пройдено парой {profile.guyName} & {profile.girlName}: {totalArchivedCount}
                                    </p>
                                </div>
                            </div>
                        </header>

                        {totalArchivedCount === 0 ? (
                            <div className="flex-1 flex flex-col items-center justify-center text-center py-16 gap-4">
                                <div className="w-12 h-12 rounded-2xl bg-white/[0.04] border border-white/10 flex items-center justify-center text-zinc-500">

                                <button 
                                    onClick={() => { SoundFX.click(); navigate('cat_list'); }}
                                    className="px-6 rounded-2xl btn-secondary text-xs font-bold uppercase tracking-widest mt-2"
                                >
                                    Назад к темам
                                </button>
                            </div>
                        ) : (
                            <div className="flex-1 flex flex-col gap-6 pb-24">

                                <div className="grid grid-cols-1 sm:grid-cols-3 gap-2.5">

                                        type="text"
                                        value={archiveSearch}
                                        onChange={e => setArchiveSearch(e.target.value)}
                                        placeholder="🔍 Поиск по тексту..."

                                    />

                                    <select 
                                        value={archiveFilterCat}
                                        onChange={e => { SoundFX.toggle(true); setArchiveFilterCat(e.target.value); }}
                                        className="h-11 px-3.5 rounded-xl bg-white/[0.04] border border-white/10 text-xs text-zinc-200 outline-none"
                                    >
                                        <option value="all" className="bg-[#09080c]">Все темы ({totalArchivedCount})</option>
                                        {CATEGORIES.map(c => (
                                            <option key={c.id} value={c.id} className="bg-[#09080c]">
                                                {c.icon} {c.name} ({stats.archivedByCat[c.id] || 0})
                                            </option>
                                        ))}
                                    </select>

                                    <select 
                                        value={archiveFilterDiff}
                                        onChange={e => { SoundFX.toggle(true); setArchiveFilterDiff(e.target.value); }}
                                        className="h-11 px-3.5 rounded-xl bg-white/[0.04] border border-white/10 text-xs text-zinc-200 outline-none"
                                    >
                                        <option value="all" className="bg-[#09080c]">Любая сложность</option>
                                        {DIFFICULTIES.map(d => (
                                            <option key={d.id} value={d.id} className="bg-[#09080c]">{d.name}</option>
                                        ))}
                                    </select>
                                </div>

                                {/* Список вопросов в Архиве */}
                                <div className="flex flex-col divide-y divide-white/[0.08] border-y border-white/[0.08]">
                                    {filteredArchivedList.length === 0 ? (
                                        <div className="text-center py-10 text-xs text-zinc-500">
                                            По выбранным фильтрам ничего не найдено
                                        </div>
                                    ) : (
                                        filteredArchivedList.slice(0, archiveVisibleLimit).map(q => {
                                            const cInfo = CATEGORIES.find(c => c.id === q.categoryId) || CATEGORIES[0];
                                            const dInfo = DIFFICULTIES.find(d => d.id === q.level) || DIFFICULTIES[0];
                                            return (
                                                <div key={q.dbKey} className="py-4 flex items-start justify-between gap-4">
                                                    <div className="text-sm text-zinc-200 leading-relaxed">
                                                        <div className="flex items-center gap-2 text-[11px] mb-1">
                                                            <span className="text-rose-400 font-bold">№ {q.num}</span>
                                                            <span className="text-zinc-600">•</span>
                                                            <span className="text-zinc-400">{cInfo.icon} {cInfo.name}</span>
                                                            <span className="text-zinc-600">•</span>
                                                            <span className={dInfo.classText}>{dInfo.name}</span>
                                                        </div>
                                                        {q.cleanText}
                                                    </div>
                                                    <button 
                                                        onClick={() => handleRestoreSingleFromArchive(q)}
                                                        className="flex-shrink-0 px-3.5 py-2 rounded-xl border border-white/15 bg-white/[0.04] hover:bg-white/[0.09] text-white text-[11px] font-bold uppercase tracking-wider flex items-center gap-1.5 active:scale-95 transition-all"
                                                    >
                                                        <Icons.Restore /> Вернуть
                                                    </button>
                                                </div>
                                            );
                                        })
                                    )}
                                </div>

                                {filteredArchivedList.length > archiveVisibleLimit && (
                                    <button 
                                        onClick={() => { SoundFX.click(); setArchiveVisibleLimit(prev => prev + 60); }}
                                        className="w-full h-12 rounded-2xl btn-secondary text-xs font-bold uppercase tracking-widest"
                                    >
                                        Еще ({filteredArchivedList.length - archiveVisibleLimit})
                                    </button>
                                )}

                                <button 
                                    onClick={() => handleRestoreBatchFromArchive(stats.archivedList)}
                                    className="w-full rounded-2xl btn-primary text-xs font-bold uppercase tracking-widest flex items-center justify-center gap-2 mt-2"
                                >
                                    <Icons.Restore /> Вернуть все ({totalArchivedCount})
                                </button>
                            </div>
                        )}

                        <AppFooter />
                    </div>
                );
            }

            // 9. СПИСОК ВОПРОСОВ ВЫБРАННОЙ ТЕМЫ (#/questions — Чистые строки без лишних подложек)
            if (screen === 'q_list') {
                const cat = CATEGORIES.find(c => c.id === viewCategory) || CATEGORIES[0];
                const qs = profileDb.filter(q => q.categoryId === viewCategory);
                
                return (
                    <div className="safe-screen w-full flex flex-col fade-in max-w-2xl mx-auto relative z-10">
                        <header className="flex items-center justify-between gap-4 mb-7 pt-2 flex-shrink-0">
                            <div className="flex items-center gap-3.5">
                                <button onClick={() => { SoundFX.click(); navigate('cat_list'); }} className="p-3 bg-white/[0.04] rounded-2xl hover:bg-white/[0.08] text-zinc-300 border border-white/10">
                                    <Icons.Back />
                                </button>
                                <div>
                                    <h2 className="font-display text-2xl font-bold text-white flex items-center gap-2">
                                        {cat.icon} {cat.name}
                                    </h2>
                                    <div className="text-xs text-zinc-500 mt-0.5">
                                        Активных: {stats.activeByCat[cat.id] || 0} из {qs.length}
                                    </div>
                                </div>
                            </div>

                            {isAdmin && (
                                <button 
                                    onClick={() => { SoundFX.click(); setAddStatus(null); setAddForm({ text: '', cat: viewCategory || 'family', diff: 'Простые' }); navigate('add_q'); }} 
                                    className="hidden lg:flex px-5 h-12 rounded-2xl font-bold text-xs uppercase tracking-wider btn-primary items-center gap-2"
                                >
                                    <Icons.Plus /> Новый вопрос
                                </button>
                            )}
                        </header>

                        <div className="flex-1 flex flex-col gap-10 pb-24">
                            {DIFFICULTIES.map(diff => {
                                const diffQs = qs.filter(q => q.level === diff.id);
                                if (diffQs.length === 0) return null;
                                const shownQs = diffQs.slice(0, visibleLimit);

                                return (
                                    <div key={diff.id} className="space-y-3">
                                        <h3 className={`font-display text-sm font-bold uppercase tracking-[0.2em] ${diff.classText}`}>
                                            {diff.name} ({diffQs.length})
                                        </h3>
                                        <div className="flex flex-col divide-y divide-white/[0.08] border-y border-white/[0.08]">
                                            {shownQs.map(q => (
                                                <div 
                                                    key={q.dbKey} 
                                                    className={`py-4 flex items-start justify-between gap-4 transition-opacity ${q.disabled ? 'opacity-40' : 'opacity-100'}`}
                                                >
                                                    <div className="text-[15px] text-zinc-100 leading-relaxed flex-1">
                                                        <span className="text-rose-400 font-bold mr-2">№ {q.num}.</span>
                                                        {q.cleanText}
                                                        {q.archived && (
                                                            <span className="ml-2 inline-block text-[10px] font-bold uppercase px-2 py-0.5 rounded bg-white/10 text-zinc-300">
                                                                Архив
                                                            </span>
                                                        )}
                                                        {q.disabled && (
                                                            <span className="ml-2 inline-block text-[10px] font-bold uppercase px-2 py-0.5 rounded bg-rose-500/20 text-rose-300">
                                                                Скрыт
                                                            </span>
                                                        )}
                                                    </div>

                                                    <div className="flex items-center gap-2 flex-shrink-0">
                                                        <button 
                                                            onClick={() => toggleQuestionPersonalEnable(q)}
                                                            className={`px-3 py-1.5 rounded-xl text-[10px] font-bold uppercase tracking-wider border transition-all active:scale-90 ${
                                                                q.disabled 
                                                                    ? 'border-white/10 text-zinc-500' 
                                                                    : 'border-rose-500/40 bg-rose-500/10 text-rose-300'
                                                            }`}
                                                        >
                                                            {q.disabled ? "Выкл" : "Вкл"}
                                                        </button>

                                                        {isAdmin && (
                                                            <button 
                                                                onClick={() => openEditScreen(q, 'q_list')}
                                                                className="p-2 rounded-xl bg-white/[0.04] hover:bg-white/[0.1] text-zinc-400 hover:text-white active:scale-90 transition-all border border-white/10"
                                                            >
                                                                <Icons.Edit />
                                                            </button>
                                                        )}
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                        {diffQs.length > visibleLimit && (
                                            <button 
                                                onClick={() => { SoundFX.click(); setVisibleLimit(prev => prev + 80); }}
                                                className="w-full h-12 rounded-2xl btn-secondary text-xs font-bold uppercase tracking-widest"
                                            >
                                                Еще ({diffQs.length - visibleLimit})
                                            </button>
                                        )}
                                    </div>
                                );
                            })}

                            <AppFooter extraBottomPadding={isAdmin} />
                        </div>

                        {isAdmin && (
                            <div className="lg:hidden fixed bottom-5 left-5 right-5 max-w-2xl mx-auto pointer-events-none" style={{ paddingBottom: 'env(safe-area-inset-bottom)' }}>
                                <button 
                                    onClick={() => { SoundFX.click(); setAddStatus(null); setAddForm({ text: '', cat: viewCategory || 'family', diff: 'Простые' }); navigate('add_q'); }} 
                                    className="w-full rounded-2xl font-bold text-xs uppercase tracking-widest btn-primary flex items-center justify-center gap-2 pointer-events-auto"
                                >
                                    <Icons.Plus /> Новый вопрос
                                </button>
                            </div>
                        )}
                    </div>
                );
            }

            // 10. ЭКРАН РЕДАКТИРОВАНИЯ И УДАЛЕНИЯ ВОПРОСА (#/edit — Админ)
            if (screen === 'edit_q' && editingQuestion && isAdmin) {
                const origText = (editingQuestion.cleanText || editingQuestion.text.replace(/^№\s*\d+\.\s*/, '')).trim();
                const hasChanges = 
                    editForm.text.trim() !== "" && (
                        editForm.text.trim() !== origText ||
                        editForm.cat !== editingQuestion.categoryId ||
                        editForm.diff !== editingQuestion.level
                    );

                return (
                    <div className="safe-screen w-full flex flex-col fade-in max-w-lg mx-auto relative z-10">
                        <header className="flex items-center gap-3.5 mb-6 pt-2">
                            <button onClick={() => { SoundFX.click(); navigate(returnScreen); }} className="p-3 bg-white/[0.04] rounded-2xl hover:bg-white/[0.08] text-zinc-300 border border-white/10">
                                <Icons.Back />
                            </button>
                            <div>
                                <h2 className="font-display text-xl font-bold text-white">Редактирование</h2>
                                <p className="text-xs text-zinc-500 mt-0.5">
                                    Вопрос № {editingQuestion.num} • ID: {editingQuestion.id}
                                </p>
                            </div>
                        </header>

                        <div className="flex-1 flex flex-col gap-5 slide-up">
                            <div>
                                <label className="block text-[11px] font-bold uppercase tracking-wider text-zinc-400 mb-2 ml-1">Текст вопроса</label>
                                <textarea 
                                    value={editForm.text}
                                    onChange={e => setEditForm({...editForm, text: e.target.value})}
                                    className="w-full p-4 rounded-2xl bg-white/[0.04] border border-white/12 text-base text-white placeholder-zinc-600 outline-none resize-none h-36 focus:border-rose-500 transition-colors"
                                    placeholder="Введите текст вопроса..."
                                ></textarea>
                            </div>
                            
                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                <div>
                                    <label className="block text-[11px] font-bold uppercase tracking-wider text-zinc-400 mb-2 ml-1">Тема</label>
                                    <select 
                                        value={editForm.cat}
                                        onChange={e => { SoundFX.toggle(true); setEditForm({...editForm, cat: e.target.value}); }}
                                        className="w-full h-13 px-4 rounded-2xl bg-white/[0.04] border border-white/12 text-sm text-white outline-none"
                                    >
                                        {CATEGORIES.map(c => <option key={c.id} value={c.id} className="bg-[#09080c] text-white">{c.icon} {c.name}</option>)}
                                    </select>
                                </div>

                                <div>
                                    <label className="block text-[11px] font-bold uppercase tracking-wider text-zinc-400 mb-2 ml-1">Сложность</label>
                                    <select 
                                        value={editForm.diff}
                                        onChange={e => { SoundFX.toggle(true); setEditForm({...editForm, diff: e.target.value}); }}
                                        className="w-full h-13 px-4 rounded-2xl bg-white/[0.04] border border-white/12 text-sm text-white outline-none"
                                    >
                                        {DIFFICULTIES.map(d => <option key={d.id} value={d.id} className="bg-[#09080c] text-white">{d.name}</option>)}
                                    </select>
                                </div>
                            </div>

                            <button 
                                type="button"
                                onClick={() => { SoundFX.warn(); setConfirmModal({ action: 'delete', title: 'Точно ли вы хотите удалить вопрос из базы данных?' }); }}
                                className="w-full h-13 py-3.5 rounded-2xl border border-rose-500/40 bg-rose-500/10 hover:bg-rose-500/20 text-rose-300 text-xs font-bold uppercase tracking-wider flex items-center justify-center gap-2 transition-all active:scale-95"
                            >
                                <Icons.Trash /> Удалить вопрос
                            </button>

                            <div className="mt-auto pt-4 grid grid-cols-2 gap-3.5">
                                <button 
                                    type="button" 
                                    onClick={() => { SoundFX.click(); navigate(returnScreen); }} 
                                    className="w-full rounded-2xl btn-secondary text-xs font-bold uppercase tracking-widest"
                                >
                                    Отменить
                                </button>
                                <button 
                                    type="button"
                                    disabled={!hasChanges || isSaving}
                                    onClick={() => { SoundFX.click(); setConfirmModal({ action: 'save', title: 'Точно ли вы хотите изменить вопрос в базе данных?' }); }}
                                    className="w-full rounded-2xl btn-primary text-xs font-bold uppercase tracking-widest flex items-center justify-center gap-2 disabled:opacity-25 disabled:pointer-events-none"
                                >
                                    <Icons.Check /> Сохранить
                                </button>
                            </div>
                        </div>

                        <AppFooter />

                        {confirmModal && (
                            <div className="viewport-popup-overlay fade-in">
                                <div className="viewport-popup-box text-center flex flex-col items-center gap-5 slide-up">
                                    <h3 className="font-display text-base font-bold text-white leading-snug">
                                        {confirmModal.title}
                                    </h3>
                                    <div className="grid grid-cols-2 gap-3 w-full">
                                        <button 
                                            onClick={() => { SoundFX.click(); setConfirmModal(null); }}
                                            className="w-full rounded-2xl btn-secondary text-xs font-bold uppercase tracking-widest"
                                        >
                                            Отмена
                                        </button>
                                        <button 
                                            onClick={() => confirmModal.action === 'delete' ? executeDeleteQuestion() : executeSaveEdit()}
                                            className="w-full rounded-2xl btn-primary text-xs font-bold uppercase tracking-widest"
                                        >
                                            Да
                                        </button>
                                    </div>
                                </div>
                            </div>
                        )}

                        {resultModal && (
                            <div className="viewport-popup-overlay fade-in">
                                <div className="viewport-popup-box text-center flex flex-col items-center gap-4 slide-up">
                                    <h3 className="font-display text-lg font-bold text-white">
                                        {resultModal.ok ? 'Выполнено' : 'Ошибка базы данных'}
                                    </h3>
                                    <p className="text-xs text-zinc-400 leading-relaxed">
                                        {resultModal.msg}
                                    </p>
                                    <button 
                                        onClick={() => {
                                            SoundFX.click();
                                            const target = resultModal.afterCloseScreen;
                                            setResultModal(null);
                                            if (target) navigate(target);
                                        }}
                                        className="w-full rounded-2xl btn-primary text-xs font-bold uppercase tracking-widest mt-1"
                                    >
                                        Понятно
                                    </button>
                                </div>
                            </div>
                        )}
                    </div>
                );
            }

            // 11. ФОРМА ДОБАВЛЕНИЯ ВОПРОСА (#/add — Админ)
            if (screen === 'add_q' && isAdmin) {
                return (
                    <div className="safe-screen w-full flex flex-col fade-in max-w-lg mx-auto relative z-10">
                        <header className="flex items-center gap-3.5 mb-6 pt-2">
                            <button onClick={() => { SoundFX.click(); navigate(viewCategory ? 'q_list' : 'cat_list'); }} className="p-3 bg-white/[0.04] rounded-2xl hover:bg-white/[0.08] text-zinc-300 border border-white/10">
                                <Icons.Back />
                            </button>
                            <h2 className="font-display text-xl font-bold text-white">Новый вопрос</h2>
                        </header>

                        {addStatus ? (
                            <div className="flex-1 flex flex-col items-center justify-center slide-up">
                                <div className="w-full flex flex-col items-center text-center gap-4 py-8">
                                    <h3 className="font-display text-2xl font-bold text-white">
                                        {addStatus.ok ? 'Вопрос добавлен' : 'Ошибка сохранения'}
                                    </h3>
                                    <p className="text-xs text-zinc-400 mb-4 leading-relaxed max-w-xs">
                                        {addStatus.msg}
                                    </p>
                                    <div className="grid grid-cols-2 gap-3 w-full">
                                        <button 
                                            onClick={() => { SoundFX.click(); navigate(viewCategory ? 'q_list' : 'cat_list'); }} 
                                            className="btn-secondary w-full rounded-2xl text-xs font-bold uppercase tracking-widest"
                                        >
                                            К списку
                                        </button>
                                        <button 
                                            onClick={() => { SoundFX.click(); setAddStatus(null); setAddForm({ text: '', cat: addForm.cat, diff: addForm.diff }); }} 
                                            className="btn-primary w-full rounded-2xl text-xs font-bold uppercase tracking-widest"
                                        >
                                            Еще один
                                        </button>
                                    </div>
                                </div>
                                <AppFooter />
                            </div>
                        ) : (
                            <form onSubmit={handleAddQuestion} className="flex-1 flex flex-col gap-5 slide-up">
                                <div>
                                    <label className="block text-[11px] font-bold uppercase tracking-wider text-zinc-400 mb-2 ml-1">Текст вопроса</label>
                                    <textarea 
                                        required
                                        value={addForm.text}
                                        onChange={e => setAddForm({...addForm, text: e.target.value})}
                                        className="w-full p-4 rounded-2xl bg-white/[0.04] border border-white/12 text-base text-white placeholder-zinc-600 outline-none resize-none h-36 focus:border-rose-500 transition-colors"
                                        placeholder="Введите вопрос или нажмите «Идея от ИИ» ниже..."
                                    ></textarea>
                                </div>
                                
                                <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                    <div>
                                        <label className="block text-[11px] font-bold uppercase tracking-wider text-zinc-400 mb-2 ml-1">Тема</label>
                                        <select 
                                            value={addForm.cat}
                                            onChange={e => { SoundFX.toggle(true); setAddForm({...addForm, cat: e.target.value}); }}
                                            className="w-full h-13 px-4 rounded-2xl bg-white/[0.04] border border-white/12 text-sm text-white outline-none"
                                        >
                                            {CATEGORIES.map(c => <option key={c.id} value={c.id} className="bg-[#09080c] text-white">{c.icon} {c.name}</option>)}
                                        </select>
                                    </div>

                                    <div>
                                        <label className="block text-[11px] font-bold uppercase tracking-wider text-zinc-400 mb-2 ml-1">Сложность</label>
                                        <select 
                                            value={addForm.diff}
                                            onChange={e => { SoundFX.toggle(true); setAddForm({...addForm, diff: e.target.value}); }}
                                            className="w-full h-13 px-4 rounded-2xl bg-white/[0.04] border border-white/12 text-sm text-white outline-none"
                                        >
                                            {DIFFICULTIES.map(d => <option key={d.id} value={d.id} className="bg-[#09080c] text-white">{d.name}</option>)}
                                        </select>
                                    </div>
                                </div>

                                <button 
                                    type="button"
                                    disabled={isGeneratingQuestion}
                                    onClick={handleGenerateQuestionAI}
                                    className="w-full h-13 py-3.5 rounded-2xl border border-rose-500/40 bg-rose-500/10 hover:bg-rose-500/15 text-rose-200 text-xs font-bold uppercase tracking-wider flex items-center justify-center gap-2 disabled:opacity-50 transition-all"
                                >
                                    <Icons.Sparkles />
                                    {isGeneratingQuestion ? "Генерация..." : "Идея от ИИ"}
                                </button>

                                <div className="mt-auto pt-4 grid grid-cols-2 gap-3.5">
                                    <button type="button" onClick={() => { SoundFX.click(); navigate(viewCategory ? 'q_list' : 'cat_list'); }} className="w-full rounded-2xl btn-secondary text-xs font-bold uppercase tracking-widest">
                                        Отмена
                                    </button>
                                    <button type="submit" disabled={isSaving || !addForm.text.trim()} className="w-full rounded-2xl btn-primary text-xs font-bold uppercase tracking-widest flex items-center justify-center gap-2 disabled:opacity-30">
                                        <Icons.Plus /> {isSaving ? "Запись..." : "Сохранить"}
                                    </button>
                                </div>
                            </form>
                        )}
                        {!addStatus && <AppFooter />}
                    </div>
                );
            }

            return null;
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
