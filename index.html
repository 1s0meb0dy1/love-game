    <!-- Подключение Google Sans и каллиграфического шрифта Great Vibes для логотипа -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <style>
        @import url('https://fonts.cdnfonts.com/css/google-sans');
        
        :root {
            color-scheme: dark;
        }

        html, body {
            width: 100%;
            min-height: 100dvh;
            min-height: -webkit-fill-available;
            margin: 0;
            padding: 0;
            background-color: #14091a !important;
            font-family: 'Product Sans', 'Google Sans', sans-serif; 
            overflow-x: hidden;
            color: white; 
            -webkit-tap-highlight-color: transparent;
            touch-action: pan-y;
            overscroll-behavior-y: none;
        }

        /* Романтический рукописный шрифт для логотипа Ask Me */
        .font-romantic-logo {
            font-family: 'Great Vibes', cursive;
            background: linear-gradient(135deg, #fff1f2 0%, #fda4af 45%, #fb7185 75%, #e11d48 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 4px 20px rgba(225, 29, 72, 0.55));
        }

        /* Фиксированный переливающийся фон с запасом за края экрана */
        .fullscreen-bg {
            position: fixed;
            top: -20vh;
            bottom: -20vh;
            left: -20vw;
            right: -20vw;
            z-index: 0;
            background: linear-gradient(-45deg, #1f0d29, #2d1426, #141e30, #2f1322, #110b16);
            background-size: 400% 400%;
            animation: gradientShift 15s ease infinite;
            pointer-events: none;
        }

        /* Контейнер с учетом челки iPhone и нижней полоски навигации */
        .safe-screen {
            min-height: 100dvh;
            padding-top: max(1.25rem, env(safe-area-inset-top));
            padding-bottom: max(1.5rem, env(safe-area-inset-bottom));
            padding-left: max(1rem, env(safe-area-inset-left));
            padding-right: max(1rem, env(safe-area-inset-right));
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Стекломорфизм */
        .glass-panel { 
            background: rgba(20, 11, 28, 0.64); 
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.08); 
            border-radius: 1.75rem;
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.45);
        }

        /* Легкие карточки без темной теневой подложки */
        .clean-card {
            background: rgba(255, 255, 255, 0.045);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 1.5rem;
            transition: all 0.2s ease;
        }
        .clean-card:hover {
            background: rgba(255, 255, 255, 0.075);
            border-color: rgba(255, 255, 255, 0.15);
        }

        /* Кнопки одинаковой высоты (56px) */
        .btn-romantic {
            background: linear-gradient(135deg, #e11d48 0%, #881337 100%);
            box-shadow: 0 6px 25px rgba(225, 29, 72, 0.35);
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            height: 56px;
        }
        .btn-romantic:active { transform: scale(0.96); box-shadow: 0 2px 10px rgba(225, 29, 72, 0.5); }

        .btn-ai-magic {
            background: linear-gradient(135deg, rgba(139, 92, 246, 0.28) 0%, rgba(14, 165, 233, 0.28) 100%);
            border: 1px solid rgba(167, 139, 250, 0.45);
            box-shadow: 0 6px 25px rgba(139, 92, 246, 0.2);
            transition: all 0.25s ease;
            height: 56px;
        }
        .btn-ai-magic:active { transform: scale(0.96); }

        .btn-ghost {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.14);
            color: rgba(255,255,255,0.88);
            transition: all 0.25s ease;
            height: 56px;
        }
        .btn-ghost:active { transform: scale(0.96); background: rgba(255,255,255,0.1); }
        
        .cat-btn-active {
            background: rgba(255, 255, 255, 0.11);
            border: 1px solid rgba(255, 200, 220, 0.35);
            box-shadow: 0 0 20px rgba(255, 200, 220, 0.12);
            transform: scale(0.98);
        }
        .cat-btn-inactive {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        /* Анимации */
        .fade-in { animation: fadeIn 0.3s ease-out forwards; }
        .slide-up { animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .heart-pulse { animation: heartPulse 1.8s infinite ease-in-out; }
        .roulette-glow { animation: rouletteGlow 0.6s infinite alternate ease-in-out; }
        
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes heartPulse { 0%, 100% { transform: scale(1); } 15% { transform: scale(1.15); } 30% { transform: scale(1); } 45% { transform: scale(1.1); } }
        @keyframes rouletteGlow { from { box-shadow: 0 0 15px rgba(225, 29, 72, 0.3); } to { box-shadow: 0 0 35px rgba(56, 189, 248, 0.6); } }

        /* Анимация летящих сердечек для поздравления при ответе на все вопросы */
        .floating-heart {
            position: fixed;
            bottom: -10vh;
            pointer-events: none;
            z-index: 5;
            animation: floatUpwards linear infinite;
        }
        @keyframes floatUpwards {
            0% { transform: translateY(0) scale(0.7) rotate(0deg); opacity: 0; }
            15% { opacity: 0.85; }
            85% { opacity: 0.85; }
            100% { transform: translateY(-115vh) scale(1.25) rotate(25deg); opacity: 0; }
        }

        .checkmark-circle { stroke-dasharray: 166; stroke-dashoffset: 166; stroke-width: 2; stroke-miterlimit: 10; stroke: #10b981; fill: none; animation: stroke 0.6s cubic-bezier(0.65, 0, 0.45, 1) forwards; }
        .checkmark { width: 64px; height: 64px; border-radius: 50%; display: block; stroke-width: 2; stroke: #fff; stroke-miterlimit: 10; margin: 10% auto; box-shadow: inset 0px 0px 0px #10b981; animation: fill .4s ease-in-out .4s forwards, scale .3s ease-in-out .9s both; }
        .checkmark-check { transform-origin: 50% 50%; stroke-dasharray: 48; stroke-dashoffset: 48; animation: stroke 0.3s cubic-bezier(0.65, 0, 0.45, 1) 0.8s forwards; }
        @keyframes stroke { 100% { stroke-dashoffset: 0; } }
        @keyframes scale { 0%, 100% { transform: none; } 50% { transform: scale3d(1.1, 1.1, 1); } }
        @keyframes fill { 100% { box-shadow: inset 0px 0px 0px 35px #10b981; } }

        .ai-cursor::after { content: '|'; animation: blink 1s step-end infinite; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

        /* Цвета сложностей */
        .diff-easy { color: #34d399; }
        .diff-med  { color: #fbbf24; }
        .diff-hard { color: #fb7185; }
        .bg-diff-easy { background: rgba(52, 211, 153, 0.15); border: 1px solid rgba(52, 211, 153, 0.35); }
        .bg-diff-med  { background: rgba(251, 191, 36, 0.15); border: 1px solid rgba(251, 191, 36, 0.35); }
        .bg-diff-hard { background: rgba(251, 113, 133, 0.15); border: 1px solid rgba(251, 113, 133, 0.35); }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>

        const GEMINI_API_KEY = "AQ.Ab8RN6JlrwetdJDgph_PDXCwnW1GCoUcw6jc8_iIBLEbG1dNWA"; 
        const PROFILE_STORAGE_KEY = "askme_device_profile_v2";
        const ADMIN_STORAGE_KEY = "askme_admin_unlocked_v2";

        // Проверка секретного кода владельца
        const verifyAdminSecret = (input) => {
            const clean = String(input || "").trim().toLowerCase();
            return clean === "7777" || clean === "askme777" || clean === "2402";

        // Защита от XSS и вредоносного ввода
        const sanitizeInput = (str, maxLength = 600) => {
            if (!str) return "";
            return String(str)
                .replace(/[<>]/g, "")
                .replace(/javascript:/gi, "")
                .replace(/on\w+=/gi, "")
                .trim()
                .slice(0, maxLength);
        };

        // Защита от спам-запросов
        const ActionGuard = {
            lastActionTime: 0,
            canProceed(cooldownMs = 700) {
                const now = Date.now();
                if (now - this.lastActionTime < cooldownMs) return false;
                this.lastActionTime = now;
                return true;
            }
        };

        const CATEGORIES = [
            { id: "family", name: "Семья", icon: "👨‍👩‍👧‍👦", color: "from-blue-950/40 to-transparent" },
            { id: "intimacy", name: "Интим", icon: "🔞", color: "from-rose-950/40 to-transparent" },

            { id: "secrets", name: "Секреты", icon: "🤫", color: "from-fuchsia-950/40 to-transparent" },

        const DIFFICULTIES = [

            { id: "Средние", name: "Средние", classText: "diff-med", classBg: "bg-diff-med" },

        ];

        // ЗВУКОВОЙ ДВИЖОК (с романтичной мелодией финала)
        const SoundFX = {
            ctx: null,
            muted: false,
            unlocked: false,
            init() {
                try {
                    const AudioCtx = window.AudioContext || window.webkitAudioContext;
                    if (!AudioCtx) return;
                    if (!this.ctx) {
                        this.ctx = new AudioCtx();
                    }
                    if (this.ctx.state === 'suspended') {
                        this.ctx.resume();
                    }
                    if (!this.unlocked && this.ctx) {
                        const buffer = this.ctx.createBuffer(1, 1, 22050);
                        const source = this.ctx.createBufferSource();
                        source.buffer = buffer;
                        source.connect(this.ctx.destination);
                        if (source.start) source.start(0);
                        this.unlocked = true;
                    }
                } catch (e) {}
            },
            playTone(freq, type = 'sine', duration = 0.11, vol = 0.28, slideFreq = null) {
                if (this.muted) return;
                try {
                    this.init();
                    if (!this.ctx) return;
                    const now = this.ctx.currentTime;
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();

                    osc.type = type;
                    osc.frequency.setValueAtTime(freq, now);
                    if (slideFreq) {
                        osc.frequency.exponentialRampToValueAtTime(slideFreq, now + duration);
                    }

                    gain.gain.setValueAtTime(0.001, now);
                    gain.gain.linearRampToValueAtTime(vol, now + 0.012);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + duration);

                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(now);
                    osc.stop(now + duration + 0.01);
                } catch (e) {}
            },
            click() {
                this.playTone(540, 'sine', 0.08, 0.25, 720);
            },
            toggle(active = true) {
                this.playTone(active ? 580 : 440, 'triangle', 0.09, 0.24, active ? 780 : 330);
            },
            rouletteTick() {
                this.playTone(720, 'triangle', 0.06, 0.22, 400);
            },
            rouletteWin() {
                if (this.muted) return;
                this.init();
                setTimeout(() => this.playTone(523.25, 'sine', 0.16, 0.3), 0);
                setTimeout(() => this.playTone(659.25, 'sine', 0.16, 0.3), 110);
                setTimeout(() => this.playTone(783.99, 'sine', 0.34, 0.35), 220);
            },
            romanticFinale() {
                // Красивый лиричный арпеджио-аккорд при ответе на все вопросы
                if (this.muted) return;
                this.init();
                const notes = [
                    { f: 440.00, d: 0.45, t: 0 },     // A4
                    { f: 554.37, d: 0.45, t: 140 },   // C#5
                    { f: 659.25, d: 0.50, t: 280 },   // E5
                    { f: 830.61, d: 0.60, t: 420 },   // G#5
                    { f: 880.00, d: 0.95, t: 580 }    // A5
                ];
                notes.forEach(n => {
                    setTimeout(() => this.playTone(n.f, 'sine', n.d, 0.32), n.t);
                });
            },
            magic() {
                if (this.muted) return;
                this.init();
                setTimeout(() => this.playTone(480, 'sine', 0.14, 0.25, 680), 0);
                setTimeout(() => this.playTone(680, 'sine', 0.22, 0.28, 920), 90);
            },
            success() {
                if (this.muted) return;
                this.init();
                setTimeout(() => this.playTone(587.33, 'sine', 0.14, 0.28), 0);
                setTimeout(() => this.playTone(880, 'sine', 0.28, 0.32), 110);
            },
            warn() {
                this.playTone(320, 'triangle', 0.16, 0.26, 210);
            }
        };

        if (typeof window !== 'undefined') {
            const unlockHandler = () => SoundFX.init();
            window.addEventListener('touchstart', unlockHandler, { passive: true, once: true });
            window.addEventListener('click', unlockHandler, { passive: true, once: true });
        }

        const AskMeLogo = ({ size = "lg", onClick = null }) => {

                                <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
                            </svg>

            // Большой парадный логотип для Главной страницы
            return (

                    <div className="relative flex items-center justify-center">
                        {/* Декоративное левое крыло-росчерк */}
                        <svg className="w-9 h-9 md:w-11 md:h-11 text-rose-400/60 -mr-2 opacity-80" viewBox="0 0 64 64" fill="none">

                            <svg className="w-6 h-6 md:w-7 md:h-7 text-rose-500 heart-pulse drop-shadow-[0_0_15px_rgba(225,29,72,0.9)]" viewBox="0 0 24 24" fill="currentColor">
                                <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
                            </svg>

                            </linearGradient>
                        </defs>
                    </svg>

        };

        // КОМПОНЕНТ ПОДВАЛА САЙТА (ФУТЕР)
        const AppFooter = ({ extraBottomPadding = false }) => (
            <footer className={`w-full py-4 mt-6 flex flex-col items-center justify-center gap-1 opacity-75 hover:opacity-100 transition-opacity select-none z-10 ${extraBottomPadding ? 'pb-20' : ''}`}>
                <div className="flex items-center gap-2.5">
                    <AskMeLogo size="xs" />
                    <span className="text-white/20 text-xs">•</span>
                    <span className="text-[11px] text-white/40 tracking-widest uppercase font-medium">
                        by <span className="text-rose-300/80 font-bold tracking-wider">yedvinn</span>

        // Многоуровневый вызов нейросети
        const callNeuralNet = async (systemPrompt, userPrompt, maxTokens = 900) => {
            const randomSeed = Math.floor(Math.random() * 10000000);

            if (GEMINI_API_KEY && GEMINI_API_KEY.startsWith("AIza")) {
                try {
                    const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}`;
                    const response = await fetch(url, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            contents: [{ parts: [{ text: systemPrompt + "\n\n" + userPrompt }] }],
                            generationConfig: { temperature: 0.95, maxOutputTokens: maxTokens }
                        })
                    });
                    if (response.ok) {
                        const data = await response.json();
                        const text = data?.candidates?.[0]?.content?.parts?.[0]?.text;
                        if (text) return text.trim();
                    }
                } catch (e) {}

            try {
                const response = await fetch("https://text.pollinations.ai/openai", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({

            const [adminPinInput, setAdminPinInput] = useState('');
            const [adminPinError, setAdminPinError] = useState('');
            const [logoTapCount, setLogoTapCount] = useState(0);

            const [screen, setScreen] = useState(() => profile ? 'menu' : 'onboarding'); 
            const [selectedCats, setSelectedCats] = useState(CATEGORIES.map(c => c.id));
            const [selectedDiffs, setSelectedDiffs] = useState(DIFFICULTIES.map(d => d.id));
            const [isMuted, setIsMuted] = useState(false);

            // Режим игры: 'normal' | 'test'
            const [gameMode, setGameMode] = useState('normal');

            const [gameQuestions, setGameQuestions] = useState([]);
            const [currentIndex, setCurrentIndex] = useState(0);
            const [maxReachedIndex, setMaxReachedIndex] = useState(0);
            const [turnHistory, setTurnHistory] = useState({});
            const [answeredCount, setAnsweredCount] = useState(0); 
            const [completedAllFlag, setCompletedAllFlag] = useState(false);
            const [showEndGameConfirm, setShowEndGameConfirm] = useState(false);

            // Состояние для рандомного выбора первого игрока в Обычном режиме
            const [turnPopup, setTurnPopup] = useState({ open: false, spinning: false, highlight: 'guy', winner: null });
            const rouletteTimeoutsRef = useRef([]);

            // Состояние для AI-экрана
            const [aiType, setAiType] = useState('situation');
            const [aiContent, setAiContent] = useState('');
            const [isAiTyping, setIsAiTyping] = useState(false);
            const typingIntervalRef = useRef(null);

            // Списки, Архив и фильтры
            const [viewCategory, setViewCategory] = useState(null);
            const [visibleLimit, setVisibleLimit] = useState(60);
            const [archiveExpanded, setArchiveExpanded] = useState(false);
            const [archiveFilterCat, setArchiveFilterCat] = useState('all');
            const [archiveFilterDiff, setArchiveFilterDiff] = useState('all');
            const [archiveSearch, setArchiveSearch] = useState('');
            const [archiveVisibleLimit, setArchiveVisibleLimit] = useState(50);
            
            // Добавление вопроса + AI генерация (только для Админа)
            const [addForm, setAddForm] = useState({ text: '', cat: 'family', diff: 'Простые' });
            const [addStatus, setAddStatus] = useState(null);
            const [isSaving, setIsSaving] = useState(false);
            const [isGeneratingQuestion, setIsGeneratingQuestion] = useState(false);

            // Редактирование и удаление вопроса (только для Админа)
            const [editingQuestion, setEditingQuestion] = useState(null);
            const [editForm, setEditForm] = useState({ text: '', cat: 'family', diff: 'Простые' });
            const [returnScreen, setReturnScreen] = useState('menu');
            const [confirmModal, setConfirmModal] = useState(null);
            const [resultModal, setResultModal] = useState(null);

            // Автоматическое сохранение профиля на устройстве
            useEffect(() => {
                if (profile) {
                    try {
                        localStorage.setItem(PROFILE_STORAGE_KEY, JSON.stringify(profile));
                    } catch (e) {}
                }
            }, [profile]);

            const toggleMute = () => {
                const nextState = !isMuted;
                setIsMuted(nextState);
                SoundFX.muted = nextState;
                if (!nextState) SoundFX.click();
            };

            // Секретный вход для владельца по 5 нажатиям на логотип "Ask Me"
            const handleLogoSecretTap = () => {
                const nextCount = logoTapCount + 1;
                setLogoTapCount(nextCount);
                if (nextCount >= 5) {
                    SoundFX.magic();
                    setLogoTapCount(0);
                    setProfileForm({ guyName: profile?.guyName || 'Максим', girlName: profile?.girlName || 'Анна' });
                    setShowProfileModal(true);
                }
            };

            // Сохранение имен профиля
            const handleSaveProfileNames = (e) => {
                e.preventDefault();
                const gName = sanitizeInput(profileForm.guyName, 25);
                const fName = sanitizeInput(profileForm.girlName, 25);
                if (!gName || !fName) return;

                SoundFX.success();
                const updatedProfile = {
                    id: profile?.id || ('prof_' + Math.random().toString(36).slice(2, 10)),
                    guyName: gName,
                    girlName: fName,
                    archivedIds: profile?.archivedIds || [],
                    disabledIds: profile?.disabledIds || []
                };
                setProfile(updatedProfile);
                setShowProfileModal(false);
                if (screen === 'onboarding') {
                    setScreen('menu');
                }
            };

            const handleUnlockAdmin = () => {
                if (verifyAdminSecret(adminPinInput)) {
                    SoundFX.success();
                    setIsAdmin(true);
                    localStorage.setItem(ADMIN_STORAGE_KEY, "true");
                    setAdminPinInput('');
                    setAdminPinError('');
                } else {
                    SoundFX.warn();
                    setAdminPinError('Неверный секретный код владельца');
                }
            };

            const handleLockAdmin = () => {
                SoundFX.click();
                setIsAdmin(false);
                localStorage.removeItem(ADMIN_STORAGE_KEY);
            };

            // Парсинг базы со сквозной сортировкой номеров 1..N
            const parseDatabaseObject = (rawObj) => {
                const entries = Object.entries(rawObj);
                const parsed = [];

                for (let i = 0; i < entries.length; i++) {
                    const [dbKey, item] = entries[i];
                    if (!item || typeof item !== 'object' || !item.text) continue;

                    const matchNum = String(item.text).match(/^№\s*(\d+)\.\s*(.*)/s);
                    const cleanText = matchNum ? matchNum[2].trim() : String(item.text).trim();

                    parsed.push({
                        dbKey: String(dbKey),
                        id: item.id || `q_${i + 1}`,
                        origNum: item.num ? Number(item.num) : (matchNum ? Number(matchNum[1]) : i + 1),
                        categoryId: item.categoryId || "family",
                        level: item.level || "Простые",
                        cleanText: cleanText
                    });
                }

                parsed.sort((a, b) => a.origNum - b.origNum);
                return reindexSequential(parsed);
            };

            // Загрузка вопросов из Firebase
            useEffect(() => {
                const initDatabase = async () => {
                    try {
                        const res = await fetch(`${FIREBASE_BASE_URL}/.json?t=${Date.now()}`);
                        if (!res.ok) throw new Error(`HTTP ${res.status}`);
                        const data = await res.json();

                        if (data) {
                            if (data.questions && typeof data.questions === 'object') {
                                setDbSubPath("/questions");
                                setDb(parseDatabaseObject(data.questions));
                            } else {
                                setDbSubPath("");
                                setDb(parseDatabaseObject(data));
                            }
                            setIsLoading(false);
                        } else {
                            const gistRes = await fetch(`${GIST_FALLBACK_URL}?t=${Date.now()}`);
                            const gistData = await gistRes.json();
                            const formattedForFirebase = gistData.map((q, idx) => {
                                const m = String(q.text).match(/^№\s*(\d+)\.\s*(.*)/s);
                                const cText = m ? m[2].trim() : String(q.text).trim();
                                return {
                                    id: q.id || `v_init_${idx + 1}`,
                                    num: idx + 1,
                                    categoryId: q.categoryId || "family",
                                    level: q.level || "Простые",
                                    text: cText
                                };
                            });

                            await fetch(`${FIREBASE_BASE_URL}/.json`, {
                                method: "PUT",
                                headers: { "Content-Type": "application/json" },
                                body: JSON.stringify(formattedForFirebase)
                            });

                            setDbSubPath("");
                            setDb(parseDatabaseObject(formattedForFirebase));
                            setIsLoading(false);
                        }
                    } catch (err) {
                        console.error("Firebase load error, falling back to Gist:", err);
                        try {
                            const gistRes = await fetch(`${GIST_FALLBACK_URL}?t=${Date.now()}`);
                            const gistData = await gistRes.json();
                            setDb(parseDatabaseObject(gistData));
                        } catch (e) {
                            setDb([]);
                        }
                        setIsLoading(false);
                    }
                };
                initDatabase();
            }, []);

            // Обогащенный список вопросов с учетом персонального Архива и Отключенных вопросов текущего профиля
            const profileDb = useMemo(() => {
                const archSet = new Set(profile?.archivedIds || []);
                const disSet = new Set(profile?.disabledIds || []);
                return db.map(q => ({
                    ...q,
                    archived: archSet.has(q.id) || archSet.has(q.dbKey),
                    disabled: disSet.has(q.id) || disSet.has(q.dbKey)
                }));
            }, [db, profile]);

            // Статистика по текущему профилю
            const stats = useMemo(() => {
                const activeByCat = {};
                const totalByCat = {};
                const archivedByCat = {};
                CATEGORIES.forEach(c => { activeByCat[c.id] = 0; totalByCat[c.id] = 0; archivedByCat[c.id] = 0; });

                let availableActive = 0;
                let availableTotal = 0;
                let disabledCount = 0;
                const archivedList = [];

                for (let i = 0; i < profileDb.length; i++) {
                    const q = profileDb[i];
                    if (totalByCat[q.categoryId] !== undefined) totalByCat[q.categoryId]++;
                    
                    const matchesDiff = selectedDiffs.includes(q.level);
                    const matchesCat = selectedCats.includes(q.categoryId);

                    if (q.disabled) {
                        disabledCount++;
                    }

                    if (q.archived) {
                        archivedList.push(q);
                        if (archivedByCat[q.categoryId] !== undefined) archivedByCat[q.categoryId]++;
                    } else if (!q.disabled) {
                        if (activeByCat[q.categoryId] !== undefined) activeByCat[q.categoryId]++;
                        if (matchesCat && matchesDiff) availableActive++;
                    }

                    if (matchesCat && matchesDiff) {
                        availableTotal++;
                    }
                }

                return { activeByCat, totalByCat, archivedByCat, availableActive, availableTotal, disabledCount, archivedList };
            }, [profileDb, selectedCats, selectedDiffs]);

            // Фильтрация внутри Архива
            const filteredArchivedList = useMemo(() => {
                return stats.archivedList.filter(q => {
                    if (archiveFilterCat !== 'all' && q.categoryId !== archiveFilterCat) return false;
                    if (archiveFilterDiff !== 'all' && q.level !== archiveFilterDiff) return false;
                    if (archiveSearch.trim() !== '') {
                        const s = archiveSearch.toLowerCase().trim();
                        const matchText = q.cleanText.toLowerCase().includes(s);
                        const matchNum = String(q.num).includes(s);
                        if (!matchText && !matchNum) return false;
                    }
                    return true;
                });
            }, [stats.archivedList, archiveFilterCat, archiveFilterDiff, archiveSearch]);

            const toggleCategory = (catId) => {
                if (stats.activeByCat[catId] === 0 && stats.totalByCat[catId] === 0) return;
                const willBeSelected = !selectedCats.includes(catId);
                SoundFX.toggle(willBeSelected);
                setSelectedCats(prev => willBeSelected ? [...prev, catId] : prev.filter(id => id !== catId));
            };

            const toggleDiff = (diffId) => {
                const willBeSelected = !selectedDiffs.includes(diffId);
                SoundFX.toggle(willBeSelected);
                setSelectedDiffs(prev => willBeSelected ? [...prev, diffId] : prev.filter(id => id !== diffId));
            };

            const toggleQuestionPersonalEnable = (qObj) => {
                if (!profile) return;
                const targetKey = qObj.id || qObj.dbKey;
                const currentlyDisabled = (profile.disabledIds || []).includes(targetKey);
                SoundFX.toggle(currentlyDisabled);
                setProfile(prev => {
                    const list = prev.disabledIds || [];
                    const nextList = currentlyDisabled ? list.filter(k => k !== targetKey) : [...list, targetKey];
                    return { ...prev, disabledIds: nextList };
                });
            };

            // ПЛАВНАЯ РУЛЕТКА С ЭФФЕКТОМ ЗАМЕДЛЕНИЯ (не слишком быстрая и не слишком медленная ~2.2 сек)
            const triggerRouletteForIndex = (targetIdx, currentHistory) => {
                if (currentHistory[targetIdx]) return;

                // Очищаем старые таймеры, если были
                rouletteTimeoutsRef.current.forEach(t => clearTimeout(t));
                rouletteTimeoutsRef.current = [];

                const winner = Math.random() < 0.5 ? 'guy' : 'girl';
                const startSide = winner === 'guy' ? 'girl' : 'guy'; // Чтобы ровно на 11-м шаге остановиться на победителе
                setTurnPopup({ open: true, spinning: true, highlight: startSide, winner: null });

                // Шаги замедления в миллисекундах (плавный переход от 140мс до 340мс)
                const stepDelays = [140, 155, 170, 190, 210, 235, 260, 290, 320, 350];
                let cumulativeTime = 0;
                let currentHighlight = startSide;

                stepDelays.forEach((delay, idx) => {
                    cumulativeTime += delay;
                    const tId = setTimeout(() => {
                        currentHighlight = currentHighlight === 'guy' ? 'girl' : 'guy';
                        if (idx < stepDelays.length - 1) {
                            SoundFX.rouletteTick();
                            setTurnPopup({ open: true, spinning: true, highlight: currentHighlight, winner: null });
                        } else {
                            // Финальный шаг — победа!
                            SoundFX.rouletteWin();
                            setTurnPopup({ open: true, spinning: false, highlight: winner, winner: winner });
                            setTurnHistory(prev => ({ ...prev, [targetIdx]: winner }));
                        }
                    }, cumulativeTime);
                    rouletteTimeoutsRef.current.push(tId);
                });
            };

            const handlePressStartButton = () => {
                SoundFX.click();
                if (isAdmin) {
                    setScreen('mode_select');
                } else {
                    startWithMode('normal');
                }
            };

            const startWithMode = (mode) => {
                SoundFX.click();
                let pool = [];
                if (mode === 'normal') {
                    pool = profileDb.filter(q => !q.archived && !q.disabled && selectedCats.includes(q.categoryId) && selectedDiffs.includes(q.level));
                    if (pool.length === 0) {
                        alert("Для новой игры нет активных вопросов по выбранным темам (возможно, они в Архиве или скрыты). Верните вопросы из Архива в разделе «Список вопросов»! ❤️");
                        return;
                    }
                } else {
                    const catsToUse = selectedCats.length > 0 ? selectedCats : CATEGORIES.map(c => c.id);
                    const diffsToUse = selectedDiffs.length > 0 ? selectedDiffs : DIFFICULTIES.map(d => d.id);
                    pool = profileDb.filter(q => catsToUse.includes(q.categoryId) && diffsToUse.includes(q.level));
                    if (pool.length === 0) {
                        alert("В базе нет вопросов по этим фильтрам!");
                        return;
                    }
                }

                const shuffled = [...pool];
                for (let i = shuffled.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
                }

                setGameMode(mode);
                setGameQuestions(shuffled);
                setCurrentIndex(0);
                setMaxReachedIndex(0);
                setTurnHistory({});
                setAnsweredCount(0);
                setCompletedAllFlag(false);
                setShowEndGameConfirm(false);
                setScreen('game');

                if (mode === 'normal') {
                    triggerRouletteForIndex(0, {});
                }
            };

            const handleNextQuestion = () => {
                SoundFX.click();
                if (currentIndex < gameQuestions.length - 1) {
                    const nextIdx = currentIndex + 1;
                    setCurrentIndex(nextIdx);
                    if (nextIdx > maxReachedIndex) {
                        setMaxReachedIndex(nextIdx);
                    }
                    if (gameMode === 'normal' && !turnHistory[nextIdx]) {
                        triggerRouletteForIndex(nextIdx, turnHistory);
                    }
                } else {
                    handleFinishGame(true);
                }
            };

            const handlePrevQuestion = () => {
                if (currentIndex <= 0) return;
                SoundFX.click();
                setCurrentIndex(prev => prev - 1);
            };

            const archiveAnsweredQuestions = (questionsToArchive) => {
                if (!questionsToArchive || questionsToArchive.length === 0 || !profile) return;
                const newArchKeys = questionsToArchive.map(q => q.id || q.dbKey);
                setProfile(prev => {
                    const merged = Array.from(new Set([...(prev.archivedIds || []), ...newArchKeys]));
                    return { ...prev, archivedIds: merged };
                });
            };

            const handleRestoreSingleFromArchive = (qObj) => {
                SoundFX.success();
                setProfile(prev => ({
                    ...prev,
                    archivedIds: (prev.archivedIds || []).filter(k => k !== qObj.id && k !== qObj.dbKey)
                }));
            };

            const handleRestoreBatchFromArchive = (listToRestore) => {
                if (!listToRestore || listToRestore.length === 0) return;
                SoundFX.success();
                const keysToRemove = new Set();
                listToRestore.forEach(q => {
                    keysToRemove.add(q.id);
                    keysToRemove.add(q.dbKey);
                });
                setProfile(prev => ({
                    ...prev,
                    archivedIds: (prev.archivedIds || []).filter(k => !keysToRemove.has(k))
                }));
            };

            // Завершение игры (с проверкой, ответила ли пара на ВСЕ вопросы)
            const handleFinishGame = (reachedVeryEnd = false) => {
                SoundFX.click();
                setShowEndGameConfirm(false);

                if (gameMode === 'test') {
                    setScreen('menu');
                    return;
                }

                const totalAnswered = maxReachedIndex + 1;
                const answeredSlice = gameQuestions.slice(0, totalAnswered);
                const isAllCleared = reachedVeryEnd || (totalAnswered >= gameQuestions.length && gameQuestions.length > 0);

                setAnsweredCount(totalAnswered);
                setCompletedAllFlag(isAllCleared);

                if (isAllCleared) {
                    SoundFX.romanticFinale();
                } else {
                    SoundFX.success();
                }

                archiveAnsweredQuestions(answeredSlice);
                setScreen('summary');
            };

            const triggerAI = async (type) => {
                if (!ActionGuard.canProceed(600)) return;
                SoundFX.magic();
                setAiType(type);
                setAiContent(type === 'situation' ? "Моделирую уникальную ситуацию..." : "Формирую психологический разбор...");
                setIsAiTyping(true);
                setScreen('ai_response');

                const q = gameQuestions[currentIndex];
                const response = await fetchFromAI(
                    type,
                    q.cleanText || q.text,
                    q.categoryId,
                    profile?.guyName || "Парень",
                    profile?.girlName || "Девушка"
                );
                
                if (typingIntervalRef.current) clearInterval(typingIntervalRef.current);
                
                setAiContent("");
                let i = 0;
                typingIntervalRef.current = setInterval(() => {
                    setAiContent(response.substring(0, i + 1));
                    i += 2;
                    if (i >= response.length) {
                        setAiContent(response);
                        clearInterval(typingIntervalRef.current);
                        setIsAiTyping(false);
                    }
                }, 8);
            };

            const handleGenerateQuestionAI = async () => {
                if (!isAdmin || isGeneratingQuestion || !ActionGuard.canProceed(800)) return;
                SoundFX.magic();
                setIsGeneratingQuestion(true);

                try {
                    const randomCat = CATEGORIES[Math.floor(Math.random() * CATEGORIES.length)];
                    const randomDiff = DIFFICULTIES[Math.floor(Math.random() * DIFFICULTIES.length)];

                    const generatedText = await generateUniqueQuestionAI(
                        randomCat,
                        randomDiff,
                        db,
                        profile?.guyName || "Парень",
                        profile?.girlName || "Девушка"
                    );
                    if (generatedText) {
                        SoundFX.success();
                        setAddForm({
                            text: generatedText,
                            cat: randomCat.id,
                            diff: randomDiff.id
                        });
                    }
                } catch (err) {
                    console.error(err);
                } finally {
                    setIsGeneratingQuestion(false);
                }
            };

            const openEditScreen = (questionObj, fromScreen) => {
                if (!isAdmin) return;
                SoundFX.click();
                setEditingQuestion(questionObj);
                setEditForm({
                    text: questionObj.cleanText || questionObj.text.replace(/^№\s*\d+\.\s*/, ''),
                    cat: questionObj.categoryId,
                    diff: questionObj.level
                });
                setReturnScreen(fromScreen);
                setConfirmModal(null);
                setResultModal(null);
                setScreen('edit_q');
            };

            const handleAddQuestion = async (e) => {
                e.preventDefault();
                if (!isAdmin || !addForm.text.trim() || isSaving || !ActionGuard.canProceed(1000)) return;
                SoundFX.click();
                setIsSaving(true);

                try {
                    const cleanInput = sanitizeInput(addForm.text.replace(/^№\s*\d+\.\s*/, ''), 500);
                    if (!cleanInput) throw new Error("Пустой текст вопроса");
                    const nextNum = db.length + 1;

                    const numericKeys = db.map(item => Number(item.dbKey)).filter(n => !isNaN(n));
                    const nextDbKey = numericKeys.length > 0 ? String(Math.max(...numericKeys) + 1) : String(db.length);
                    const newId = `v_db_${nextNum}_${Math.random().toString(36).substring(2, 6)}`;

                    const payload = {
                        id: newId,
                        num: nextNum,
                        categoryId: addForm.cat,
                        level: addForm.diff,
                        text: cleanInput
                    };

                    const res = await fetch(`${FIREBASE_BASE_URL}${dbSubPath}/${nextDbKey}.json`, {
                        method: "PUT",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify(payload)
                    });

                    if (!res.ok) {
                        const errText = await res.text();
                        throw new Error(`Код ответа сервера: ${res.status}. ${errText}`);
                    }

                    const createdQuestion = {
                        ...payload,
                        dbKey: nextDbKey,
                        cleanText: cleanInput,
                        text: `№ ${nextNum}. ${cleanInput}`
                    };

                    SoundFX.success();
                    setDb(prev => reindexSequential([...prev, createdQuestion]));
                    setAddStatus({
                        ok: true,
                        msg: `Вопрос № ${nextNum} успешно сохранен в базу данных и доступен в новой игре!`,
                        id: newId
                    });
                } catch (err) {
                    SoundFX.warn();
                    setAddStatus({
                        ok: false,
                        msg: `Вопрос НЕ был сохранен в базу данных. Причина: ${err.message || "Ошибка сети или правил доступа Firebase."}`
                    });
                } finally {
                    setIsSaving(false);
                }
            };

            const executeSaveEdit = async () => {
                if (!isAdmin || !editingQuestion || isSaving) return;
                SoundFX.click();
                setIsSaving(true);
                setConfirmModal(null);

                const cleanUpdatedText = sanitizeInput(editForm.text.replace(/^№\s*\d+\.\s*/, ''), 500);
                const updatedPayload = {
                    id: editingQuestion.id,
                    num: editingQuestion.num,
                    categoryId: editForm.cat,
                    level: editForm.diff,
                    text: cleanUpdatedText
                };

                try {
                    const res = await fetch(`${FIREBASE_BASE_URL}${dbSubPath}/${editingQuestion.dbKey}.json`, {
                        method: "PATCH",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify(updatedPayload)
                    });

                    if (!res.ok) {
                        const errText = await res.text();
                        throw new Error(`Код ${res.status}: ${errText}`);
                    }

                    const updatedObj = {
                        ...editingQuestion,
                        categoryId: editForm.cat,
                        level: editForm.diff,
                        cleanText: cleanUpdatedText,
                        text: `№ ${editingQuestion.num}. ${cleanUpdatedText}`
                    };

                    SoundFX.success();
                    setDb(prev => prev.map(q => q.dbKey === editingQuestion.dbKey ? updatedObj : q));
                    setGameQuestions(prev => prev.map(q => q.dbKey === editingQuestion.dbKey ? updatedObj : q));
                    setEditingQuestion(updatedObj);

                    setResultModal({
                        ok: true,
                        msg: `Вопрос № ${editingQuestion.num} (ID: ${editingQuestion.id}) успешно изменен в базе данных!`,
                        afterCloseScreen: returnScreen
                    });
                } catch (err) {
                    SoundFX.warn();
                    setResultModal({
                        ok: false,
                        msg: `Не удалось изменить вопрос в базе данных. Причина: ${err.message || "Сбой соединения."}`
                    });
                } finally {
                    setIsSaving(false);
                }
            };

            const executeDeleteQuestion = async () => {
                if (!isAdmin || !editingQuestion || isSaving) return;
                SoundFX.click();
                setIsSaving(true);
                setConfirmModal(null);

                try {
                    const res = await fetch(`${FIREBASE_BASE_URL}${dbSubPath}/${editingQuestion.dbKey}.json`, {
                        method: "DELETE"
                    });

                    if (!res.ok) {
                        const errText = await res.text();
                        throw new Error(`Код ${res.status}: ${errText}`);
                    }

                    SoundFX.success();
                    setDb(prev => {
                        const filtered = prev.filter(q => q.dbKey !== editingQuestion.dbKey);
                        return reindexSequential(filtered);

                    setGameQuestions(prev => {

                                        </p>
                                    ) : (
                                        <>
                                            {archiveExpanded && (
                                                <div className="flex flex-col gap-3.5 mt-1">

                                                            type="text"

                                                        />

                                                        <div className="grid grid-cols-2 gap-2">
                                                            <select 
                                                                value={archiveFilterCat}

                                                                    <option key={c.id} value={c.id} className="bg-[#160a1c]">
                                                                        {c.icon} {c.name} ({stats.archivedByCat[c.id] || 0})

                                                                value={archiveFilterDiff}
