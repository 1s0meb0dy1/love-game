<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Игра для Влада и Иры ❤️</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Montserrat', sans-serif; 
            overflow: hidden; /* Предотвращаем скролл от частиц */
            background-color: #0f172a; 
            color: white; 
            -webkit-tap-highlight-color: transparent;
        }
        
        /* Стили стекломорфизма */
        .glass-panel { 
            background: rgba(20, 25, 40, 0.4); 
            backdrop-filter: blur(16px); 
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1); 
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.3);
        }
        
        .glass-button-active {
            background: rgba(255, 255, 255, 0.9);
            color: #0f172a;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.5), inset 0 0 10px rgba(255, 255, 255, 0.8);
            border: 1px solid rgba(255, 255, 255, 1);
        }

        .glass-button-inactive {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* Анимации */
        .fade-in-up { animation: fadeInUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .scale-in { animation: scaleIn 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        
        @keyframes fadeInUp { 
            from { opacity: 0; transform: translateY(20px); } 
            to { opacity: 1; transform: translateY(0); } 
        }
        @keyframes scaleIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        /* Плавающие частицы */
        .particle {
            position: absolute;
            bottom: -10%;
            pointer-events: none;
            opacity: 0;
            animation: floatUp linear infinite;
            z-index: 0;
        }
        @keyframes floatUp {
            0% { transform: translateY(0) rotate(0deg) scale(0.8); opacity: 0; }
            10% { opacity: 0.5; }
            90% { opacity: 0.5; }
            100% { transform: translateY(-120vh) rotate(360deg) scale(1.2); opacity: 0; }
        }

        /* Декоративные светящиеся шары */
        .glow-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.4;
            z-index: 0;
            animation: pulseGlow 8s ease-in-out infinite alternate;
        }
        @keyframes pulseGlow {
            0% { transform: scale(1) translate(0, 0); opacity: 0.3; }
            100% { transform: scale(1.2) translate(20px, -20px); opacity: 0.6; }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        const GIST_URL = "https://gist.githubusercontent.com/1s0meb0dy1/9d890bde848f3a2c5464c7c1729fe17a/raw/2bbc9a4eb6f2d9a7d2225821b57b82fba6b51ed4/questions.json";

        const CATEGORIES = [
            { id: "family", name: "Семья", icon: "👨‍👩‍👧‍👦", color: "from-blue-900 via-slate-900 to-black" },
            { id: "intimacy", name: "Интим", icon: "🔥", color: "from-red-950 via-rose-900 to-black" },
            { id: "future", name: "Будущее", icon: "🎯", color: "from-emerald-950 via-teal-900 to-black" },
            { id: "secrets", name: "Секреты", icon: "🤫", color: "from-purple-950 via-fuchsia-900 to-black" },
            { id: "romance", name: "Романтика", icon: "❤️", color: "from-pink-950 via-rose-900 to-black" },
            { id: "past", name: "Прошлое", icon: "🕰️", color: "from-yellow-950 via-amber-900 to-black" },
            { id: "values", name: "Ценности", icon: "⚖️", color: "from-indigo-950 via-blue-900 to-black" },
            { id: "fears", name: "Страхи", icon: "👻", color: "from-slate-900 via-gray-900 to-black" },
            { id: "money", name: "Деньги", icon: "💰", color: "from-green-950 via-emerald-900 to-black" },
            { id: "life", name: "Быт", icon: "🏠", color: "from-orange-950 via-amber-900 to-black" }
        ];

        // Компонент декоративного фона
        const BackgroundEffects = ({ activeColor = "bg-pink-500", particleIcon = "✨" }) => {
            const particles = useMemo(() => Array.from({ length: 15 }).map((_, i) => ({
                id: i,
                left: `${Math.random() * 100}%`,
                animationDuration: `${10 + Math.random() * 15}s`,
                animationDelay: `${Math.random() * 5}s`,
                fontSize: `${10 + Math.random() * 20}px`
            })), []);

            return (
                <div className="absolute inset-0 overflow-hidden pointer-events-none">
                    {/* Светящиеся сферы */}
                    <div className={`glow-orb w-64 h-64 top-[-10%] left-[-10%] ${activeColor}`}></div>
                    <div className={`glow-orb w-80 h-80 bottom-[-10%] right-[-10%] ${activeColor}`}></div>
                    
                    {/* Частицы */}
                    {particles.map(p => (
                        <div key={p.id} className="particle" style={{
                            left: p.left,
                            animationDuration: p.animationDuration,
                            animationDelay: p.animationDelay,
                            fontSize: p.fontSize
                        }}>
                            {particleIcon}
                        </div>
                    ))}
                </div>
            );
        };

        function App() {
            const [db, setDb] = useState([]);
            const [isLoading, setIsLoading] = useState(true);
            const [screen, setScreen] = useState('menu');
            const [selectedCats, setSelectedCats] = useState([]);
            const [gameQuestions, setGameQuestions] = useState([]);
            const [currentIndex, setCurrentIndex] = useState(0);
            const [showAiPopup, setShowAiPopup] = useState(false);
            const [animationKey, setAnimationKey] = useState(0); // Для перезапуска анимаций карточки

            useEffect(() => {
                fetch(GIST_URL)
                    .then(res => res.json())
                    .then(data => {
                        setDb(data);
                        setTimeout(() => setIsLoading(false), 800); // Небольшая задержка для красоты
                    })
                    .catch(err => {
                        console.error(err);
                        setDb([{ text: "Ошибка загрузки вопросов. Проверьте ссылку.", categoryId: "family", level: "Простые" }]);
                        setIsLoading(false);
                    });
            }, []);

            const toggleCategory = (catId) => {
                setSelectedCats(prev => 
                    prev.includes(catId) ? prev.filter(id => id !== catId) : [...prev, catId]
                );
            };

            const startGame = () => {
                let filtered = db.filter(q => selectedCats.includes(q.categoryId));
                if (filtered.length === 0) return alert("Выберите хотя бы одну тему для разговора! ✨");

                for (let i = filtered.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [filtered[i], filtered[j]] = [filtered[j], filtered[i]];
                }

                setGameQuestions(filtered);
                setCurrentIndex(0);
                setScreen('game');
            };

            const changeQuestion = (direction) => {
                setAnimationKey(prev => prev + 1);
                setCurrentIndex(prev => prev + direction);
            };

            const exitToMenu = () => {
                if (confirm("Выйти в меню? Прогресс текущей игры сбросится.")) {
                    setScreen('menu');
                }
            };

            if (isLoading) {
                return (
                    <div className="min-h-screen flex flex-col items-center justify-center bg-slate-950">
                        <BackgroundEffects activeColor="bg-pink-600" particleIcon="🤍" />
                        <div className="relative z-10 flex flex-col items-center scale-in">
                            <div className="animate-pulse text-7xl mb-6 drop-shadow-[0_0_20px_rgba(255,255,255,0.5)]">🤍</div>
                            <p className="text-slate-300 font-light tracking-widest uppercase text-sm">Синхронизация...</p>
                        </div>
                    </div>
                );
            }

            if (screen === 'menu') {
                return (
                    <div className="relative min-h-screen flex flex-col items-center justify-center p-6 bg-slate-950">
                        <BackgroundEffects activeColor="bg-violet-600" particleIcon="✨" />
                        
                        <div className="relative z-10 text-center mb-8 fade-in-up" style={{animationDelay: '0.1s'}}>
                            <h1 className="text-5xl font-bold mb-3 tracking-tight bg-clip-text text-transparent bg-gradient-to-r from-pink-300 via-white to-violet-300">
                                Влад & Ира
                            </h1>
                            <p className="text-slate-400 font-light tracking-wide">Узнаем друг друга еще глубже</p>
                        </div>

                        <div className="relative z-10 w-full max-w-md glass-panel rounded-[2rem] p-7 fade-in-up" style={{animationDelay: '0.2s'}}>
                            <h2 className="text-sm font-semibold mb-5 text-center tracking-widest uppercase text-slate-300">Выбери темы</h2>
                            
                            <div className="grid grid-cols-2 gap-3 mb-8">
                                {CATEGORIES.map(cat => (
                                    <button 
                                        key={cat.id}
                                        onClick={() => toggleCategory(cat.id)}
                                        className={`p-3 rounded-2xl text-sm font-medium transition-all duration-300 flex items-center justify-center gap-2 transform active:scale-95 ${selectedCats.includes(cat.id) ? 'glass-button-active' : 'glass-button-inactive text-slate-300 hover:bg-white/10'}`}
                                    >
                                        <span className="text-xl drop-shadow-md">{cat.icon}</span> 
                                        <span>{cat.name}</span>
                                    </button>
                                ))}
                            </div>

                            <div className="flex justify-between items-center text-xs font-medium text-slate-400 mb-8 px-2">
                                <div className="flex flex-col items-center">
                                    <span className="text-2xl text-white font-bold">{selectedCats.length}</span>
                                    <span className="uppercase tracking-wider mt-1">Категорий</span>
                                </div>
                                <div className="h-8 w-px bg-white/20"></div>
                                <div className="flex flex-col items-center">
                                    <span className="text-2xl text-white font-bold">{db.filter(q => selectedCats.includes(q.categoryId)).length}</span>
                                    <span className="uppercase tracking-wider mt-1">Вопросов</span>
                                </div>
                            </div>

                            <button 
                                onClick={startGame}
                                disabled={selectedCats.length === 0}
                                className="relative overflow-hidden w-full py-4 rounded-2xl bg-white text-slate-900 font-bold text-lg disabled:opacity-50 disabled:bg-slate-700 disabled:text-slate-400 active:scale-95 transition-all duration-300 shadow-[0_0_30px_rgba(255,255,255,0.3)] hover:shadow-[0_0_40px_rgba(255,255,255,0.5)] group"
                            >
                                <div className="absolute inset-0 bg-gradient-to-r from-pink-500/20 to-violet-500/20 opacity-0 group-hover:opacity-100 transition-opacity"></div>
                                <span className="relative z-10">Начать игру</span>
                            </button>
                        </div>
                    </div>
                );
            }

            if (screen === 'game') {
                const currentQ = gameQuestions[currentIndex];
                const categoryInfo = CATEGORIES.find(c => c.id === currentQ.categoryId) || CATEGORIES[0];

                return (
