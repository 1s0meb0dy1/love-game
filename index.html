<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#1a0b1c">
    <title>Влад & Ира ❤️</title>
    <!-- React & Tailwind -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Подключение Google Sans -->
    <style>
        @import url('https://fonts.cdnfonts.com/css/google-sans');
        
        html, body {
            height: 100%;
            min-height: 100dvh;
            margin: 0;
            padding: 0;
            background-color: #1a0b1c; 
            font-family: 'Product Sans', 'Google Sans', sans-serif; 
            overflow-x: hidden;
            color: white; 
            -webkit-tap-highlight-color: transparent;
            touch-action: pan-y;
        }

        /* Переливающийся темный фон */
        .animated-gradient-bg {
            background: linear-gradient(-45deg, #1f0d29, #2d1426, #141e30, #2f1322, #111111);
            background-size: 400% 400%;
            animation: gradientShift 15s ease infinite;
            min-height: 100dvh;
            width: 100%;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Стекломорфизм */
        .glass-panel { 
            background: rgba(18, 10, 24, 0.65); 
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.06); 
            border-radius: 1.75rem;
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.5);
        }

        /* Кнопки одинаковой высоты (56px) */
        .btn-romantic {
            background: linear-gradient(135deg, #be123c 0%, #881337 100%);
            box-shadow: 0 6px 25px rgba(159, 18, 57, 0.35);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            height: 56px;
        }
        .btn-romantic:active { transform: scale(0.96); box-shadow: 0 2px 10px rgba(159, 18, 57, 0.5); }

        .btn-ghost {
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.15);
            color: rgba(255,255,255,0.85);
            transition: all 0.3s ease;
            height: 56px;
        }
        .btn-ghost:active { transform: scale(0.96); background: rgba(255,255,255,0.1); }
        
        .cat-btn-active {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 200, 220, 0.3);
            box-shadow: 0 0 20px rgba(255, 200, 220, 0.1);
            transform: scale(0.98);
        }
        .cat-btn-inactive {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.03);
        }

        /* Анимации */
        .fade-in { animation: fadeIn 0.35s ease-out forwards; }
        .slide-up { animation: slideUp 0.45s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .heart-pulse { animation: heartPulse 1.8s infinite ease-in-out; }
        
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes heartPulse { 0%, 100% { transform: scale(1); } 15% { transform: scale(1.15); } 30% { transform: scale(1); } 45% { transform: scale(1.1); } }

        .checkmark-circle { stroke-dasharray: 166; stroke-dashoffset: 166; stroke-width: 2; stroke-miterlimit: 10; stroke: #10b981; fill: none; animation: stroke 0.6s cubic-bezier(0.65, 0, 0.45, 1) forwards; }
        .checkmark { width: 64px; height: 64px; border-radius: 50%; display: block; stroke-width: 2; stroke: #fff; stroke-miterlimit: 10; margin: 10% auto; box-shadow: inset 0px 0px 0px #10b981; animation: fill .4s ease-in-out .4s forwards, scale .3s ease-in-out .9s both; }
        .checkmark-check { transform-origin: 50% 50%; stroke-dasharray: 48; stroke-dashoffset: 48; animation: stroke 0.3s cubic-bezier(0.65, 0, 0.45, 1) 0.8s forwards; }
        @keyframes stroke { 100% { stroke-dashoffset: 0; } }
        @keyframes scale { 0%, 100% { transform: none; } 50% { transform: scale3d(1.1, 1.1, 1); } }
        @keyframes fill { 100% { box-shadow: inset 0px 0px 0px 35px #10b981; } }

        .ai-cursor::after { content: '|'; animation: blink 1s step-end infinite; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

        /* Цвета сложностей */
        .diff-easy { color: #34d399; }
        .diff-med  { color: #fbbf24; }
        .diff-hard { color: #fb7185; }
        .bg-diff-easy { background: rgba(52, 211, 153, 0.15); border: 1px solid rgba(52, 211, 153, 0.3); }
        .bg-diff-med  { background: rgba(251, 191, 36, 0.15); border: 1px solid rgba(251, 191, 36, 0.3); }
        .bg-diff-hard { background: rgba(251, 113, 133, 0.15); border: 1px solid rgba(251, 113, 133, 0.3); }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body>
    <div id="root" class="animated-gradient-bg"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // НАСТРОЙКИ БАЗЫ ДАННЫХ И AI
        const FIREBASE_BASE_URL = "https://project-x-5e16a-default-rtdb.europe-west1.firebasedatabase.app";
        const GIST_FALLBACK_URL = "https://gist.githubusercontent.com/1s0meb0dy1/9d890bde848f3a2c5464c7c1729fe17a/raw/questions.json";
        const GEMINI_API_KEY = "AQ.Ab8RN6JlrwetdJDgph_PDXCwnW1GCoUcw6jc8_iIBLEbG1dNWA"; 

        const CATEGORIES = [
            { id: "family", name: "Семья", icon: "👨‍👩‍👧‍👦", color: "from-blue-950/40 to-transparent" },
            { id: "intimacy", name: "Интим", icon: "🔞", color: "from-rose-950/40 to-transparent" },
            { id: "future", name: "Будущее", icon: "🎯", color: "from-teal-950/40 to-transparent" },
            { id: "secrets", name: "Секреты", icon: "🤫", color: "from-fuchsia-950/40 to-transparent" },
            { id: "romance", name: "Романтика", icon: "❤️", color: "from-pink-950/40 to-transparent" },
            { id: "past", name: "Прошлое", icon: "⏳", color: "from-amber-950/40 to-transparent" },
            { id: "values", name: "Ценности", icon: "⚖️", color: "from-indigo-950/40 to-transparent" },
            { id: "fears", name: "Страхи", icon: "👻", color: "from-stone-800/50 to-transparent" },
            { id: "money", name: "Деньги", icon: "💰", color: "from-emerald-950/40 to-transparent" },
            { id: "life", name: "Быт", icon: "🏠", color: "from-orange-950/40 to-transparent" }
        ];

        const DIFFICULTIES = [
            { id: "Простые", name: "Легкие", classText: "diff-easy", classBg: "bg-diff-easy" },
            { id: "Средние", name: "Средние", classText: "diff-med", classBg: "bg-diff-med" },
            { id: "Глубокие", name: "Глубокие", classText: "diff-hard", classBg: "bg-diff-hard" }
        ];

        // Двухконтурный генератор реального ИИ (гарантирует уникальный ответ при каждом клике)
        const fetchFromAI = async (promptType, questionText, catId) => {
            const cleanQuestion = questionText.replace(/^№\s*\d+\.\s*/, '').trim();
            const randomSeed = Math.floor(Math.random() * 10000000);
            const catObj = CATEGORIES.find(c => c.id === catId);
            const catName = catObj ? catObj.name : "Отношения";

            let systemPrompt = "";
            let userPrompt = "";

            if (promptType === "situation") {
                systemPrompt = "Ты креативный сценарист и психолог отношений. Пиши живо, реалистично, без шаблонов и повторений.";
                userPrompt = `Контекст: Мы пара (Влад и Ира). Текущий вопрос из категории "${catName}": "${cleanQuestion}".
Сгенерируй абсолютно новый, уникальный ответ строго по этому вопросу (код уникальности: ${randomSeed}), разделенный на 2 блока с отступами:

🎬 Моделирование ситуации:
(Придумай 1 реалистичную, жизненную или интригующую ситуацию из 3-4 предложений, которая происходит с нами прямо сейчас и органично подводит к вопросу "${cleanQuestion}". Пиши от первого лица "мы").

👩👨 Как бы ответили большинство девушек и парней:
(Напиши развернуто и честно: как на этот конкретный вопрос или ситуацию обычно реагируют и отвечают большинство девушек, а как — большинство парней, и почему их взгляды могут совпадать или различаться).`;
            } else {
                systemPrompt = "Ты практикующий семейный психотерапевт, сексолог и аналитик. Каждый твой разбор глубокий, конкретный и привязан строго к заданному вопросу.";
                userPrompt = `Проанализируй конкретный вопрос для пары (Влад и Ира) из категории "${catName}": "${cleanQuestion}".
Сгенерируй абсолютно новый, уникальный профессиональный разбор именно этого вопроса (код уникальности: ${randomSeed}) строго по следующим 6 пунктам с двойными отступами между ними:

🧠 Как лучше поступить в этой ситуации:
(Конкретный разбор: как паре правильно подойти к обсуждению и решению именно вопроса "${cleanQuestion}").

👩👨 Как обычно отвечают большинство девушек и парней:
(Объективный разбор: что чаще всего думают, чувствуют и отвечают на этот вопрос большинство девушек, а что — большинство парней).

💡 Интересные факты:
(1-2 научных факта из психологии, нейробиологии или социологии строго по теме вопроса).

📊 Статистика:
(Реальные или научно обоснованные статистические данные и проценты по теме вопроса "${cleanQuestion}").

🔗 Как это влияет на отношения:
(К чему приводит замалчивание этой темы и что дает паре честный ответ).

🛠️ Психологические советы:
(2-3 практических совета, как обсудить этот вопрос без обид и стать ближе).`;
            }

            // Контур 1: Прямой запрос к Gemini API (если ключ валидный AIza...)
            if (GEMINI_API_KEY && GEMINI_API_KEY.startsWith("AIza")) {
                try {
                    const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}`;
                    const response = await fetch(url, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            contents: [{ parts: [{ text: systemPrompt + "\n\n" + userPrompt }] }],
                            generationConfig: { temperature: 0.95, maxOutputTokens: 900 }
                        })
                    });
                    if (response.ok) {
                        const data = await response.json();
                        const text = data?.candidates?.[0]?.content?.parts?.[0]?.text;
                        if (text) return text.trim();
                    }
                } catch (e) {
                    console.warn("Gemini direct call failed, switching to neural gateway...", e);
                }
            }

            // Контур 2: Реальный нейросетевой шлюз (OpenAI/Mistral через Pollinations AI — работает без привязки к ключу)
            try {
                const response = await fetch("https://text.pollinations.ai/openai", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        model: "openai",
                        seed: randomSeed,
                        temperature: 0.9,
                        messages: [
                            { role: "system", content: systemPrompt },
                            { role: "user", content: userPrompt }
                        ]
                    })
                });
                if (response.ok) {
                    const data = await response.json();
                    const content = data?.choices?.[0]?.message?.content;
                    if (content) return content.trim();
                }
            } catch (e) {
                console.warn("Primary neural gateway failed, trying GET fallback...", e);
            }

            // Контур 3: Резервный GET-запрос к нейросети
            try {
                const fallbackUrl = `https://text.pollinations.ai/${encodeURIComponent(systemPrompt + "\n" + userPrompt)}?seed=${randomSeed}&model=openai`;
                const response = await fetch(fallbackUrl);
                if (response.ok) {
                    const text = await response.text();
                    if (text && text.length > 40) return text.trim();
                }
            } catch (e) {
                console.error("All AI endpoints unreachable:", e);
            }

            return `Не удалось связаться с нейросетью (проверьте интернет-соединение).\n\nПопробуйте нажать кнопку еще раз для вопроса:\n«${cleanQuestion}»`;
        };

        const AnimatedCounter = ({ target }) => {
            const [count, setCount] = useState(0);
            useEffect(() => {
                if (!target || target === 0) { setCount(0); return; }
                let current = 0;
                const stepTime = Math.max(5, Math.floor(1000 / target)); 
                const timer = setInterval(() => {
                    current += 1;
                    setCount(current);
                    if (current >= target) clearInterval(timer);
                }, stepTime);
                return () => clearInterval(timer);
            }, [target]);
            return <span>{count}</span>;
        };

        const Icons = {
            Play: () => <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z" /><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>,
            Menu: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 6h16M4 12h16M4 18h16" /></svg>,
            Back: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M10 19l-7-7m0 0l7-7m-7 7h18" /></svg>,
            Next: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M14 5l7 7m0 0l-7 7m7-7H3" /></svg>,
            Sparkles: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z" /></svg>,
            List: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 6h16M4 10h16M4 14h16M4 18h16" /></svg>,
            Plus: () => <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 4v16m8-8H4" /></svg>,
            Check: () => <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M5 13l4 4L19 7" /></svg>,
            Bulb: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z" /></svg>,
            Edit: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z" /></svg>,
            Trash: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>
        };

        function App() {
            const [db, setDb] = useState([]);
            const [dbSubPath, setDbSubPath] = useState(""); // "" или "/questions"
            const [isLoading, setIsLoading] = useState(true);
            const [screen, setScreen] = useState('menu'); 
            const [selectedCats, setSelectedCats] = useState(CATEGORIES.map(c => c.id));
            const [selectedDiffs, setSelectedDiffs] = useState(DIFFICULTIES.map(d => d.id));
            
            const [gameQuestions, setGameQuestions] = useState([]);
            const [currentIndex, setCurrentIndex] = useState(0);
            const [answeredCount, setAnsweredCount] = useState(0); 
            const [showEndGameConfirm, setShowEndGameConfirm] = useState(false);

            // Состояние для AI-экрана
            const [aiType, setAiType] = useState('situation');
            const [aiContent, setAiContent] = useState('');
            const [isAiTyping, setIsAiTyping] = useState(false);
            const typingIntervalRef = useRef(null);

            const [viewCategory, setViewCategory] = useState(null);
            
            // Добавление вопроса
            const [addForm, setAddForm] = useState({ text: '', cat: 'family', diff: 'Простые' });
            const [addStatus, setAddStatus] = useState(null); // { ok: bool, msg: string, id?: string }
            const [isSaving, setIsSaving] = useState(false);

            // Редактирование и удаление вопроса
            const [editingQuestion, setEditingQuestion] = useState(null);
            const [editForm, setEditForm] = useState({ text: '', cat: 'family', diff: 'Простые' });
            const [returnScreen, setReturnScreen] = useState('menu');
            const [confirmModal, setConfirmModal] = useState(null); // { action: 'save' | 'delete', title: string }
            const [resultModal, setResultModal] = useState(null);   // { ok: bool, msg: string, afterCloseScreen?: string }

            // Форматирование сырых данных из базы с сохранением постоянных номеров и ID
            const parseDatabaseObject = (rawObj) => {
                const entries = Object.entries(rawObj);
                let autoNum = 1;
                const parsed = [];

                for (let i = 0; i < entries.length; i++) {
                    const [dbKey, item] = entries[i];
                    if (!item || typeof item !== 'object' || !item.text) continue;

                    const matchNum = String(item.text).match(/^№\s*(\d+)\.\s*(.*)/s);
                    const cleanText = matchNum ? matchNum[2].trim() : String(item.text).trim();
                    const permanentNum = item.num ? Number(item.num) : (matchNum ? Number(matchNum[1]) : autoNum);
                    if (permanentNum >= autoNum) autoNum = permanentNum + 1;

                    parsed.push({
                        dbKey: String(dbKey),
                        id: item.id || `q_${ permanentNum }`,
                        num: permanentNum,
                        categoryId: item.categoryId || "family",
                        level: item.level || "Простые",
                        cleanText: cleanText,
                        text: `№ ${permanentNum}. ${cleanText}`
                    });
                }
                return parsed;
            };

            // Загрузка из Firebase (с авто-импортом из Gist, если база пустая)
            useEffect(() => {
                const initDatabase = async () => {
                    try {
                        const res = await fetch(`${FIREBASE_BASE_URL}/.json?t=${Date.now()}`);
                        if (!res.ok) throw new Error(`HTTP ${res.status}`);
                        const data = await res.json();

                        if (data) {
                            // Проверяем, лежат ли вопросы в корне или внутри узла /questions
                            if (data.questions && typeof data.questions === 'object') {
                                setDbSubPath("/questions");
                                setDb(parseDatabaseObject(data.questions));
                            } else {
                                setDbSubPath("");
                                setDb(parseDatabaseObject(data));
                            }
                            setIsLoading(false);
                        } else {
                            // Если база в Firebase еще пустая — автоматически переносим вопросы из Gist
                            const gistRes = await fetch(`${GIST_FALLBACK_URL}?t=${Date.now()}`);
                            const gistData = await gistRes.json();
                            const formattedForFirebase = gistData.map((q, idx) => {
                                const m = String(q.text).match(/^№\s*(\d+)\.\s*(.*)/s);
                                const cText = m ? m[2].trim() : String(q.text).trim();
                                return {
                                    id: q.id || `v_init_${idx + 1}`,
                                    num: idx + 1,
                                    categoryId: q.categoryId || "family",
                                    level: q.level || "Простые",
                                    text: cText
                                };
                            });

                            // Записываем в Firebase
                            await fetch(`${FIREBASE_BASE_URL}/.json`, {
                                method: "PUT",
                                headers: { "Content-Type": "application/json" },
                                body: JSON.stringify(formattedForFirebase)
                            });

                            setDbSubPath("");
                            setDb(parseDatabaseObject(formattedForFirebase));
                            setIsLoading(false);
                        }
                    } catch (err) {
                        console.error("Firebase load error, falling back to Gist:", err);
                        try {
                            const gistRes = await fetch(`${GIST_FALLBACK_URL}?t=${Date.now()}`);
                            const gistData = await gistRes.json();
                            setDb(parseDatabaseObject(gistData));
                        } catch (e) {
                            setDb([]);
                        }
                        setIsLoading(false);
                    }
                };
                initDatabase();
            }, []);

            const toggleCategory = (catId) => setSelectedCats(prev => prev.includes(catId) ? prev.filter(id => id !== catId) : [...prev, catId]);
            const toggleDiff = (diffId) => setSelectedDiffs(prev => prev.includes(diffId) ? prev.filter(id => id !== diffId) : [...prev, diffId]);

            const startGame = () => {
                let filtered = db.filter(q => selectedCats.includes(q.categoryId) && selectedDiffs.includes(q.level));
                if (filtered.length === 0) return alert("По этим параметрам нет вопросов. Выберите другие! ❤️");
                for (let i = filtered.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [filtered[i], filtered[j]] = [filtered[j], filtered[i]];
                }
                setGameQuestions(filtered);
                setCurrentIndex(0);
                setAnsweredCount(0);
                setScreen('game');
            };

            const triggerAI = async (type) => {
                setAiType(type);
                setAiContent(type === 'situation' ? "Моделирую уникальную ситуацию..." : "Формирую психологический разбор...");
                setIsAiTyping(true);
                setScreen('ai_response');

                const q = gameQuestions[currentIndex];
                const response = await fetchFromAI(type, q.cleanText || q.text, q.categoryId);
                
                if (typingIntervalRef.current) clearInterval(typingIntervalRef.current);
                
                setAiContent("");
                let i = 0;
                typingIntervalRef.current = setInterval(() => {
                    setAiContent(response.substring(0, i + 1));
                    i++;
                    if (i >= response.length) {
                        clearInterval(typingIntervalRef.current);
                        setIsAiTyping(false);
                    }
                }, 8);
            };

            // Открытие экрана редактирования
            const openEditScreen = (questionObj, fromScreen) => {
                setEditingQuestion(questionObj);
                setEditForm({
                    text: questionObj.cleanText || questionObj.text.replace(/^№\s*\d+\.\s*/, ''),
                    cat: questionObj.categoryId,
                    diff: questionObj.level
                });
                setReturnScreen(fromScreen);
                setConfirmModal(null);
                setResultModal(null);
                setScreen('edit_q');
            };

            // Добавление нового вопроса после последней строки в БД
            const handleAddQuestion = async (e) => {
                e.preventDefault();
                if (!addForm.text.trim() || isSaving) return;
                setIsSaving(true);

                try {
                    const cleanInput = addForm.text.replace(/^№\s*\d+\.\s*/, '').trim();
                    
                    // Вычисляем следующий номер вопроса и следующий ключ после последней строки
                    const maxNum = db.reduce((max, item) => Math.max(max, Number(item.num) || 0), 0);
                    const nextNum = maxNum + 1;

                    const numericKeys = db.map(item => Number(item.dbKey)).filter(n => !isNaN(n));
                    const nextDbKey = numericKeys.length > 0 ? String(Math.max(...numericKeys) + 1) : String(db.length);
                    const newId = `v_db_${nextNum}_${Math.random().toString(36).substring(2, 6)}`;

                    const payload = {
                        id: newId,
                        num: nextNum,
                        categoryId: addForm.cat,
                        level: addForm.diff,
                        text: cleanInput
                    };

                    const res = await fetch(`${FIREBASE_BASE_URL}${dbSubPath}/${nextDbKey}.json`, {
                        method: "PUT",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify(payload)
                    });

                    if (!res.ok) {
                        const errText = await res.text();
                        throw new Error(`Код ответа сервера: ${res.status}. ${errText}`);
                    }

                    const createdQuestion = {
                        ...payload,
                        dbKey: nextDbKey,
                        cleanText: cleanInput,
                        text: `№ ${nextNum}. ${cleanInput}`
                    };

                    setDb(prev => [...prev, createdQuestion]);
                    setAddStatus({
                        ok: true,
                        msg: `Вопрос № ${nextNum} успешно сохранен после последней строки в базе данных!`,
                        id: newId
                    });
                } catch (err) {
                    setAddStatus({
                        ok: false,
                        msg: `Вопрос НЕ был сохранен в базу данных. Причина: ${err.message || "Ошибка сети или правил доступа Firebase (Rules)."}`
                    });
                } finally {
                    setIsSaving(false);
                }
            };

            // Выполнение сохранения изменений в БД
            const executeSaveEdit = async () => {
                if (!editingQuestion || isSaving) return;
                setIsSaving(true);
                setConfirmModal(null);

                const cleanUpdatedText = editForm.text.replace(/^№\s*\d+\.\s*/, '').trim();
                const updatedPayload = {
                    id: editingQuestion.id,     // ID не меняется
                    num: editingQuestion.num,   // Номер не меняется
                    categoryId: editForm.cat,
                    level: editForm.diff,
                    text: cleanUpdatedText
                };

                try {
                    const res = await fetch(`${FIREBASE_BASE_URL}${dbSubPath}/${editingQuestion.dbKey}.json`, {
                        method: "PATCH",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify(updatedPayload)
                    });

                    if (!res.ok) {
                        const errText = await res.text();
                        throw new Error(`Код ${res.status}: ${errText}`);
                    }

                    const updatedObj = {
                        ...editingQuestion,
                        categoryId: editForm.cat,
                        level: editForm.diff,
                        cleanText: cleanUpdatedText,
                        text: `№ ${editingQuestion.num}. ${cleanUpdatedText}`
                    };

                    setDb(prev => prev.map(q => q.dbKey === editingQuestion.dbKey ? updatedObj : q));
                    setGameQuestions(prev => prev.map(q => q.dbKey === editingQuestion.dbKey ? updatedObj : q));
                    setEditingQuestion(updatedObj);

                    setResultModal({
                        ok: true,
                        msg: `Вопрос № ${editingQuestion.num} (ID: ${editingQuestion.id}) успешно изменен в базе данных!`,
                        afterCloseScreen: returnScreen
                    });
                } catch (err) {
                    setResultModal({
                        ok: false,
                        msg: `Не удалось изменить вопрос в базе данных. Причина: ${err.message || "Сбой соединения или доступ запрещен в Firebase Rules."}`
                    });
                } finally {
                    setIsSaving(false);
                }
            };

            // Выполнение удаления вопроса из БД
            const executeDeleteQuestion = async () => {
                if (!editingQuestion || isSaving) return;
                setIsSaving(true);
                setConfirmModal(null);

                try {
                    const res = await fetch(`${FIREBASE_BASE_URL}${dbSubPath}/${editingQuestion.dbKey}.json`, {
                        method: "DELETE"
                    });

                    if (!res.ok) {
                        const errText = await res.text();
                        throw new Error(`Код ${res.status}: ${errText}`);
                    }

                    // Удаляем вопрос без изменения номеров и ID остальных вопросов
                    setDb(prev => prev.filter(q => q.dbKey !== editingQuestion.dbKey));
                    
                    setGameQuestions(prev => {
                        const nextList = prev.filter(q => q.dbKey !== editingQuestion.dbKey);
                        if (currentIndex >= nextList.length && nextList.length > 0) {
                            setCurrentIndex(nextList.length - 1);
                        }
                        return nextList;
                    });

                    setResultModal({
                        ok: true,
                        msg: `Вопрос № ${editingQuestion.num} (ID: ${editingQuestion.id}) навсегда удален из базы данных!`,
                        afterCloseScreen: returnScreen
                    });
                } catch (err) {
                    setResultModal({
                        ok: false,
                        msg: `Не удалось удалить вопрос из базы данных. Причина: ${err.message || "Сбой сети или запрет записи в Firebase Rules."}`
                    });
                } finally {
                    setIsSaving(false);
                }
            };

            const goToSummary = (fromFinishButton = false) => {
                setShowEndGameConfirm(false);
                setAnsweredCount(fromFinishButton ? currentIndex + 1 : currentIndex);
                setScreen('summary');
            };

            if (isLoading) {
                return (
                    <div className="min-h-[100dvh] w-full flex flex-col items-center justify-center fade-in">
                        <div className="text-6xl mb-6 heart-pulse text-[#be123c] drop-shadow-[0_0_30px_rgba(190,18,60,0.7)]">🤍</div>
                        <p className="text-white/40 font-bold uppercase text-[10px] tracking-[0.4em]">Синхронизация с базой</p>
                    </div>
                );
            }

            // ГЛАВНОЕ МЕНЮ
            if (screen === 'menu') {
                const availableCount = db.filter(q => selectedCats.includes(q.categoryId) && selectedDiffs.includes(q.level)).length;
                return (
                    <div className="min-h-[100dvh] w-full flex flex-col items-center justify-center p-4 md:p-6 slide-up relative z-10">
                        <div className="text-center mb-6 flex-shrink-0">
                            <h1 className="text-5xl font-bold mb-3 flex items-center justify-center gap-3 text-white tracking-tight">
                                <span>Влад</span>
                                <span className="text-4xl text-[#be123c] heart-pulse drop-shadow-[0_0_20px_rgba(190,18,60,0.6)]">❤️</span>
                                <span>Ира</span>
                            </h1>
                            <p className="text-white/40 text-[11px] font-bold uppercase tracking-[0.25em] mt-2">Давай узнаем друг друга еще раз</p>
                        </div>

                        <div className="w-full max-w-md glass-panel p-6 flex flex-col gap-8">
                            <div>
                                <h2 className="text-[15px] md:text-base font-bold text-center uppercase tracking-widest text-white/50 mb-5">Темы вопросов</h2>
                                <div className="grid grid-cols-2 gap-3">
                                    {CATEGORIES.map(cat => (
                                        <button 
                                            key={cat.id}
                                            onClick={() => toggleCategory(cat.id)}
                                            className={`p-4 rounded-xl text-sm font-medium flex items-center justify-center gap-2 transition-all duration-300 ${selectedCats.includes(cat.id) ? 'cat-btn-active text-white' : 'cat-btn-inactive text-white/40 hover:text-white/60'}`}
                                        >
                                            <span className="text-xl">{cat.icon}</span> 
                                            <span className="truncate">{cat.name}</span>
                                        </button>
                                    ))}
                                </div>
                            </div>

                            <div className="w-full overflow-hidden">
                                <h2 className="text-[15px] md:text-base font-bold text-center uppercase tracking-widest text-white/50 mb-5">Сложность вопросов</h2>
                                <div className="flex overflow-x-auto gap-3 pb-2 pt-1 px-1 no-scrollbar snap-x touch-pan-x">
                                    {DIFFICULTIES.map(diff => {
                                        const isActive = selectedDiffs.includes(diff.id);
                                        return (
                                            <button 
                                                key={diff.id}
                                                onClick={() => toggleDiff(diff.id)}
                                                className={`flex-shrink-0 px-6 h-14 rounded-full text-xs font-bold uppercase tracking-widest transition-all duration-300 snap-center ${isActive ? diff.classBg + ' ' + diff.classText : 'bg-black/20 text-white/30 border border-white/5'}`}
                                            >
                                                {diff.name}
                                            </button>
                                        );
                                    })}
                                </div>
                                <button 
                                    onClick={() => setScreen('cat_list')} 
                                    className="w-full mt-5 rounded-2xl btn-ghost flex items-center justify-center gap-2 text-xs font-bold uppercase tracking-widest"
                                >
                                    <Icons.List /> Список вопросов
                                </button>
                            </div>

                            <div className="flex flex-col gap-6 pt-6 border-t border-white/5 relative">
                                <div className="absolute left-0 right-0 top-[-10px] text-center">
                                    <span className="text-[10px] font-bold uppercase tracking-[0.2em] text-white/40 bg-[#140b19] px-4 py-1.5 rounded-full border border-white/5">Вы выбрали</span>
                                </div>
                                
                                <div className="grid grid-cols-[1fr_auto_1fr] items-center px-2 mt-4">
                                    <div className="flex flex-col items-center gap-2">
                                        <span className="text-4xl font-light text-white leading-none">{selectedCats.length}</span>
                                        <span className="uppercase text-[10px] font-bold tracking-widest text-white/40">Тем(ы)</span>
                                    </div>
                                    <div className="h-12 w-[1px] bg-white/10"></div>
                                    <div className="flex flex-col items-center gap-2">
                                        <span className="text-4xl font-light text-white leading-none">{availableCount}</span>
                                        <span className="uppercase text-[10px] font-bold tracking-widest text-white/40">Вопросов</span>
                                    </div>
                                </div>

                                <button 
                                    onClick={startGame}
                                    disabled={availableCount === 0}
                                    className="w-full h-14 text-white font-bold text-sm uppercase tracking-[0.2em] btn-romantic disabled:opacity-50 disabled:grayscale flex items-center justify-center gap-2 shadow-2xl rounded-2xl"
                                >
                                    <Icons.Play /> Начать игру
                                </button>
                            </div>
                        </div>
                    </div>
                );
            }

            // ЭКРАН ИГРЫ
            if (screen === 'game') {
                const currentQ = gameQuestions[currentIndex];
                if (!currentQ) {
                    setScreen('menu');
                    return null;
                }
                const categoryInfo = CATEGORIES.find(c => c.id === currentQ.categoryId) || CATEGORIES[0];
                const diffInfo = DIFFICULTIES.find(d => d.id === currentQ.level) || DIFFICULTIES[0];
                const cleanText = currentQ.cleanText || currentQ.text.replace(/^№\s*\d+\.\s*/, '');

                return (
                    <div className={`min-h-[100dvh] w-full flex flex-col bg-gradient-to-br ${categoryInfo.color} transition-colors duration-1000 fade-in relative z-10`}>
                        {/* Верхняя панель: слева порядок в игре + кнопка Редактировать, справа кнопка Меню */}
                        <div className="flex justify-between items-center p-5 md:p-8 flex-shrink-0">
                            <div className="flex items-center gap-2.5">
                                <div className="bg-[#0b0610]/60 backdrop-blur-md border border-white/5 text-white/80 font-bold px-6 py-2.5 rounded-full text-xs tracking-widest shadow-xl">
                                    {currentIndex + 1} / {gameQuestions.length}
                                </div>
                                <button 
                                    onClick={() => openEditScreen(currentQ, 'game')}
                                    title="Редактировать вопрос"
                                    className="p-2.5 rounded-full bg-white/5 hover:bg-white/10 text-white/80 hover:text-white active:scale-95 transition-all border border-white/5 shadow-xl"
                                >
                                    <Icons.Edit />
                                </button>
                            </div>
                            <button 
                                onClick={() => setShowEndGameConfirm(true)} 
                                className="flex items-center gap-2 text-white/80 text-[11px] font-bold uppercase tracking-widest px-5 py-2.5 rounded-full bg-white/5 hover:bg-white/10 active:scale-95 transition-all border border-white/5"
                            >
                                <Icons.Menu /> Меню
                            </button>
                        </div>

                        {/* Центральная часть с вопросом */}
                        <div className="flex-1 flex flex-col items-center justify-center px-5 pb-28 overflow-y-auto no-scrollbar">
                            <div className="w-full max-w-lg flex flex-col items-center slide-up" key={currentQ.dbKey + '_' + currentIndex}>
                                
                                {/* Плашка с настоящим номером вопроса из базы */}
                                <div className="glass-panel px-6 py-3.5 rounded-3xl mb-7 flex flex-col items-center gap-1.5 shadow-2xl">
                                    <span className="text-white/40 text-[10px] uppercase tracking-[0.25em] font-bold">
                                        Вопрос {currentQ.num}
                                    </span>
                                    <div className="flex items-center gap-2.5 text-[12px] font-bold uppercase tracking-widest text-white/90">
                                        <span className="text-lg">{categoryInfo.icon}</span>
                                        <span>{categoryInfo.name}</span>
                                        <span className="w-1.5 h-1.5 rounded-full bg-white/20"></span>
                                        <span className={diffInfo.classText}>{diffInfo.name}</span>
                                    </div>
                                </div>

                                {/* Текст вопроса с уменьшенным межстрочным интервалом */}
                                <h2 className="text-[25px] md:text-[29px] font-medium text-center leading-[1.18] mb-9 text-white/95 px-2">
                                    {cleanText}
                                </h2>
                                
                                {/* Кнопки "Ситуация" и "Совет" в одну строку */}
                                <div className="grid grid-cols-2 gap-3 w-full max-w-sm px-1">
                                    <button 
                                        onClick={() => triggerAI('situation')}
                                        className="h-14 bg-white/5 hover:bg-white/10 border border-white/10 rounded-2xl text-white/85 text-xs font-bold uppercase tracking-widest active:scale-95 transition-all flex items-center justify-center gap-2 shadow-xl px-2"
                                    >
                                        <Icons.Sparkles /> Ситуация
                                    </button>
                                    <button 
                                        onClick={() => triggerAI('psych')}
                                        className="h-14 bg-[#0ea5e9]/10 hover:bg-[#0ea5e9]/20 border border-[#0ea5e9]/30 rounded-2xl text-[#38bdf8] text-xs font-bold uppercase tracking-widest active:scale-95 transition-all flex items-center justify-center gap-2 shadow-xl px-2"
                                    >
                                        <Icons.Bulb /> Совет
                                    </button>
                                </div>
                            </div>
                        </div>

                        {/* Закрепленные внизу кнопки Назад и Далее (50% на 50%) */}
                        <div className="fixed bottom-0 left-0 right-0 p-5 md:p-8 z-20 pointer-events-none">
                            <div className="max-w-lg mx-auto grid grid-cols-2 gap-4 pointer-events-auto">
                                <button 
                                    onClick={() => setCurrentIndex(prev => prev - 1)}
                                    disabled={currentIndex === 0}
                                    className="w-full h-14 rounded-2xl font-bold text-white/85 glass-panel disabled:opacity-25 active:scale-95 transition-all uppercase tracking-widest text-xs flex items-center justify-center gap-2"
                                >
                                    <Icons.Back /> Назад
                                </button>
                                <button 
                                    onClick={() => {
                                        if (currentIndex < gameQuestions.length - 1) {
                                            setCurrentIndex(prev => prev + 1);
                                        } else {
                                            goToSummary(true);
                                        }
                                    }}
                                    className="w-full h-14 rounded-2xl font-bold text-white btn-romantic active:scale-95 uppercase tracking-widest text-xs flex items-center justify-center gap-2 shadow-2xl"
                                >
                                    {currentIndex === gameQuestions.length - 1 ? "Итоги" : "Далее"} <Icons.Next />
                                </button>
                            </div>
                        </div>

                        {/* Промежуточное подтверждение выхода в Меню */}
                        {showEndGameConfirm && (
                            <div className="fixed inset-0 bg-black/80 backdrop-blur-md flex items-center justify-center p-5 z-50 fade-in">
                                <div className="glass-panel p-7 w-full max-w-sm text-center flex flex-col items-center gap-6 border border-white/10">
                                    <div className="text-4xl">❤️</div>
                                    <h3 className="text-lg font-bold text-white leading-snug">
                                        Точно хотите закончить игру?
                                    </h3>
                                    <div className="grid grid-cols-2 gap-3 w-full">
                                        <button 
                                            onClick={() => setShowEndGameConfirm(false)}
                                            className="w-full h-14 rounded-2xl btn-ghost text-xs font-bold uppercase tracking-widest"
                                        >
                                            Отмена
                                        </button>
                                        <button 
                                            onClick={() => goToSummary(false)}
                                            className="w-full h-14 rounded-2xl btn-romantic text-white text-xs font-bold uppercase tracking-widest"
                                        >
                                            Да
                                        </button>
                                    </div>
                                </div>
                            </div>
                        )}
                    </div>
                );
            }

            // ОТДЕЛЬНАЯ СТРАНИЦА AI-ОТВЕТА
            if (screen === 'ai_response') {
                const currentQ = gameQuestions[currentIndex];
                const categoryInfo = CATEGORIES.find(c => c.id === currentQ?.categoryId) || CATEGORIES[0];
                const isSituation = aiType === 'situation';
                
                return (
                    <div className={`min-h-[100dvh] w-full flex flex-col bg-gradient-to-br ${categoryInfo.color} transition-colors duration-1000 fade-in relative z-10`}>
                        <div className="flex items-center justify-between pt-6 px-5 flex-shrink-0">
                            <button onClick={() => setScreen('game')} className="p-4 bg-white/5 rounded-full hover:bg-white/10 text-white/80 transition-all">
                                <Icons.Back />
                            </button>
                            <span className="text-[11px] font-bold uppercase tracking-widest text-white/40">
                                Вопрос № {currentQ?.num}
                            </span>
                        </div>

                        <div className="flex-1 flex flex-col items-center p-5 pb-28 overflow-y-auto no-scrollbar">
                            <div className="w-full max-w-lg flex flex-col items-center slide-up text-center">
                                <div className="text-[4.5rem] mb-4 drop-shadow-[0_0_30px_rgba(225,29,72,0.6)] heart-pulse">❤️‍🩹</div>
                                <h2 className={`text-xl font-bold mb-6 tracking-widest uppercase ${isSituation ? 'text-[#be123c]' : 'text-[#38bdf8]'}`}>
                                    {isSituation ? "Моделирование ситуации" : "Совет психолога"}
                                </h2>
                                
                                <div className="glass-panel p-5 mb-5 w-full text-center text-white/80 text-sm font-medium border border-white/10">
                                    «{currentQ?.cleanText || currentQ?.text}»
                                </div>

                                <div className={`glass-panel p-6 md:p-8 w-full text-left text-white/95 text-[15px] md:text-[16px] font-light leading-relaxed shadow-2xl whitespace-pre-wrap ${isAiTyping ? 'ai-cursor' : ''}`}>
                                    {aiContent}
                                </div>
                            </div>
                        </div>

                        <div className="fixed bottom-0 left-0 right-0 p-5 md:p-8 z-20 pointer-events-none">
                            <div className="max-w-lg mx-auto pointer-events-auto">
                                <button onClick={() => setScreen('game')} className="w-full h-14 rounded-2xl btn-romantic flex items-center justify-center text-xs font-bold uppercase tracking-widest text-white shadow-2xl">
                                    Вернуться к вопросу
                                </button>
                            </div>
                        </div>
                    </div>
                );
            }

            // ИТОГИ (SUMMARY)
            if (screen === 'summary') {
                const answered = gameQuestions.slice(0, answeredCount);
                const cEasy = answered.filter(q => q.level === 'Простые').length;
                const cMed = answered.filter(q => q.level === 'Средние').length;
                const cHard = answered.filter(q => q.level === 'Глубокие').length;

                return (
                    <div className="min-h-[100dvh] w-full flex flex-col items-center justify-center p-5 slide-up relative z-10">
                        <div className="text-[5rem] mb-10 heart-pulse drop-shadow-[0_0_40px_rgba(190,18,60,0.8)]">❤️</div>
                        <div className="text-center mb-12">
                            <h1 className="text-3xl font-bold mb-4 text-white/90">Вы ответили на</h1>
                            <div className="text-7xl font-light text-[#be123c] mt-2"><AnimatedCounter target={answered.length} /></div>
                            <p className="text-white/40 text-[11px] font-bold uppercase tracking-[0.25em] mt-4">вопросов</p>
                        </div>
                        <div className="w-full max-w-sm glass-panel p-6 flex flex-col gap-4 mb-12">
                            <div className="flex justify-between items-center p-5 bg-black/40 rounded-xl border border-[#34d399]/20">
                                <span className="font-bold text-xs uppercase tracking-widest diff-easy">Легких</span>
                                <span className="text-2xl font-light text-white"><AnimatedCounter target={cEasy} /></span>
                            </div>
                            <div className="flex justify-between items-center p-5 bg-black/40 rounded-xl border border-[#fbbf24]/20">
                                <span className="font-bold text-xs uppercase tracking-widest diff-med">Средних</span>
                                <span className="text-2xl font-light text-white"><AnimatedCounter target={cMed} /></span>
                            </div>
                            <div className="flex justify-between items-center p-5 bg-black/40 rounded-xl border border-[#fb7185]/20">
                                <span className="font-bold text-xs uppercase tracking-widest diff-hard">Глубоких</span>
                                <span className="text-2xl font-light text-white"><AnimatedCounter target={cHard} /></span>
                            </div>
                        </div>
                        <div className="w-full max-w-sm">
                            <button onClick={() => setScreen('menu')} className="w-full h-14 rounded-2xl text-white font-bold text-sm uppercase tracking-[0.2em] btn-romantic flex items-center justify-center gap-2 shadow-2xl">
                                <Icons.Check /> Завершить игру
                            </button>
                        </div>
                    </div>
                );
            }

            // СПИСОК КАТЕГОРИЙ (Без отличающейся подложки под кнопками)
            if (screen === 'cat_list') {
                return (
                    <div className="min-h-[100dvh] w-full flex flex-col p-5 fade-in max-w-lg mx-auto relative z-10">
                        <div className="flex items-center gap-4 mb-8 pt-4">
                            <button onClick={() => setScreen('menu')} className="p-4 bg-white/5 rounded-full hover:bg-white/10 text-white/80 transition-all">
                                <Icons.Back />
                            </button>
                            <div>
                                <h2 className="text-2xl font-bold text-white tracking-wide">База вопросов</h2>
                                <p className="text-[11px] uppercase tracking-widest text-white/40 mt-1">Всего в базе: {db.length}</p>
                            </div>
                        </div>
                        <div className="flex-1 overflow-y-auto no-scrollbar flex flex-col gap-4 pb-28">
                            {CATEGORIES.map(cat => {
                                const count = db.filter(q => q.categoryId === cat.id).length;
                                return (
                                    <button 
                                        key={cat.id} 
                                        onClick={() => { setViewCategory(cat.id); setScreen('q_list'); }} 
                                        className="glass-panel p-6 flex items-center justify-between hover:bg-white/5 transition-colors text-left"
                                    >
                                        <div className="flex items-center gap-5">
                                            <span className="text-3xl">{cat.icon}</span>
                                            <div>
                                                <div className="font-bold text-base text-white/90 mb-1">{cat.name}</div>
                                                <div className="text-[11px] font-bold uppercase tracking-widest text-white/40">{count} вопросов</div>
                                            </div>
                                        </div>
                                        <Icons.Next />
                                    </button>
                                );
                            })}
                        </div>
                        <div className="fixed bottom-6 left-5 right-5 max-w-lg mx-auto pointer-events-none">
                            <button 
                                onClick={() => { setAddStatus(null); setAddForm({ text: '', cat: 'family', diff: 'Простые' }); setScreen('add_q'); }} 
                                className="w-full h-14 rounded-2xl font-bold text-sm uppercase tracking-widest btn-romantic flex items-center justify-center gap-2 shadow-2xl pointer-events-auto"
                            >
                                <Icons.Plus /> Добавить вопрос
                            </button>
                        </div>
                    </div>
                );
            }

            // СПИСОК ВОПРОСОВ ВЫБРАННОЙ КАТЕГОРИИ (С иконкой редактирования на каждой карточке)
            if (screen === 'q_list') {
                const cat = CATEGORIES.find(c => c.id === viewCategory) || CATEGORIES[0];
                const qs = db.filter(q => q.categoryId === viewCategory);
                
                return (
                    <div className="min-h-[100dvh] w-full flex flex-col p-5 fade-in max-w-2xl mx-auto relative z-10">
                        <div className="flex items-center gap-4 mb-10 pt-4 flex-shrink-0">
                            <button onClick={() => setScreen('cat_list')} className="p-4 bg-white/5 rounded-full hover:bg-white/10 text-white/80 transition-all">
                                <Icons.Back />
                            </button>
                            <div>
                                <h2 className="text-2xl font-bold text-white tracking-wide flex items-center gap-2">
                                    {cat.icon} {cat.name}
                                </h2>
                                <div className="text-[11px] font-bold uppercase tracking-widest text-white/40 mt-1">{qs.length} вопросов</div>
                            </div>
                        </div>
                        <div className="flex-1 overflow-y-auto no-scrollbar flex flex-col gap-10 pb-28">
                            {DIFFICULTIES.map(diff => {
                                const diffQs = qs.filter(q => q.level === diff.id);
                                if (diffQs.length === 0) return null;
                                return (
                                    <div key={diff.id}>
                                        <h3 className={`text-[24px] md:text-3xl font-bold uppercase tracking-widest mb-6 pl-2 ${diff.classText}`}>
                                            {diff.name} ({diffQs.length})
                                        </h3>
                                        <div className="flex flex-col gap-4">
                                            {diffQs.map(q => (
                                                <div key={q.dbKey} className="glass-panel p-5 md:p-6 flex items-start justify-between gap-4 border-white/5 shadow-md">
                                                    <div className="text-[16px] md:text-lg font-normal text-white/90 leading-snug">
                                                        <span className="text-white/40 font-bold mr-2">№ {q.num}.</span>
                                                        {q.cleanText}
                                                    </div>
                                                    <button 
                                                        onClick={() => openEditScreen(q, 'q_list')}
                                                        title="Редактировать вопрос"
                                                        className="flex-shrink-0 p-3 rounded-xl bg-white/5 hover:bg-white/15 text-white/60 hover:text-white active:scale-90 transition-all border border-white/10"
                                                    >
                                                        <Icons.Edit />
                                                    </button>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                );
                            })}
                        </div>
                        <div className="fixed bottom-6 left-5 right-5 max-w-2xl mx-auto pointer-events-none">
                            <button 
                                onClick={() => { setAddStatus(null); setAddForm({ text: '', cat: viewCategory || 'family', diff: 'Простые' }); setScreen('add_q'); }} 
                                className="w-full h-14 rounded-2xl font-bold text-sm uppercase tracking-widest btn-romantic flex items-center justify-center gap-2 shadow-2xl pointer-events-auto"
                            >
                                <Icons.Plus /> Добавить вопрос
                            </button>
                        </div>
                    </div>
                );
            }

            // ЭКРАН РЕДАКТИРОВАНИЯ И УДАЛЕНИЯ ВОПРОСА
            if (screen === 'edit_q' && editingQuestion) {
                const origText = (editingQuestion.cleanText || editingQuestion.text.replace(/^№\s*\d+\.\s*/, '')).trim();
                const hasChanges = 
                    editForm.text.trim() !== "" && (
                        editForm.text.trim() !== origText ||
                        editForm.cat !== editingQuestion.categoryId ||
                        editForm.diff !== editingQuestion.level
                    );

                return (
                    <div className="min-h-[100dvh] w-full flex flex-col p-5 fade-in max-w-lg mx-auto relative z-10">
                        <div className="flex items-center justify-between mb-6 pt-4">
                            <div className="flex items-center gap-4">
                                <button onClick={() => setScreen(returnScreen)} className="p-4 bg-white/5 rounded-full hover:bg-white/10 text-white/80 transition-all">
                                    <Icons.Back />
                                </button>
                                <div>
                                    <h2 className="text-xl font-bold text-white tracking-wide">Редактирование</h2>
                                    <p className="text-[11px] font-bold uppercase tracking-widest text-white/40 mt-0.5">
                                        Вопрос № {editingQuestion.num} • ID: {editingQuestion.id}
                                    </p>
                                </div>
                            </div>
                        </div>

                        <div className="flex-1 flex flex-col gap-6 slide-up">
                            <div>
                                <label className="block text-[11px] font-bold uppercase tracking-widest text-white/50 mb-3 ml-2">Текст вопроса</label>
                                <textarea 
                                    value={editForm.text}
                                    onChange={e => setEditForm({...editForm, text: e.target.value})}
                                    className="w-full glass-panel p-5 text-base text-white/95 placeholder-white/20 outline-none resize-none h-36 focus:border-[#be123c]/50 transition-colors shadow-inner"
                                    placeholder="Введите текст вопроса..."
                                ></textarea>
                            </div>
                            
                            <div>
                                <label className="block text-[11px] font-bold uppercase tracking-widest text-white/50 mb-3 ml-2">Тема вопроса</label>
                                <select 
                                    value={editForm.cat}
                                    onChange={e => setEditForm({...editForm, cat: e.target.value})}
                                    className="w-full glass-panel h-14 px-5 text-base text-white/90 outline-none appearance-none font-medium bg-transparent"
                                >
                                    {CATEGORIES.map(c => <option key={c.id} value={c.id} className="bg-[#1a0b1c] text-white">{c.icon} {c.name}</option>)}
                                </select>
                            </div>

                            <div>
                                <label className="block text-[11px] font-bold uppercase tracking-widest text-white/50 mb-3 ml-2">Сложность</label>
                                <select 
                                    value={editForm.diff}
                                    onChange={e => setEditForm({...editForm, diff: e.target.value})}
                                    className="w-full glass-panel h-14 px-5 text-base text-white/90 outline-none appearance-none font-medium bg-transparent"
                                >
                                    {DIFFICULTIES.map(d => <option key={d.id} value={d.id} className="bg-[#1a0b1c] text-white">{d.name}</option>)}
                                </select>
                            </div>

                            {/* Кнопка удаления вопроса */}
                            <button 
                                type="button"
                                onClick={() => setConfirmModal({ action: 'delete', title: 'Точно ли вы хотите удалить этот вопрос из базы данных?' })}
                                className="w-full h-14 rounded-2xl border border-rose-500/40 bg-rose-950/20 hover:bg-rose-900/30 text-rose-400 text-xs font-bold uppercase tracking-widest flex items-center justify-center gap-2 transition-all active:scale-95"
                            >
                                <Icons.Trash /> Удалить вопрос
                            </button>

                            {/* Кнопки Отменить и Сохранить */}
                            <div className="mt-auto pb-4 pt-2 grid grid-cols-2 gap-4">
                                <button 
                                    type="button" 
                                    onClick={() => setScreen(returnScreen)} 
                                    className="w-full h-14 rounded-2xl btn-ghost text-xs font-bold uppercase tracking-widest"
                                >
                                    Отменить
                                </button>
                                <button 
                                    type="button"
                                    disabled={!hasChanges || isSaving}
                                    onClick={() => setConfirmModal({ action: 'save', title: 'Точно ли вы хотите изменить этот вопрос в базе данных?' })}
                                    className="w-full h-14 rounded-2xl btn-romantic text-white text-xs font-bold uppercase tracking-widest flex items-center justify-center gap-2 shadow-xl disabled:opacity-25 disabled:pointer-events-none"
                                >
                                    <Icons.Check /> Сохранить
                                </button>
                            </div>
                        </div>

                        {/* Модальное окно подтверждения действия */}
                        {confirmModal && (
                            <div className="fixed inset-0 bg-black/80 backdrop-blur-md flex items-center justify-center p-5 z-50 fade-in">
                                <div className="glass-panel p-7 w-full max-w-sm text-center flex flex-col items-center gap-6 border border-white/10">
                                    <div className="text-4xl">{confirmModal.action === 'delete' ? '🗑️' : '✏️'}</div>
                                    <h3 className="text-base font-bold text-white leading-snug">
                                        {confirmModal.title}
                                    </h3>
                                    <div className="grid grid-cols-2 gap-3 w-full">
                                        <button 
                                            onClick={() => setConfirmModal(null)}
                                            className="w-full h-14 rounded-2xl btn-ghost text-xs font-bold uppercase tracking-widest"
                                        >
                                            Отмена
                                        </button>
                                        <button 
                                            onClick={() => confirmModal.action === 'delete' ? executeDeleteQuestion() : executeSaveEdit()}
                                            className="w-full h-14 rounded-2xl btn-romantic text-white text-xs font-bold uppercase tracking-widest"
                                        >
                                            Да
                                        </button>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* Модальное окно ответа системы (Успех или Ошибка БД) */}
                        {resultModal && (
                            <div className="fixed inset-0 bg-black/85 backdrop-blur-md flex items-center justify-center p-5 z-50 fade-in">
                                <div className="glass-panel p-8 w-full max-w-sm text-center flex flex-col items-center gap-5 border border-white/10">
                                    <div className="text-5xl">{resultModal.ok ? '✅' : '⚠️'}</div>
                                    <h3 className="text-lg font-bold text-white">
                                        {resultModal.ok ? 'Выполнено успешно' : 'Ошибка базы данных'}
                                    </h3>
                                    <p className="text-xs text-white/70 leading-relaxed">
                                        {resultModal.msg}
                                    </p>
                                    <button 
                                        onClick={() => {
                                            const target = resultModal.afterCloseScreen;
                                            setResultModal(null);
                                            if (target) setScreen(target);
                                        }}
                                        className="w-full h-14 rounded-2xl btn-romantic text-white text-xs font-bold uppercase tracking-widest mt-2"
                                    >
                                        Понятно
                                    </button>
                                </div>
                            </div>
                        )}
                    </div>
                );
            }

            // ФОРМА ДОБАВЛЕНИЯ НОВОГО ВОПРОСА В БАЗУ
            if (screen === 'add_q') {
                return (
                    <div className="min-h-[100dvh] w-full flex flex-col p-5 fade-in max-w-lg mx-auto relative z-10">
                        <div className="flex items-center gap-4 mb-8 pt-4">
                            <button onClick={() => setScreen('cat_list')} className="p-4 bg-white/5 rounded-full hover:bg-white/10 text-white/80 transition-all">
                                <Icons.Back />
                            </button>
                            <h2 className="text-2xl font-bold text-white tracking-wide">Новый вопрос</h2>
                        </div>

                        {addStatus ? (
                            <div className="flex-1 flex flex-col items-center justify-center slide-up">
                                <div className="glass-panel p-8 w-full flex flex-col items-center text-center shadow-2xl">
                                    {addStatus.ok ? (
                                        <svg className="checkmark mb-6" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 52 52">
                                            <circle className="checkmark-circle" cx="26" cy="26" r="25" fill="none"/>
                                            <path className="checkmark-check" fill="none" d="M14.1 27.2l7.1 7.2 16.7-16.8"/>
                                        </svg>
                                    ) : (
                                        <div className="text-5xl mb-6">⚠️</div>
                                    )}
                                    <h3 className="text-xl font-bold text-white mb-2 tracking-wide">
                                        {addStatus.ok ? 'Успешно добавлен!' : 'Ошибка сохранения'}
                                    </h3>
                                    <p className="text-xs text-white/70 mb-8 leading-relaxed">
                                        {addStatus.msg}
                                    </p>
                                    <div className="grid grid-cols-2 gap-3 w-full">
                                        <button 
                                            onClick={() => setScreen('cat_list')} 
                                            className="btn-ghost h-14 w-full rounded-2xl text-xs font-bold uppercase tracking-widest"
                                        >
                                            К списку
                                        </button>
                                        <button 
                                            onClick={() => { setAddStatus(null); setAddForm({ text: '', cat: addForm.cat, diff: addForm.diff }); }} 
                                            className="btn-romantic h-14 w-full rounded-2xl text-xs font-bold uppercase tracking-widest text-white"
                                        >
                                            Еще один
                                        </button>
                                    </div>
                                </div>
                            </div>
                        ) : (
                            <form onSubmit={handleAddQuestion} className="flex-1 flex flex-col gap-6 slide-up">
                                <div>
                                    <label className="block text-[11px] font-bold uppercase tracking-widest text-white/50 mb-3 ml-2">Текст вопроса</label>
                                    <textarea 
                                        required
                                        value={addForm.text}
                                        onChange={e => setAddForm({...addForm, text: e.target.value})}
                                        className="w-full glass-panel p-6 text-base text-white/90 placeholder-white/20 outline-none resize-none h-40 focus:border-[#be123c]/50 transition-colors shadow-inner"
                                        placeholder="Напишите ваш вопрос..."
                                    ></textarea>
                                </div>
                                
                                <div>
                                    <label className="block text-[11px] font-bold uppercase tracking-widest text-white/50 mb-3 ml-2">Тема вопроса</label>
                                    <select 
                                        value={addForm.cat}
                                        onChange={e => setAddForm({...addForm, cat: e.target.value})}
                                        className="w-full glass-panel h-14 px-5 text-base text-white/90 outline-none appearance-none font-medium bg-transparent"
                                    >
                                        {CATEGORIES.map(c => <option key={c.id} value={c.id} className="bg-[#1a0b1c] text-white">{c.icon} {c.name}</option>)}
                                    </select>
                                </div>

                                <div>
                                    <label className="block text-[11px] font-bold uppercase tracking-widest text-white/50 mb-3 ml-2">Сложность</label>
                                    <select 
                                        value={addForm.diff}
                                        onChange={e => setAddForm({...addForm, diff: e.target.value})}
                                        className="w-full glass-panel h-14 px-5 text-base text-white/90 outline-none appearance-none font-medium bg-transparent"
                                    >
                                        {DIFFICULTIES.map(d => <option key={d.id} value={d.id} className="bg-[#1a0b1c] text-white">{d.name}</option>)}
                                    </select>
                                </div>

                                <div className="mt-auto pb-6 pt-4 grid grid-cols-2 gap-4">
                                    <button type="button" onClick={() => setScreen('cat_list')} className="w-full h-14 rounded-2xl btn-ghost text-xs font-bold uppercase tracking-widest">
                                        Отмена
                                    </button>
                                    <button type="submit" disabled={isSaving || !addForm.text.trim()} className="w-full h-14 rounded-2xl btn-romantic text-white text-xs font-bold uppercase tracking-widest flex items-center justify-center gap-2 shadow-xl disabled:opacity-30">
                                        <Icons.Plus /> {isSaving ? "Сохранение..." : "Сохранить"}
                                    </button>
                                </div>
                            </form>
                        )}
                    </div>
                );
            }
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
