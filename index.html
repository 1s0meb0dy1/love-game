        .fade-in { animation: fadeIn 0.22s ease-out forwards; } .slide-up { animation: slideUp 0.32s cubic-bezier(0.22, 1, 0.36, 1) forwards; } .pulse-soft { animation: pulseSoft 2.4s ease-in-out infinite; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } } @keyframes slideUp { from { opacity: 0; transform: translate3d(0, 14px, 0); } to { opacity: 1; transform: none; } } @keyframes pulseSoft { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.07); } }
        .no-scrollbar::-webkit-scrollbar { display: none; } .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo, useCallback } = React;

        const FIREBASE_BASE_URL = "https://project-x-5e16a-default-rtdb.europe-west1.firebasedatabase.app";
        const FIREBASE_API_KEY = "AIzaSyDBE1-ZGgrHOVVUzl0Pcnkua-heJyRyoqg"; 
        
        const PROFILE_STORAGE_KEY = "askme_device_profile_v6";
        const ADMIN_STORAGE_KEY = "askme_admin_unlocked_v6";
        const OFFLINE_DB_CACHE_KEY = "askme_offline_db_cache_v3";
        const CAT_CACHE_KEY = "askme_categories_v1";
        const SETTINGS_CACHE_KEY = "askme_settings_v1";

        const DEFAULT_CATEGORIES = [
            { id: "family", name: "Семья", icon: "👨‍👩‍👧‍👦", order: 1 }, { id: "intimacy", name: "Интим", icon: "🔞", order: 2 },
            { id: "future", name: "Будущее", icon: "🎯", order: 3 }, { id: "secrets", name: "Секреты", icon: "🤫", order: 4 },
            { id: "romance", name: "Романтика", icon: "❤️", order: 5 }, { id: "past", name: "Прошлое", icon: "⏳", order: 6 }
        ];

        const DIFFICULTIES = [
            { id: "Простые", name: "Легкие", classText: "diff-text-1" },
            { id: "Средние", name: "Средние", classText: "diff-text-2" },
            { id: "Глубокие", name: "Глубокие", classText: "diff-text-3" }
        ];

        const DEFAULT_PUNISHMENTS = {
            "Простые": ["Сделай комплимент соседу справа", "Расскажи неловкую шутку", "Выпей стакан воды залпом"],
            "Средние": ["Покажи 3 последних фото в галерее", "Расскажи стыдную историю из детства", "Дай посмотреть историю поиска в браузере"],
            "Глубокие": ["Ответь на следующий вопрос без права отказа", "Позвони случайному контакту и промолчи 10 секунд", "Отдай телефон соседу на 1 минуту"]
        };

        const GROUP_EMOJIS = ["😈", "🤫", "😋", "🤔", "🤪", "😏", "😱", "🫣"];

        const fetchWithTimeout = async (url, options = {}, ms = 20000) => {
            const ctrl = new AbortController(); const timer = setTimeout(() => ctrl.abort(), ms);
            try { return await fetch(url, { ...options, signal: ctrl.signal }); } finally { clearTimeout(timer); }
        };

        const generateSessionId = () => Math.random().toString(36).substring(2, 10).toUpperCase();

        const Icons = {
            Play: () => <svg className="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5.14v14l11-7-11-7z" /></svg>, Menu: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 6h16M4 12h16M4 18h16" /></svg>, Back: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M10 19l-7-7m0 0l7-7m-7 7h18" /></svg>, Next: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M14 5l7 7m0 0l-7 7m7-7H3" /></svg>, Plus: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 4v16m8-8H4" /></svg>, Check: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2.5} d="M5 13l4 4L19 7" /></svg>, Close: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2.2} d="M6 18L18 6M6 6l12 12" /></svg>, Lock: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" /></svg>, Clock: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>, Skip: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M11.933 12.8a1 1 0 000-1.6L6.6 7.2A1 1 0 005 8v8a1 1 0 001.6.8l5.333-4zM19.933 12.8a1 1 0 000-1.6l-5.333-4A1 1 0 0013 8v8a1 1 0 001.6.8l5.333-4z" /></svg>, Chart: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" /></svg>, Trash: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>
        };

        const PopupModal = ({ isOpen, onClose, children, closeBtn=true }) => {
            if (!isOpen) return null; return ReactDOM.createPortal(<div className="viewport-popup-overlay fade-in" onClick={() => { if (onClose && closeBtn) onClose(); }}> <div className="viewport-popup-box slide-up" onClick={e => e.stopPropagation()}> {closeBtn && onClose && <button onClick={onClose} className="absolute top-4 right-4 w-9 h-9 rounded-full bg-white/[0.06] flex items-center justify-center text-zinc-400 z-10"><Icons.Close /></button>} {children} </div> </div>, document.body);
        };

        // Component for Tinder-like Swipe and Blur
        const SwipeableCarousel = ({ questions, currentIndex, maxReachedIndex, onSwipeLeft, onSwipeRight, isTestMode }) => {
            const [touchStart, setTouchStart] = useState(null);
            const [touchEnd, setTouchEnd] = useState(null);
            
            const handleTouchStart = (e) => { setTouchEnd(null); setTouchStart(e.targetTouches[0].clientX); };
            const handleTouchMove = (e) => setTouchEnd(e.targetTouches[0].clientX);
            const handleTouchEnd = () => {
                if (!touchStart || !touchEnd) return;
                const distance = touchStart - touchEnd;
                if (distance > 60) onSwipeLeft();
                if (distance < -60) onSwipeRight();
            };

            return (
                <div className="w-full overflow-hidden relative touch-pan-y" onTouchStart={handleTouchStart} onTouchMove={handleTouchMove} onTouchEnd={handleTouchEnd}>
                    <div className="swiper-container" style={{ transform: `translate3d(-${currentIndex * 100}%, 0, 0)` }}>
                        {questions.map((q, i) => {
                            const isBlurred = !isTestMode && i > maxReachedIndex;
                            return (
                                <div key={q.id || i} className="swiper-slide">
                                    <div className={`w-full flex flex-col items-center justify-center min-h-[250px] relative transition-all duration-300 ${isBlurred ? 'card-blurred' : ''}`}>
                                        {isBlurred && (
                                            <div className="absolute inset-0 z-10 flex flex-col items-center justify-center bg-black/20 rounded-3xl">
                                                <div className="w-16 h-16 rounded-full bg-rose-500/20 text-rose-500 flex items-center justify-center mb-3"><Icons.Lock /></div>
                                                <p className="font-bold text-white uppercase tracking-widest text-xs">Завершите предыдущий</p>
                                            </div>
                                        )}
                                        <h2 className="text-[24px] sm:text-[28px] font-medium text-center leading-[1.25] text-white px-2 mb-8">
                                            {q.cleanText || q.text}
                                        </h2>
                                    </div>
                                </div>
                            );
                        })}
                    </div>
                </div>
            );
        };

        const TurnReel = ({ candidates, winnerId, spinning }) => {
            const wrapRef = React.useRef(null); const [pos, setPos] = React.useState({ x: 0, anim: false, ready: false });
            const reelItems = useMemo(() => { if(!candidates || candidates.length === 0) return []; const arr = []; while(arr.length < 40) arr.push(...candidates); if(winnerId) { const w = candidates.find(c => c.id === winnerId); if(w) arr[25] = w; } return arr.slice(0, 40); }, [candidates, winnerId]);
            useEffect(() => { const w = wrapRef.current ? wrapRef.current.getBoundingClientRect().width : 300; const g = { final: w / 2 - (25 * 92 + 42), start: w / 2 - (25 * 92 + 42) + 20 * 92 }; if (spinning) { setPos({ x: g.start, anim: false, ready: true }); setTimeout(() => setPos({ x: g.final, anim: true, ready: true }), 50); } else { setPos({ x: g.final, anim: false, ready: true }); } }, [spinning, winnerId]);
            return ( <div ref={wrapRef} className="relative w-full h-[112px] overflow-hidden rounded-2xl border border-white/10 bg-white/[0.02]"> <div className="absolute top-0 bottom-0 left-0 flex items-center gap-2" style={{ transform: `translate3d(${pos.x}px,0,0)`, transition: pos.anim ? 'transform 2.2s cubic-bezier(0.08,0.6,0.12,1)' : 'none', opacity: pos.ready ? 1 : 0 }}> {reelItems.map((c, i) => { const win = !spinning && i === 25; return ( <div key={`${c.id}_${i}`} className={`w-[84px] h-[92px] rounded-xl border flex flex-col items-center justify-center gap-1 transition-all flex-shrink-0 ${win ? 'bg-rose-500/15 border-rose-500 scale-105' : 'bg-white/[0.04] border-white/10 opacity-40'}`}> <span className="text-2xl">{c.gender === 'guy' ? '👨' : '👩'}</span> <span className="text-[11px] font-bold text-white truncate max-w-[72px]">{c.name}</span> </div> ); })} </div> <div className="pointer-events-none absolute inset-y-0 left-1/2 w-[2px] -translate-x-1/2 bg-rose-400 shadow-[0_0_12px_rgba(251,113,133,0.9)]" /> </div> );
        };

        const CountdownTimer = ({ duration, timeLeft }) => {
            const radius = 36; const circumference = radius * 2 * Math.PI; const strokeDashoffset = circumference - (timeLeft / duration) * circumference;
            const isLow = timeLeft <= 5 && timeLeft > 0;
            return (
                <div className="relative flex items-center justify-center w-24 h-24 mb-4">
                    <svg className="timer-ring absolute inset-0 w-full h-full" viewBox="0 0 80 80">
                        <circle cx="40" cy="40" r={radius} fill="transparent" stroke="rgba(255,255,255,0.1)" strokeWidth="6" />
                        <circle cx="40" cy="40" r={radius} fill="transparent" stroke={isLow ? "#f43f5e" : "#34d399"} strokeWidth="6" strokeDasharray={circumference} strokeDashoffset={strokeDashoffset} className="transition-all duration-1000 ease-linear" strokeLinecap="round" />
                    </svg>
                    <span className={`font-display text-2xl font-bold ${isLow ? 'text-rose-500 animate-pulse' : 'text-white'}`}>{timeLeft}</span>
                </div>
            );
        };

        function App() {
            const [db, setDb] = useState([]);
            const [categories, setCategories] = useState(DEFAULT_CATEGORIES);
            const [isLoading, setIsLoading] = useState(true);
            const [isAdmin, setIsAdmin] = useState(() => !!localStorage.getItem(ADMIN_STORAGE_KEY));
            
            const [profile, setProfile] = useState(() => { try { const p = JSON.parse(localStorage.getItem(PROFILE_STORAGE_KEY)); return p || null; } catch(e){ return null; } });
            const [screen, setScreenState] = useState(profile ? 'menu' : 'onboarding');
            const navigate = (scr) => { setScreenState(scr); window.scrollTo(0,0); };

            // Game State
            const [gameMode, setGameMode] = useState('normal'); 
            const [gameQuestions, setGameQuestions] = useState([]); 
            const [currentIndex, setCurrentIndex] = useState(0); 
            const [maxReachedIndex, setMaxReachedIndex] = useState(0); 
            const [turnHistory, setTurnHistory] = useState({}); // { qIndex: ['p1', 'p2'] }
            const [skippedHistory, setSkippedHistory] = useState({}); // { qIndex: ['p1'] (if single skip) or 'ALL' }
            const [turnPopup, setTurnPopup] = useState({ open: false, spinning: false, candidates: [], winnerId: null });
            const [skipModal, setSkipModal] = useState({ open: false, qIndex: null });
            const [punishmentModal, setPunishmentModal] = useState({ open: false, text: "", player: null });
            
            // Settings Pre-Game
            const [gameSettings, setGameSettings] = useState(() => { try { return JSON.parse(localStorage.getItem(SETTINGS_CACHE_KEY)) || { timer: 0, punishments: DEFAULT_PUNISHMENTS }; } catch(e){ return { timer: 0, punishments: DEFAULT_PUNISHMENTS }; } });
            
            // Timer state
            const [timeLeft, setTimeLeft] = useState(0);
            const [timerActive, setTimerActive] = useState(false);

            // Analytics State
            const [analyticsData, setAnalyticsData] = useState([]);
            const [sessionStartTime, setSessionStartTime] = useState(0);
            const [sessionLog, setSessionLog] = useState([]); // tracks time and skips per question

            useEffect(() => {
                const loadDb = async () => {
                    try {
                        const res = await fetchWithTimeout(`${FIREBASE_BASE_URL}/questions.json`);
                        if(res.ok) {
                            const data = await res.json();
                            const parsed = Object.keys(data||{}).map((k, i) => ({ dbKey: k, id: data[k].id || `q_${i}`, num: i+1, categoryId: data[k].categoryId, level: data[k].level, text: data[k].text, cleanText: data[k].text.replace(/^№\s*\d+\.\s*/, '') }));
                            setDb(parsed);
                        }
                    } catch(e) {}
                    setIsLoading(false);
                }; loadDb();
            }, []);

            // Timer Logic
            useEffect(() => {
                let interval = null;
                if (timerActive && timeLeft > 0 && !turnPopup.open && !punishmentModal.open && !skipModal.open) {
                    interval = setInterval(() => setTimeLeft(t => t - 1), 1000);
                } else if (timeLeft === 0 && timerActive) {
                    setTimerActive(false);
                    handleTimeOut();
                }
                return () => clearInterval(interval);
            }, [timerActive, timeLeft, turnPopup.open, punishmentModal.open, skipModal.open]);

            const triggerRoulette = (qIdx, currentHistObj) => {
                if (!profile?.players) return;
                const answered = currentHistObj[qIdx] || [];
                const skipped = skippedHistory[qIdx];
                if (skipped === 'ALL' || answered.length >= profile.players.length) {
                    setTimerActive(false);
                    return; // Next button becomes "Swipe Left"
                }
                
                const candidates = profile.players.filter(p => !answered.includes(p.id));
                if (candidates.length > 0) {
                    setTimerActive(false);
                    const winner = candidates[Math.floor(Math.random() * candidates.length)];
                    setTurnPopup({ open: true, spinning: true, candidates, winnerId: null });
                    setTimeout(() => {
                        setTurnPopup({ open: true, spinning: false, candidates, winnerId: winner.id });
                        const newHist = { ...currentHistObj, [qIdx]: [...answered, winner.id] };
                        setTurnHistory(newHist);
                        // Record for analytics
                        if(!sessionLog[qIdx]) sessionLog[qIdx] = { qId: gameQuestions[qIdx].id, skips: 0, answers: 0, timeSpent: 0, startTs: Date.now() };
                    }, 2200);
                }
            };

            const closeRoulette = () => {
                setTurnPopup({ open: false, spinning: false, candidates: [], winnerId: null });
                if (gameSettings.timer > 0) {
                    setTimeLeft(gameSettings.timer);
                    setTimerActive(true);
                }
            };

            const handleTimeOut = () => {
                const answeredIds = turnHistory[currentIndex] || [];
                const activePlayerId = answeredIds[answeredIds.length - 1];
                const playerObj = profile.players.find(p => p.id === activePlayerId);
                applyPunishment(playerObj, "Время вышло!");
            };

            const applyPunishment = (player, reason) => {
                const qLevel = gameQuestions[currentIndex].level;
                const punishList = gameSettings.punishments[qLevel] || DEFAULT_PUNISHMENTS[qLevel];
                const randomP = punishList[Math.floor(Math.random() * punishList.length)];
                setPunishmentModal({ open: true, player, text: randomP, reason });
                setTimerActive(false);
            };

            const handlePunishmentDone = () => {
                const p = punishmentModal.player;
                setPunishmentModal({ open: false, player: null, text: "" });
                // Mark as skipped for this player in history so they don't count as 'answered' normally, but they are in turnHistory so roulette moves on.
                const curSkip = skippedHistory[currentIndex] || [];
                if (curSkip !== 'ALL') {
                    setSkippedHistory({...skippedHistory, [currentIndex]: [...curSkip, p?.id]});
                }
                
                // Track analytics
                if(sessionLog[currentIndex]) sessionLog[currentIndex].skips += 1;

                // Move to next player
                triggerRoulette(currentIndex, turnHistory);
            };

            const handleSkipRequest = () => setSkipModal({ open: true, qIndex: currentIndex });

            const confirmSkip = (type) => {
                setSkipModal({ open: false });
                const answeredIds = turnHistory[currentIndex] || [];
                const activePlayerId = answeredIds[answeredIds.length - 1];
                const playerObj = profile.players.find(p => p.id === activePlayerId);

                if (type === 'me') {
                    applyPunishment(playerObj, "Отказ от ответа");
                } else if (type === 'all') {
                    setSkippedHistory({...skippedHistory, [currentIndex]: 'ALL'});
                    setTimerActive(false);
                    // Force complete for this question
                    setMaxReachedIndex(Math.max(maxReachedIndex, currentIndex + 1));
                    if(sessionLog[currentIndex]) sessionLog[currentIndex].skips += profile.players.length;
                }
            };

            const markAnswered = () => {
                setTimerActive(false);
                if(sessionLog[currentIndex]) {
                    sessionLog[currentIndex].answers += 1;
                    sessionLog[currentIndex].timeSpent += Math.round((Date.now() - sessionLog[currentIndex].startTs)/1000);
                    sessionLog[currentIndex].startTs = Date.now(); // reset for next player
                }
                triggerRoulette(currentIndex, turnHistory);
            };

            // Swipe Handlers
            const onSwipeLeft = () => {
                // Going Forward
                if (currentIndex < gameQuestions.length - 1) {
                    const answered = turnHistory[currentIndex] || [];
                    const isSkippedAll = skippedHistory[currentIndex] === 'ALL';
                    const isCompleted = isSkippedAll || answered.length >= profile.players.length;

                    if (currentIndex < maxReachedIndex || isCompleted) {
                        const nextIdx = currentIndex + 1;
                        setCurrentIndex(nextIdx);
                        if (isCompleted) setMaxReachedIndex(Math.max(maxReachedIndex, nextIdx));
                        
                        // If it's a new question, spin roulette
                        if (!turnHistory[nextIdx]) triggerRoulette(nextIdx, turnHistory);
                    } else {
                        // User trying to swipe to unreached. Let them see blur, snap them to it
                        setCurrentIndex(currentIndex + 1);
                    }
                } else {
                    finishGame();
                }
            };

            const onSwipeRight = () => {
                if (currentIndex > 0) setCurrentIndex(currentIndex - 1);
            };

            const finishGame = async () => {
                setTimerActive(false);
                if (gameMode === 'normal') {
                    // Compile analytics
                    const duration = Math.round((Date.now() - sessionStartTime) / 1000);
                    let totAnswers = 0; let totSkips = 0;
                    sessionLog.forEach(l => { if(l){ totAnswers+=l.answers; totSkips+=l.skips; }});
                    const payload = {
                        sessionId: profile.sessionId, date: Date.now(),
                        duration, players: profile.players.length,
                        timer: gameSettings.timer, questionsTotal: maxReachedIndex + 1,
                        answers: totAnswers, skips: totSkips, logs: sessionLog.filter(Boolean)
                    };
                    try { await fetchWithTimeout(`${FIREBASE_BASE_URL}/analytics_v2/${profile.sessionId}_${Date.now()}.json`, { method: "PUT", body: JSON.stringify(payload) }); } catch(e){}
                }
                navigate('summary');
            };

            const saveSettingsAndStart = (settingsObj) => {
                setGameSettings(settingsObj);
                localStorage.setItem(SETTINGS_CACHE_KEY, JSON.stringify(settingsObj));
                
                // Shuffle pool
                let pool = db.filter(q => q.categoryId !== '_session');
                const shuffled = [...pool].sort(() => Math.random() - 0.5);
                
                setGameQuestions(shuffled);
                setCurrentIndex(0); setMaxReachedIndex(0); setTurnHistory({}); setSkippedHistory({}); setSessionLog([]);
                setSessionStartTime(Date.now());
                navigate('game');
                if (gameMode === 'normal') triggerRoulette(0, {});
            };

            const fetchAnalytics = async () => {
                try {
                    const r = await fetchWithTimeout(`${FIREBASE_BASE_URL}/analytics_v2.json`);
                    if(r.ok) {
                        const d = await r.json();
                        if(d) setAnalyticsData(Object.values(d));
                    }
                } catch(e){}
            };

            if (isLoading) return <div className="safe-screen flex items-center justify-center"><div className="pulse-soft text-rose-500 font-bold tracking-widest text-xs uppercase">Синхронизация...</div></div>;

            if (screen === 'onboarding') {
                return (
                    <div className="safe-screen flex flex-col items-center justify-center slide-up px-6 text-center gap-8">
                        <div className="flex items-center gap-3">
                            <div className="w-12 h-12 rounded-2xl bg-rose-500 flex items-center justify-center text-white"><Icons.Play /></div>
                            <span className="font-display text-4xl font-extrabold text-white uppercase tracking-wider">Ask<span className="text-rose-500">Me</span></span>
                        </div>
                        <p className="text-zinc-400 text-sm">Создай сессию, чтобы начать откровенный разговор.</p>
                        <button onClick={() => {
                            const newProf = { sessionId: generateSessionId(), players: [{id:'p1',name:'Игрок 1',gender:'guy'}, {id:'p2',name:'Игрок 2',gender:'girl'}] };
                            setProfile(newProf); localStorage.setItem(PROFILE_STORAGE_KEY, JSON.stringify(newProf));
                            navigate('menu');
                        }} className="w-full max-w-sm rounded-2xl btn-primary uppercase font-bold text-xs tracking-widest">Создать новую игру</button>
                        <button onClick={()=>{setIsAdmin(true); navigate('menu');}} className="text-xs text-zinc-600 underline">Вход для владельца</button>
                    </div>
                );
            }

            if (screen === 'menu') {
                return (
                    <div className="safe-screen max-w-md mx-auto flex flex-col gap-6 slide-up py-4">
                        <header className="flex justify-between items-center w-full px-2">
                            <button onClick={()=>navigate('onboarding')} className="px-4 py-2 rounded-full bg-white/[0.05] text-xs font-bold text-zinc-300">Игроки ({profile?.players?.length||2})</button>
                            {isAdmin && <button onClick={()=>{fetchAnalytics(); navigate('analytics');}} className="p-2 rounded-full bg-rose-500/20 text-rose-400"><Icons.Chart /></button>}
                        </header>
                        <div className="flex-1 flex flex-col gap-4 items-center justify-center mt-10">
                            <h1 className="font-display text-3xl font-bold text-white mb-6">Готовы начать?</h1>
                            <button onClick={() => { setGameMode('normal'); navigate('game_settings'); }} className="w-full rounded-2xl btn-primary uppercase font-bold text-sm h-16 flex items-center justify-center gap-2 shadow-[0_0_30px_rgba(244,63,94,0.3)]"><Icons.Play /> Обычная игра</button>
                            {isAdmin && <button onClick={() => { setGameMode('test'); saveSettingsAndStart({timer:0}); }} className="w-full rounded-2xl btn-secondary uppercase font-bold text-xs">Тестовый режим (Все вопросы)</button>}
                        </div>
                    </div>
                );
            }

            if (screen === 'game_settings') {
                const [locSet, setLocSet] = useState(gameSettings);
                const [editDiff, setEditDiff] = useState('Простые');
                const [newP, setNewP] = useState('');

                const addP = () => { if(newP.trim()){ setLocSet({...locSet, punishments: {...locSet.punishments, [editDiff]: [newP.trim(), ...locSet.punishments[editDiff]]}}); setNewP(''); }};
                const remP = (idx) => { const arr = [...locSet.punishments[editDiff]]; arr.splice(idx,1); setLocSet({...locSet, punishments: {...locSet.punishments, [editDiff]: arr}}); };

                return (
                    <div className="safe-screen max-w-md mx-auto flex flex-col fade-in">
                        <header className="flex items-center gap-4 py-4 mb-4"><button onClick={()=>navigate('menu')} className="p-3 bg-white/[0.04] rounded-2xl text-zinc-400"><Icons.Back /></button><h2 className="font-display text-xl font-bold text-white">Настройки перед стартом</h2></header>
                        
                        <div className="flex flex-col gap-6 flex-1 overflow-y-auto pb-24 no-scrollbar">
                            <div className="p-5 rounded-2xl bg-white/[0.03] border border-white/10 space-y-4">
                                <div className="flex items-center gap-3 text-rose-400 font-bold uppercase tracking-wider text-xs"><Icons.Clock /> Таймер на ответ</div>
                                <div className="grid grid-cols-4 gap-2">
                                    {[0, 15, 30, 60].map(v => (
                                        <button key={v} onClick={()=>setLocSet({...locSet, timer: v})} className={`h-12 rounded-xl text-xs font-bold ${locSet.timer===v ? 'bg-rose-500 text-white' : 'bg-white/[0.05] text-zinc-400'}`}>{v === 0 ? 'Выкл' : `${v} сек`}</button>
                                    ))}
                                </div>
                            </div>

                            <div className="p-5 rounded-2xl bg-white/[0.03] border border-white/10 space-y-4">
                                <div className="flex items-center gap-3 text-rose-400 font-bold uppercase tracking-wider text-xs"><span className="text-lg">😈</span> Наказания (Фанты)</div>
                                <div className="flex gap-2 p-1 bg-black/40 rounded-xl overflow-x-auto no-scrollbar">
                                    {['Простые', 'Средние', 'Глубокие'].map(d => (
                                        <button key={d} onClick={()=>setEditDiff(d)} className={`px-4 py-2 rounded-lg text-xs font-bold flex-shrink-0 ${editDiff===d ? 'bg-white/10 text-white' : 'text-zinc-500'}`}>{d}</button>
                                    ))}
                                </div>
                                
                                <div className="flex gap-2 mt-2">
                                    <input type="text" value={newP} onChange={e=>setNewP(e.target.value)} placeholder="Свое наказание..." className="flex-1 h-12 bg-white/[0.04] rounded-xl px-4 text-sm text-white outline-none border border-white/10" />
                                    <button onClick={addP} className="w-12 h-12 bg-rose-500 rounded-xl flex items-center justify-center text-white"><Icons.Plus /></button>
                                </div>

                                <div className="flex flex-col gap-2 max-h-48 overflow-y-auto pr-1">
                                    {locSet.punishments[editDiff].map((p, i) => (
                                        <div key={i} className="flex justify-between items-center p-3 rounded-xl bg-white/[0.02] border border-white/5 text-xs text-zinc-300">
                                            <span className="flex-1">{p}</span>
                                            <button onClick={()=>remP(i)} className="p-2 text-zinc-600 hover:text-rose-400"><Icons.Trash /></button>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>

                        <div className="fixed bottom-6 left-6 right-6 max-w-md mx-auto">
                            <button onClick={()=>saveSettingsAndStart(locSet)} className="w-full rounded-2xl btn-primary h-14 font-bold text-xs uppercase tracking-widest shadow-lg">🚀 Погнали!</button>
                        </div>
                    </div>
                );
            }

            if (screen === 'game') {
                const currentQ = gameQuestions[currentIndex]; if(!currentQ) return null;
                const answered = turnHistory[currentIndex] || [];
                const isSkippedAll = skippedHistory[currentIndex] === 'ALL';
                const isCompleted = isSkippedAll || answered.length >= (profile?.players?.length || 2);
                
                let activeP = null;
                if(!isSkippedAll && answered.length > 0 && !isCompleted) {
                    activeP = profile.players.find(p => p.id === answered[answered.length-1]);
                }

                return (
                    <div className="safe-screen flex flex-col justify-between overflow-hidden relative fade-in">
                        <header className="flex justify-between items-center px-4 py-2 relative z-20">
                            <div className="px-4 py-1.5 rounded-full border border-white/10 text-xs font-bold text-white tracking-widest">{currentIndex + 1} / {gameQuestions.length}</div>
                            <button onClick={()=>navigate('menu')} className="p-2 rounded-full border border-white/10 text-zinc-400"><Icons.Close /></button>
                        </header>

                        <main className="flex-1 flex flex-col relative z-10 w-full overflow-hidden justify-center py-4">
                            {/* TOP INFO STATUS */}
                            <div className="absolute top-4 left-0 right-0 flex flex-col items-center pointer-events-none z-20">
                                {isCompleted ? (
                                    <div className="px-5 py-2 rounded-full bg-emerald-500/10 border border-emerald-500/40 text-emerald-300 text-xs font-bold uppercase tracking-widest flex items-center gap-2"><Icons.Check /> Вопрос пройден</div>
                                ) : activeP ? (
                                    <div className="px-5 py-2 rounded-full bg-rose-500/10 border border-rose-500/40 text-rose-200 text-xs font-bold uppercase tracking-widest">Очередь: {activeP.name}</div>
                                ) : (
                                    <div className="px-5 py-2 rounded-full bg-white/5 border border-white/10 text-zinc-400 text-xs font-bold uppercase tracking-widest">Ожидание рулетки...</div>
                                )}
                            </div>

                            {timerActive && activeP && !isCompleted && (
                                <div className="absolute top-20 left-0 right-0 flex justify-center z-20 pointer-events-none">
                                    <CountdownTimer duration={gameSettings.timer} timeLeft={timeLeft} />
                                </div>
                            )}

                            <SwipeableCarousel questions={gameQuestions} currentIndex={currentIndex} maxReachedIndex={maxReachedIndex} onSwipeLeft={onSwipeLeft} onSwipeRight={onSwipeRight} isTestMode={gameMode === 'test'} />
                        </main>

                        <div className="p-6 relative z-20">
                            {isCompleted ? (
                                <div className="text-center animate-pulse text-zinc-500 text-xs font-bold uppercase tracking-widest">Смахните влево <br/>для следующего вопроса ⬅️</div>
                            ) : (
                                <div className="flex gap-3">
                                    <button onClick={handleSkipRequest} disabled={!activeP} className="h-14 px-5 rounded-2xl bg-white/[0.05] border border-white/10 text-zinc-400 disabled:opacity-30"><Icons.Skip /></button>
                                    <button onClick={markAnswered} disabled={!activeP} className="flex-1 h-14 rounded-2xl btn-primary uppercase font-bold text-xs tracking-widest disabled:opacity-30">Ответил / След. Игрок</button>
                                </div>
                            )}
                        </div>

                        {/* ROULETTE POPUP */}
                        <PopupModal isOpen={turnPopup.open} onClose={null} closeBtn={false}>
                            <div className="text-center flex flex-col gap-6 py-2">
                                <h3 className="font-display text-xl font-bold text-white">{turnPopup.spinning ? "Крутим..." : "Очередь отвечать!"}</h3>
                                <TurnReel candidates={turnPopup.candidates} winnerId={turnPopup.winnerId} spinning={turnPopup.spinning} />
                                {!turnPopup.spinning && <button onClick={closeRoulette} className="w-full rounded-2xl btn-primary py-4 font-bold text-xs uppercase tracking-widest">Принять</button>}
                            </div>
                        </PopupModal>

                        {/* PUNISHMENT POPUP */}
                        <PopupModal isOpen={punishmentModal.open} onClose={null} closeBtn={false}>
                            <div className="text-center flex flex-col gap-6 py-4">
                                <div className="text-4xl">😈</div>
                                <div>
                                    <h3 className="font-display text-2xl font-bold text-rose-500 mb-1">{punishmentModal.reason}</h3>
                                    <p className="text-sm font-bold text-zinc-300 uppercase tracking-widest">{punishmentModal.player?.name}</p>
                                </div>
                                <div className="p-5 rounded-2xl bg-rose-500/10 border border-rose-500/30 text-white font-medium text-lg leading-snug">{punishmentModal.text}</div>
                                <button onClick={handlePunishmentDone} className="w-full rounded-2xl btn-primary py-4 font-bold text-xs uppercase tracking-widest">Выполнено</button>
                            </div>
                        </PopupModal>

                        {/* SKIP POPUP */}
                        <PopupModal isOpen={skipModal.open} onClose={()=>setSkipModal({open:false})}>
                            <div className="text-center flex flex-col gap-5">
                                <h3 className="font-display text-xl font-bold text-white">Пропустить вопрос?</h3>
                                <p className="text-xs text-zinc-400">Если вы пропускаете только для себя, вам будет выдано наказание.</p>
                                <div className="flex flex-col gap-3 mt-2">
                                    <button onClick={()=>confirmSkip('me')} className="w-full py-4 rounded-2xl border border-rose-500/40 bg-rose-500/10 text-rose-300 text-xs font-bold uppercase tracking-widest">Пропускаю только я</button>
                                    <button onClick={()=>confirmSkip('all')} className="w-full py-4 rounded-2xl bg-white/[0.05] text-zinc-300 text-xs font-bold uppercase tracking-widest">Скип для всех (Без наказания)</button>
                                </div>
                            </div>
                        </PopupModal>
                    </div>
                );
            }

            if (screen === 'summary') {
                return (
                    <div className="safe-screen flex flex-col items-center justify-center text-center px-6 gap-8 fade-in">
                        <div className="w-16 h-16 rounded-full bg-emerald-500/20 text-emerald-400 flex items-center justify-center text-3xl"><Icons.Check /></div>
                        <div>
                            <h1 className="font-display text-3xl font-bold text-white mb-2">Игра завершена!</h1>
                            <p className="text-zinc-400 text-sm">Вы ответили на {maxReachedIndex+1} вопросов.</p>
                        </div>
                        <button onClick={()=>navigate('menu')} className="w-full max-w-sm rounded-2xl btn-primary py-4 font-bold text-xs uppercase tracking-widest">В главное меню</button>
                    </div>
                );
            }

            if (screen === 'analytics' && isAdmin) {
                const totSessions = analyticsData.length;
                const avgDur = totSessions ? Math.round(analyticsData.reduce((acc,s)=>acc+s.duration, 0) / totSessions / 60) : 0;
                
                return (
                    <div className="safe-screen max-w-2xl mx-auto flex flex-col fade-in">
                        <header className="flex items-center gap-4 py-4 mb-4"><button onClick={()=>navigate('menu')} className="p-3 bg-white/[0.04] rounded-2xl text-zinc-400"><Icons.Back /></button><h2 className="font-display text-xl font-bold text-white">Аналитика</h2></header>
                        <div className="grid grid-cols-2 gap-4 px-4 mb-8">
                            <div className="p-4 rounded-2xl bg-white/[0.03] border border-white/10"><div className="text-3xl font-display font-bold text-rose-500">{totSessions}</div><div className="text-[10px] uppercase font-bold text-zinc-500 mt-1 tracking-widest">Сессий</div></div>
                            <div className="p-4 rounded-2xl bg-white/[0.03] border border-white/10"><div className="text-3xl font-display font-bold text-rose-500">{avgDur} <span className="text-sm">мин</span></div><div className="text-[10px] uppercase font-bold text-zinc-500 mt-1 tracking-widest">Средн. время</div></div>
                        </div>
                        
                        <div className="px-4 text-xs font-bold uppercase tracking-widest text-zinc-500 mb-4">История игр</div>
                        <div className="flex flex-col gap-3 px-4 pb-20">
                            {analyticsData.sort((a,b)=>b.date-a.date).map((s, i) => (
                                <div key={i} className="p-4 rounded-2xl bg-white/[0.02] border border-white/5 flex flex-col gap-2">
                                    <div className="flex justify-between items-center text-xs text-zinc-400"><span>{new Date(s.date).toLocaleDateString()} {new Date(s.date).toLocaleTimeString()}</span><span className="font-mono">{s.sessionId}</span></div>
                                    <div className="flex justify-between items-center text-white font-bold"><span className="text-sm">Игроков: {s.players}</span><span className="text-rose-400">{Math.round(s.duration/60)} мин</span></div>
                                    <div className="flex gap-4 text-[11px] uppercase tracking-wider text-zinc-500 mt-2">
                                        <span>Ответов: {s.answers}</span><span>Скипов: {s.skips}</span>
                                        {s.timer > 0 && <span className="text-emerald-400">Таймер: {s.timer}с</span>}
                                    </div>
                                </div>
                            ))}
                            {totSessions === 0 && <div className="text-center text-zinc-500 py-10">Нет данных</div>}
                        </div>
                    </div>
                );
            }

            return null;
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
