<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#160a1c">
    <title>Влад & Ира ❤️</title>
    <!-- React & Tailwind -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>

    <!-- Подключение Google Sans -->
    <style>
        @import url('https://fonts.cdnfonts.com/css/google-sans');
        
        html, body {
            height: 100%;
            min-height: 100dvh;
            margin: 0;
            padding: 0;
            background-color: #160a1c; 
            font-family: 'Product Sans', 'Google Sans', sans-serif; 
            overflow-x: hidden;
            color: white; 
            -webkit-tap-highlight-color: transparent;
            touch-action: pan-y;
        }

        /* Переливающийся темный фон 2026 */
        .animated-gradient-bg {
            background: linear-gradient(-45deg, #1f0d29, #2d1426, #141e30, #2f1322, #110b16);
            background-size: 400% 400%;
            animation: gradientShift 15s ease infinite;
            min-height: 100dvh;
            width: 100%;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Стекломорфизм */
        .glass-panel { 
            background: rgba(20, 11, 28, 0.68); 
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.08); 
            border-radius: 1.75rem;
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.5);
        }

        /* Кнопки одинаковой высоты (56px) */
        .btn-romantic {
            background: linear-gradient(135deg, #e11d48 0%, #881337 100%);
            box-shadow: 0 6px 25px rgba(225, 29, 72, 0.35);
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            height: 56px;
        }
        .btn-romantic:active { transform: scale(0.96); box-shadow: 0 2px 10px rgba(225, 29, 72, 0.5); }

        .btn-ai-magic {
            background: linear-gradient(135deg, rgba(139, 92, 246, 0.25) 0%, rgba(14, 165, 233, 0.25) 100%);
            border: 1px solid rgba(167, 139, 250, 0.4);
            box-shadow: 0 6px 25px rgba(139, 92, 246, 0.2);
            transition: all 0.25s ease;
            height: 56px;
        }
        .btn-ai-magic:active { transform: scale(0.96); }

        .btn-ghost {
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.14);
            color: rgba(255,255,255,0.85);
            transition: all 0.25s ease;
            height: 56px;
        }
        .btn-ghost:active { transform: scale(0.96); background: rgba(255,255,255,0.1); }
        
        .cat-btn-active {
            background: rgba(255, 255, 255, 0.11);
            border: 1px solid rgba(255, 200, 220, 0.35);
            box-shadow: 0 0 20px rgba(255, 200, 220, 0.12);
            transform: scale(0.98);
        }
        .cat-btn-inactive {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        /* Анимации */
        .fade-in { animation: fadeIn 0.3s ease-out forwards; }
        .slide-up { animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .heart-pulse { animation: heartPulse 1.8s infinite ease-in-out; }
        .roulette-glow { animation: rouletteGlow 0.5s infinite alternate ease-in-out; }
        
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes heartPulse { 0%, 100% { transform: scale(1); } 15% { transform: scale(1.15); } 30% { transform: scale(1); } 45% { transform: scale(1.1); } }
        @keyframes rouletteGlow { from { box-shadow: 0 0 15px rgba(225, 29, 72, 0.3); } to { box-shadow: 0 0 35px rgba(56, 189, 248, 0.6); } }

        .checkmark-circle { stroke-dasharray: 166; stroke-dashoffset: 166; stroke-width: 2; stroke-miterlimit: 10; stroke: #10b981; fill: none; animation: stroke 0.6s cubic-bezier(0.65, 0, 0.45, 1) forwards; }
        .checkmark { width: 64px; height: 64px; border-radius: 50%; display: block; stroke-width: 2; stroke: #fff; stroke-miterlimit: 10; margin: 10% auto; box-shadow: inset 0px 0px 0px #10b981; animation: fill .4s ease-in-out .4s forwards, scale .3s ease-in-out .9s both; }
        .checkmark-check { transform-origin: 50% 50%; stroke-dasharray: 48; stroke-dashoffset: 48; animation: stroke 0.3s cubic-bezier(0.65, 0, 0.45, 1) 0.8s forwards; }
        @keyframes stroke { 100% { stroke-dashoffset: 0; } }
        @keyframes scale { 0%, 100% { transform: none; } 50% { transform: scale3d(1.1, 1.1, 1); } }
        @keyframes fill { 100% { box-shadow: inset 0px 0px 0px 35px #10b981; } }

        .ai-cursor::after { content: '|'; animation: blink 1s step-end infinite; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

        /* Цвета сложностей */
        .diff-easy { color: #34d399; }
        .diff-med  { color: #fbbf24; }
        .diff-hard { color: #fb7185; }
        .bg-diff-easy { background: rgba(52, 211, 153, 0.15); border: 1px solid rgba(52, 211, 153, 0.35); }
        .bg-diff-med  { background: rgba(251, 191, 36, 0.15); border: 1px solid rgba(251, 191, 36, 0.35); }
        .bg-diff-hard { background: rgba(251, 113, 133, 0.15); border: 1px solid rgba(251, 113, 133, 0.35); }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body>
    <div id="root" class="animated-gradient-bg"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo } = React;

        // НАСТРОЙКИ БАЗЫ ДАННЫХ И AI
        const FIREBASE_BASE_URL = "https://project-x-5e16a-default-rtdb.europe-west1.firebasedatabase.app";
        const GIST_FALLBACK_URL = "https://gist.githubusercontent.com/1s0meb0dy1/9d890bde848f3a2c5464c7c1729fe17a/raw/questions.json";
        const GEMINI_API_KEY = "AQ.Ab8RN6JlrwetdJDgph_PDXCwnW1GCoUcw6jc8_iIBLEbG1dNWA"; 

        const CATEGORIES = [
            { id: "family", name: "Семья", icon: "👨‍👩‍👧‍👦", color: "from-blue-950/40 to-transparent" },
            { id: "intimacy", name: "Интим", icon: "🔞", color: "from-rose-950/40 to-transparent" },
            { id: "future", name: "Будущее", icon: "🎯", color: "from-teal-950/40 to-transparent" },
            { id: "secrets", name: "Секреты", icon: "🤫", color: "from-fuchsia-950/40 to-transparent" },
            { id: "romance", name: "Романтика", icon: "❤️", color: "from-pink-950/40 to-transparent" },
            { id: "past", name: "Прошлое", icon: "⏳", color: "from-amber-950/40 to-transparent" },
            { id: "values", name: "Ценности", icon: "⚖️", color: "from-indigo-950/40 to-transparent" },
            { id: "fears", name: "Страхи", icon: "👻", color: "from-stone-800/50 to-transparent" },
            { id: "money", name: "Деньги", icon: "💰", color: "from-emerald-950/40 to-transparent" },
            { id: "life", name: "Быт", icon: "🏠", color: "from-orange-950/40 to-transparent" }
        ];

        const DIFFICULTIES = [
            { id: "Простые", name: "Легкие", classText: "diff-easy", classBg: "bg-diff-easy" },
            { id: "Средние", name: "Средние", classText: "diff-med", classBg: "bg-diff-med" },
            { id: "Глубокие", name: "Глубокие", classText: "diff-hard", classBg: "bg-diff-hard" }
        ];

        // Универсальный вызов нейросети (Gemini + Pollinations OpenAI Fallback)
        const callNeuralNet = async (systemPrompt, userPrompt, maxTokens = 900) => {
            const randomSeed = Math.floor(Math.random() * 10000000);

            if (GEMINI_API_KEY && GEMINI_API_KEY.startsWith("AIza")) {
                try {
                    const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}`;
                    const response = await fetch(url, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            contents: [{ parts: [{ text: systemPrompt + "\n\n" + userPrompt }] }],
                            generationConfig: { temperature: 0.95, maxOutputTokens: maxTokens }
                        })
                    });
                    if (response.ok) {
                        const data = await response.json();
                        const text = data?.candidates?.[0]?.content?.parts?.[0]?.text;
                        if (text) return text.trim();
                    }
                } catch (e) {
                    console.warn("Direct Gemini call failed, switching to neural gateway...", e);
                }
            }

            try {
                const response = await fetch("https://text.pollinations.ai/openai", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        model: "openai",
                        seed: randomSeed,
                        temperature: 0.92,
                        messages: [
                            { role: "system", content: systemPrompt },
                            { role: "user", content: userPrompt }
                        ]
                    })
                });
                if (response.ok) {
                    const data = await response.json();
                    const content = data?.choices?.[0]?.message?.content;
                    if (content) return content.trim();
                }
            } catch (e) {
                console.warn("Primary gateway failed, trying GET fallback...", e);
            }

            try {
                const fallbackUrl = `https://text.pollinations.ai/${encodeURIComponent(systemPrompt + "\n" + userPrompt)}?seed=${randomSeed}&model=openai`;
                const response = await fetch(fallbackUrl);
                if (response.ok) {
                    const text = await response.text();
                    if (text && text.length > 15) return text.trim();
                }
            } catch (e) {
                console.error("All AI endpoints unreachable:", e);
            }

            throw new Error("Не удалось связаться с нейросетью. Проверьте подключение к интернету.");
        };

        // Генератор ответов для "Ситуация" и "Совет"
        const fetchFromAI = async (promptType, questionText, catId) => {
            const cleanQuestion = questionText.replace(/^№\s*\d+\.\s*/, '').trim();
            const catObj = CATEGORIES.find(c => c.id === catId);
            const catName = catObj ? catObj.name : "Отношения";
            const randomSeed = Math.floor(Math.random() * 999999);

            let systemPrompt = "";
            let userPrompt = "";

            if (promptType === "situation") {
                systemPrompt = "Ты креативный сценарист и психолог отношений. Пиши живо, реалистично, без шаблонов и повторений.";
                userPrompt = `Контекст: Мы пара (Влад и Ира). Текущий вопрос из категории "${catName}": "${cleanQuestion}".
Сгенерируй абсолютно новый, уникальный ответ строго по этому вопросу (код генерации: ${randomSeed}), разделенный на 2 блока с отступами:

🎬 Моделирование ситуации:
(Придумай 1 реалистичную, жизненную или интригующую ситуацию из 3-4 предложений, которая происходит с нами прямо сейчас и органично подводит к вопросу "${cleanQuestion}". Пиши от первого лица "мы").

👩👨 Как бы ответили большинство девушек и парней:
(Напиши развернуто и честно: как на этот конкретный вопрос или ситуацию обычно реагируют и отвечают большинство девушек, а как — большинство парней, и почему их взгляды могут совпадать или различаться).`;
            } else {
                systemPrompt = "Ты практикующий семейный психотерапевт, сексолог и аналитик. Каждый твой разбор глубокий, конкретный и привязан строго к заданному вопросу.";
                userPrompt = `Проанализируй конкретный вопрос для пары (Влад и Ира) из категории "${catName}": "${cleanQuestion}".
Сгенерируй абсолютно новый, уникальный профессиональный разбор именно этого вопроса (код генерации: ${randomSeed}) строго по следующим 6 пунктам с двойными отступами между ними:

🧠 Как лучше поступить в этой ситуации:
(Конкретный разбор: как паре правильно подойти к обсуждению и решению именно вопроса "${cleanQuestion}").

👩👨 Как обычно отвечают большинство девушек и парней:
(Объективный разбор: что чаще всего думают, чувствуют и отвечают на этот вопрос большинство девушек, а что — большинство парней).

💡 Интересные факты:
(1-2 научных факта из психологии, нейробиологии или социологии строго по теме вопроса).

📊 Статистика:
(Реальные или научно обоснованные статистические данные и проценты по теме вопроса "${cleanQuestion}").

🔗 Как это влияет на отношения:
(К чему приводит замалчивание этой темы и что дает паре честный ответ).

🛠️ Психологические советы:
(2-3 практических совета, как обсудить этот вопрос без обид и стать ближе).`;
            }

            try {
                return await callNeuralNet(systemPrompt, userPrompt, 950);
            } catch (e) {
                return `${e.message}\n\nПопробуйте нажать кнопку еще раз для вопроса:\n«${cleanQuestion}»`;
            }
        };

        // Генератор нового уникального вопроса (Пункт 9)
        const generateUniqueQuestionAI = async (targetCat, targetDiff, existingQuestionsSample) => {
            const systemPrompt = "Ты топовый автор психологических, романтических и откровенных игр для пар (Влад и Ира). Твоя задача — придумать один совершенно новый, небанальный, глубокий или острый вопрос, которого еще нет в базе.";
            const sampleText = existingQuestionsSample.slice(0, 35).map(q => `- ${q.cleanText}`).join("\n");
            
            const diffDesc = targetDiff.id === "Простые" 
                ? "Легкий (прямой, анкетный, жизненный или пикантный вопрос без тяжелой философии)"
                : targetDiff.id === "Средние"
                ? "Средний (вопрос на размышление, личный опыт, желания или отношения)"
                : "Глубокий (максимально откровенный, психологический, провокационный или интимный вопрос)";

            const userPrompt = `Придумай ОДИН совершенно новый, уникальный вопрос для пары (Влад и Ира).
Заданная тема: "${targetCat.name}" (${targetCat.icon}).
Заданная сложность: "${targetDiff.name}" — ${diffDesc}.

ВАЖНО: Вопрос НЕ должен повторять по смыслу следующие уже существующие вопросы из базы и архива:
${sampleText}

Требования к ответу:
1. Выведи ТОЛЬКО чистый текст самого вопроса на русском языке (без кавычек, без номера, без префиксов и без пояснений).
2. Вопрос должен быть живым, обращенным на "ты", интересным для обсуждения парой.`;

            const raw = await callNeuralNet(systemPrompt, userPrompt, 200);
            return raw.replace(/^["«№\d\.\-\s]+|["»]+$/g, '').trim();
        };

        // Автоматическая сквозная перенумерация по порядку без разрывов (Пункт 7)
        const reindexSequential = (items) => {
            return items.map((item, idx) => {
                const seqNum = idx + 1;
                const clean = item.cleanText || String(item.text || '').replace(/^№\s*\d+\.\s*/, '').trim();
                return {
                    ...item,
                    num: seqNum,
                    cleanText: clean,
                    text: `№ ${seqNum}. ${clean}`,
                    archived: Boolean(item.archived)
                };
            });
        };

        const AnimatedCounter = ({ target }) => {
            const [count, setCount] = useState(0);
            useEffect(() => {
                if (!target || target === 0) { setCount(0); return; }
                let current = 0;
                const stepTime = Math.max(5, Math.floor(900 / target)); 
                const timer = setInterval(() => {
                    current += 1;
                    setCount(current);
                    if (current >= target) clearInterval(timer);
                }, stepTime);
                return () => clearInterval(timer);
            }, [target]);
            return <span>{count}</span>;
        };

        const Icons = {
            Play: () => <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z" /><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>,
            Menu: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 6h16M4 12h16M4 18h16" /></svg>,
            Back: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M10 19l-7-7m0 0l7-7m-7 7h18" /></svg>,
            Next: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M14 5l7 7m0 0l-7 7m7-7H3" /></svg>,
            Sparkles: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z" /></svg>,
            List: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 6h16M4 10h16M4 14h16M4 18h16" /></svg>,
            Plus: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 4v16m8-8H4" /></svg>,
            Check: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M5 13l4 4L19 7" /></svg>,
            Bulb: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z" /></svg>,
            Edit: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z" /></svg>,
            Trash: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>,
            Restore: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M3 10h10a8 8 0 018 8v2M3 10l6 6m-6-6l6-6" /></svg>,
            Archive: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M5 8h14M5 8a2 2 0 110-4h14a2 2 0 110 4M5 8v10a2 2 0 002 2h10a2 2 0 002-2V8m-9 4h4" /></svg>
        };

        function App() {
            const [db, setDb] = useState([]);
            const [dbSubPath, setDbSubPath] = useState("");
            const [isLoading, setIsLoading] = useState(true);
            const [screen, setScreen] = useState('menu'); 
            const [selectedCats, setSelectedCats] = useState(CATEGORIES.map(c => c.id));
            const [selectedDiffs, setSelectedDiffs] = useState(DIFFICULTIES.map(d => d.id));
            
            // Режим игры: 'normal' | 'test'
            const [gameMode, setGameMode] = useState('normal');
            const [showModeModal, setShowModeModal] = useState(false);

            const [gameQuestions, setGameQuestions] = useState([]);
            const [currentIndex, setCurrentIndex] = useState(0);
            const [answeredCount, setAnsweredCount] = useState(0); 
            const [showEndGameConfirm, setShowEndGameConfirm] = useState(false);

            // Состояние для рандомного выбора первого игрока в Обычном режиме (Пункт 10)
            const [turnPopup, setTurnPopup] = useState({ open: false, spinning: false, highlight: 'guy', winner: null });
            const [currentFirstPlayer, setCurrentFirstPlayer] = useState(null);
            const lastRolledIndexRef = useRef(-1);

            // Состояние для AI-экрана
            const [aiType, setAiType] = useState('situation');
            const [aiContent, setAiContent] = useState('');
            const [isAiTyping, setIsAiTyping] = useState(false);
            const typingIntervalRef = useRef(null);

            // Списки и пагинация для высокой производительности (без лагов)
            const [viewCategory, setViewCategory] = useState(null);
            const [visibleLimit, setVisibleLimit] = useState(60);
            const [archiveExpanded, setArchiveExpanded] = useState(false);
            const [archiveVisibleLimit, setArchiveVisibleLimit] = useState(50);
            const [isArchivingSync, setIsArchivingSync] = useState(false);
            
            // Добавление вопроса + AI генерация
            const [addForm, setAddForm] = useState({ text: '', cat: 'family', diff: 'Простые' });
            const [addStatus, setAddStatus] = useState(null);
            const [isSaving, setIsSaving] = useState(false);
            const [isGeneratingQuestion, setIsGeneratingQuestion] = useState(false);

            // Редактирование и удаление вопроса
            const [editingQuestion, setEditingQuestion] = useState(null);
            const [editForm, setEditForm] = useState({ text: '', cat: 'family', diff: 'Простые' });
            const [returnScreen, setReturnScreen] = useState('menu');
            const [confirmModal, setConfirmModal] = useState(null);
            const [resultModal, setResultModal] = useState(null);

            // Парсинг базы со сквозной сортировкой номеров 1..N без разрывов (Пункт 7)
            const parseDatabaseObject = (rawObj) => {
                const entries = Object.entries(rawObj);
                const parsed = [];

                for (let i = 0; i < entries.length; i++) {
                    const [dbKey, item] = entries[i];
                    if (!item || typeof item !== 'object' || !item.text) continue;

                    const matchNum = String(item.text).match(/^№\s*(\d+)\.\s*(.*)/s);
                    const cleanText = matchNum ? matchNum[2].trim() : String(item.text).trim();

                    parsed.push({
                        dbKey: String(dbKey),
                        id: item.id || `q_${i + 1}`,
                        origNum: item.num ? Number(item.num) : (matchNum ? Number(matchNum[1]) : i + 1),
                        categoryId: item.categoryId || "family",
                        level: item.level || "Простые",
                        cleanText: cleanText,
                        archived: Boolean(item.archived)
                    });
                }

                // Сортируем по исходному порядку и присваиваем непрерывные номера 1..N без дыр
                parsed.sort((a, b) => a.origNum - b.origNum);
                return reindexSequential(parsed);
            };

            // Загрузка из Firebase
            useEffect(() => {
                const initDatabase = async () => {
                    try {
                        const res = await fetch(`${FIREBASE_BASE_URL}/.json?t=${Date.now()}`);
                        if (!res.ok) throw new Error(`HTTP ${res.status}`);
                        const data = await res.json();

                        if (data) {
                            if (data.questions && typeof data.questions === 'object') {
                                setDbSubPath("/questions");
                                setDb(parseDatabaseObject(data.questions));
                            } else {
                                setDbSubPath("");
                                setDb(parseDatabaseObject(data));
                            }
                            setIsLoading(false);
                        } else {
                            const gistRes = await fetch(`${GIST_FALLBACK_URL}?t=${Date.now()}`);
                            const gistData = await gistRes.json();
                            const formattedForFirebase = gistData.map((q, idx) => {
                                const m = String(q.text).match(/^№\s*(\d+)\.\s*(.*)/s);
                                const cText = m ? m[2].trim() : String(q.text).trim();
                                return {
                                    id: q.id || `v_init_${idx + 1}`,
                                    num: idx + 1,
                                    categoryId: q.categoryId || "family",
                                    level: q.level || "Простые",
                                    text: cText,
                                    archived: false
                                };
                            });

                            await fetch(`${FIREBASE_BASE_URL}/.json`, {
                                method: "PUT",
                                headers: { "Content-Type": "application/json" },
                                body: JSON.stringify(formattedForFirebase)
                            });

                            setDbSubPath("");
                            setDb(parseDatabaseObject(formattedForFirebase));
                            setIsLoading(false);
                        }
                    } catch (err) {
                        console.error("Firebase load error, falling back to Gist:", err);
                        try {
                            const gistRes = await fetch(`${GIST_FALLBACK_URL}?t=${Date.now()}`);
                            const gistData = await gistRes.json();
                            setDb(parseDatabaseObject(gistData));
                        } catch (e) {
                            setDb([]);
                        }
                        setIsLoading(false);
                    }
                };
                initDatabase();
            }, []);

            // Мемоизированная статистика по активным и архивным вопросам (Пункты 3, 4, 5, 8)
            const stats = useMemo(() => {
                const activeByCat = {};
                const totalByCat = {};
                CATEGORIES.forEach(c => { activeByCat[c.id] = 0; totalByCat[c.id] = 0; });

                let availableActive = 0;
                let availableTotal = 0;
                const archivedList = [];

                for (let i = 0; i < db.length; i++) {
                    const q = db[i];
                    if (totalByCat[q.categoryId] !== undefined) totalByCat[q.categoryId]++;
                    
                    const matchesDiff = selectedDiffs.includes(q.level);
                    const matchesCat = selectedCats.includes(q.categoryId);

                    if (q.archived) {
                        archivedList.push(q);
                    } else {
                        if (activeByCat[q.categoryId] !== undefined) activeByCat[q.categoryId]++;
                        if (matchesCat && matchesDiff) availableActive++;
                    }

                    if (matchesCat && matchesDiff) {
                        availableTotal++;
                    }
                }

                return { activeByCat, totalByCat, availableActive, availableTotal, archivedList };
            }, [db, selectedCats, selectedDiffs]);

            // Если в какой-то теме стало 0 активных вопросов, снимаем с нее выделение (но если в тестовом режиме нужны все, оставляем возможность)
            const toggleCategory = (catId) => {
                if (stats.activeByCat[catId] === 0 && stats.totalByCat[catId] === 0) return;
                setSelectedCats(prev => prev.includes(catId) ? prev.filter(id => id !== catId) : [...prev, catId]);
            };

            const toggleDiff = (diffId) => {
                setSelectedDiffs(prev => prev.includes(diffId) ? prev.filter(id => id !== diffId) : [...prev, diffId]);
            };

            // Запуск рулетки "Кто отвечает первым" для Обычного режима (Пункт 10)
            useEffect(() => {
                if (screen === 'game' && gameMode === 'normal' && gameQuestions.length > 0) {
                    if (lastRolledIndexRef.current !== currentIndex) {
                        lastRolledIndexRef.current = currentIndex;
                        const winner = Math.random() < 0.5 ? 'guy' : 'girl';
                        setTurnPopup({ open: true, spinning: true, highlight: 'guy', winner: null });
                        
                        let ticks = 0;
                        const spinInterval = setInterval(() => {
                            ticks++;
                            setTurnPopup(prev => ({
                                ...prev,
                                highlight: prev.highlight === 'guy' ? 'girl' : 'guy'
                            }));
                            if (ticks >= 9) {
                                clearInterval(spinInterval);
                                setTurnPopup({ open: true, spinning: false, highlight: winner, winner: winner });
                                setCurrentFirstPlayer(winner);
                            }
                        }, 110);

                        return () => clearInterval(spinInterval);
                    }
                }
            }, [screen, gameMode, currentIndex, gameQuestions]);

            // Старт игры в выбранном режиме (Пункты 1, 2, 3, 8)
            const startWithMode = (mode) => {
                let pool = [];
                if (mode === 'normal') {
                    // В обычном режиме берем только НЕ архивные вопросы из активных выбранных тем
                    pool = db.filter(q => !q.archived && selectedCats.includes(q.categoryId) && selectedDiffs.includes(q.level));
                    if (pool.length === 0) {
                        alert("Для обычного режима нет доступных вопросов (возможно, все они уже в Архиве). Выберите Тестовый режим или верните вопросы из Архива! ❤️");
                        return;
                    }
                } else {
                    // В тестовом режиме показываем абсолютно все вопросы (включая архивные)
                    const catsToUse = selectedCats.length > 0 ? selectedCats : CATEGORIES.map(c => c.id);
                    const diffsToUse = selectedDiffs.length > 0 ? selectedDiffs : DIFFICULTIES.map(d => d.id);
                    pool = db.filter(q => catsToUse.includes(q.categoryId) && diffsToUse.includes(q.level));
                    if (pool.length === 0) {
                        alert("В базе нет вопросов по этим фильтрам!");
                        return;
                    }
                }

                const shuffled = [...pool];
                for (let i = shuffled.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
                }

                setGameMode(mode);
                setGameQuestions(shuffled);
                setCurrentIndex(0);
                setAnsweredCount(0);
                lastRolledIndexRef.current = -1;
                setShowModeModal(false);
                setShowEndGameConfirm(false);
                setScreen('game');
            };

            // Перемещение отвеченных вопросов в Архив после завершения Обычной игры (Пункт 2)
            const archiveAnsweredQuestions = async (questionsToArchive) => {
                if (!questionsToArchive || questionsToArchive.length === 0) return;
                const keysSet = new Set(questionsToArchive.map(q => q.dbKey));

                // Мгновенно обновляем локальный стейт
                setDb(prev => prev.map(q => keysSet.has(q.dbKey) ? { ...q, archived: true } : q));

                // Пакетно сохраняем в Firebase одним запросом
                try {
                    const patchPayload = {};
                    questionsToArchive.forEach(q => {
                        patchPayload[`${q.dbKey}/archived`] = true;
                    });
                    await fetch(`${FIREBASE_BASE_URL}${dbSubPath}.json`, {
                        method: "PATCH",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify(patchPayload)
                    });
                } catch (e) {
                    console.error("Archive sync error:", e);
                }
            };

            // Возврат одного вопроса из Архива в активную игру (Пункт 2)
            const handleRestoreSingleFromArchive = async (qObj) => {
                setDb(prev => prev.map(q => q.dbKey === qObj.dbKey ? { ...q, archived: false } : q));
                try {
                    await fetch(`${FIREBASE_BASE_URL}${dbSubPath}/${qObj.dbKey}.json`, {
                        method: "PATCH",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ archived: false })
                    });
                } catch (e) {
                    console.error("Failed to restore question:", e);
                }
            };

            // Возврат ВСЕХ вопросов из Архива (Пункт 2)
            const handleRestoreAllFromArchive = async () => {
                if (stats.archivedList.length === 0 || isArchivingSync) return;
                setIsArchivingSync(true);
                const toRestore = [...stats.archivedList];

                setDb(prev => prev.map(q => q.archived ? { ...q, archived: false } : q));

                try {
                    const patchPayload = {};
                    toRestore.forEach(q => {
                        patchPayload[`${q.dbKey}/archived`] = false;
                    });
                    await fetch(`${FIREBASE_BASE_URL}${dbSubPath}.json`, {
                        method: "PATCH",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify(patchPayload)
                    });
                } catch (e) {
                    console.error("Failed to restore all questions:", e);
                } finally {
                    setIsArchivingSync(false);
                }
            };

            // Завершение игры (с учетом различий Обычного и Тестового режимов)
            const handleFinishGame = async (fromLastQuestionButton = false) => {
                setShowEndGameConfirm(false);

                if (gameMode === 'test') {
                    // В тестовом режиме убираем страницу со счетчиком отвеченных вопросов и сразу выходим в меню (Пункт 1)
                    setScreen('menu');
                    return;
                }

                // В обычном режиме все пройденные вопросы (включая текущий открытый вопрос) уходят в Архив (Пункт 2)
                const totalAnswered = currentIndex + 1;
                const answeredSlice = gameQuestions.slice(0, totalAnswered);
                setAnsweredCount(totalAnswered);
                setScreen('summary');
                await archiveAnsweredQuestions(answeredSlice);
            };

            const triggerAI = async (type) => {
                setAiType(type);
                setAiContent(type === 'situation' ? "Моделирую уникальную ситуацию..." : "Формирую психологический разбор...");
                setIsAiTyping(true);
                setScreen('ai_response');

                const q = gameQuestions[currentIndex];
                const response = await fetchFromAI(type, q.cleanText || q.text, q.categoryId);
                
                if (typingIntervalRef.current) clearInterval(typingIntervalRef.current);
                
                setAiContent("");
                let i = 0;
                typingIntervalRef.current = setInterval(() => {
                    setAiContent(response.substring(0, i + 1));
                    i += 2;
                    if (i >= response.length) {
                        setAiContent(response);
                        clearInterval(typingIntervalRef.current);
                        setIsAiTyping(false);
                    }
                }, 8);
            };

            // AI-генерация нового уникального вопроса в форме добавления (Пункт 9)
            const handleGenerateQuestionAI = async () => {
                if (isGeneratingQuestion) return;
                setIsGeneratingQuestion(true);

                try {
                    const randomCat = CATEGORIES[Math.floor(Math.random() * CATEGORIES.length)];
                    const randomDiff = DIFFICULTIES[Math.floor(Math.random() * DIFFICULTIES.length)];

                    // Выбираем сэмпл существующих вопросов этой же темы (из базы и архива), чтобы не повторяться
                    const catQuestions = db.filter(q => q.categoryId === randomCat.id);
                    const shuffledSample = [...catQuestions].sort(() => 0.5 - Math.random()).slice(0, 35);

                    const generatedText = await generateUniqueQuestionAI(randomCat, randomDiff, shuffledSample);
                    if (generatedText) {
                        setAddForm({
                            text: generatedText,
                            cat: randomCat.id,
                            diff: randomDiff.id
                        });
                    }
                } catch (err) {
                    alert(err.message || "Ошибка генерации вопроса. Попробуйте еще раз!");
                } finally {
                    setIsGeneratingQuestion(false);
                }
            };

            // Открытие экрана редактирования
            const openEditScreen = (questionObj, fromScreen) => {
                setEditingQuestion(questionObj);
                setEditForm({
                    text: questionObj.cleanText || questionObj.text.replace(/^№\s*\d+\.\s*/, ''),
                    cat: questionObj.categoryId,
                    diff: questionObj.level
                });
                setReturnScreen(fromScreen);
                setConfirmModal(null);
                setResultModal(null);
                setScreen('edit_q');
            };

            // Добавление нового вопроса после последней строки в БД (Пункты 6, 7)
            const handleAddQuestion = async (e) => {
                e.preventDefault();
                if (!addForm.text.trim() || isSaving) return;
                setIsSaving(true);

                try {
                    const cleanInput = addForm.text.replace(/^№\s*\d+\.\s*/, '').trim();
                    const nextNum = db.length + 1;

                    const numericKeys = db.map(item => Number(item.dbKey)).filter(n => !isNaN(n));
                    const nextDbKey = numericKeys.length > 0 ? String(Math.max(...numericKeys) + 1) : String(db.length);
                    const newId = `v_db_${nextNum}_${Math.random().toString(36).substring(2, 6)}`;

                    const payload = {
                        id: newId,
                        num: nextNum,
                        categoryId: addForm.cat,
                        level: addForm.diff,
                        text: cleanInput,
                        archived: false // Новый вопрос сразу попадает в активную игру
                    };

                    const res = await fetch(`${FIREBASE_BASE_URL}${dbSubPath}/${nextDbKey}.json`, {
                        method: "PUT",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify(payload)
                    });

                    if (!res.ok) {
                        const errText = await res.text();
                        throw new Error(`Код ответа сервера: ${res.status}. ${errText}`);
                    }

                    const createdQuestion = {
                        ...payload,
                        dbKey: nextDbKey,
                        cleanText: cleanInput,
                        text: `№ ${nextNum}. ${cleanInput}`
                    };

                    setDb(prev => reindexSequential([...prev, createdQuestion]));
                    setAddStatus({
                        ok: true,
                        msg: `Вопрос № ${nextNum} успешно сохранен в базу данных и доступен в новой игре!`,
                        id: newId
                    });
                } catch (err) {
                    setAddStatus({
                        ok: false,
                        msg: `Вопрос НЕ был сохранен в базу данных. Причина: ${err.message || "Ошибка сети или правил доступа Firebase."}`
                    });
                } finally {
                    setIsSaving(false);
                }
            };

            // Сохранение изменений вопроса в БД
            const executeSaveEdit = async () => {
                if (!editingQuestion || isSaving) return;
                setIsSaving(true);
                setConfirmModal(null);

                const cleanUpdatedText = editForm.text.replace(/^№\s*\d+\.\s*/, '').trim();
                const updatedPayload = {
                    id: editingQuestion.id,
                    num: editingQuestion.num,
                    categoryId: editForm.cat,
                    level: editForm.diff,
                    text: cleanUpdatedText,
                    archived: Boolean(editingQuestion.archived)
                };

                try {
                    const res = await fetch(`${FIREBASE_BASE_URL}${dbSubPath}/${editingQuestion.dbKey}.json`, {
                        method: "PATCH",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify(updatedPayload)
                    });

                    if (!res.ok) {
                        const errText = await res.text();
                        throw new Error(`Код ${res.status}: ${errText}`);
                    }

                    const updatedObj = {
                        ...editingQuestion,
                        categoryId: editForm.cat,
                        level: editForm.diff,
                        cleanText: cleanUpdatedText,
                        text: `№ ${editingQuestion.num}. ${cleanUpdatedText}`
                    };

                    setDb(prev => prev.map(q => q.dbKey === editingQuestion.dbKey ? updatedObj : q));
                    setGameQuestions(prev => prev.map(q => q.dbKey === editingQuestion.dbKey ? updatedObj : q));
                    setEditingQuestion(updatedObj);

                    setResultModal({
                        ok: true,
                        msg: `Вопрос № ${editingQuestion.num} (ID: ${editingQuestion.id}) успешно изменен в базе данных!`,
                        afterCloseScreen: returnScreen
                    });
                } catch (err) {
                    setResultModal({
                        ok: false,
                        msg: `Не удалось изменить вопрос в базе данных. Причина: ${err.message || "Сбой соединения."}`
                    });
                } finally {
                    setIsSaving(false);
                }
            };

            // Удаление вопроса из БД с автоматической пересортировкой номеров без дыр (Пункт 7)
            const executeDeleteQuestion = async () => {
                if (!editingQuestion || isSaving) return;
                setIsSaving(true);
                setConfirmModal(null);

                try {
                    const res = await fetch(`${FIREBASE_BASE_URL}${dbSubPath}/${editingQuestion.dbKey}.json`, {
                        method: "DELETE"
                    });

                    if (!res.ok) {
                        const errText = await res.text();
                        throw new Error(`Код ${res.status}: ${errText}`);
                    }

                    setDb(prev => {
                        const filtered = prev.filter(q => q.dbKey !== editingQuestion.dbKey);
                        return reindexSequential(filtered);
                    });
                    
                    setGameQuestions(prev => {
                        const nextList = prev.filter(q => q.dbKey !== editingQuestion.dbKey);
                        if (currentIndex >= nextList.length && nextList.length > 0) {
                            setCurrentIndex(nextList.length - 1);
                        }
                        return nextList;
                    });

                    setResultModal({
                        ok: true,
                        msg: `Вопрос № ${editingQuestion.num} (ID: ${editingQuestion.id}) навсегда удален из базы данных, нумерация обновлена!`,
                        afterCloseScreen: returnScreen
                    });
                } catch (err) {
                    setResultModal({
                        ok: false,
                        msg: `Не удалось удалить вопрос из базы данных. Причина: ${err.message || "Сбой сети."}`
                    });
                } finally {
                    setIsSaving(false);
                }
            };

            if (isLoading) {
                return (
                    <div className="min-h-[100dvh] w-full flex flex-col items-center justify-center fade-in">
                        <div className="text-6xl mb-6 heart-pulse text-[#e11d48] drop-shadow-[0_0_30px_rgba(225,29,72,0.7)]">🤍</div>
                        <p className="text-white/40 font-bold uppercase text-[10px] tracking-[0.4em]">Синхронизация с базой</p>
                    </div>
                );
            }

            // ГЛАВНОЕ МЕНЮ
            if (screen === 'menu') {
                const activeSelectedCatsCount = selectedCats.filter(cid => stats.activeByCat[cid] > 0).length;

                return (
                    <div className="min-h-[100dvh] w-full flex flex-col items-center justify-center p-4 md:p-6 slide-up relative z-10">
                        <div className="text-center mb-6 flex-shrink-0">
                            <h1 className="text-5xl font-bold mb-3 flex items-center justify-center gap-3 text-white tracking-tight">
                                <span>Влад</span>
                                <span className="text-4xl text-[#e11d48] heart-pulse drop-shadow-[0_0_20px_rgba(225,29,72,0.6)]">❤️</span>
                                <span>Ира</span>
                            </h1>
                            <p className="text-white/40 text-[11px] font-bold uppercase tracking-[0.25em] mt-2">Давай узнаем друг друга еще раз</p>
                        </div>

                        <div className="w-full max-w-md glass-panel p-6 flex flex-col gap-7">
                            <div>
                                <h2 className="text-[14px] md:text-base font-bold text-center uppercase tracking-widest text-white/50 mb-4">Темы вопросов</h2>
                                <div className="grid grid-cols-2 gap-2.5">
                                    {CATEGORIES.map(cat => {
                                        const catActiveCount = stats.activeByCat[cat.id] || 0;
                                        const isEmpty = catActiveCount === 0;
                                        const isSelected = selectedCats.includes(cat.id) && !isEmpty;

                                        return (
                                            <button 
                                                key={cat.id}
                                                disabled={isEmpty}
                                                onClick={() => toggleCategory(cat.id)}
                                                className={`p-3.5 rounded-xl text-sm font-medium flex items-center justify-between transition-all duration-300 ${
                                                    isEmpty 
                                                        ? 'opacity-30 cursor-not-allowed bg-black/20 border border-white/5 text-white/30' 
                                                        : isSelected 
                                                            ? 'cat-btn-active text-white' 
                                                            : 'cat-btn-inactive text-white/40 hover:text-white/60'
                                                }`}
                                            >
                                                <div className="flex items-center gap-2 truncate">
                                                    <span className="text-lg">{cat.icon}</span> 
                                                    <span className="truncate">{cat.name}</span>
                                                </div>
                                                <span className="text-[10px] font-bold px-2 py-0.5 rounded-full bg-white/5 text-white/50">
                                                    {catActiveCount}
                                                </span>
                                            </button>
                                        );
                                    })}
                                </div>
                            </div>

                            <div className="w-full overflow-hidden">
                                <h2 className="text-[14px] md:text-base font-bold text-center uppercase tracking-widest text-white/50 mb-4">Сложность вопросов</h2>
                                <div className="flex overflow-x-auto gap-3 pb-2 pt-1 px-1 no-scrollbar snap-x touch-pan-x">
                                    {DIFFICULTIES.map(diff => {
                                        const isActive = selectedDiffs.includes(diff.id);
                                        return (
                                            <button 
                                                key={diff.id}
                                                onClick={() => toggleDiff(diff.id)}
                                                className={`flex-shrink-0 px-6 h-14 rounded-full text-xs font-bold uppercase tracking-widest transition-all duration-300 snap-center ${isActive ? diff.classBg + ' ' + diff.classText : 'bg-black/20 text-white/30 border border-white/5'}`}
                                            >
                                                {diff.name}
                                            </button>
                                        );
                                    })}
                                </div>
                                <button 
                                    onClick={() => setScreen('cat_list')} 
                                    className="w-full mt-4 rounded-2xl btn-ghost flex items-center justify-center gap-2 text-xs font-bold uppercase tracking-widest"
                                >
                                    <Icons.List /> Список вопросов {stats.archivedList.length > 0 ? `(Архив: ${stats.archivedList.length})` : ''}
                                </button>
                            </div>

                            <div className="flex flex-col gap-5 pt-5 border-t border-white/5 relative">
                                <div className="absolute left-0 right-0 top-[-10px] text-center">
