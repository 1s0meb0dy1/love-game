            const handleTimeOut = () => { SoundFX.warn(); const answeredIds = turnHistory[currentIndex] || []; const activePlayerId = answeredIds[answeredIds.length - 1]; const playerObj = profile.players.find(p => p.id === activePlayerId); applyPunishment(playerObj, "Время вышло!"); };

            const applyPunishment = (player, reason) => {
                const qLevel = gameQuestions[currentIndex].level;
                const punishList = gameSettings.punishments[qLevel] || DEFAULT_PUNISHMENTS[qLevel];
                const randomP = punishList[Math.floor(Math.random() * punishList.length)];
                SoundFX.warn(); setPunishmentModal({ open: true, player, text: randomP, reason }); setTimerActive(false);
            };

            const handlePunishmentDone = () => {
                SoundFX.success(); const p = punishmentModal.player; setPunishmentModal({ open: false, player: null, text: "", reason: "" });
                const curSkip = skippedHistory[currentIndex] || [];
                let nextSkipHist = skippedHistory;
                if (curSkip !== 'ALL') {
                    nextSkipHist = {...skippedHistory, [currentIndex]: [...curSkip, p?.id]};
                    setSkippedHistory(nextSkipHist);
                }
                setSessionLog(prev => { const log = prev[currentIndex] || { skips: 0 }; return { ...prev, [currentIndex]: { ...log, skips: log.skips + 1 } }; });
                saveGameProgress(currentIndex, maxReachedIndex, turnHistory, nextSkipHist);
                triggerRoulette(currentIndex, turnHistory, nextSkipHist);
            };

            const handleSkipRequest = () => { SoundFX.click(); setSkipModal({ open: true }); };

            const confirmSkip = (type) => {
                setSkipModal({ open: false }); const answeredIds = turnHistory[currentIndex] || []; const activePlayerId = answeredIds[answeredIds.length - 1]; const playerObj = profile.players.find(p => p.id === activePlayerId);
                if (type === 'me') {
                    applyPunishment(playerObj, "Отказ от ответа");
                } else if (type === 'all') {
                    SoundFX.click(); const nextSkipHist = {...skippedHistory, [currentIndex]: 'ALL'}; setSkippedHistory(nextSkipHist); setTimerActive(false);
                    const nextMax = Math.max(maxReachedIndex, currentIndex + 1); setMaxReachedIndex(nextMax);
                    setSessionLog(prev => { const log = prev[currentIndex] || { skips: 0 }; return { ...prev, [currentIndex]: { ...log, skips: log.skips + (profile?.players?.length || 2) } }; });
                    saveGameProgress(currentIndex, nextMax, turnHistory, nextSkipHist);
                }
            };

            const markAnswered = () => {
                SoundFX.click(); setTimerActive(false);
                setSessionLog(prev => {
                    const log = prev[currentIndex]; if(!log) return prev;
                    const elapsed = Math.round((Date.now() - log.startTs) / 1000);
                    return { ...prev, [currentIndex]: { ...log, answers: log.answers + 1, timeSpent: log.timeSpent + Math.max(0, elapsed) } };
                });
                triggerRoulette(currentIndex, turnHistory, skippedHistory);
            };

            const onSwipeLeft = () => {
                if (currentIndex < gameQuestions.length - 1) {
                    const answered = turnHistory[currentIndex] || []; const isSkippedAll = skippedHistory[currentIndex] === 'ALL'; const isCompleted = isSkippedAll || answered.length >= (profile?.players?.length || 2);
                    if (currentIndex < maxReachedIndex || isCompleted || gameMode === 'test') {
                        SoundFX.click(); const nextIdx = currentIndex + 1; setCurrentIndex(nextIdx);
                        const nextMax = isCompleted ? Math.max(maxReachedIndex, nextIdx) : maxReachedIndex;
                        setMaxReachedIndex(nextMax); saveGameProgress(nextIdx, nextMax, turnHistory, skippedHistory);
                        if (gameMode === 'normal' && !turnHistory[nextIdx]) triggerRoulette(nextIdx, turnHistory, skippedHistory);
                    } else { SoundFX.warn(); setCurrentIndex(currentIndex + 1); /* user swipes to blurred card, let it snap */ }
                } else { if (currentIndex <= maxReachedIndex || skippedHistory[currentIndex]==='ALL' || (turnHistory[currentIndex]||[]).length >= (profile?.players?.length||2)) handleFinishGame(); }
            };

            const onSwipeRight = () => { if (currentIndex > 0) { SoundFX.click(); setCurrentIndex(currentIndex - 1); saveGameProgress(currentIndex - 1, maxReachedIndex, turnHistory, skippedHistory); } };

            const handleFinishGame = async () => {
                SoundFX.click(); setTimerActive(false); setShowEndGameConfirm(false);
                if (gameMode === 'normal') {
                    const answeredSlice = gameQuestions.slice(0, maxReachedIndex + 1);
                    const newArchKeys = answeredSlice.map(q => q.id || q.dbKey);
                    const mergedArch = Array.from(new Set([...(profile.archivedIds || []), ...newArchKeys]));
                    setProfile(prev => ({ ...prev, archivedIds: mergedArch, savedGame: null, updatedAt: Date.now() }));
                    
                    const duration = Math.round((Date.now() - sessionStartTime) / 1000);
                    let totAnswers = 0; let totSkips = 0;
                    Object.values(sessionLog).forEach(l => { totAnswers+=l.answers; totSkips+=l.skips; });
                    const payload = { sessionId: profile.sessionId, date: Date.now(), duration, players: profile.players.length, timer: gameSettings.timer, questionsTotal: maxReachedIndex + 1, answers: totAnswers, skips: totSkips, logs: Object.values(sessionLog) };
                    try { await fetchWithTimeout(`${FIREBASE_BASE_URL}/analytics_v2/${profile.sessionId}_${Date.now()}.json`, { method: "PUT", body: JSON.stringify(payload) }); } catch(e){}

            const executeSaveEdit = async () => { if (!isAdmin || !editingQuestion || isSaving) return; SoundFX.click(); setIsSaving(true); setConfirmModal(null); const cleanUpdatedText = sanitizeInput(editForm.text.replace(/^№\s*\d+\.\s*/, ''), 500); const updatedPayload = { id: editingQuestion.id, num: editingQuestion.num, categoryId: editForm.cat, level: editForm.diff, text: cleanUpdatedText, targetId: sanitizeInput(editForm.targetId, 8) }; try { const res = await fetchWithTimeout(`${FIREBASE_BASE_URL}/questions/${editingQuestion.dbKey}.json`, { method: "PATCH", headers: { "Content-Type": "application/json" }, body: JSON.stringify(updatedPayload) }); if (!res.ok) throw new Error(`Код ${res.status}`); const updatedObj = { ...editingQuestion, categoryId: editForm.cat, level: editForm.diff, cleanText: cleanUpdatedText, text: `№ ${editingQuestion.num}. ${cleanUpdatedText}`, targetId: updatedPayload.targetId }; SoundFX.success(); setDb(prev => { const nextDb = prev.map(q => q.dbKey === editingQuestion.dbKey ? updatedObj : q); try { localStorage.setItem(OFFLINE_DB_CACHE_KEY, JSON.stringify(nextDb)); } catch (e) {} return nextDb; }); setResultModal({ ok: true, msg: `Успешно обновлен!`, afterCloseScreen: returnScreen }); } catch (err) { SoundFX.warn(); setResultModal({ ok: false, msg: `Не удалось: ${err.message}` }); } finally { setIsSaving(false); } };

                            </div>
                        </main>
                        <div className="fixed bottom-0 left-0 right-0 p-4 sm:p-6 z-20 bg-gradient-to-t from-[#09080c] via-[#09080c]/90 to-transparent"> <div className="max-w-xl mx-auto"> <button onClick={() => { SoundFX.click(); navigate('game'); }} className="w-full rounded-2xl btn-primary flex items-center justify-center text-xs font-bold uppercase tracking-widest h-14">К вопросу</button> </div> </div>
                    </div>
                );
            }

            if (screen === 'summary') {
                let totAnswers = 0; let totSkips = 0; Object.values(sessionLog).forEach(l => { totAnswers+=l.answers; totSkips+=l.skips; });
                return (
                    <div className="safe-screen flex flex-col items-center justify-between text-center slide-up relative z-10">
                        <div className="flex-1 flex flex-col items-center justify-center w-full max-w-sm py-6 gap-8">
                            <div className="w-20 h-20 rounded-full bg-emerald-500/20 text-emerald-400 flex items-center justify-center text-4xl shadow-[0_0_40px_rgba(16,185,129,0.3)]"><Icons.Check /></div>
                            <div><h1 className="font-display text-3xl font-bold text-white mb-3">Игра завершена!</h1><p className="text-zinc-400 text-sm leading-relaxed">Вопросы перенесены в архив.</p></div>
                            <div className="w-full grid grid-cols-2 gap-4">
                                <div className="p-4 rounded-2xl bg-white/[0.04] border border-white/10"><div className="text-3xl font-display font-bold text-white mb-1"><AnimatedCounter target={maxReachedIndex + 1} /></div><div className="text-[10px] uppercase font-bold text-zinc-500 tracking-widest">Прошли</div></div>
                                <div className="p-4 rounded-2xl bg-white/[0.04] border border-white/10"><div className="text-3xl font-display font-bold text-white mb-1"><AnimatedCounter target={totAnswers} /></div><div className="text-[10px] uppercase font-bold text-zinc-500 tracking-widest">Ответов</div></div>
                                <div className="p-4 rounded-2xl bg-rose-500/10 border border-rose-500/20 col-span-2 flex items-center justify-center gap-3"><span className="text-xl">😈</span><span className="text-rose-200 font-bold text-sm">Пропусков / Фантов: {totSkips}</span></div>
                            </div>
                            <button onClick={()=>{SoundFX.click(); navigate('menu');}} className="w-full rounded-2xl btn-primary h-14 font-bold text-xs uppercase tracking-widest flex items-center justify-center gap-2 mt-4">В меню</button>
                        </div>
                        <AppFooter />
                    </div>
                );
            }

            if (screen === 'analytics' && isAdmin) {
                const totSessions = analyticsData.length; const avgDur = totSessions ? Math.round(analyticsData.reduce((acc,s)=>acc+s.duration, 0) / totSessions / 60) : 0;
                
                return (
                    <div className="safe-screen max-w-2xl mx-auto flex flex-col fade-in relative z-10">
                        <header className="flex items-center gap-4 py-4 mb-4"><button onClick={()=>{SoundFX.click(); navigate('menu');}} className="p-3 bg-white/[0.04] rounded-2xl text-zinc-400 border border-white/10"><Icons.Back /></button><h2 className="font-display text-xl font-bold text-white">Аналитика сессий</h2></header>
                        
                        <div className="grid grid-cols-2 gap-4 px-4 mb-8">
                            <div className="p-5 rounded-2xl bg-rose-500/15 border border-rose-500/30 flex flex-col items-center justify-center text-center"><div className="text-4xl font-display font-bold text-rose-400 mb-1">{totSessions}</div><div className="text-[10px] uppercase font-bold text-rose-300 tracking-widest opacity-80">Игр проведено</div></div>
                            <div className="p-5 rounded-2xl bg-white/[0.04] border border-white/10 flex flex-col items-center justify-center text-center"><div className="text-4xl font-display font-bold text-white mb-1">{avgDur} <span className="text-lg">м</span></div><div className="text-[10px] uppercase font-bold text-zinc-500 tracking-widest">Среднее время</div></div>
                        </div>
                        
                        <div className="px-4 text-xs font-bold uppercase tracking-widest text-zinc-500 mb-4 flex items-center gap-2"><Icons.List /> Детальная история</div>
                        <div className="flex flex-col gap-3 px-4 pb-20">
                            {analyticsData.sort((a,b)=>b.date-a.date).map((s, i) => (
                                <div key={i} className="p-5 rounded-2xl bg-white/[0.02] border border-white/5 flex flex-col gap-3 hover:bg-white/[0.04] transition-colors">
                                    <div className="flex justify-between items-center text-[11px] font-bold text-zinc-500 tracking-wider"><span>{new Date(s.date).toLocaleDateString()} в {new Date(s.date).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</span><span className="font-mono text-zinc-400 bg-white/5 px-2 py-1 rounded text-[10px]">ID: {s.sessionId}</span></div>
                                    <div className="flex justify-between items-end">
                                        <div><div className="text-white font-bold text-lg mb-1">{s.questionsTotal} вопр.</div><div className="text-xs text-zinc-400">Игроков: {s.players}</div></div>
                                        <div className="text-right"><div className="text-rose-400 font-bold text-lg mb-1">{Math.round(s.duration/60)} мин</div><div className="text-xs text-zinc-400">Ответов: {s.answers} • Скипов: {s.skips}</div></div>
                                    </div>
                                    {s.timer > 0 && <div className="text-[10px] uppercase font-bold tracking-widest text-emerald-400 mt-1 border-t border-white/5 pt-3">Таймер сессии: {s.timer} сек</div>}
                                </div>
                            ))}
                            {totSessions === 0 && <div className="text-center text-zinc-500 py-10 text-sm">Нет данных о проведенных играх</div>}
                        </div>
                    </div>
                );
            }

            // --- ADMIN SCREENS (Categories, Add, Edit, Archive) ---
            if (screen === 'cat_list') {
                return (
                    <div className="safe-screen w-full flex flex-col fade-in max-w-md lg:max-w-3xl mx-auto relative z-10">
                        <header className="flex items-center justify-between gap-4 mb-6 pt-2">
                            <div className="flex items-center gap-3.5"><button onClick={() => { SoundFX.click(); navigate('menu'); }} className="p-3 bg-white/[0.04] rounded-2xl border border-white/10"><Icons.Back /></button><div><h2 className="font-display text-2xl font-bold text-white">Все темы</h2><p className="text-xs text-zinc-500 mt-0.5">Активно: {db.length - stats.archivedList.length} из {db.length}</p></div></div>
                            {isAdmin && <button onClick={() => { SoundFX.click(); setAddStatus(null); setAddForm({ text: '', cat: 'family', diff: 'Простые', targetId: '' }); navigate('add_q'); }} className="hidden lg:flex px-5 h-12 rounded-2xl font-bold text-xs uppercase btn-primary items-center gap-2"><Icons.Plus /> Вопрос</button>}
                        </header>
                        {isAdmin && ( <div className="mb-6 space-y-3 p-4 rounded-2xl border border-rose-500/20 bg-rose-500/5"> <h3 className="text-xs font-bold uppercase tracking-wider text-rose-300">Новая тема</h3> <div className="flex gap-2"> <input type="text" value={newCatForm.icon} onChange={e=>setNewCatForm({...newCatForm, icon: e.target.value})} className="w-14 h-12 text-center bg-white/[0.04] border border-white/10 rounded-xl" placeholder="Эмодзи" /> <input type="text" value={newCatForm.name} onChange={e=>setNewCatForm({...newCatForm, name: e.target.value})} className="flex-1 h-12 px-4 bg-white/[0.04] border border-white/10 rounded-xl text-white" placeholder="Название темы" /> <button onClick={handleAddCategory} className="px-4 h-12 rounded-xl bg-rose-500 text-white font-bold"><Icons.Plus /></button> </div> </div> )}
                        <div className="flex-1 flex flex-col gap-8 pb-24">
                            <div className="flex flex-col border-y border-white/[0.08] divide-y divide-white/[0.08]">
                                {categories.map((cat, idx) => ( <div key={cat.id} className="py-4 px-2 flex items-center justify-between hover:bg-white/[0.02] transition-colors group"> <button onClick={() => { SoundFX.click(); setViewCategory(cat.id); setVisibleLimit(60); navigate('q_list'); }} className="flex-1 flex items-center gap-3.5 text-left"> <span className="text-2xl">{cat.icon}</span><div><div className="font-semibold text-base text-white">{cat.name}</div><div className="text-xs text-zinc-500">Активных: <span className="text-zinc-300 font-semibold">{stats.activeByCat[cat.id] || 0}</span> из {stats.totalByCat[cat.id] || 0}</div></div> </button> <div className="flex items-center gap-2"> {isAdmin && ( <div className="flex flex-col gap-1 mr-2 opacity-100 lg:opacity-0 lg:group-hover:opacity-100 transition-opacity"> <button onClick={()=>moveCategory(idx, 'up')} disabled={idx===0} className="text-zinc-500 hover:text-white disabled:opacity-30"><Icons.UpArrow /></button> <button onClick={()=>moveCategory(idx, 'down')} disabled={idx===categories.length-1} className="text-zinc-500 hover:text-white disabled:opacity-30"><Icons.DownArrow /></button> </div> )} <span className="text-zinc-600 pointer-events-none"><Icons.Next /></span> </div> </div> ))}
                            </div>
                            <div className="pt-2 flex flex-col gap-4"> <button onClick={() => { SoundFX.click(); navigate('archive_page'); }} className="flex items-center gap-3 text-left group"> <span className="w-10 h-10 rounded-2xl bg-white/[0.04] border border-white/10 flex items-center justify-center text-rose-400 group-hover:border-rose-500/40 transition-all"><Icons.Archive /></span> <div><div className="font-bold text-base text-white flex items-center gap-2">Архив вопросов <span className="text-xs text-zinc-500 font-normal">→</span></div><div className="text-xs text-zinc-500">В архиве: {stats.archivedList.length} вопр.</div></div> </button> </div>
                        </div>
                        {isAdmin && <div className="lg:hidden fixed bottom-5 left-5 right-5 max-w-md mx-auto pointer-events-none"> <button onClick={() => { SoundFX.click(); setAddStatus(null); setAddForm({ text: '', cat: categories[0]?.id || 'family', diff: 'Простые', targetId: '' }); navigate('add_q'); }} className="w-full rounded-2xl font-bold text-xs uppercase btn-primary flex items-center justify-center gap-2 pointer-events-auto h-14"><Icons.Plus /> Новый вопрос</button> </div>}
                    </div>
                );
            }

            if (screen === 'archive_page') {
                const filteredArch = stats.archivedList.filter(q => { if (archiveFilterCat !== 'all' && q.categoryId !== archiveFilterCat) return false; if (archiveFilterDiff !== 'all' && q.level !== archiveFilterDiff) return false; if (archiveSearch.trim() !== '') { const s = archiveSearch.toLowerCase().trim(); if (!q.cleanText.toLowerCase().includes(s) && !String(q.num).includes(s)) return false; } return true; });
                return (
                    <div className="safe-screen w-full flex flex-col fade-in max-w-2xl mx-auto relative z-10">
                        <header className="flex items-center justify-between gap-3 mb-6 pt-2 flex-wrap"> <div className="flex items-center gap-3.5"><button onClick={() => { SoundFX.click(); navigate('cat_list'); }} className="p-3 bg-white/[0.04] rounded-2xl border border-white/10"><Icons.Back /></button><div><h2 className="font-display text-2xl font-bold text-white">Архив вопросов</h2></div></div> </header>
                        {stats.archivedList.length === 0 ? ( <div className="flex-1 flex flex-col items-center justify-center text-center py-16 gap-4"><div className="w-12 h-12 rounded-2xl bg-white/[0.04] border border-white/10 flex items-center justify-center text-zinc-500"><Icons.Archive /></div><p className="text-sm text-zinc-400 max-w-xs leading-relaxed">Архив пуст.</p><button onClick={() => navigate('cat_list')} className="px-6 h-12 rounded-2xl btn-secondary text-xs font-bold mt-2">К темам</button></div> ) : ( <div className="flex-1 flex flex-col gap-6 pb-24"><div className="flex flex-col divide-y divide-white/[0.08] border-y border-white/[0.08]"> {filteredArch.slice(0, archiveVisibleLimit).map(q => ( <div key={q.dbKey} className="py-4 flex items-start justify-between gap-4"><div className="text-sm text-zinc-200"><div className="flex items-center gap-2 text-[11px] mb-1"><span className="text-rose-400 font-bold">№ {q.num}</span></div>{q.cleanText}</div><button onClick={() => handleRestoreSingleFromArchive(q)} className="px-3.5 py-2 rounded-xl border border-white/15 bg-white/[0.04] text-[11px] font-bold"><Icons.Restore /> Вернуть</button></div> ))} </div> <button onClick={() => handleRestoreBatchFromArchive(stats.archivedList)} className="w-full rounded-2xl btn-primary h-14 text-xs font-bold uppercase flex items-center justify-center gap-2 mt-2"><Icons.Restore /> Вернуть все</button></div> )}
                    </div>
                );
            }

            if (screen === 'q_list') {
                const qs = profileDb.filter(q => q.categoryId === viewCategory);
                return (
                    <div className="safe-screen w-full flex flex-col fade-in max-w-2xl mx-auto relative z-10">
                        <header className="flex items-center justify-between gap-4 mb-7 pt-2 flex-shrink-0">
                            <div className="flex items-center gap-3.5"><button onClick={() => { SoundFX.click(); navigate('cat_list'); }} className="p-3 bg-white/[0.04] rounded-2xl border border-white/10"><Icons.Back /></button><h2 className="font-display text-2xl font-bold text-white">{categories.find(c => c.id === viewCategory)?.name}</h2></div>
                            {isAdmin && <button onClick={() => { SoundFX.click(); setAddStatus(null); setAddForm({ text: '', cat: viewCategory || categories[0]?.id, diff: 'Простые', targetId: '' }); navigate('add_q'); }} className="hidden lg:flex px-5 h-12 rounded-2xl font-bold text-xs uppercase btn-primary items-center gap-2"><Icons.Plus /> Новый вопрос</button>}
                        </header>
                        <div className="flex-1 flex flex-col gap-10 pb-24">
                            {DIFFICULTIES.map(diff => { const diffQs = qs.filter(q => q.level === diff.id); if (diffQs.length === 0) return null; return ( <div key={diff.id} className="space-y-3"><h3 className={`font-display text-sm font-bold uppercase ${diff.classText}`}>{diff.name}</h3><div className="flex flex-col divide-y divide-white/[0.08] border-y border-white/[0.08]"> {diffQs.slice(0, visibleLimit).map(q => ( <div key={q.dbKey} className="py-4 flex items-start justify-between gap-4"> <div className="text-[15px] text-zinc-100 flex-1"><span className="text-rose-400 font-bold mr-2">№ {q.num}.</span>{q.cleanText}</div> <div className="flex items-center gap-2 flex-shrink-0"> {isAdmin && <button onClick={() => {SoundFX.click(); setEditingQuestion(q); setEditForm({ text: q.cleanText, cat: q.categoryId, diff: q.level, targetId: q.targetId || '' }); setReturnScreen('q_list'); navigate('edit_q');}} className="p-2 rounded-xl bg-white/[0.04] text-zinc-400 border border-white/10"><Icons.Edit /></button>} </div> </div> ))} </div></div> ); })}
                        </div>
                    </div>
                );
            }

            if (screen === 'add_q' && isAdmin) {
                return (
                    <div className="safe-screen w-full flex flex-col fade-in max-w-lg mx-auto relative z-10">
                        <header className="flex items-center gap-3.5 mb-6 pt-2"><button onClick={() => { SoundFX.click(); navigate(viewCategory ? 'q_list' : 'cat_list'); }} className="p-3 bg-white/[0.04] rounded-2xl border border-white/10"><Icons.Back /></button><h2 className="font-display text-xl font-bold text-white">Новый вопрос</h2></header>
                        {addStatus ? (
                            <div className="flex-1 flex flex-col items-center justify-center slide-up text-center"><h3 className="font-display text-2xl font-bold text-white">{addStatus.ok ? 'Вопрос добавлен' : 'Ошибка'}</h3><p className="text-xs text-zinc-400 mb-6 mt-2">{addStatus.msg}</p><div className="grid grid-cols-2 gap-3 w-full max-w-xs"><button onClick={() => navigate(viewCategory ? 'q_list' : 'cat_list')} className="btn-secondary rounded-2xl h-12 uppercase text-xs font-bold">К списку</button><button onClick={() => setAddStatus(null)} className="btn-primary rounded-2xl h-12 uppercase text-xs font-bold">Еще один</button></div></div>
                        ) : (
                            <form onSubmit={handleAddQuestion} className="flex-1 flex flex-col gap-5 slide-up pb-10">
                                <textarea required value={addForm.text} onChange={e => setAddForm({...addForm, text: e.target.value})} className="w-full p-4 rounded-2xl bg-white/[0.04] border border-white/12 text-base text-white h-36 focus:border-rose-500 outline-none" placeholder="Введите вопрос..."></textarea>
                                <input type="text" placeholder="ID сессии (оставьте пустым для всех)" value={addForm.targetId} onChange={e => setAddForm({...addForm, targetId: e.target.value})} className="w-full h-14 px-5 rounded-2xl bg-white/[0.04] border border-white/12 text-white outline-none" />
                                <div className="grid grid-cols-2 gap-4"><CustomSelect value={addForm.cat} onChange={val => setAddForm({...addForm, cat: val})} options={categories.map(c=>({value:c.id, label:c.name, icon:c.icon}))} /><CustomSelect value={addForm.diff} onChange={val => setAddForm({...addForm, diff: val})} options={DIFFICULTIES.map(d=>({value:d.id, label:d.name}))} /></div>
                                <button type="button" disabled={isGeneratingQuestion} onClick={handleGenerateQuestionAI} className="w-full h-13 rounded-2xl border border-rose-500/40 bg-rose-500/10 text-rose-200 font-bold uppercase text-xs flex items-center justify-center gap-2"><Icons.Sparkles /> {isGeneratingQuestion ? "Генерация..." : "Идея от ИИ"}</button>
                                <div className="mt-auto pt-4 grid grid-cols-2 gap-3.5"><button type="button" onClick={() => navigate(viewCategory ? 'q_list' : 'cat_list')} className="w-full rounded-2xl btn-secondary h-14 font-bold text-xs uppercase">Отмена</button><button type="submit" disabled={isSaving || !addForm.text.trim()} className="w-full rounded-2xl btn-primary h-14 font-bold text-xs uppercase flex items-center justify-center gap-2"><Icons.Plus /> Сохранить</button></div>
                            </form>
                        )}
                    </div>
                );
            }

            if (screen === 'edit_q' && editingQuestion && isAdmin) {
                return (
                    <div className="safe-screen w-full flex flex-col fade-in max-w-lg mx-auto relative z-10">
                        <header className="flex items-center gap-3.5 mb-6 pt-2"><button onClick={() => { SoundFX.click(); navigate(returnScreen); }} className="p-3 bg-white/[0.04] rounded-2xl border border-white/10"><Icons.Back /></button><div><h2 className="font-display text-xl font-bold text-white">Редактирование</h2><p className="text-xs text-zinc-500">№ {editingQuestion.num}</p></div></header>
                        <div className="flex-1 flex flex-col gap-5 slide-up pb-10">
                            <textarea value={editForm.text} onChange={e => setEditForm({...editForm, text: e.target.value})} className="w-full p-4 rounded-2xl bg-white/[0.04] border border-white/12 text-base text-white h-36 focus:border-rose-500 outline-none"></textarea>
                            <input type="text" placeholder="ID сессии (оставьте пустым для всех)" value={editForm.targetId} onChange={e => setEditForm({...editForm, targetId: e.target.value})} className="w-full h-14 px-5 rounded-2xl bg-white/[0.04] border border-white/12 text-white outline-none" />
                            <div className="grid grid-cols-2 gap-4"><CustomSelect value={editForm.cat} onChange={val => setEditForm({...editForm, cat: val})} options={categories.map(c=>({value:c.id, label:c.name, icon:c.icon}))} /><CustomSelect value={editForm.diff} onChange={val => setEditForm({...editForm, diff: val})} options={DIFFICULTIES.map(d=>({value:d.id, label:d.name}))} /></div>
                            <button onClick={() => {SoundFX.warn(); setConfirmModal({ action: 'delete', title: 'Удалить вопрос?' });}} className="w-full h-13 rounded-2xl border border-rose-500/40 bg-rose-500/10 text-rose-300 font-bold uppercase text-xs flex items-center justify-center gap-2"><Icons.Trash /> Удалить</button>
                            <div className="mt-auto pt-4 grid grid-cols-2 gap-3.5"><button onClick={() => navigate(returnScreen)} className="w-full rounded-2xl btn-secondary h-14 font-bold text-xs uppercase">Отмена</button><button onClick={() => {SoundFX.click(); setConfirmModal({ action: 'save', title: 'Сохранить?' });}} disabled={isSaving} className="w-full rounded-2xl btn-primary h-14 font-bold text-xs uppercase"><Icons.Check /> Сохранить</button></div>
                        </div>
                        <PopupModal isOpen={Boolean(confirmModal)} onClose={() => setConfirmModal(null)}>
                            {confirmModal && <div className="text-center gap-5 pt-2"><h3 className="font-display font-bold text-white mb-4 text-xl">{confirmModal.title}</h3><div className="grid grid-cols-2 gap-3 w-full"><button onClick={() => setConfirmModal(null)} className="btn-secondary rounded-2xl h-12 uppercase font-bold text-xs">Отмена</button><button onClick={() => confirmModal.action === 'delete' ? executeDeleteQuestion() : executeSaveEdit()} className="btn-primary rounded-2xl h-12 uppercase font-bold text-xs">Да</button></div></div>}
                        </PopupModal>
                        <PopupModal isOpen={Boolean(resultModal)} onClose={() => { const target = resultModal?.afterCloseScreen; setResultModal(null); if (target) navigate(target); }}>
                            {resultModal && <div className="text-center gap-4 pt-2"><h3 className="font-display text-lg font-bold text-white mb-2">{resultModal.msg}</h3><button onClick={() => { const target = resultModal.afterCloseScreen; setResultModal(null); if (target) navigate(target); }} className="w-full rounded-2xl btn-primary h-14 font-bold text-xs mt-1">Понятно</button></div>}
                        </PopupModal>
                    </div>
                );
            }

            return null;
        }

        const root = ReactDOM.createRoot(document.getElementById('root')); root.render(<App />);
    </script>
</body>
</html>
