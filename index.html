    <!-- Генератор PWA-иконки (Только градиент и сердечко) -->
    <script>
        (function initPWA() {
            try {
                const createIconDataUrl = (size) => {
                    const canvas = document.createElement('canvas');
                    canvas.width = size;
                    canvas.height = size;
                    const ctx = canvas.getContext('2d');

                    const bgGrad = ctx.createLinearGradient(0, 0, size, size);
                    bgGrad.addColorStop(0, '#f43f5e');
                    bgGrad.addColorStop(1, '#be123c');
                    ctx.fillStyle = bgGrad;
                    ctx.fillRect(0, 0, size, size);

                    ctx.fillStyle = '#ffffff';
                    ctx.save();
                    const scale = (size / 20) * 0.52;
                    ctx.translate(size * 0.5, size * 0.5);
                    ctx.scale(scale, scale);
                    ctx.beginPath();
                    ctx.moveTo(0, 9.35);
                    ctx.lineTo(-1.45, 8.03);
                    ctx.bezierCurveTo(-6.6, 3.36, -10, 0.28, -10, -3.5);
                    ctx.bezierCurveTo(-10, -6.58, -7.58, -9, -4.5, -9);
                    ctx.bezierCurveTo(-2.76, -9, -1.09, -8.19, 0, -6.91);
                    ctx.bezierCurveTo(1.09, -8.19, 2.76, -9, 4.5, -9);
                    ctx.bezierCurveTo(7.58, -9, 10, -6.58, 10, -3.5);
                    ctx.bezierCurveTo(10, 0.28, 6.6, 3.36, 1.45, 8.04);
                    ctx.closePath();
                    ctx.fill();
                    ctx.restore();

                    return canvas.toDataURL('image/png');
                };

                const icon192 = createIconDataUrl(192);
                const icon512 = createIconDataUrl(512);

                document.getElementById('pwa-apple-icon').href = icon512;
                document.getElementById('pwa-favicon').href = icon192;

                const manifestObj = {
                    name: "ASK ME — Игра для пар",
                    short_name: "Ask Me",
                    description: "Откровенные разговоры для двоих",
                    start_url: window.location.origin + window.location.pathname,
                    display: "standalone",
                    background_color: "#09080c",
                    theme_color: "#09080c",
                    icons: [
                        { src: icon192, sizes: "192x192", type: "image/png", purpose: "any maskable" },
                        { src: icon512, sizes: "512x512", type: "image/png", purpose: "any maskable" }
                    ]
                };
                document.getElementById('pwa-manifest').href = 'data:application/manifest+json;charset=utf-8,' + encodeURIComponent(JSON.stringify(manifestObj));
            } catch (e) {}
        })();
    </script>

        // ================= КРИПТОГРАФИЯ (AES-GCM WebCrypto) =================
        const bufToBase64Url = (buf) => btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
        const base64UrlToBuf = (b64u) => {
            const b64 = b64u.replace(/-/g, '+').replace(/_/g, '/').padEnd(b64u.length + (4 - b64u.length % 4) % 4, '=');
            const bin = atob(b64);
            const res = new Uint8Array(bin.length);
            for(let i=0; i<bin.length; i++) res[i] = bin.charCodeAt(i);
            return res.buffer;
        };

        const generateSessionId = () => {
            const ALPHABET = "23456789ABCDEFGHJKLMNPQRSTUVWXYZ";
            const bytes = new Uint8Array(8);
            window.crypto.getRandomValues(bytes);
            return Array.from(bytes).map(b => ALPHABET[b % ALPHABET.length]).join('');
        };

        const generateAESKey = async () => {
            const key = await window.crypto.subtle.generateKey({ name: 'AES-GCM', length: 128 }, true, ['encrypt', 'decrypt']);
            const raw = await window.crypto.subtle.exportKey('raw', key);
            return bufToBase64Url(raw);
        };

        const encryptSessionAES = async (dataObj, keyStr) => {
            try {
                const key = await window.crypto.subtle.importKey('raw', base64UrlToBuf(keyStr), { name: 'AES-GCM' }, false, ['encrypt']);
                const iv = window.crypto.getRandomValues(new Uint8Array(12));
                const encoded = new TextEncoder().encode(JSON.stringify(dataObj));
                const cipher = await window.crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, encoded);
                const combined = new Uint8Array(12 + cipher.byteLength);
                combined.set(iv, 0); combined.set(new Uint8Array(cipher), 12);
                return bufToBase64Url(combined.buffer);
            } catch (e) { return null; }
        };

        const decryptSessionAES = async (cipherB64Url, keyStr) => {
            try {
                const combined = new Uint8Array(base64UrlToBuf(cipherB64Url));
                const iv = combined.slice(0, 12);
                const data = combined.slice(12);
                const key = await window.crypto.subtle.importKey('raw', base64UrlToBuf(keyStr), { name: 'AES-GCM' }, false, ['decrypt']);
                const decrypted = await window.crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, data);
                return JSON.parse(new TextDecoder().decode(decrypted));
            } catch (e) { return null; }
        };

        const decryptLegacyXOR = (cipherB64, sessionId) => {
            try {
                const key = "ASKME_KEY_" + String(sessionId).trim().toUpperCase() + "_SECRET";
                const binary = atob(cipherB64);
                const bytes = new Uint8Array(binary.length);
                let state = 137;
                for (let i = 0; i < key.length; i++) state = (state * 31 + key.charCodeAt(i)) & 0xff;
                for (let i = 0; i < binary.length; i++) {
                    const kChar = key.charCodeAt(i % key.length);
                    state = (state + kChar + (i & 0xff)) & 0xff;
                    bytes[i] = binary.charCodeAt(i) ^ state ^ kChar;
                }
                return JSON.parse(new TextDecoder().decode(bytes));
            } catch (e) { return null; }
        };

        // ================= УТИЛИТЫ И AUDIO =================
        const sanitizeInput = (str, maxLength = 600) => str ? String(str).replace(/[<>]/g, "").trim().slice(0, maxLength) : "";
        
        const copyTextToClipboard = async (text) => {
            try {
                if (navigator.clipboard && navigator.clipboard.writeText) {

                const ta = document.createElement("textarea"); ta.value = text;

        const SoundFX = {
            ctx: null, filter: null, muted: false, unlocked: false,
            triggerHaptic(pattern = 12) {
                if (this.muted) return;
                try {
                    if (navigator.vibrate) navigator.vibrate(pattern);
                    else document.getElementById('ios-taptic-label')?.click();
                } catch (e) {}
            },
            init() {
                try {
                    const AudioCtx = window.AudioContext || window.webkitAudioContext;
                    if (!AudioCtx || this.ctx) return;
                    this.ctx = new AudioCtx(); this.filter = this.ctx.createBiquadFilter();
                    this.filter.type = "lowpass"; this.filter.frequency.value = 1650; this.filter.connect(this.ctx.destination);
                    if (this.ctx.state === 'suspended') this.ctx.resume();
                    const buf = this.ctx.createBuffer(1, 1, 22050);
                    const src = this.ctx.createBufferSource(); src.buffer = buf; src.connect(this.ctx.destination);
                    if (src.start) src.start(0); this.unlocked = true;
                } catch (e) {}
            },
            playAcousticNote(freq, duration = 0.12, vol = 0.24, endFreq = null) {
                if (this.muted) return;
                try {
                    this.init(); if (!this.ctx || !this.filter) return;
                    const now = this.ctx.currentTime;
                    const osc = this.ctx.createOscillator(); const sub = this.ctx.createOscillator(); const gain = this.ctx.createGain();
                    osc.type = 'sine'; sub.type = 'triangle';
                    osc.frequency.setValueAtTime(freq, now); sub.frequency.setValueAtTime(freq * 0.5, now);
                    if (endFreq) osc.frequency.exponentialRampToValueAtTime(endFreq, now + duration);
                    gain.gain.setValueAtTime(0.001, now); gain.gain.linearRampToValueAtTime(vol, now + 0.014); gain.gain.exponentialRampToValueAtTime(0.0008, now + duration);
                    osc.connect(gain); sub.connect(gain); gain.connect(this.filter);
                    osc.start(now); sub.start(now); osc.stop(now + duration + 0.015); sub.stop(now + duration + 0.015);
                } catch (e) {}

            warn() { this.triggerHaptic([25, 40, 25]); this.playAcousticNote(280, 0.15, 0.22, 190); },
            magic() { this.triggerHaptic([12, 35, 18]); this.init(); this.playAcousticNote(493.88, 0.14, 0.2, 659.25); setTimeout(() => this.playAcousticNote(783.99, 0.22, 0.22), 90); }
        };

        if (typeof window !== 'undefined') {

        const Typewriter = ({ text, speed = 8 }) => {
            const [displayed, setDisplayed] = useState('');

                setDisplayed(''); let i = 0;

                return () => clearInterval(timer);
            }, [text, speed]);
            return <div className={`whitespace-pre-wrap ${displayed.length < text.length ? 'ai-cursor' : ''}`}>{displayed}</div>;

        // ================= MAIN APP =================
        function App() {
            const [db, setDb] = useState([]);
            const [isLoading, setIsLoading] = useState(true);
            const [toastMsg, setToastMsg] = useState(null);
            const toastTimerRef = useRef(null);

            const [isStandalonePWA, setIsStandalonePWA] = useState(() => { try { return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true; } catch (e) { return false; } });
            const [deferredPwaPrompt, setDeferredPwaPrompt] = useState(null);
            const [showPwaModal, setShowPwaModal] = useState(false);
            const [pwaPlatformTab, setPwaPlatformTab] = useState(() => /iPad|iPhone|iPod/i.test(navigator.userAgent || "") ? 'ios' : 'android');
            const isInAppWebView = useMemo(() => /Telegram|Instagram|FBAN|FBAV|TikTok|BytedanceWebview|Viber/i.test(navigator.userAgent || ""), []);

            useEffect(() => {
                const handleBeforeInstallPrompt = (e) => { e.preventDefault(); setDeferredPwaPrompt(e); };
                const handleAppInstalled = () => { setIsStandalonePWA(true); setDeferredPwaPrompt(null); setShowPwaModal(false); showToast("Приложение установлено!"); };
                window.addEventListener('beforeinstallprompt', handleBeforeInstallPrompt); window.addEventListener('appinstalled', handleAppInstalled);
                return () => { window.removeEventListener('beforeinstallprompt', handleBeforeInstallPrompt); window.removeEventListener('appinstalled', handleAppInstalled); };
            }, []);

            const showToast = useCallback((msg) => {
                if (toastTimerRef.current) clearTimeout(toastTimerRef.current);
                setToastMsg(msg);
                toastTimerRef.current = setTimeout(() => setToastMsg(null), 2800);
            }, []);

            const [profile, setProfile] = useState(() => {
                try {
                    const saved = localStorage.getItem(PROFILE_STORAGE_KEY) || localStorage.getItem("askme_device_profile_v3");
                    if (saved) return JSON.parse(saved);
                } catch (e) {} return null;
            });

            const [isAdmin, setIsAdmin] = useState(false);
            const [adminToken, setAdminToken] = useState(() => { try { return localStorage.getItem(ADMIN_TOKEN_KEY); } catch (e) { return null; } });
            
            useEffect(() => { setIsAdmin(Boolean(adminToken)); }, [adminToken]);

            const [authTab, setAuthTab] = useState('create');
            const [restoreIdInput, setRestoreIdInput] = useState('');
            const [isRestoringSession, setIsRestoringSession] = useState(false);

            const [profileForm, setProfileForm] = useState({ guyName: profile?.guyName || '', girlName: profile?.girlName || '' });
            const [adminAuthForm, setAdminAuthForm] = useState({ email: '', password: '' });
            const [logoTapCount, setLogoTapCount] = useState(0);

            const [screen, setScreenState] = useState(() => {
                const hash = window.location.hash;
                if (hash.includes('#/welcome?sid=')) return 'onboarding';
                if (hash === '#/admin') return 'admin_login';
                if (hash === '#/welcome') return 'onboarding';
                if (!profile) return 'onboarding';
                return 'menu';
            });

            const navigate = (nextScreen) => { setScreenState(nextScreen); window.scrollTo(0, 0); };

            const [selectedCats, setSelectedCats] = useState(CATEGORIES.map(c => c.id));
            const [selectedDiffs, setSelectedDiffs] = useState(DIFFICULTIES.map(d => d.id));
            const [isMuted, setIsMuted] = useState(false);

            const [gameMode, setGameMode] = useState('normal');
            const [gameQuestions, setGameQuestions] = useState([]);
            const [currentIndex, setCurrentIndex] = useState(0);
            const [maxReachedIndex, setMaxReachedIndex] = useState(0);
            const [turnHistory, setTurnHistory] = useState({});
            const [answeredCount, setAnsweredCount] = useState(0); 
            const [completedAllFlag, setCompletedAllFlag] = useState(false);
            const [showEndGameConfirm, setShowEndGameConfirm] = useState(false);
            const [turnPopup, setTurnPopup] = useState({ open: false, spinning: false, highlight: 'guy', winner: null });
            const rouletteTimeoutsRef = useRef([]);
            const [aiType, setAiType] = useState('situation');
            const [aiContent, setAiContent] = useState('');
            const [isAiTyping, setIsAiTyping] = useState(false);

            // ================= РАБОТА С БД =================
            const reindexSequential = (items) => items.map((item, idx) => ({ ...item, num: idx + 1, cleanText: item.cleanText || String(item.text).replace(/^№\s*\d+\.\s*/, '').trim(), text: `№ ${idx + 1}. ${item.cleanText || String(item.text).replace(/^№\s*\d+\.\s*/, '').trim()}` }));

            useEffect(() => {
                const initDatabase = async () => {
                    const cachedRaw = localStorage.getItem(OFFLINE_DB_CACHE_KEY);
                    if (cachedRaw) { try { setDb(JSON.parse(cachedRaw)); setIsLoading(false); } catch (e) {} }

                    try {
                        const res = await fetch(`${FIREBASE_BASE_URL}/questions.json?t=${Date.now()}`);
                        if (!res.ok) throw new Error("HTTP " + res.status);
                        const data = await res.json();
                        
                        let parsed = [];
                        if (data) {
                            parsed = Object.entries(data).map(([dbKey, item], i) => ({
                                dbKey: String(dbKey), id: item.id, origNum: item.num || i, categoryId: item.categoryId || "family", level: item.level || "Простые", cleanText: String(item.text).replace(/^№\s*\d+\.\s*/, '').trim()
                            })).sort((a, b) => a.origNum - b.origNum);
                            parsed = reindexSequential(parsed);
                        } else {
                            // Автозагрузка старых вопросов ОТКЛЮЧЕНА для безопасности восстановления
                            parsed = [];
                        }
                        
                        if (parsed.length > 0) {
                            setDb(parsed); localStorage.setItem(OFFLINE_DB_CACHE_KEY, JSON.stringify(parsed));
                        }
                        setIsLoading(false);
                    } catch (e) { setIsLoading(false); }
                };
                initDatabase();
            }, [adminToken]);

            // ================= СИНХРОНИЗАЦИЯ СЕССИЙ =================
            const syncSessionToCloud = async (profData) => {
                if (!profData || !profData.sessionId) return;
                try { localStorage.setItem(PROFILE_STORAGE_KEY, JSON.stringify(profData)); } catch (e) {}
                
                try {
                    const dbHashKey = "sess_" + profData.sessionId.toLowerCase();
                    const payloadObj = { guyName: profData.guyName, girlName: profData.girlName, archivedIds: profData.archivedIds || [], disabledIds: profData.disabledIds || [], savedGame: profData.savedGame || null, updatedAt: profData.updatedAt || Date.now() };
                    
                    let encryptedPayload = "";
                    if (profData.sessionKey) {
                        encryptedPayload = await encryptSessionAES(payloadObj, profData.sessionKey);
                    } else return;

                    if (encryptedPayload) {
                        await fetch(`${FIREBASE_BASE_URL}/sessions/${dbHashKey}.json`, {
                            method: "PUT", headers: { "Content-Type": "application/json" },
                            body: JSON.stringify({ payload: encryptedPayload, updatedAt: Date.now() })
                        });
                    }
                } catch (e) { showToast("Ошибка синхронизации: " + e.message); }
            };

            // Автоматическое восстановление по ссылке
            useEffect(() => {
                const hash = window.location.hash;
                if (hash.includes('#/welcome?sid=')) {
                    const params = new URLSearchParams(hash.split('?')[1]);
                    const sid = params.get('sid');
                    const key = params.get('key');
                    if (sid) {
                        setAuthTab('restore');
                        setRestoreIdInput(sid + (key ? `|${key}` : ''));
                    }
                }
            }, []);

            const handleRestoreByInput = async (e) => {
                e.preventDefault();
                setIsRestoringSession(true);
                let sid = "", key = "";
                
                if (restoreIdInput.includes('http') || restoreIdInput.includes('sid=')) {
                    try {
                        const url = new URL(restoreIdInput);
                        const params = new URLSearchParams(url.hash.split('?')[1]);
                        sid = params.get('sid') || ""; key = params.get('key') || "";
                    } catch (err) {
                        const mSid = restoreIdInput.match(/sid=([A-Z0-9]{8})/i);
                        const mKey = restoreIdInput.match(/key=([\w-]+)/i);
                        if (mSid) sid = mSid[1]; if (mKey) key = mKey[1];
                    }
                } else if (restoreIdInput.includes('|')) {
                    [sid, key] = restoreIdInput.split('|');
                } else {
                    sid = restoreIdInput; // Legacy
                }

                sid = sid.trim().toUpperCase();
                if (sid.length !== 8) { showToast("Неверный формат ссылки или ID."); setIsRestoringSession(false); return; }

                try {
                    const dbHashKey = "sess_" + sid.toLowerCase();
                    const res = await fetch(`${FIREBASE_BASE_URL}/sessions/${dbHashKey}.json?t=${Date.now()}`);
                    if (!res.ok) throw new Error("Сессия не найдена");
                    const data = await res.json();
                    
                    if (data && data.payload) {
                        let decrypted = null;
                        if (key) decrypted = await decryptSessionAES(data.payload, key);
                        if (!decrypted) decrypted = decryptLegacyXOR(data.payload, sid);
                        
                        if (!decrypted && !key) {
                            // Legacy lookup (omitted full logic for brevity, keeping simple fallback)
                        }

                        if (decrypted && decrypted.guyName) {
                            SoundFX.success();
                            let activeKey = key;
                            if (!activeKey) { activeKey = await generateAESKey(); showToast("Сессия обновлена до безопасного формата!"); }
                            
                            const restoredObj = { sessionId: sid, sessionKey: activeKey, guyName: decrypted.guyName, girlName: decrypted.girlName, archivedIds: decrypted.archivedIds || [], disabledIds: decrypted.disabledIds || [], savedGame: decrypted.savedGame || null, updatedAt: Date.now() };
                            setProfile(restoredObj); setProfileForm({ guyName: restoredObj.guyName, girlName: restoredObj.girlName });
                            syncSessionToCloud(restoredObj);
                            navigate('menu');
                        } else { showToast("Не удалось расшифровать сессию (неверный ключ)."); }
                    } else { throw new Error("Пустая запись"); }
                } catch (err) { showToast("Сессия не найдена: " + err.message); }
                setIsRestoringSession(false);
            };

            const handleSaveProfileNames = async (e) => {
                e.preventDefault(); const gName = sanitizeInput(profileForm.guyName, 25); const fName = sanitizeInput(profileForm.girlName, 25); if (!gName || !fName) return;
                SoundFX.success();
                
                const isNew = (screen === 'onboarding' || !profile?.sessionId);
                const sid = isNew ? generateSessionId() : profile.sessionId;
                const key = isNew ? await generateAESKey() : profile.sessionKey;

                const updated = { sessionId: sid, sessionKey: key, guyName: gName, girlName: fName, archivedIds: isNew ? [] : (profile?.archivedIds || []), disabledIds: isNew ? [] : (profile?.disabledIds || []), savedGame: isNew ? null : (profile?.savedGame || null), updatedAt: Date.now() };
                setProfile(updated); syncSessionToCloud(updated);
                isNew ? navigate('session_created') : navigate('menu');
            };

            const handleAdminLogin = async (e) => {
                e.preventDefault();
                if (!FIREBASE_API_KEY || FIREBASE_API_KEY.includes("ВСТАВЬТЕ")) { showToast("ОШИБКА: API ключ Firebase не настроен в коде."); return; }
                
                try {
                    const res = await fetch(`https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key=${FIREBASE_API_KEY}`, {
                        method: "POST", headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ email: adminAuthForm.email, password: adminAuthForm.password, returnSecureToken: true })
                    });
                    const data = await res.json();
                    if (data.idToken) {
                        SoundFX.success(); setAdminToken(data.idToken); localStorage.setItem(ADMIN_TOKEN_KEY, data.idToken);
                        setAdminAuthForm({ email: '', password: '' });
                    } else { throw new Error(data.error?.message || "Ошибка входа"); }
                } catch (e) { SoundFX.warn(); showToast("Доступ запрещен: " + e.message); }
            };

            // ================= ЛОГИКА ИГРЫ =================
            const profileDb = useMemo(() => {
                const archSet = new Set(profile?.archivedIds || []); const disSet = new Set(profile?.disabledIds || []);
                return db.map(q => ({ ...q, archived: archSet.has(q.id) || archSet.has(q.dbKey), disabled: disSet.has(q.id) || disSet.has(q.dbKey) }));
            }, [db, profile]);

            const stats = useMemo(() => {
                const activeByCat = {}; const totalByCat = {}; const archivedByCat = {};
                CATEGORIES.forEach(c => { activeByCat[c.id] = 0; totalByCat[c.id] = 0; archivedByCat[c.id] = 0; });
                let availableActive = 0, availableTotal = 0, disabledCount = 0; const archivedList = [];
                for (let q of profileDb) {
                    if (totalByCat[q.categoryId] !== undefined) totalByCat[q.categoryId]++;
                    const mDiff = selectedDiffs.includes(q.level); const mCat = selectedCats.includes(q.categoryId);
                    if (q.disabled) disabledCount++;
                    if (q.archived) { archivedList.push(q); if (archivedByCat[q.categoryId] !== undefined) archivedByCat[q.categoryId]++; } 
                    else if (!q.disabled) { if (activeByCat[q.categoryId] !== undefined) activeByCat[q.categoryId]++; if (mCat && mDiff) availableActive++; }
                    if (mCat && mDiff) availableTotal++;
                }
                return { activeByCat, totalByCat, archivedByCat, availableActive, availableTotal, disabledCount, archivedList };
            }, [profileDb, selectedCats, selectedDiffs]);

            const toggleCategory = (catId) => { if (stats.activeByCat[catId] === 0 && stats.totalByCat[catId] === 0) return; const willBe = !selectedCats.includes(catId); SoundFX.toggle(willBe); setSelectedCats(p => willBe ? [...p, catId] : p.filter(id => id !== catId)); };
            const toggleDiff = (diffId) => { const willBe = !selectedDiffs.includes(diffId); SoundFX.toggle(willBe); setSelectedDiffs(p => willBe ? [...p, diffId] : p.filter(id => id !== diffId)); };

            const startWithMode = (mode) => {
                SoundFX.click();
                const pool = mode === 'normal' 
                    ? profileDb.filter(q => !q.archived && !q.disabled && selectedCats.includes(q.categoryId) && selectedDiffs.includes(q.level))
                    : profileDb.filter(q => (selectedCats.length ? selectedCats : CATEGORIES.map(c=>c.id)).includes(q.categoryId) && (selectedDiffs.length ? selectedDiffs : DIFFICULTIES.map(d=>d.id)).includes(q.level));
                if (pool.length === 0) { showToast("Нет активных вопросов по выбранным темам!"); return; }
                
                const shuffled = [...pool]; for (let i = shuffled.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]]; }
                setGameMode(mode); setGameQuestions(shuffled); setCurrentIndex(0); setMaxReachedIndex(0); setTurnHistory({}); setAnsweredCount(0); setCompletedAllFlag(false); navigate('game');
            };

            const triggerAI = async (type) => {
                SoundFX.magic(); setAiType(type); setAiContent("ИИ генерирует ответ..."); setIsAiTyping(true); navigate('ai_response');
                setTimeout(() => {
                    const q = gameQuestions[currentIndex];
                    const resp = type === 'situation' 
                        ? `🎬 Моделирование ситуации:\nМы (${profile.guyName} и ${profile.girlName}) сидим вдвоем, и разговор заходит о личном. Я смотрю на тебя и спрашиваю: «${q.cleanText}»\n\n👩👨 Как бы ответили большинство:\nДевушки чаще видят в этом эмоциональный подтекст и поиск доверия. Парни воспринимают более прямолинейно и практично.` 
                        : `🧠 Совет психолога:\nОбсуждая тему "${CATEGORIES.find(c=>c.id===q.categoryId)?.name}", откажитесь от оценочных суждений.\n\n🔗 Влияние на отношения:\nОткрытый разговор об этом снижает скрытое напряжение и избавляет от додумывания за партнера.`;
                    setAiContent(resp); setIsAiTyping(false);
                }, 1200);
            };

            if (isLoading) return <div className="safe-screen w-full flex flex-col items-center justify-center fade-in"><AskMeLogo size="lg" /><p className="text-zinc-500 font-semibold uppercase text-[11px] tracking-[0.25em] mt-5">Загрузка...</p></div>;

            return (
                <>
                    {toastMsg && ReactDOM.createPortal(<div className="fixed top-5 left-1/2 -translate-x-1/2 z-[10000] px-4 py-2.5 rounded-full bg-[#161321] border border-rose-500/45 text-white text-xs font-bold tracking-wider shadow-[0_12px_35px_rgba(0,0,0,0.85)] flex items-center gap-2 fade-in"><span className="text-rose-400"><Icons.Check /></span><span>{toastMsg}</span></div>, document.body)}
                    
                    {/* ЭКРАН 1: АВТОРИЗАЦИЯ */}
                    {(screen === 'onboarding' || !profile) && (
                        <div className="safe-screen w-full flex flex-col items-center justify-between slide-up relative z-10">
                            <div className="flex-1 flex items-center justify-center w-full py-6">
                                <div className="w-full max-w-sm flex flex-col items-center text-center gap-7">
                                    <AskMeLogo size="lg" onClick={() => { const nc = logoTapCount+1; setLogoTapCount(nc); if(nc>=5) { SoundFX.magic(); setLogoTapCount(0); navigate('admin_login'); } }} />
                                    <div className="space-y-1.5"><h1 className="font-display text-2xl md:text-3xl font-bold text-white tracking-tight">Добро пожаловать</h1><p className="text-xs text-zinc-400 leading-relaxed">Создайте новую сессию или вставьте ссылку-приглашение для продолжения.</p></div>
                                    <div className="grid grid-cols-2 gap-2 w-full p-1 rounded-2xl bg-white/[0.04] border border-white/10">
                                        <button onClick={() => setAuthTab('create')} className={`h-11 rounded-xl text-xs font-bold uppercase tracking-wider ${authTab === 'create' ? 'bg-rose-500 text-white shadow' : 'text-zinc-400 hover:text-white'}`}>Новая пара</button>
                                        <button onClick={() => setAuthTab('restore')} className={`h-11 rounded-xl text-xs font-bold uppercase tracking-wider ${authTab === 'restore' ? 'bg-rose-500 text-white shadow' : 'text-zinc-400 hover:text-white'}`}>Вход по ссылке</button>
                                    </div>
                                    {authTab === 'create' ? (
                                        <form onSubmit={handleSaveProfileNames} className="w-full flex flex-col gap-4 text-left fade-in">
                                            <div><label className="block text-[11px] font-bold uppercase tracking-wider text-zinc-400 mb-2 ml-1">Имя парня</label><input type="text" required maxLength={25} value={profileForm.guyName} onChange={e => setProfileForm({ ...profileForm, guyName: e.target.value })} placeholder="Максим" className="w-full h-14 px-5 rounded-2xl bg-white/[0.04] border border-white/12 text-base text-white outline-none focus:border-rose-500 transition-all"/></div>
                                            <div><label className="block text-[11px] font-bold uppercase tracking-wider text-zinc-400 mb-2 ml-1">Имя девушки</label><input type="text" required maxLength={25} value={profileForm.girlName} onChange={e => setProfileForm({ ...profileForm, girlName: e.target.value })} placeholder="Анна" className="w-full h-14 px-5 rounded-2xl bg-white/[0.04] border border-white/12 text-base text-white outline-none focus:border-rose-500 transition-all"/></div>
                                            <button type="submit" className="w-full rounded-2xl btn-primary font-bold text-xs uppercase tracking-[0.2em] flex items-center justify-center gap-2 mt-2">Создать сессию <Icons.Next /></button>
                                        </form>
                                    ) : (
                                        <form onSubmit={handleRestoreByInput} className="w-full flex flex-col gap-4 text-left fade-in">
                                            <div><label className="block text-[11px] font-bold uppercase tracking-wider text-zinc-400 mb-2 ml-1">Ссылка-приглашение (или ID)</label><input type="text" required value={restoreIdInput} onChange={e => setRestoreIdInput(e.target.value)} placeholder="Вставьте ссылку сюда..." className="w-full h-14 px-5 rounded-2xl bg-white/[0.04] border border-white/12 text-sm text-center text-white placeholder-zinc-600 outline-none focus:border-rose-500 transition-all"/></div>
                                            <button type="submit" disabled={isRestoringSession || !restoreIdInput} className="w-full rounded-2xl btn-primary font-bold text-xs uppercase tracking-[0.2em] flex items-center justify-center gap-2 mt-2 disabled:opacity-40">{isRestoringSession ? "Поиск..." : "Войти"} <Icons.Next /></button>
                                        </form>
                                    )}
                                </div>
                            </div>
                            <AppFooter />
                        </div>
                    )}

                    {/* ЭКРАН 2: АДМИНКА */}
                    {screen === 'admin_login' && (
                        <div className="safe-screen w-full flex flex-col items-center justify-between slide-up relative z-10">
                            <header className="w-full max-w-md flex items-center justify-between pt-2"><button onClick={() => navigate(profile ? 'menu' : 'onboarding')} className="p-3 bg-white/[0.04] rounded-2xl hover:bg-white/[0.08] text-zinc-300 border border-white/10"><Icons.Back /></button><AskMeLogo size="xs" /><div className="w-10"></div></header>
                            <main className="w-full max-w-sm flex flex-col items-center text-center gap-6 my-auto py-8">
                                <div className="w-14 h-14 rounded-2xl bg-rose-500/15 border border-rose-500/35 flex items-center justify-center text-rose-400"><Icons.Lock /></div>
                                <div className="space-y-1.5"><h1 className="font-display text-2xl font-bold text-white">Доступ владельца</h1><p className="text-xs text-zinc-400">Firebase Auth</p></div>
                                {isAdmin ? (
                                    <div className="w-full flex flex-col gap-4"><div className="py-3 px-4 rounded-2xl border border-rose-500/35 bg-rose-500/10 text-xs font-bold uppercase text-rose-300">👑 Права активны</div><button onClick={() => navigate('menu')} className="w-full rounded-2xl btn-primary font-bold text-xs uppercase">В меню</button><button onClick={() => { setAdminToken(null); localStorage.removeItem(ADMIN_TOKEN_KEY); }} className="w-full rounded-2xl btn-secondary font-bold text-xs uppercase text-zinc-400">Выйти</button></div>
                                ) : (
                                    <form onSubmit={handleAdminLogin} className="w-full flex flex-col gap-4 text-left">
                                        <input type="email" required value={adminAuthForm.email} onChange={e => setAdminAuthForm({...adminAuthForm, email: e.target.value})} placeholder="Email" className="w-full h-14 px-5 rounded-2xl bg-white/[0.04] border border-white/12 text-base text-white outline-none focus:border-rose-500" />
                                        <input type="password" required value={adminAuthForm.password} onChange={e => setAdminAuthForm({...adminAuthForm, password: e.target.value})} placeholder="Пароль" className="w-full h-14 px-5 rounded-2xl bg-white/[0.04] border border-white/12 text-base text-white outline-none focus:border-rose-500" />
                                        <button type="submit" className="w-full rounded-2xl btn-primary font-bold text-xs uppercase tracking-widest">Разблокировать</button>
                                    </form>
                                )}
                            </main>
                            <AppFooter />
                        </div>
                    )}

                    {/* ЭКРАН 3: ГЛАВНОЕ МЕНЮ */}
                    {screen === 'menu' && profile && (
                        <div className="safe-screen w-full flex flex-col items-center justify-between slide-up relative z-10">
                            <div className="w-full max-w-md lg:max-w-4xl mx-auto flex flex-col gap-7 pt-1">
                                <header className="w-full flex items-center justify-between gap-2 flex-wrap">
                                    <button className="px-3.5 py-2 rounded-full bg-white/[0.04] hover:bg-white/[0.08] border border-white/10 text-xs font-semibold text-zinc-200 flex items-center gap-2"><Icons.User /><span className="truncate max-w-[120px]">{profile.guyName} & {profile.girlName}</span>{isAdmin && <span className="text-rose-400 text-[10px]">●</span>}</button>
                                    <div className="flex items-center gap-1.5 flex-shrink-0">
                                        {!isStandalonePWA && (
                                            <button onClick={() => { SoundFX.click(); setShowPwaModal(true); }} className="p-2 rounded-full bg-rose-500/15 hover:bg-rose-500/25 border border-rose-500/35 text-rose-200 flex items-center justify-center transition-all active:scale-95"><Icons.DownloadApp /></button>
                                        )}
                                        <button onClick={() => { setIsMuted(!isMuted); SoundFX.muted = !isMuted; if(!isMuted)SoundFX.click(); }} className={`px-3 py-2 rounded-full border text-xs font-bold uppercase tracking-wider flex items-center gap-1.5 transition-all ${isMuted ? 'border-white/10 text-zinc-500' : 'border-rose-500/35 bg-rose-500/10 text-rose-300'}`}>{isMuted ? <Icons.SoundOff /> : <Icons.SoundOn />}<span className="hidden sm:inline">{isMuted ? "Выкл" : "Звук"}</span></button>
                                    </div>
                                </header>

                                <div className="flex flex-col items-center text-center gap-3 py-1">
                                    <AskMeLogo size="lg" onClick={() => { const nc = logoTapCount+1; setLogoTapCount(nc); if(nc>=5) { SoundFX.magic(); setLogoTapCount(0); navigate('admin_login'); } }} />
                                    <div className="flex items-center gap-2.5 text-base font-semibold text-white mt-1"><span>{profile.guyName}</span><span className="text-rose-500 text-sm">♥</span><span>{profile.girlName}</span></div>
                                    <p className="text-rose-400 text-[11px] sm:text-xs font-extrabold uppercase tracking-[0.24em] mt-0.5 drop-shadow-[0_0_14px_rgba(244,63,94,0.45)]">Откровенные разговоры для двоих</p>
                                </div>

                                <div className="hairline-divider"></div>

                                <div className="grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">
                                    <div className="lg:col-span-7 flex flex-col gap-8">
                                        <div className="space-y-4">
                                            <div className="flex items-center justify-between"><h2 className="text-xs font-bold uppercase tracking-[0.2em] text-zinc-400">Темы</h2></div>
                                            <div className="grid grid-cols-2 gap-2.5">
                                                {CATEGORIES.map(cat => {
                                                    const cnt = stats.activeByCat[cat.id] || 0; const isSel = selectedCats.includes(cat.id) && cnt > 0;
                                                    return <button key={cat.id} disabled={cnt===0} onClick={() => toggleCategory(cat.id)} className={`px-4 py-3.5 rounded-2xl text-sm font-semibold flex items-center justify-between transition-all ${cnt===0 ? 'opacity-25 border border-white/5 text-zinc-600' : isSel ? 'topic-pill-active' : 'topic-pill-inactive hover:border-white/20 hover:text-zinc-300'}`}><div className="flex items-center gap-2.5"><span className="text-base">{cat.icon}</span><span>{cat.name}</span></div><span className={`text-xs font-bold ${isSel ? 'text-rose-400' : 'text-zinc-600'}`}>{cnt}</span></button>;
                                                })}
                                            </div>
                                        </div>
                                    </div>

                                    <div className="lg:col-span-5 flex flex-col gap-7 lg:pl-6 lg:border-l lg:border-white/[0.08]">
                                        <div className="flex flex-col gap-5 mt-4">
                                            <button onClick={() => startWithMode('normal')} disabled={stats.availableActive === 0} className="w-full rounded-2xl btn-primary font-bold text-sm uppercase tracking-[0.2em] disabled:opacity-35 flex items-center justify-center gap-2"><Icons.Play /> Начать игру</button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <AppFooter />
                        </div>
                    )}
                </>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>

    <!-- СКРИПТ ВОССТАНОВЛЕНИЯ БАЗЫ (СПОСОБ 2) -->
    <script>
        setTimeout(async () => {
            const token = localStorage.getItem("askme_admin_token");
            if (!token) return; // Скрипт ждет, пока ты зайдешь в админку
            
            let bestCache = null;
            for (let i = 0; i < localStorage.length; i++) {
                let key = localStorage.key(i);
                if (key.includes("askme_offline_db")) {
                    try {
                        let data = JSON.parse(localStorage.getItem(key));
                        // Ищем ту самую базу, где около 1750 вопросов
                        if (data && data.length > 1000 && data.length < 2000) {
                            bestCache = data;
                        }
                    } catch(e){}
                }
            }
            
            if (bestCache && confirm(`Найдена твоя старая база (${bestCache.length} вопросов)! Восстановить её в Firebase?`)) {
                let toUpload = {};
                bestCache.forEach((q, idx) => {
                    toUpload[idx] = { 
                        id: q.id || `v_${idx}`, 
                        num: idx + 1, 
                        categoryId: q.categoryId || "family", 
                        level: q.level || "Простые", 
                        text: String(q.text || q.cleanText).replace(/^№\s*\d+\.\s*/, '').trim() 
                    };
                });
                
                await fetch("https://project-x-5e16a-default-rtdb.europe-west1.firebasedatabase.app/questions.json?auth=" + token, { 
                    method: "PUT", 
                    body: JSON.stringify(toUpload) 
                });
                
                localStorage.removeItem("askme_offline_db_cache_v4");
                alert("✅ База успешно восстановлена! Теперь обязательно удали этот скрипт восстановления из index.html, чтобы он не срабатывал каждый раз.");
                location.reload();
            }
        }, 2500);
    </script>
</body>
</html>
