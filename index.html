                                        <div className="flex items-center gap-3.5">
                                            <span className="text-2xl text-amber-400"><Icons.Archive /></span>
                                            <div>
                                                <h3 className="font-bold text-base text-white">Архив вопросов</h3>
                                                <p className="text-[11px] font-bold uppercase tracking-widest text-white/40 mt-0.5">
                                                    Отвечено в играх: {archivedQs.length}
                                                </p>
                                            </div>
                                        </div>
                                        {archivedQs.length > 0 && (
                                            <button 
                                                onClick={() => setArchiveExpanded(prev => !prev)}
                                                className="px-4 py-2 rounded-xl bg-white/5 hover:bg-white/10 text-xs font-bold uppercase tracking-wider text-amber-300 border border-amber-500/30 transition-all"
                                            >
                                                {archiveExpanded ? "Скрыть" : "Открыть"}
                                            </button>
                                        )}
                                    </div>

                                    {archivedQs.length === 0 ? (
                                        <p className="text-xs text-white/40 leading-relaxed">
                                            Архив пока пуст. Вопросы попадают сюда автоматически после завершения игры в Обычном режиме, чтобы не повторяться в следующих играх.
                                        </p>
                                    ) : (
                                        <>
                                            {archiveExpanded && (
                                                <div className="flex flex-col gap-3 mt-2 max-h-[420px] overflow-y-auto no-scrollbar pr-1">
                                                    {archivedQs.slice(0, archiveVisibleLimit).map(q => {
                                                        const cInfo = CATEGORIES.find(c => c.id === q.categoryId) || CATEGORIES[0];
                                                        return (
                                                            <div key={q.dbKey} className="p-4 rounded-2xl bg-black/40 border border-white/5 flex items-start justify-between gap-3">
                                                                <div className="text-xs text-white/85 leading-relaxed">
                                                                    <span className="text-amber-400/80 font-bold mr-1.5">№ {q.num} ({cInfo.icon})</span>
                                                                    {q.cleanText}
                                                                </div>
                                                                <button 
                                                                    onClick={() => handleRestoreSingleFromArchive(q)}
                                                                    title="Вернуть вопрос в активную игру"
                                                                    className="flex-shrink-0 px-3 py-2 rounded-xl bg-emerald-500/15 hover:bg-emerald-500/25 border border-emerald-500/30 text-emerald-300 text-[10px] font-bold uppercase tracking-wider flex items-center gap-1 active:scale-95 transition-all"
                                                                >
                                                                    <Icons.Restore /> Вернуть
                                                                </button>
                                                            </div>
                                                        );
                                                    })}
                                                    {archivedQs.length > archiveVisibleLimit && (
                                                        <button 
                                                            onClick={() => setArchiveVisibleLimit(prev => prev + 60)}
                                                            className="w-full py-3 rounded-xl bg-white/5 text-xs font-bold uppercase tracking-widest text-white/60 hover:text-white"
                                                        >
                                                            Показать еще ({archivedQs.length - archiveVisibleLimit})
                                                        </button>
                                                    )}
                                                </div>
                                            )}

                                            {/* Кнопка "Вернуть все вопросы" в самом низу Архива */}
                                            <button 
                                                disabled={isArchivingSync}
                                                onClick={handleRestoreAllFromArchive}
                                                className="w-full h-14 rounded-2xl bg-emerald-600/20 hover:bg-emerald-600/30 border border-emerald-500/40 text-emerald-300 text-xs font-bold uppercase tracking-widest flex items-center justify-center gap-2 transition-all active:scale-95 mt-1"
                                            >
                                                <Icons.Restore /> {isArchivingSync ? "Восстановление..." : `Вернуть все вопросы (${archivedQs.length})`}
                                            </button>
                                        </>
                                    )}
                                </div>
                            </div>
                        </div>

                        <div className="fixed bottom-6 left-5 right-5 max-w-lg mx-auto pointer-events-none">
                            <button 
                                onClick={() => { setAddStatus(null); setAddForm({ text: '', cat: 'family', diff: 'Простые' }); setScreen('add_q'); }} 
                                className="w-full h-14 rounded-2xl font-bold text-sm uppercase tracking-widest btn-romantic flex items-center justify-center gap-2 shadow-2xl pointer-events-auto"
                            >
                                <Icons.Plus /> Добавить вопрос
                            </button>
                        </div>
                    </div>
                );
            }

            // СПИСОК ВОПРОСОВ ВЫБРАННОЙ КАТЕГОРИИ (Оптимизированный рендер без лагов)
            if (screen === 'q_list') {
                const cat = CATEGORIES.find(c => c.id === viewCategory) || CATEGORIES[0];
                const qs = db.filter(q => q.categoryId === viewCategory);
                
                return (
                    <div className="min-h-[100dvh] w-full flex flex-col p-5 fade-in max-w-2xl mx-auto relative z-10">
                        <div className="flex items-center gap-4 mb-8 pt-4 flex-shrink-0">
                            <button onClick={() => setScreen('cat_list')} className="p-4 bg-white/5 rounded-full hover:bg-white/10 text-white/80 transition-all">
                                <Icons.Back />
                            </button>
                            <div>
                                <h2 className="text-2xl font-bold text-white tracking-wide flex items-center gap-2">
                                    {cat.icon} {cat.name}
                                </h2>
                                <div className="text-[11px] font-bold uppercase tracking-widest text-white/40 mt-1">
                                    Всего: {qs.length} вопросов
                                </div>
                            </div>
                        </div>
                        <div className="flex-1 overflow-y-auto no-scrollbar flex flex-col gap-10 pb-28">
                            {DIFFICULTIES.map(diff => {
                                const diffQs = qs.filter(q => q.level === diff.id);
                                if (diffQs.length === 0) return null;
                                const shownQs = diffQs.slice(0, visibleLimit);

                                return (
                                    <div key={diff.id}>
                                        <h3 className={`text-[22px] md:text-2xl font-bold uppercase tracking-widest mb-5 pl-2 ${diff.classText}`}>
                                            {diff.name} ({diffQs.length})
                                        </h3>
                                        <div className="flex flex-col gap-3.5">
                                            {shownQs.map(q => (
                                                <div key={q.dbKey} className="glass-panel p-5 flex items-start justify-between gap-4 border-white/5 shadow-md">
                                                    <div className="text-[15px] md:text-base font-normal text-white/90 leading-snug">
                                                        <span className="text-white/40 font-bold mr-2">№ {q.num}.</span>
                                                        {q.cleanText}
                                                        {q.archived && (
                                                            <span className="ml-2 inline-block text-[10px] font-bold uppercase px-2 py-0.5 rounded-md bg-amber-500/20 text-amber-300">
                                                                Архив
                                                            </span>
                                                        )}
                                                    </div>
                                                    <button 
                                                        onClick={() => openEditScreen(q, 'q_list')}
                                                        title="Редактировать вопрос"
                                                        className="flex-shrink-0 p-3 rounded-xl bg-white/5 hover:bg-white/15 text-white/60 hover:text-white active:scale-90 transition-all border border-white/10"
                                                    >
                                                        <Icons.Edit />
                                                    </button>
                                                </div>
                                            ))}
                                            {diffQs.length > visibleLimit && (
                                                <button 
                                                    onClick={() => setVisibleLimit(prev => prev + 80)}
                                                    className="w-full h-12 rounded-2xl bg-white/5 hover:bg-white/10 text-xs font-bold uppercase tracking-widest text-white/70"
                                                >
                                                    Показать еще ({diffQs.length - visibleLimit})
                                                </button>
                                            )}
                                        </div>
                                    </div>
                                );
                            })}
                        </div>
                        <div className="fixed bottom-6 left-5 right-5 max-w-2xl mx-auto pointer-events-none">
                            <button 
                                onClick={() => { setAddStatus(null); setAddForm({ text: '', cat: viewCategory || 'family', diff: 'Простые' }); setScreen('add_q'); }} 
                                className="w-full h-14 rounded-2xl font-bold text-sm uppercase tracking-widest btn-romantic flex items-center justify-center gap-2 shadow-2xl pointer-events-auto"
                            >
                                <Icons.Plus /> Добавить вопрос
                            </button>
                        </div>
                    </div>
                );
            }

            // ЭКРАН РЕДАКТИРОВАНИЯ И УДАЛЕНИЯ ВОПРОСА
            if (screen === 'edit_q' && editingQuestion) {
                const origText = (editingQuestion.cleanText || editingQuestion.text.replace(/^№\s*\d+\.\s*/, '')).trim();
                const hasChanges = 
                    editForm.text.trim() !== "" && (
                        editForm.text.trim() !== origText ||
                        editForm.cat !== editingQuestion.categoryId ||
                        editForm.diff !== editingQuestion.level
                    );

                return (
                    <div className="min-h-[100dvh] w-full flex flex-col p-5 fade-in max-w-lg mx-auto relative z-10">
                        <div className="flex items-center justify-between mb-6 pt-4">
                            <div className="flex items-center gap-4">
                                <button onClick={() => setScreen(returnScreen)} className="p-4 bg-white/5 rounded-full hover:bg-white/10 text-white/80 transition-all">
                                    <Icons.Back />
                                </button>
                                <div>
                                    <h2 className="text-xl font-bold text-white tracking-wide">Редактирование</h2>
                                    <p className="text-[11px] font-bold uppercase tracking-widest text-white/40 mt-0.5">
                                        Вопрос № {editingQuestion.num} • ID: {editingQuestion.id}
                                    </p>
                                </div>
                            </div>
                        </div>

                        <div className="flex-1 flex flex-col gap-6 slide-up">
                            <div>
                                <label className="block text-[11px] font-bold uppercase tracking-widest text-white/50 mb-3 ml-2">Текст вопроса</label>
                                <textarea 
                                    value={editForm.text}
                                    onChange={e => setEditForm({...editForm, text: e.target.value})}
                                    className="w-full glass-panel p-5 text-base text-white/95 placeholder-white/20 outline-none resize-none h-36 focus:border-[#e11d48]/50 transition-colors shadow-inner"
                                    placeholder="Введите текст вопроса..."
                                ></textarea>
                            </div>
                            
                            <div>
                                <label className="block text-[11px] font-bold uppercase tracking-widest text-white/50 mb-3 ml-2">Тема вопроса</label>
                                <select 
                                    value={editForm.cat}
                                    onChange={e => setEditForm({...editForm, cat: e.target.value})}
                                    className="w-full glass-panel h-14 px-5 text-base text-white/90 outline-none appearance-none font-medium bg-transparent"
                                >
                                    {CATEGORIES.map(c => <option key={c.id} value={c.id} className="bg-[#160a1c] text-white">{c.icon} {c.name}</option>)}
                                </select>
                            </div>

                            <div>
                                <label className="block text-[11px] font-bold uppercase tracking-widest text-white/50 mb-3 ml-2">Сложность</label>
                                <select 
                                    value={editForm.diff}
                                    onChange={e => setEditForm({...editForm, diff: e.target.value})}
                                    className="w-full glass-panel h-14 px-5 text-base text-white/90 outline-none appearance-none font-medium bg-transparent"
                                >
                                    {DIFFICULTIES.map(d => <option key={d.id} value={d.id} className="bg-[#160a1c] text-white">{d.name}</option>)}
                                </select>
                            </div>

                            <button 
                                type="button"
                                onClick={() => setConfirmModal({ action: 'delete', title: 'Точно ли вы хотите удалить этот вопрос из базы данных?' })}
                                className="w-full h-14 rounded-2xl border border-rose-500/40 bg-rose-950/20 hover:bg-rose-900/30 text-rose-400 text-xs font-bold uppercase tracking-widest flex items-center justify-center gap-2 transition-all active:scale-95"
                            >
                                <Icons.Trash /> Удалить вопрос
                            </button>

                            <div className="mt-auto pb-4 pt-2 grid grid-cols-2 gap-4">
                                <button 
                                    type="button" 
                                    onClick={() => setScreen(returnScreen)} 
                                    className="w-full h-14 rounded-2xl btn-ghost text-xs font-bold uppercase tracking-widest"
                                >
                                    Отменить
                                </button>
                                <button 
                                    type="button"
                                    disabled={!hasChanges || isSaving}
                                    onClick={() => setConfirmModal({ action: 'save', title: 'Точно ли вы хотите изменить этот вопрос в базе данных?' })}
                                    className="w-full h-14 rounded-2xl btn-romantic text-white text-xs font-bold uppercase tracking-widest flex items-center justify-center gap-2 shadow-xl disabled:opacity-25 disabled:pointer-events-none"
                                >
                                    <Icons.Check /> Сохранить
                                </button>
                            </div>
                        </div>

                        {confirmModal && (
                            <div className="fixed inset-0 bg-black/80 backdrop-blur-md flex items-center justify-center p-5 z-50 fade-in">
                                <div className="glass-panel p-7 w-full max-w-sm text-center flex flex-col items-center gap-6 border border-white/10">
                                    <div className="text-4xl">{confirmModal.action === 'delete' ? '🗑️' : '✏️'}</div>
                                    <h3 className="text-base font-bold text-white leading-snug">
                                        {confirmModal.title}
                                    </h3>
                                    <div className="grid grid-cols-2 gap-3 w-full">
                                        <button 
                                            onClick={() => setConfirmModal(null)}
                                            className="w-full h-14 rounded-2xl btn-ghost text-xs font-bold uppercase tracking-widest"
                                        >
                                            Отмена
                                        </button>
                                        <button 
                                            onClick={() => confirmModal.action === 'delete' ? executeDeleteQuestion() : executeSaveEdit()}
                                            className="w-full h-14 rounded-2xl btn-romantic text-white text-xs font-bold uppercase tracking-widest"
                                        >
                                            Да
                                        </button>
                                    </div>
                                </div>
                            </div>
                        )}

                        {resultModal && (
                            <div className="fixed inset-0 bg-black/85 backdrop-blur-md flex items-center justify-center p-5 z-50 fade-in">
                                <div className="glass-panel p-8 w-full max-w-sm text-center flex flex-col items-center gap-5 border border-white/10">
                                    <div className="text-5xl">{resultModal.ok ? '✅' : '⚠️'}</div>
                                    <h3 className="text-lg font-bold text-white">
                                        {resultModal.ok ? 'Выполнено успешно' : 'Ошибка базы данных'}
                                    </h3>
                                    <p className="text-xs text-white/70 leading-relaxed">
                                        {resultModal.msg}
                                    </p>
                                    <button 
                                        onClick={() => {
                                            const target = resultModal.afterCloseScreen;
                                            setResultModal(null);
                                            if (target) setScreen(target);
                                        }}
                                        className="w-full h-14 rounded-2xl btn-romantic text-white text-xs font-bold uppercase tracking-widest mt-2"
                                    >
                                        Понятно
                                    </button>
                                </div>
                            </div>
                        )}
                    </div>
                );
            }

            // ФОРМА ДОБАВЛЕНИЯ НОВОГО ВОПРОСА + AI ГЕНЕРАТОР (Пункт 9)
            if (screen === 'add_q') {
                return (
                    <div className="min-h-[100dvh] w-full flex flex-col p-5 fade-in max-w-lg mx-auto relative z-10">
                        <div className="flex items-center gap-4 mb-6 pt-4">
                            <button onClick={() => setScreen(viewCategory ? 'q_list' : 'cat_list')} className="p-4 bg-white/5 rounded-full hover:bg-white/10 text-white/80 transition-all">
                                <Icons.Back />
                            </button>
                            <h2 className="text-2xl font-bold text-white tracking-wide">Новый вопрос</h2>
                        </div>

                        {addStatus ? (
                            <div className="flex-1 flex flex-col items-center justify-center slide-up">
                                <div className="glass-panel p-8 w-full flex flex-col items-center text-center shadow-2xl">
                                    {addStatus.ok ? (
                                        <svg className="checkmark mb-6" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 52 52">
                                            <circle className="checkmark-circle" cx="26" cy="26" r="25" fill="none"/>
                                            <path className="checkmark-check" fill="none" d="M14.1 27.2l7.1 7.2 16.7-16.8"/>
                                        </svg>
                                    ) : (
                                        <div className="text-5xl mb-6">⚠️</div>
                                    )}
                                    <h3 className="text-xl font-bold text-white mb-2 tracking-wide">
                                        {addStatus.ok ? 'Успешно добавлен!' : 'Ошибка сохранения'}
                                    </h3>
                                    <p className="text-xs text-white/70 mb-8 leading-relaxed">
                                        {addStatus.msg}
                                    </p>
                                    <div className="grid grid-cols-2 gap-3 w-full">
                                        <button 
                                            onClick={() => setScreen(viewCategory ? 'q_list' : 'cat_list')} 
                                            className="btn-ghost h-14 w-full rounded-2xl text-xs font-bold uppercase tracking-widest"
                                        >
                                            К списку
                                        </button>
                                        <button 
                                            onClick={() => { setAddStatus(null); setAddForm({ text: '', cat: addForm.cat, diff: addForm.diff }); }} 
                                            className="btn-romantic h-14 w-full rounded-2xl text-xs font-bold uppercase tracking-widest text-white"
                                        >
                                            Еще один
                                        </button>
                                    </div>
                                </div>
                            </div>
                        ) : (
                            <form onSubmit={handleAddQuestion} className="flex-1 flex flex-col gap-5 slide-up">
                                <div>
                                    <label className="block text-[11px] font-bold uppercase tracking-widest text-white/50 mb-2.5 ml-2">Текст вопроса</label>
                                    <textarea 
                                        required
                                        value={addForm.text}
                                        onChange={e => setAddForm({...addForm, text: e.target.value})}
                                        className="w-full glass-panel p-5 text-base text-white/95 placeholder-white/25 outline-none resize-none h-36 focus:border-[#e11d48]/50 transition-colors shadow-inner"
                                        placeholder="Напишите вопрос вручную или нажмите «Сгенерировать вопрос» ниже..."
                                    ></textarea>
                                </div>
                                
                                <div>
                                    <label className="block text-[11px] font-bold uppercase tracking-widest text-white/50 mb-2.5 ml-2">Тема вопроса</label>
                                    <select 
                                        value={addForm.cat}
                                        onChange={e => setAddForm({...addForm, cat: e.target.value})}
                                        className="w-full glass-panel h-14 px-5 text-base text-white/90 outline-none appearance-none font-medium bg-transparent"
                                    >
                                        {CATEGORIES.map(c => <option key={c.id} value={c.id} className="bg-[#160a1c] text-white">{c.icon} {c.name}</option>)}
                                    </select>
                                </div>

                                <div>
                                    <label className="block text-[11px] font-bold uppercase tracking-widest text-white/50 mb-2.5 ml-2">Сложность</label>
                                    <select 
                                        value={addForm.diff}
                                        onChange={e => setAddForm({...addForm, diff: e.target.value})}
                                        className="w-full glass-panel h-14 px-5 text-base text-white/90 outline-none appearance-none font-medium bg-transparent"
                                    >
                                        {DIFFICULTIES.map(d => <option key={d.id} value={d.id} className="bg-[#160a1c] text-white">{d.name}</option>)}
                                    </select>
                                </div>

                                {/* AI-КНОПКА ГЕНЕРАЦИИ НОВОГО УНИКАЛЬНОГО ВОПРОСА ЧУТЬ НИЖЕ ПОЛЯ СЛОЖНОСТЬ (Пункт 9) */}
                                <button 
                                    type="button"
                                    disabled={isGeneratingQuestion}
                                    onClick={handleGenerateQuestionAI}
                                    className="w-full rounded-2xl btn-ai-magic text-white text-xs font-bold uppercase tracking-widest flex items-center justify-center gap-2.5 shadow-xl disabled:opacity-50"
                                >
                                    <Icons.Sparkles />
                                    {isGeneratingQuestion ? "ИИ придумывает уникальный вопрос..." : "Сгенерировать вопрос"}
                                </button>

                                <div className="mt-auto pb-6 pt-4 grid grid-cols-2 gap-4">
                                    <button type="button" onClick={() => setScreen(viewCategory ? 'q_list' : 'cat_list')} className="w-full h-14 rounded-2xl btn-ghost text-xs font-bold uppercase tracking-widest">
                                        Отмена
                                    </button>
                                    <button type="submit" disabled={isSaving || !addForm.text.trim()} className="w-full h-14 rounded-2xl btn-romantic text-white text-xs font-bold uppercase tracking-widest flex items-center justify-center gap-2 shadow-xl disabled:opacity-30">
                                        <Icons.Plus /> {isSaving ? "Сохранение..." : "Сохранить"}
                                    </button>
                                </div>
                            </form>
                        )}
                    </div>
                );
            }
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
