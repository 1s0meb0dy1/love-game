<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <!-- лише HTTPS: старі http-посилання браузер сам переводить на https; без плагінів і підміни базової адреси -->
    <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests; object-src 'none'; base-uri 'self'">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0a0710">
    <meta name="color-scheme" content="dark light">
    <script>
      /* Heat 2: тема до першого кадру, щоб не блимало. Вибір: auto | dark | light (src/theme.js). */
      (function () { try { var p = localStorage.getItem('askme_theme_v1'); var t = p === 'light' || p === 'dark' ? p : (window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'); document.documentElement.setAttribute('data-theme', t); var m = document.querySelector('meta[name="theme-color"]'); if (m) m.setAttribute('content', t === 'light' ? '#fbf3ef' : '#0a0710'); } catch (e) { document.documentElement.setAttribute('data-theme', 'dark'); } })();
    </script>
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
